steps:
  - script: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts darwin $VSCODE_ARCH $(node -p process.arch) > .build/packagelockhash
    displayName: Prepare node_modules cache key

  - task: Cache@2
    inputs:
      key: '"node_modules-root-v1" | .build/packagelockhash'
      path: node_modules
      cacheHitVar: ROOT_NODE_MODULES_RESTORED
    displayName: Restore root node_modules cache

  - task: Cache@2
    inputs:
      key: '"node_modules-rest-v1" | .build/packagelockhash'
      path: .build/node_modules_cache
      cacheHitVar: REMAINING_NODE_MODULES_RESTORED
    displayName: Restore remaining node_modules cache

  - script: tar -xzf .build/node_modules_cache/cache.tgz
    condition: and(succeeded(), eq(variables.REMAINING_NODE_MODULES_RESTORED, 'true'))
    displayName: Extract remaining node_modules cache

  - script: |
      set -e
      npm config set registry "$NPM_REGISTRY"
      echo "##vso[task.setvariable variable=NPMRC_PATH]$(npm config get userconfig)"
    condition: and(succeeded(), or(ne(variables.ROOT_NODE_MODULES_RESTORED, 'true'), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true')), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM

  - task: npmAuthenticate@0
    inputs:
      workingFile: $(NPMRC_PATH)
    condition: and(succeeded(), or(ne(variables.ROOT_NODE_MODULES_RESTORED, 'true'), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true')), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM Authentication

  - task: PipAuthenticate@1
    inputs:
      artifactFeeds: Monaco/vscode
    condition: and(succeeded(), or(ne(variables.ROOT_NODE_MODULES_RESTORED, 'true'), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true')))
    displayName: Setup PyPI Authentication

  - script: |
      set -e
      python3 -m pip install setuptools
      npm ci
    env:
      npm_config_arch: $(VSCODE_ARCH)
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      GITHUB_TOKEN: "$(github-token-code-oss)"
      GYP_DEFINES: "kerberos_use_rtld=false"
    condition: and(succeeded(), or(ne(variables.ROOT_NODE_MODULES_RESTORED, 'true'), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true')))
    retryCountOnTaskFailure: 5
    displayName: Install dependencies

  - script: node build/azure-pipelines/distro/mixin-npm.ts
    condition: and(succeeded(), or(ne(variables.ROOT_NODE_MODULES_RESTORED, 'true'), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true')))
    displayName: Mixin distro node modules

  - script: |
      set -e
      node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt node_modules
      mkdir -p .build/node_modules_cache
      tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt
    condition: and(succeeded(), ne(variables.REMAINING_NODE_MODULES_RESTORED, 'true'))
    displayName: Create remaining node_modules archive

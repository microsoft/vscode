parameters:
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
  - name: VSCODE_SKIP_SUCCESSFUL_TEST_TASKS
    type: boolean

steps:
  - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Download Electron and Playwright
    retryCountOnTaskFailure: 3

  - template: ../../common/restore-test-checkpoints.yml@self
    parameters:
      enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}

  - ${{ if eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true) }}:
    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
        script: |
          set -e
          ./scripts/test.sh --build --tfs "Unit Tests"
          node build/azure-pipelines/common/testCheckpoint.ts record unit-electron
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_UNIT_ELECTRON_HIT'], 'true'))
      ${{ else }}:
        script: ./scripts/test.sh --build --tfs "Unit Tests"
      env:
        VSCODE_SKIP_PRELAUNCH: '1'
      displayName: 🧪 Run unit tests (Electron)
      timeoutInMinutes: 15

    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
      - template: ../../common/publish-test-checkpoint.yml@self
        parameters:
          testId: unit-electron

    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
        script: |
          set -e
          mkdir -p .build/crashes
          npm run test-node -- --build
          node build/azure-pipelines/common/testCheckpoint.ts record unit-node
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_UNIT_NODE_HIT'], 'true'))
      ${{ else }}:
        script: |
          set -e
          mkdir -p .build/crashes
          npm run test-node -- --build
      env:
        NODE_OPTIONS: "--report-on-fatalerror --report-uncaught-exception --report-directory=.build/crashes"
      displayName: 🧪 Run unit tests (node.js)
      timeoutInMinutes: 15

    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
      - template: ../../common/publish-test-checkpoint.yml@self
        parameters:
          testId: unit-node

  - ${{ if eq(parameters.VSCODE_RUN_BROWSER_TESTS, true) }}:
    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
        script: |
          set -e
          npm run test-browser-no-install -- --build --browser webkit --tfs "Browser Unit Tests"
          node build/azure-pipelines/common/testCheckpoint.ts record unit-browser-webkit
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_UNIT_BROWSER_WEBKIT_HIT'], 'true'))
      ${{ else }}:
        script: npm run test-browser-no-install -- --build --browser webkit --tfs "Browser Unit Tests"
      env:
        DEBUG: "*browser*"
      displayName: 🧪 Run unit tests (Browser, Webkit)
      timeoutInMinutes: 30

    - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
      - template: ../../common/publish-test-checkpoint.yml@self
        parameters:
          testId: unit-browser-webkit

  - script: |
      set -e
      npm run gulp \
        compile-extension:configuration-editing \
        compile-extension:css-language-features-server \
        compile-extension:emmet \
        compile-extension:git \
        compile-extension:github-authentication \
        compile-extension:html-language-features-server \
        compile-extension:ipynb \
        compile-extension:notebook-renderers \
        compile-extension:json-language-features-server \
        compile-extension:markdown-language-features \
        compile-extension-media \
        compile-extension:microsoft-authentication \
        compile-extension:typescript-language-features \
        compile-extension:vscode-api-tests \
        compile-extension:vscode-colorize-tests \
        compile-extension:vscode-colorize-perf-tests \
        compile-extension:vscode-test-resolver
    displayName: Build integration tests

  - ${{ if eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: integration-electron
        testStep:
          script: |
            # Figure out the full absolute path of the product we just built
            # including the remote server and configure the integration tests
            # to run with these builds instead of running out of sources.
            set -e
            APP_ROOT="$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)"
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            ProductJsonPath=$(find "$APP_ROOT" -name "product.json" -type f | head -n 1)
            BINARY_NAME=$(jq -r '.nameShort' "$ProductJsonPath")
            INTEGRATION_TEST_ELECTRON_PATH="$APP_ROOT/$APP_NAME/Contents/MacOS/$BINARY_NAME" \
            ./scripts/test-integration.sh --build --tfs "Integration Tests"
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-darwin-$(VSCODE_ARCH)
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run integration tests (Electron)
          timeoutInMinutes: 20

  - ${{ if eq(parameters.VSCODE_RUN_BROWSER_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: integration-browser-webkit
        testStep:
          script: ./scripts/test-web-integration.sh --browser webkit
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
          displayName: 🧪 Run integration tests (Browser, Webkit)
          timeoutInMinutes: 20

  - ${{ if eq(parameters.VSCODE_RUN_REMOTE_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: integration-remote
        testStep:
          script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            ProductJsonPath=$(find "$APP_ROOT" -name "product.json" -type f | head -n 1)
            BINARY_NAME=$(jq -r '.nameShort' "$ProductJsonPath")
            INTEGRATION_TEST_ELECTRON_PATH="$APP_ROOT/$APP_NAME/Contents/MacOS/$BINARY_NAME" \
            ./scripts/test-remote-integration.sh
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-darwin-$(VSCODE_ARCH)
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run integration tests (Remote)
          timeoutInMinutes: 20

  - script: ps -ef
    displayName: Diagnostics before smoke test run
    continueOnError: true
    condition: succeededOrFailed()

  - ${{ if eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: smoke-electron
        testStep:
          script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            npm run smoketest-no-compile -- --tracing --build "$APP_ROOT/$APP_NAME"
          timeoutInMinutes: 20
          displayName: 🧪 Run smoke tests (Electron)

    - script: brew list squid >/dev/null 2>&1 || brew install squid
      displayName: Install Squid for network-isolated smoke tests

    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: smoke-agents-pac
        testStep:
          script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            bash test/smoke/scripts/run-agents-window-network-proxy.sh --build "$APP_ROOT/$APP_NAME"
          timeoutInMinutes: 40
          displayName: 🧪 Run Agents Window smoke tests through macOS PAC proxy

    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: smoke-agents-pac-kerberos
        testStep:
          script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            bash test/smoke/scripts/run-agents-window-network-proxy.sh --kerberos --build "$APP_ROOT/$APP_NAME"
          timeoutInMinutes: 40
          displayName: 🧪 Run Agents Window smoke tests through Kerberos-authenticated macOS PAC proxy

  - ${{ if eq(parameters.VSCODE_RUN_BROWSER_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: smoke-browser-chromium
        testStep:
          script: npm run smoketest-no-compile -- --web --tracing --headless
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
          timeoutInMinutes: 20
          displayName: 🧪 Run smoke tests (Browser, Chromium)

  - ${{ if eq(parameters.VSCODE_RUN_REMOTE_TESTS, true) }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        enabled: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}
        testId: smoke-remote
        testStep:
          script: |
            set -e
            npm run gulp compile-extension:vscode-test-resolver
            APP_ROOT=$(agent.builddirectory)/VSCode-darwin-$(VSCODE_ARCH)
            APP_NAME="`ls $APP_ROOT | head -n 1`"
            npm run smoketest-no-compile -- --tracing --remote --build "$APP_ROOT/$APP_NAME"
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-darwin-$(VSCODE_ARCH)
          timeoutInMinutes: 20
          displayName: 🧪 Run smoke tests (Remote)

  - script: ps -ef
    displayName: Diagnostics after smoke test run
    continueOnError: true
    condition: succeededOrFailed()

  - ${{ if eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true) }}:
    - template: ../../copilot/test-integration-steps.yml@self
      parameters:
        OS: darwin
        VSCODE_SKIP_SUCCESSFUL_TEST_TASKS: ${{ parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS }}

  - ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
    - script: node build/azure-pipelines/common/testCheckpoint.ts collect-results
      displayName: Check test output availability
      condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: Publish Tests Results
    inputs:
      testResultsFiles: "*-results.xml"
      searchFolder: "$(Build.ArtifactStagingDirectory)/test-results"
    ${{ if eq(parameters.VSCODE_SKIP_SUCCESSFUL_TEST_TASKS, true) }}:
      condition: and(succeededOrFailed(), eq(variables['TEST_CHECKPOINT_RESULTS_AVAILABLE'], 'true'))
    ${{ else }}:
      condition: succeededOrFailed()

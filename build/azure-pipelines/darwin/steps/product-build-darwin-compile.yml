parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL
    type: boolean
    default: false
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false
  - name: VSCODE_BUILD_ONLY
    type: boolean
    default: false

steps:
  - template: product-build-darwin-setup.yml@self
    parameters:
      VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
      VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL: ${{ parameters.VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL }}
      VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
      VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
      VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}

  # The CLI is built by the parallel CLI job and mixed into the client below.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon --detach --wait -- node build/azure-pipelines/common/waitForArtifacts.ts "--producer=unsigned_vscode_cli_darwin_$(VSCODE_ARCH)_cli=macOS (${{ upper(parameters.VSCODE_ARCH) }}) - CLI" unsigned_vscode_cli_darwin_$(VSCODE_ARCH)_cli
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Wait for CLI artifact (background)

  # Start pulling the CG-generated NOTICE from the parallel Quality stage
  # in the background (overwrites repo-root ThirdPartyNotices.txt before packaging).
  # Publish builds only (CIBUILD=false) — CI test jobs never ship a notice.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon --detach --wait -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Pull CG NOTICE (background)

  - template: ../../common/install-builtin-extensions.yml@self

  - script: node build/npm/electronTypes.ts
    displayName: Prepare Electron types

  - template: ../../common/agent-sdk-produce.yml@self
    parameters:
      vscodePlatform: darwin

  - template: ../../common/dictation-runtime-produce.yml@self
    parameters:
      vscodePlatform: darwin

  - script: npx deemon --detach --wait -- node build/azure-pipelines/common/downloadCopilotVsix.ts
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Download Copilot VSIX (background)

  - template: ../../common/mixin-vscode-capi.yml@self

  - script: npm run gulp core-ci
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
    displayName: Compile

  - script: node build/azure-pipelines/common/extract-telemetry.ts
    displayName: Generate lists of telemetry events

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - script: |
        set -e
        npm run compile --prefix test/smoke
        npm run compile --prefix test/integration/browser
      displayName: Compile test suites (non-OSS)
      condition: and(succeeded(), eq(variables['VSCODE_STEP_ON_IT'], 'false'))

  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npm run copy-policy-dto --prefix build && node build/lib/policies/policyGenerator.ts build/lib/policies/policyData.jsonc darwin
      displayName: Generate policy definitions
      retryCountOnTaskFailure: 3

  - script: npx deemon --attach -- node build/azure-pipelines/common/downloadCopilotVsix.ts
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Download Copilot VSIX

  # Block on the CG NOTICE download and overwrite ThirdPartyNotices.txt
  # before gulp packages it (and before any later signing/notarization).
  # Non-fatal: falls back to legacy on any problem.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon --attach -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Apply CG NOTICE
      # deemon --attach can exit non-zero if the background daemon died; never fail for that.
      continueOnError: true

  - script: |
      set -e
      npm run gulp vscode-darwin-$(VSCODE_ARCH)-min-ci
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build client

  - script: |
      set -e
      npm run gulp vscode-reh-darwin-$(VSCODE_ARCH)-min-ci
      mv ../vscode-reh-darwin-$(VSCODE_ARCH) ../vscode-server-darwin-$(VSCODE_ARCH) # TODO@joaomoreno
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build server

  - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
    - script: node build/azure-pipelines/common/smokeTestAgentHost.ts "$(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)"
      displayName: 🧪 Smoke test packaged Agent Host

  - script: |
      set -e
      npm run gulp vscode-reh-web-darwin-$(VSCODE_ARCH)-min-ci
      mv ../vscode-reh-web-darwin-$(VSCODE_ARCH) ../vscode-server-darwin-$(VSCODE_ARCH)-web # TODO@joaomoreno
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build server (web)

  # The unsigned client is published as soon as it is built, since the macOS
  # (UNIVERSAL) job only waits a limited amount of time for it.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon --attach -- node build/azure-pipelines/common/waitForArtifacts.ts "--producer=unsigned_vscode_cli_darwin_$(VSCODE_ARCH)_cli=macOS (${{ upper(parameters.VSCODE_ARCH) }}) - CLI" unsigned_vscode_cli_darwin_$(VSCODE_ARCH)_cli
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Wait for CLI artifact

    - template: product-build-darwin-mixin-cli.yml@self

    - script: |
        set -e
        APP_ROOT="$(Agent.BuildDirectory)/VSCode-darwin-$(VSCODE_ARCH)"
        APP_NAME="`ls $APP_ROOT | head -n 1`"
        APP_PATH="$APP_ROOT/$APP_NAME" node build/darwin/verify-macho.ts $(VSCODE_ARCH)
        APP_PATH="$(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)" node build/darwin/verify-macho.ts $(VSCODE_ARCH)
      displayName: Verify arch of Mach-O objects

    - script: |
        set -e
        ARCHIVE_PATH="$(Pipeline.Workspace)/unsigned_vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin-$(VSCODE_ARCH).zip"
        mkdir -p $(dirname $ARCHIVE_PATH)
        (cd ../VSCode-darwin-$(VSCODE_ARCH) && zip -Xry $ARCHIVE_PATH *)
        echo "##vso[task.setvariable variable=CLIENT_PATH]$ARCHIVE_PATH"
      displayName: Package client

    - pwsh: node build/azure-pipelines/common/checkForArtifact.ts CLIENT_ARCHIVE_UPLOADED unsigned_vscode_client_darwin_$(VSCODE_ARCH)_archive
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Check for client artifact

    - template: ../../common/publish-artifact.yml@self
      parameters:
        targetPath: $(CLIENT_PATH)
        artifactName: unsigned_vscode_client_darwin_$(VSCODE_ARCH)_archive
        displayName: Publish client archive (unsigned)
        sbomEnabled: false
        condition: and(ne(variables['CLIENT_PATH'], ''), eq(variables['CLIENT_ARCHIVE_UPLOADED'], 'false'))

  - ${{ if and(ne(parameters.VSCODE_CIBUILD, true), ne(parameters.VSCODE_BUILD_ONLY, true)) }}:
    - template: product-build-darwin-package.yml@self

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - template: product-build-darwin-test.yml@self
      parameters:
        VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
        VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
        VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}

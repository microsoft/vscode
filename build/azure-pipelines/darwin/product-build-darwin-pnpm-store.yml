parameters:
  - name: VSCODE_ARCH
    type: string

# The dependency installation of product-build-darwin-node-modules.yml, with the pnpm store restored
# from the pipeline cache instead of the node_modules folders (see common/restore-pnpm-store.yml).
jobs:
  - job: macOSNodeModules_${{ parameters.VSCODE_ARCH }}
    displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }})
    pool:
      name: AcesShared
      os: macOS
      demands:
        - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    timeoutInMinutes: 60
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      PNPM_CONFIG_STORE_DIR: $(Pipeline.Workspace)/pnpm-store
      PNPM_CONFIG_CACHE_DIR: $(Pipeline.Workspace)/pnpm-store/cache
    steps:
      - template: ../common/checkout.yml@self

      - template: ../common/setup-node.yml@self
        parameters:
          os: macOS

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get GitHub token"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - script: node build/setup-npm-registry.ts $NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      - template: ../common/apply-sdk-canary.yml@self

      - template: ../common/restore-pnpm-store.yml@self
        parameters:
          keyArgs: darwin $(VSCODE_ARCH)
          os: macOS

      - template: ../common/install-pnpm.yml@self
        parameters:
          setupRegistry: true
          os: macOS

      - task: PipAuthenticate@1
        inputs:
          artifactFeeds: Monaco/vscode
        displayName: Setup PyPI Authentication

      - script: |
          set -e
          c++ --version
          xcode-select -print-path
          python3 -m pip install setuptools

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: $(VSCODE_ARCH)
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-token-code-oss)"
          FOUNDRY_LOCAL_SKIP_INSTALL: "1"
          # Avoid using dlopen to load Kerberos on macOS which can cause missing libraries
          # https://github.com/mongodb-js/kerberos/commit/04044d2814ad1d01e77f1ce87f26b03d86692cf2
          # flipped the default to support legacy linux distros which shouldn't happen
          # on macOS.
          GYP_DEFINES: "kerberos_use_rtld=false"
        displayName: Install dependencies

      # PipAuthenticate@1 exposes its access token to all later steps inside the
      # PIP_INDEX_URL environment variable, from where they can write it to logs.
      # Only installing dependencies needs it, so clear it now.
      - script: echo "##vso[task.setvariable variable=PIP_INDEX_URL]"
        displayName: Clear package feed credentials
        condition: always()

      # Removes the packages that the installed projects don't use from the store before the cache saves it,
      # and the store's links to those projects (in `projects`): the next install adds its own.
      - script: |
          set -e
          pnpm store prune
          rm -rf "$(pnpm store path)/projects"
        condition: and(succeeded(), ne(variables.PNPM_STORE_RESTORED, 'true'))
        displayName: Prune pnpm store

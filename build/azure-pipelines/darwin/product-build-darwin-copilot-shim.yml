parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CHECK_ONLY
    type: boolean
    default: false

jobs:
  - job: macOSCopilotShim_${{ parameters.VSCODE_ARCH }}
    displayName: macOS Copilot Shim (${{ upper(parameters.VSCODE_ARCH) }})
    timeoutInMinutes: 90
    pool:
      name: AcesShared
      os: macOS
      demands:
        - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    variables:
      MSRUSTUP_LOG: debug
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    steps:
      - template: ../common/checkout.yml@self

      - template: ../cli/install-rust-posix.yml@self
        parameters:
          targets:
            - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              - x86_64-apple-darwin
            - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
              - aarch64-apple-darwin

      - script: rustup component add rustfmt clippy
        displayName: Install Rust quality components
        condition: and(succeeded(), eq(variables['CARGO_REGISTRY'], 'none'))

      - template: ../copilot-shim/copilot-shim-quality.yml@self

      - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
        - template: ../copilot-shim/copilot-shim-compile.yml@self
          parameters:
            COPILOT_SHIM_TARGET: x86_64-apple-darwin
            COPILOT_SHIM_ARTIFACT: unsigned_copilot_shim_darwin_x64
            COPILOT_SHIM_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}

      - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
        - template: ../copilot-shim/copilot-shim-compile.yml@self
          parameters:
            COPILOT_SHIM_TARGET: aarch64-apple-darwin
            COPILOT_SHIM_ARTIFACT: unsigned_copilot_shim_darwin_arm64
            COPILOT_SHIM_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}

      - ${{ if not(parameters.VSCODE_CHECK_ONLY) }}:
        - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
          - template: ../common/publish-artifact.yml@self
            parameters:
              targetPath: $(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_darwin_x64.zip
              artifactName: unsigned_copilot_shim_darwin_x64
              displayName: Publish unsigned Copilot shim
              sbomEnabled: false
        - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
          - template: ../common/publish-artifact.yml@self
            parameters:
              targetPath: $(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_darwin_arm64.zip
              artifactName: unsigned_copilot_shim_darwin_arm64
              displayName: Publish unsigned Copilot shim
              sbomEnabled: false

        - script: |
            set -e
            signing_directory="$(Build.ArtifactStagingDirectory)/pkg/unsigned_copilot_shim_darwin_$(VSCODE_ARCH)"
            mkdir -p "$signing_directory"
            cp "$(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_darwin_$(VSCODE_ARCH).zip" "$signing_directory/unsigned_copilot_shim_darwin_$(VSCODE_ARCH).zip"
            test "$(find "$signing_directory" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"
          displayName: Prepare Copilot shim for signing

        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

        - task: UseDotNet@2
          inputs:
            version: 6.x

        - task: EsrpCodeSigning@6
          inputs:
            UseMSIAuthentication: true
            ConnectedServiceName: vscode-esrp
            AppRegistrationClientId: $(ESRP_CLIENT_ID)
            AppRegistrationTenantId: $(ESRP_TENANT_ID)
            AuthAKVName: vscode-esrp
            AuthSignCertName: esrp-sign
            FolderPath: .
            Pattern: noop
          displayName: 'Install ESRP Tooling'

        - script: node build/azure-pipelines/common/sign.ts $(Agent.RootDirectory)/_tasks/EsrpCodeSigning_*/*/net6.0/esrpcli.dll sign-darwin $(Build.ArtifactStagingDirectory)/pkg/unsigned_copilot_shim_darwin_$(VSCODE_ARCH) "*.zip"
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          displayName: ✍️ Codesign Copilot shim

        - script: node build/azure-pipelines/common/sign.ts $(Agent.RootDirectory)/_tasks/EsrpCodeSigning_*/*/net6.0/esrpcli.dll notarize-darwin $(Build.ArtifactStagingDirectory)/pkg/unsigned_copilot_shim_darwin_$(VSCODE_ARCH) "*.zip"
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          displayName: ✍️ Notarize Copilot shim

        - script: |
            set -e
            signed_archive="$(Build.ArtifactStagingDirectory)/pkg/unsigned_copilot_shim_darwin_$(VSCODE_ARCH)/unsigned_copilot_shim_darwin_$(VSCODE_ARCH).zip"
            output_archive="$(Build.ArtifactStagingDirectory)/copilot_shim_darwin_$(VSCODE_ARCH).zip"
            validation_directory="$(Build.ArtifactStagingDirectory)/copilot_shim_darwin_$(VSCODE_ARCH)"
            mv "$signed_archive" "$output_archive"
            mkdir -p "$validation_directory"
            unzip -q "$output_archive" -d "$validation_directory"
            test "$(find "$validation_directory" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"
            test -f "$validation_directory/copilot"
            test -s "$validation_directory/copilot"
            test -x "$validation_directory/copilot"
            codesign --verify --deep --strict --verbose=2 "$validation_directory/copilot"
          displayName: Validate signed Copilot shim archive

        - template: ../common/publish-artifact.yml@self
          parameters:
            targetPath: $(Build.ArtifactStagingDirectory)/copilot_shim_darwin_$(VSCODE_ARCH).zip
            artifactName: copilot_shim_darwin_$(VSCODE_ARCH)
            displayName: Publish signed Copilot shim
            sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/copilot_shim_darwin_$(VSCODE_ARCH)
            sbomPackageName: "VS Code Copilot Shim macOS $(VSCODE_ARCH)"
            sbomPackageVersion: $(Build.SourceVersion)

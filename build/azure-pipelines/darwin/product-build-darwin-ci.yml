parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_TEST_SUITE
    type: string

jobs:
  - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Electron') }}:
    - template: ../common/product-test-build.yml@self
      parameters:
        jobName: macOSElectronBuild
        displayName: Electron Build
        platform: macos
        arch: arm64
        archiveExt: tar.gz
        artifactPrefix: product-ci-darwin-arm64-electron
        testIntegration: true
        testSmoke: true
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        compileSteps:
          - template: ./steps/product-build-darwin-compile.yml@self
            parameters:
              VSCODE_ARCH: arm64
              VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
        archiveWorkspaceSteps:
          - script: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)
              tar -czf $(Build.ArtifactStagingDirectory)/repo.tar.gz --exclude=.git -C $(Build.SourcesDirectory) .
            displayName: Archive built workspace for reuse by test jobs
        archiveAppSteps:
          - script: tar -czf $(Build.ArtifactStagingDirectory)/app.tar.gz -C $(Agent.BuildDirectory) VSCode-darwin-arm64
            displayName: Archive packaged app for reuse by test jobs
        archiveServerSteps:
          - script: tar -czf $(Build.ArtifactStagingDirectory)/server.tar.gz -C $(Agent.BuildDirectory) vscode-server-darwin-arm64
            displayName: Archive packaged server for reuse by test jobs

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOSElectronUnit
        buildJobName: macOSElectronBuild
        displayName: Unit Tests
        platform: macos
        arch: arm64
        testName: unit
        artifactPrefix: product-ci-darwin-arm64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
            displayName: Extract built workspace
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOSElectronIntegration
        buildJobName: macOSElectronBuild
        displayName: Integration Tests
        platform: macos
        arch: arm64
        testName: integration
        artifactPrefix: product-ci-darwin-arm64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-app/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-server/server.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace, app and server
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOSElectronSmoke
        buildJobName: macOSElectronBuild
        displayName: Smoke Tests
        platform: macos
        arch: arm64
        testName: smoke
        artifactPrefix: product-ci-darwin-arm64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-darwin-arm64-electron-app/app.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and app
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Smoke

  - ${{ else }}:
    - job: macOS${{ parameters.VSCODE_TEST_SUITE }}
      displayName: ${{ parameters.VSCODE_TEST_SUITE }} Tests
      timeoutInMinutes: 120
      variables:
        VSCODE_ARCH: arm64
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - template: ./steps/product-build-darwin-compile.yml@self
          parameters:
            VSCODE_ARCH: arm64
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Browser') }}:
              VSCODE_RUN_BROWSER_TESTS: true
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Remote') }}:
              VSCODE_RUN_REMOTE_TESTS: true

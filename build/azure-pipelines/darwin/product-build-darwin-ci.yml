parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_JOB_NAME
    type: string
  - name: VSCODE_JOB_DISPLAY_NAME
    type: string
  - name: VSCODE_TEST_IDS
    type: object
  # Whether to include the steps and jobs that need a privileged service
  # connection (signing, CDN uploads, Copilot test setup). Only
  # sdk-validation-build.yml sets this to false.
  - name: VSCODE_PRIVILEGED_CONNECTIONS
    type: boolean
    default: true
  # Workspace images (see build/azure-pipelines/common/workspaceImage.ts)
  - name: VSCODE_WORKSPACE_IMAGE
    type: string
    default: none

jobs:
  - job: macOS${{ parameters.VSCODE_JOB_NAME }}
    displayName: ${{ parameters.VSCODE_JOB_DISPLAY_NAME }}
    timeoutInMinutes: 240
    variables:
      VSCODE_ARCH: arm64
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: true
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-macos-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          # 1ES PT runs its binary analysis for every published output, so only publish when the logs are needed
          condition: failed()
    steps:
      - template: ./steps/product-build-darwin-compile.yml@self
        parameters:
          VSCODE_ARCH: arm64
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}
          VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}
          VSCODE_WORKSPACE_IMAGE: ${{ parameters.VSCODE_WORKSPACE_IMAGE }}
          # Only what the tests of the job use: the unit and Agent Host E2E tests run out-build
          VSCODE_BUILD_CLIENT: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-kerberos-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-basic-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          # The Smoke job checks the packaged Agent Host of the server
          VSCODE_BUILD_SERVER: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          VSCODE_BUILD_SERVER_WEB: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-webkit'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium')) }}
          VSCODE_BUILD_PRODUCT_ASSETS: false
          VSCODE_BUILD_INTEGRATION_TESTS: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-webkit'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-kerberos-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-basic-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          VSCODE_COMPILE_TEST_SUITES: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-webkit'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-kerberos-pac-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-agents-basic-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}

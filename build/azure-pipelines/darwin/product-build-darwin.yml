parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false

# Compile mixes in the CLI, publishes the unsigned client for the universal
# build and publishes unpacked builds for the Test and Sign jobs. Test applies
# the local entitlement signature required to run the product on macOS, while
# Sign packages, signs, notarizes and publishes the final artifacts. Test and
# Sign run in parallel after Compile.
jobs:
  - job: macOS_${{ parameters.VSCODE_ARCH }}_Compile
    displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/compilation
          artifactName: compilation_darwin_$(VSCODE_ARCH)
          displayName: Publish compilation artifact
          sbomEnabled: false
          isProduction: false
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_darwin_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'))
    steps:
      - template: ./steps/product-build-darwin-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_BUILD_ONLY: true

      - script: |
          set -e
          mkdir -p $(Build.ArtifactStagingDirectory)/compilation
          tar -czf $(Build.ArtifactStagingDirectory)/compilation/builds.tar.gz \
            -C $(Agent.BuildDirectory) \
            VSCode-darwin-$(VSCODE_ARCH) \
            vscode-server-darwin-$(VSCODE_ARCH) \
            vscode-server-darwin-$(VSCODE_ARCH)-web
        displayName: Archive client, server and web server builds

      - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
        - script: |
            set -e
            tar -czf $(Build.ArtifactStagingDirectory)/compilation/out-build.tar.gz \
              -C $(Build.SourcesDirectory) \
              out-build
          displayName: Archive out-build

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - job: macOS_${{ parameters.VSCODE_ARCH }}_Test
      displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Test
      dependsOn: macOS_${{ parameters.VSCODE_ARCH }}_Compile
      timeoutInMinutes: 240
      cancelTimeoutInMinutes: 10
      variables:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-macos-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-macos-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-macos-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - template: ./steps/product-build-darwin-setup.yml@self
          parameters:
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
            VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
            VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
            VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}

        - template: ./steps/product-build-darwin-download-compilation.yml@self
          parameters:
            VSCODE_DOWNLOAD_OUT_BUILD: true

        - template: ./steps/product-build-darwin-sign-local.yml@self

        - template: ./steps/product-build-darwin-test.yml@self
          parameters:
            VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
            VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
            VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
            VSCODE_COMPILE_TEST_SUITES: true

  - job: macOS_${{ parameters.VSCODE_ARCH }}_Sign
    displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Sign
    dependsOn: macOS_${{ parameters.VSCODE_ARCH }}_Compile
    timeoutInMinutes: 240
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - output: pipelineArtifact
          ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin.zip
          ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin-arm64.zip
          artifactName: vscode_client_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish client archive
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_server_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH).zip
          artifactName: vscode_server_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_web_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH)-web.zip
          artifactName: vscode_web_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_dmg/VSCode-darwin-$(VSCODE_ARCH).dmg
          artifactName: vscode_client_darwin_$(VSCODE_ARCH)_dmg
          displayName: Publish client DMG
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
    steps:
      - template: ./steps/product-build-darwin-setup.yml@self
        parameters:
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}

      - template: ./steps/product-build-darwin-download-compilation.yml@self

      - template: ./steps/product-build-darwin-package.yml@self

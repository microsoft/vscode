parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false

jobs:
  - job: macOS_${{ parameters.VSCODE_ARCH }}
    displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }})
    timeoutInMinutes: 120
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - output: pipelineArtifact
          ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin.zip
          ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin-arm64.zip
          artifactName: vscode_client_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish client archive
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_server_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH).zip
          artifactName: vscode_server_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_web_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH)-web.zip
          artifactName: vscode_web_darwin_$(VSCODE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_dmg/VSCode-darwin-$(VSCODE_ARCH).dmg
          artifactName: vscode_client_darwin_$(VSCODE_ARCH)_dmg
          displayName: Publish client DMG
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
          sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_darwin_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'))
    steps:
      - template: ./steps/product-build-darwin-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
          VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
          VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
          VSCODE_RUN_TESTS_IN_PARALLEL: ${{ or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOS_${{ parameters.VSCODE_ARCH }}_Unit
        displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) Unit Tests
        platform: macos
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: unit
        artifactPrefix: product-tests-macos-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--timeout-minutes=120" "--producer=product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload=macOS_${{ parameters.VSCODE_ARCH }}" product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload'
        timeoutInMinutes: 180
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        downloadPatterns: "**/repo.tar.gz"
        artifacts:
          - name: payload
            displayName: Download product test payload
        extractArtifactSteps:
          - script: tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/repo.tar.gz -C $(Build.SourcesDirectory)
            displayName: Extract built workspace
        setupSteps:
          - template: ./steps/product-test-dependencies.yml@self
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOS_${{ parameters.VSCODE_ARCH }}_Integration
        displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) Integration Tests
        platform: macos
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: integration
        artifactPrefix: product-tests-macos-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--timeout-minutes=120" "--producer=product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload=macOS_${{ parameters.VSCODE_ARCH }}" product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload'
        timeoutInMinutes: 180
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        artifacts:
          - name: payload
            displayName: Download product test payload
        extractArtifactSteps:
          - script: |
              set -e
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/server.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/web.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and products
        setupSteps:
          - template: ./steps/product-test-dependencies.yml@self
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: macOS_${{ parameters.VSCODE_ARCH }}_Smoke
        displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) Smoke Tests
        platform: macos
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: smoke
        artifactPrefix: product-tests-macos-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--timeout-minutes=120" "--producer=product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload=macOS_${{ parameters.VSCODE_ARCH }}" product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload'
        timeoutInMinutes: 180
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        keyVaultDisplayName: "Azure Key Vault: Get GitHub token"
        artifacts:
          - name: payload
            displayName: Download product test payload
        extractArtifactSteps:
          - script: |
              set -e
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/server.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-macos-${{ parameters.VSCODE_ARCH }}-payload/web.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and products
        setupSteps:
          - template: ./steps/product-test-dependencies.yml@self
        testSteps:
          - template: ./steps/product-build-darwin-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Smoke

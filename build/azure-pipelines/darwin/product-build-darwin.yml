parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  # Whether test jobs (see product-build-darwin-test.yml) consume the
  # compilation artifact, which then also includes out-build.
  - name: VSCODE_RUN_TESTS
    type: boolean
    default: false
  # Whether to include the steps and jobs that need a privileged service
  # connection (signing, CDN uploads, Copilot test setup). Required: only
  # builds of main and release/* branches pass true.
  - name: VSCODE_PRIVILEGED_CONNECTIONS
    type: boolean
  # Whether a build without the privileged connections still runs the package
  # job, which then publishes the unsigned product artifacts. Only the product
  # build passes true, so that its dev builds can be downloaded.
  - name: VSCODE_PACKAGE_UNSIGNED
    type: boolean
    default: false

# Compile mixes in the CLI, publishes the unsigned client for the universal
# build and publishes unpacked builds for the test and Package jobs. With the
# privileged connections, Package signs, notarizes and publishes the final
# artifacts. Without them, it publishes the unsigned server and web server
# archives and DMG as unsigned_<artifact>, next to the unsigned client archive
# that Compile publishes. The test jobs are declared next to this template (see
# product-build-darwin-test.yml) and run in parallel with Package after Compile.
jobs:
  - job: macOS_${{ parameters.VSCODE_ARCH }}_Compile
    displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/compilation
          artifactName: compilation_darwin_$(VSCODE_ARCH)
          displayName: Publish compilation artifact
          sbomEnabled: false
          isProduction: false
          condition: and(succeeded(), ne(variables['COMPILATION_PUBLISHED'], 'true'))
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_darwin_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'), ne(variables['AGENT_SDK_TARBALLS_PUBLISHED'], 'true'))
    steps:
      - template: ./steps/product-build-darwin-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_BUILD_ONLY: true
          VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

      - script: |
          set -e
          mkdir -p $(Build.ArtifactStagingDirectory)/compilation
          tar -czf $(Build.ArtifactStagingDirectory)/compilation/builds.tar.gz \
            -C $(Agent.BuildDirectory) \
            VSCode-darwin-$(VSCODE_ARCH) \
            vscode-server-darwin-$(VSCODE_ARCH) \
            vscode-server-darwin-$(VSCODE_ARCH)-web
        displayName: Archive client, server and web server builds

      - ${{ if eq(parameters.VSCODE_RUN_TESTS, true) }}:
        - script: |
            set -e
            tar -czf $(Build.ArtifactStagingDirectory)/compilation/out-build.tar.gz \
              -C $(Build.SourcesDirectory) \
              out-build
          displayName: Archive out-build

      # Pipeline artifacts can't be overwritten, so a retry of this job must skip
      # the artifacts that an earlier attempt already published, for example
      # before an injected SDL step hung (see ../common/checkForArtifact.ts)
      - script: >-
          node build/azure-pipelines/common/checkForArtifact.ts
          COMPILATION_PUBLISHED compilation_darwin_$(VSCODE_ARCH)
          AGENT_SDK_TARBALLS_PUBLISHED agent_sdk_darwin_$(VSCODE_ARCH)_tarballs
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        condition: succeededOrFailed()
        continueOnError: true
        displayName: Check for artifacts published by an earlier attempt

  # Signing needs the ESRP connection, which only builds with the privileged
  # connections may reference. The others package the product unsigned.
  - ${{ if or(eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true), eq(parameters.VSCODE_PACKAGE_UNSIGNED, true)) }}:
    - job: macOS_${{ parameters.VSCODE_ARCH }}_Sign
      ${{ if eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
        displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Package & Sign
      ${{ else }}:
        displayName: macOS (${{ upper(parameters.VSCODE_ARCH) }}) - Package
      dependsOn: macOS_${{ parameters.VSCODE_ARCH }}_Compile
      timeoutInMinutes: 240
      cancelTimeoutInMinutes: 10
      variables:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
        outputs:
          # Without the privileged connections, the compile job already publishes
          # the unsigned client archive as unsigned_vscode_client_darwin_<arch>_archive.
          - ${{ if eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
            - output: pipelineArtifact
              ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
                targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin.zip
              ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
                targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_archive/VSCode-darwin-arm64.zip
              artifactName: vscode_client_darwin_$(VSCODE_ARCH)_archive
              condition: and(succeeded(), ne(variables['CLIENT_ARCHIVE_PUBLISHED'], 'true'))
              displayName: Publish client archive
              sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
              sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
              sbomPackageVersion: $(Build.SourceVersion)
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_server_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH).zip
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_darwin_$(VSCODE_ARCH)_archive
            condition: and(succeeded(), ne(variables['SERVER_ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)
            sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Server"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_web_darwin_$(VSCODE_ARCH)_archive/vscode-server-darwin-$(VSCODE_ARCH)-web.zip
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_darwin_$(VSCODE_ARCH)_archive
            condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish web server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
            sbomPackageName: "VS Code macOS $(VSCODE_ARCH) Web"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(VSCODE_ARCH)_dmg/VSCode-darwin-$(VSCODE_ARCH).dmg
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_darwin_$(VSCODE_ARCH)_dmg
            condition: and(succeeded(), ne(variables['CLIENT_DMG_PUBLISHED'], 'true'))
            displayName: Publish client DMG
            sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(VSCODE_ARCH)
            sbomPackageName: "VS Code macOS $(VSCODE_ARCH)"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
      steps:
        - template: ./steps/product-build-darwin-setup.yml@self
          parameters:
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}

        - template: ./steps/product-build-darwin-download-compilation.yml@self

        - template: ./steps/product-build-darwin-package.yml@self
          parameters:
            VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

        # Pipeline artifacts can't be overwritten, so a retry of this job must skip
        # the artifacts that an earlier attempt already published, for example
        # before timing out (see ../common/checkForArtifact.ts)
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, 'CLIENT_ARCHIVE_PUBLISHED vscode_client_darwin_$(VSCODE_ARCH)_archive', '') }}
            SERVER_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_darwin_$(VSCODE_ARCH)_archive
            WEB_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_darwin_$(VSCODE_ARCH)_archive
            CLIENT_DMG_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_darwin_$(VSCODE_ARCH)_dmg
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt

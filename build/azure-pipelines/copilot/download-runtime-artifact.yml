# Waits for and downloads the `@github/copilot` package the CopilotRuntime stage
# built for this job's target, so gulp packaging consumes it instead of compiling
# the runtime here. See build/lib/copilotRuntimeSource.ts.
#
# A no-op unless this job's own package.json asks for a runtime source build
# (VSCODE_COPILOT_RUNTIME_SOURCE, set by the apply step) — the same file the
# producing stage read, so the two never disagree.
#
# Waits rather than depending on the stage: a stage dependency would hold every
# packaging job at the gate even when nothing is being overridden. Belongs late
# in the job, after the ~20 minutes of compiling that the runtime build overlaps
# with, so the wait is normally already satisfied when it is reached. Naming the
# producer lets the wait fail fast when that target's build failed instead of
# blocking for an hour.

parameters:
  # A `@github/copilot-<platform>-<arch>` target, e.g. `linuxmusl-arm64`.
  - name: VSCODE_COPILOT_TARGET
    type: string

steps:
  - script: node build/azure-pipelines/common/waitForArtifacts.ts "--producer=$(ARTIFACT_PREFIX)copilot_runtime_${{ replace(parameters.VSCODE_COPILOT_TARGET, '-', '_') }}=CopilotRuntime_${{ replace(parameters.VSCODE_COPILOT_TARGET, '-', '_') }}" $(ARTIFACT_PREFIX)copilot_runtime_${{ replace(parameters.VSCODE_COPILOT_TARGET, '-', '_') }}
    condition: and(succeeded(), eq(variables['VSCODE_COPILOT_RUNTIME_SOURCE'], 'true'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Wait for ${{ parameters.VSCODE_COPILOT_TARGET }} runtime artifact

  - task: DownloadPipelineArtifact@2
    condition: and(succeeded(), eq(variables['VSCODE_COPILOT_RUNTIME_SOURCE'], 'true'))
    inputs:
      artifact: $(ARTIFACT_PREFIX)copilot_runtime_${{ replace(parameters.VSCODE_COPILOT_TARGET, '-', '_') }}
      patterns: "**"
      # Must match runtimeArtifactDir() in build/lib/copilotRuntimeSource.ts.
      path: $(Build.SourcesDirectory)/.build/copilot-overrides/runtime-artifacts/${{ parameters.VSCODE_COPILOT_TARGET }}
    displayName: Download ${{ parameters.VSCODE_COPILOT_TARGET }} runtime artifact

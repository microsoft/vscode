parameters:
  - name: OS
    type: string # linux, win32

# Runs every Copilot test in the Copilot Tests job of the Windows and Linux
# stages. The Quality Checks job (../product-quality-checks.yml) compiles, type
# checks and lints Copilot.
steps:
  - script: git lfs install --local
    condition: and(succeeded(), eq(variables['Build.Repository.Provider'], 'TfsGit'))
    displayName: Initialize Git LFS for Azure Repos

  - script: git --config-env=http.extraheader=GIT_AUTH_HEADER lfs pull --include="extensions/copilot/test/simulation/cache/**"
    condition: and(succeeded(), eq(variables['Build.Repository.Provider'], 'TfsGit'))
    displayName: Pull Copilot test cache from Azure Repos
    env:
      GIT_AUTH_HEADER: "AUTHORIZATION: bearer $(System.AccessToken)"

  # Setup copilot test environment (tokens, env vars)
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'VS Code Development WIF'
      ${{ if eq(parameters.OS, 'win32') }}:
        scriptType: 'pscore'
      ${{ else }}:
        scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: pnpm run setup
      workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
    displayName: Setup copilot test environment
    # The Azure login and secret fetch can fail transiently. `npm run setup`
    # replaces its .env entries by key, so a retry is safe.
    retryCountOnTaskFailure: 2

  # Compute the path to the VS Code build executable
  - ${{ if eq(parameters.OS, 'linux') }}:
    - script: |
        set -e
        APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
        APP_NAME=$(node -p "require(\"$APP_ROOT/resources/app/product.json\").applicationName")
        echo "##vso[task.setvariable variable=VSCODE_UNDER_TEST]$APP_ROOT/$APP_NAME"
      displayName: Compute VS Code build path

  - ${{ if eq(parameters.OS, 'win32') }}:
    - powershell: |
        $AppRoot = "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
        $ProductJsonPath = (Get-ChildItem -Path "$AppRoot" -Name "product.json" -Recurse | Select-Object -First 1)
        $AppProductJson = Get-Content -Raw -Path "$AppRoot\$ProductJsonPath" | ConvertFrom-Json
        $AppNameShort = $AppProductJson.nameShort
        Write-Host "##vso[task.setvariable variable=VSCODE_UNDER_TEST]$AppRoot\$AppNameShort.exe"
      displayName: Compute VS Code build path

  # Compile copilot extension for tests
  - script: pnpm run compile
    workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
    displayName: Compile copilot

  # Run Copilot tests
  - ${{ if eq(parameters.OS, 'linux') }}:
    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-unit
        testStep:
          script: pnpm run test:unit
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot unit tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-simulation
        testStep:
          script: pnpm run simulate-ci
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot simulation tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-prompt
        testStep:
          script: pnpm run test:prompt
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot prompt tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-extension
        testStep:
          script: xvfb-run -a pnpm run test:extension
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot extension tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-completions-core
        testStep:
          script: xvfb-run -a pnpm run test:completions-core
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot completions core tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-sanity
        testStep:
          script: xvfb-run -a pnpm run test:sanity
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot sanity tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

  # The Windows test tasks use the same checkpoints with PowerShell commands.
  - ${{ if eq(parameters.OS, 'win32') }}:
    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-unit
        testStep:
          powershell: pnpm run test:unit
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot unit tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-simulation
        testStep:
          powershell: pnpm run simulate-ci
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot simulation tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-prompt
        testStep:
          powershell: pnpm run test:prompt
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot prompt tests
          timeoutInMinutes: 15

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-extension
        testStep:
          powershell: pnpm run test:extension
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot extension tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

    # MAYBE https://dev.azure.com/monacotools/Monaco/_build/results?buildId=426316&view=logs&j=573fdb8c-432d-57b7-addd-e5c3edb6227f&t=6fad2a73-ceba-567d-939f-7bd557eba1dc&s=40b405d8-d9ea-5f38-8ab3-8db0b216e2d0
    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-completions-core
        testStep:
          powershell: pnpm run test:completions-core
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot completions core tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

    - template: ../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: copilot-sanity
        testStep:
          powershell: pnpm run test:sanity
          workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
          displayName: 🧪 Run Copilot sanity tests
          timeoutInMinutes: 15
          env:
            VSCODE_UNDER_TEST: $(VSCODE_UNDER_TEST)

steps:
  # microsoft/vscode-capi is a separate repository that installs with npm.
  - script: BUILD_SOURCESDIRECTORY=$(Build.SourcesDirectory)/extensions/copilot npm run mixin
    workingDirectory: $(Build.SourcesDirectory)/.build/vscode-capi
    displayName: Mixin vscode-capi

  - script: pnpm run build
    workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
    displayName: Build copilot extension

# Builds `@github/copilot` from source, one job per platform target, for the
# packaging stages to consume as pipeline artifacts.
#
# This is the hotfix and nightly path: it is the only way a VS Code release can
# carry an unpublished runtime commit, so it is built to fail loudly and early
# rather than 40 minutes into packaging.
#
# The override lives in package.json, which the pipeline cannot read when it
# decides which stages exist — template expressions have no file I/O, and nothing
# is on an agent yet. So this stage always exists, and a single cheap Detect job
# reads package.json and gates the eight build jobs behind it. A normal build
# pays for that one job and nothing else: the build jobs are skipped without ever
# acquiring an agent, and no other stage waits on this one.
#
# Targets mirror the platform toggles, so a partial build does not compile
# runtimes nobody will package. A target that is skipped here but turns out to be
# needed is not a failure: the packaging job falls back to building it in place
# (see build/lib/copilotRuntimeSource.ts).

parameters:
  # Run as the nightly canary rather than for a requested override.
  - name: VSCODE_COPILOT_RUNTIME_CANARY
    type: boolean
    default: false
  - name: VSCODE_BUILD_WIN32
    type: boolean
  - name: VSCODE_BUILD_WIN32_ARM64
    type: boolean
  - name: VSCODE_BUILD_LINUX
    type: boolean
  - name: VSCODE_BUILD_LINUX_ARM64
    type: boolean
  - name: VSCODE_BUILD_ALPINE
    type: boolean
  - name: VSCODE_BUILD_ALPINE_ARM64
    type: boolean
  - name: VSCODE_BUILD_MACOS
    type: boolean
  - name: VSCODE_BUILD_MACOS_ARM64
    type: boolean

jobs:
  - job: CopilotRuntimeDetect
    displayName: Detect
    timeoutInMinutes: 20
    pool:
      name: 1es-ubuntu-22.04-x64
      os: linux
    ${{ if eq(parameters.VSCODE_COPILOT_RUNTIME_CANARY, true) }}:
      # Every cron triggers this pipeline; the canary only wants one of them.
      condition: and(succeeded(), eq(variables['Build.CronSchedule.DisplayName'], variables['VSCODE_COPILOT_RUNTIME_CANARY_CRON']))
    steps:
      - template: ../common/checkout.yml@self

      - task: NodeTool@0
        inputs:
          versionSource: fromFile
          versionFilePath: .nvmrc

      # Publishes VSCODE_COPILOT_RUNTIME_SOURCE for the build jobs' conditions.
      - script: node build/azure-pipelines/common/apply-copilot-override.ts --detect
        name: detect
        env:
          COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}
        displayName: Copilot override — detect

  - ${{ if eq(parameters.VSCODE_BUILD_WIN32, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: win32-x64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_WIN32_ARM64, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: win32-arm64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: linux-x64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: linux-arm64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  # Alpine is musl Linux; the runtime stages those prebuilds under `linuxmusl-*`.
  - ${{ if eq(parameters.VSCODE_BUILD_ALPINE, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: linuxmusl-x64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_ALPINE_ARM64, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: linuxmusl-arm64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_MACOS, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: darwin-x64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

  - ${{ if eq(parameters.VSCODE_BUILD_MACOS_ARM64, true) }}:
      - template: runtime-source-build-job.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: darwin-arm64
          VSCODE_COPILOT_RUNTIME_CANARY: ${{ parameters.VSCODE_COPILOT_RUNTIME_CANARY }}

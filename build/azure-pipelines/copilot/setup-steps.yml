steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.21.x"

  # Check out the private microsoft/vscode-capi repository using the agent's
  # GitHub App (Monaco) credentials instead of cloning it with a PAT. The
  # repository resource is declared in the top-level pipeline (resources.repositories).
  - checkout: capi
    path: s/.build/vscode-capi
    fetchDepth: 1
    retryCountOnTaskFailure: 3
    displayName: Checkout microsoft/vscode-capi

  - pwsh: node build/setup-npm-registry.ts $env:NPM_REGISTRY
    workingDirectory: $(Build.SourcesDirectory)
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'), contains(variables['Agent.OS'], 'windows'))
    displayName: Setup NPM Registry (Windows)

  - script: node build/setup-npm-registry.ts $NPM_REGISTRY
    workingDirectory: $(Build.SourcesDirectory)
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'), not(contains(variables['Agent.OS'], 'windows')))
    displayName: Setup NPM Registry (non-Windows)

  - script: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts $(node -p process.platform) $(node -p process.arch) > .build/packagelockhash
    displayName: Prepare node_modules cache key

  - task: Cache@2
    inputs:
      key: '"copilot_build_cache" | "forced-npm-202610261608" | .build/packagelockhash | .build/vscode-capi/package-lock.json'
      path: .build/node_modules_cache
      cacheHitVar: BUILD_CACHE_RESTORED
    displayName: Restore node_modules cache
    retryCountOnTaskFailure: 2

  - script: tar -xzf .build/node_modules_cache/cache.tgz
    condition: and(succeeded(), eq(variables.BUILD_CACHE_RESTORED, 'true'))
    displayName: Extract node_modules cache

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      # Set the private NPM registry to the global npmrc file
      # so that authentication works for subfolders like build/, remote/, extensions/ etc
      # which does not have their own .npmrc file
      npm config set registry "$env:NPM_REGISTRY"
      $NpmrcPath = (npm config get userconfig)
      Write-Host "##vso[task.setvariable variable=NPMRC_PATH]$NpmrcPath"
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'), contains(variables['Agent.OS'], 'windows'))
    displayName: Setup NPM (Windows)

  - script: |
      set -e
      # Set the private NPM registry to the global npmrc file
      # so that authentication works for subfolders like build/, remote/, extensions/ etc
      # which does not have their own .npmrc file
      npm config set registry "$NPM_REGISTRY"
      echo "##vso[task.setvariable variable=NPMRC_PATH]$(npm config get userconfig)"
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'), not(contains(variables['Agent.OS'], 'windows')))
    displayName: Setup NPM (non-Windows)

  - task: npmAuthenticate@0
    inputs:
      workingFile: $(NPMRC_PATH)
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM Authentication

  # npm ci removes node_modules before installing, so retrying it after a transient registry error
  # such as ECONNRESET starts from a clean state.
  # VALIDATION ONLY (do not merge): fail the first `npm ci` in each working directory so
  # retryCountOnTaskFailure has to fire.
  - script: |
      set -e
      SHIM_DIR="$(Agent.TempDirectory)/npm-shim"
      mkdir -p "$SHIM_DIR"
      REAL_NPM="$(command -v npm)"
      cat > "$SHIM_DIR/npm" <<EOF
      #!/usr/bin/env bash
      if [ "\$1" = "ci" ]; then
        key=\$(pwd | sed 's#[^A-Za-z0-9]#_#g')
        f="$SHIM_DIR/count-\$key"
        n=\$(( \$(cat "\$f" 2>/dev/null || echo 0) + 1 )); echo \$n > "\$f"
        if [ \$n -le 1 ]; then echo "NPM-SHIM: forced failure \$n/1 for npm ci in \$(pwd)" >&2; exit 1; fi
        echo "NPM-SHIM: attempt \$n for npm ci in \$(pwd) passes through" >&2
      fi
      exec "$REAL_NPM" "\$@"
      EOF
      chmod +x "$SHIM_DIR/npm"
      echo "##vso[task.prependpath]$SHIM_DIR"
      echo "Installed npm shim in front of $REAL_NPM"
    condition: and(succeeded(), not(contains(variables['Agent.OS'], 'windows')))
    displayName: "VALIDATION: install failing npm shim"
  - script: npm ci
    workingDirectory: build
    displayName: Install build dependencies
    condition: and(succeeded(), ne(variables.BUILD_CACHE_RESTORED, 'true'))
    retryCountOnTaskFailure: 3

  - script: npm ci --ignore-scripts --no-workspaces
    workingDirectory: $(Build.SourcesDirectory)
    displayName: Install vscode dependencies
    condition: and(succeeded(), ne(variables.BUILD_CACHE_RESTORED, 'true'))
    retryCountOnTaskFailure: 3

  - script: npm ci
    workingDirectory: $(Build.SourcesDirectory)/extensions/copilot
    displayName: Install copilot dependencies
    condition: and(succeeded(), ne(variables.BUILD_CACHE_RESTORED, 'true'))
    retryCountOnTaskFailure: 3

  - script: npm ci
    workingDirectory: $(Build.SourcesDirectory)/.build/vscode-capi
    displayName: Install vscode-capi dependencies
    condition: and(succeeded(), ne(variables.BUILD_CACHE_RESTORED, 'true'))
    retryCountOnTaskFailure: 3

  - script: node build/azure-pipelines/common/checkNativeOptionalDeps.ts
    workingDirectory: $(Build.SourcesDirectory)
    displayName: Verify native optional dependency binaries

  - script: |
      set -e
      mkdir -p .build
      node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
      echo .build/vscode-capi/node_modules >> .build/node_modules_list.txt
      mkdir -p .build/node_modules_cache
      tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt
    condition: and(succeeded(), ne(variables.BUILD_CACHE_RESTORED, 'true'))
    displayName: Create node_modules archive

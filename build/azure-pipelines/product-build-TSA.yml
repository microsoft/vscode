pr: none

schedules:
  - cron: "0 18 * * *"
    displayName: Daily at 18:00 UTC (Pacific Time)
    branches:
      include:
        - main
    always: true

trigger: none

parameters:
  - name: VSCODE_RUN_TSA
    displayName: "Run TSA checks"
    type: boolean
    default: true

variables:
  - template: product-build-variables.yml@self
    parameters:
      VSCODE_PUBLISH: false

name: "$(Date:yyyyMMdd).$(Rev:r) (insider)"

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: distro
      type: github
      name: microsoft/vscode-distro
      endpoint: Monaco
      ref: main
    - repository: capi
      type: github
      name: microsoft/vscode-capi
      endpoint: Monaco
      ref: main
    - repository: encrypt
      type: github
      name: microsoft/vscode-encrypt
      endpoint: Monaco
      ref: main
    - repository: vsda
      type: github
      name: microsoft/vsda
      endpoint: Monaco
      ref: main
    - repository: regexp
      type: github
      name: microsoft/vscode-regexp-languagedetection
      endpoint: Monaco
      ref: main
    - repository: vscode_loc
      type: github
      name: microsoft/vscode-extensions-loc
      endpoint: Monaco
      ref: main

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceRepositoriesToScan:
        exclude:
          - repository: distro
          - repository: capi
          - repository: encrypt
          - repository: vsda
          - repository: regexp
          - repository: vscode_loc
      tsa:
        enabled: ${{ parameters.VSCODE_RUN_TSA }}
        configFile: $(Build.SourcesDirectory)/build/azure-pipelines/config/tsaoptions.json
      binskim:
        analyzeTargetGlob: '+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.exe;+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.dll;+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.node;-:file|$(Agent.BuildDirectory)/VSCode-*/**/resources/**/*.exe;-:file|$(Agent.BuildDirectory)/VSCode-*/**/resources/**/*.node;-:file|$(Build.SourcesDirectory)/.build/**/system-setup/VSCodeSetup*.exe;-:file|$(Build.SourcesDirectory)/.build/**/user-setup/VSCodeUserSetup*.exe'
      codeql:
        runSourceLanguagesInSourceAnalysis: true
        compiled:
          enabled: false
          justificationForDisabling: "CodeQL breaks ESRP CodeSign on macOS (ICM #520035761, githubcustomers/microsoft-codeql-support#198)"
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/build/azure-pipelines/config/CredScanSuppressions.json
      eslint:
        enabled: true
        enableExclusions: true
        exclusionsFilePath: $(Build.SourcesDirectory)/.eslint-ignore
      sourceAnalysisPool: 1es-windows-2022-x64
      createAdoIssuesForJustificationsForDisablement: false
    containers:
      ubuntu-2004-arm64:
        image: onebranch.azurecr.io/linux/ubuntu-2004-arm64:latest
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    stages:
      - stage: TSA
        displayName: TSA
        dependsOn: []
        pool:
          name: 1es-ubuntu-22.04-x64
          os: linux
        jobs:
          - job: RunTSA
            displayName: Run TSA
            steps:
              - checkout: self
                path: s
                fetchDepth: 1
                fetchTags: false
                retryCountOnTaskFailure: 3
                displayName: Checkout microsoft/vscode

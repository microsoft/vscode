pr: none

trigger: none

parameters:
  - name: VSCODE_QUALITY
    displayName: Product Build Quality
    type: string
    default: insider
    values:
      - exploration
      - insider
      - stable
  - name: VSCODE_PUBLISH
    displayName: Publish Product Build
    type: boolean
    default: false
  - name: VSCODE_RELEASE
    displayName: Release Product Build
    type: boolean
    default: false
  - name: VSCODE_WAIT_FOR_PRODUCT_BUILD
    displayName: Wait for Product Build
    type: boolean
    default: true
  - name: NPM_REGISTRY
    displayName: Internal NPM Registry
    type: string
    default: https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/npm/registry/
  - name: CARGO_REGISTRY
    displayName: Internal Cargo Registry
    type: string
    default: sparse+https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/Cargo/index/
  - name: VSCODE_PRODUCT_BUILD_DEFINITION_ID
    displayName: Product Build Definition
    type: number
    default: 111
  - name: VSCODE_BUILD_WINDOWS
    displayName: Build Windows
    type: boolean
    default: true
  - name: VSCODE_BUILD_LINUX
    displayName: Build Linux
    type: boolean
    default: true
  - name: VSCODE_BUILD_ALPINE
    displayName: Build Alpine
    type: boolean
    default: true
  - name: VSCODE_BUILD_MACOS
    displayName: Build macOS
    type: boolean
    default: true
  - name: VSCODE_BUILD_WEB
    displayName: Also Build Web (Requires a Runtime OS)
    type: boolean
    default: true

variables:
  - name: skipComponentGovernanceDetection
    value: true
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: NPM_REGISTRY
    value: ${{ parameters.NPM_REGISTRY }}
  - name: CARGO_REGISTRY
    value: ${{ parameters.CARGO_REGISTRY }}

name: "$(Date:yyyyMMdd).$(Rev:r) (Copilot source)"

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      tsa:
        enabled: false
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: The pipeline builds external Copilot sources and does not compile VS Code.
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/build/azure-pipelines/config/CredScanSuppressions.json
      eslint:
        enabled: false
      sourceAnalysisPool: 1es-windows-2022-x64
      createAdoIssuesForJustificationsForDisablement: false
    stages:
      - stage: Build
        displayName: Build Copilot Runtime
        jobs:
          - job: ResolveCopilotBuildOverrides
            displayName: Resolve Copilot Build Overrides
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build/azure-pipelines/common/checkout.yml@self
              - task: NodeTool@0
                inputs:
                  versionSource: fromFile
                  versionFilePath: .nvmrc
              - script: node build/azure-pipelines/common/resolve-copilot-build-overrides.ts
                name: resolve
                env:
                  VSCODE_BUILD_WINDOWS: ${{ parameters.VSCODE_BUILD_WINDOWS }}
                  VSCODE_BUILD_LINUX: ${{ parameters.VSCODE_BUILD_LINUX }}
                  VSCODE_BUILD_ALPINE: ${{ parameters.VSCODE_BUILD_ALPINE }}
                  VSCODE_BUILD_MACOS: ${{ parameters.VSCODE_BUILD_MACOS }}
                displayName: Resolve package.json Build Overrides

          - ${{ if eq(parameters.VSCODE_BUILD_WINDOWS, true) }}:
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: win32-x64
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: win32-arm64
          - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: linux-x64
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: linux-arm64
          - ${{ if eq(parameters.VSCODE_BUILD_ALPINE, true) }}:
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: linuxmusl-x64
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: linuxmusl-arm64
          - ${{ if eq(parameters.VSCODE_BUILD_MACOS, true) }}:
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: darwin-x64
            - template: build/azure-pipelines/copilot/source-publish-runtime-job.yml@self
              parameters:
                target: darwin-arm64

      - stage: Publish
        displayName: Publish and Queue Product Build
        dependsOn: Build
        pool:
          name: 1es-ubuntu-22.04-x64
          os: linux
        jobs:
          - job: Publish
            timeoutInMinutes: 600
            variables:
              COPILOT_SDK_SOURCE_REF: $[ stageDependencies.Build.ResolveCopilotBuildOverrides.outputs['resolve.COPILOT_SDK_SOURCE_REF'] ]
              COPILOT_RUNTIME_SOURCE_REF: $[ stageDependencies.Build.ResolveCopilotBuildOverrides.outputs['resolve.COPILOT_RUNTIME_SOURCE_REF'] ]
            steps:
              - template: build/azure-pipelines/common/checkout.yml@self

              - task: NodeTool@0
                inputs:
                  versionSource: fromFile
                  versionFilePath: .nvmrc

              - script: node build/azure-pipelines/common/set-copilot-source-version.ts
                displayName: Set Copilot source package version

              - ${{ if eq(parameters.VSCODE_BUILD_MACOS, true) }}:
                - download: current
                  artifact: copilot_runtime_darwin_arm64
                  displayName: Download darwin-arm64 runtime
                - download: current
                  artifact: copilot_runtime_darwin_x64
                  displayName: Download darwin-x64 runtime
              - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
                - download: current
                  artifact: copilot_runtime_linux_arm64
                  displayName: Download linux-arm64 runtime
                - download: current
                  artifact: copilot_runtime_linux_x64
                  displayName: Download linux-x64 runtime
              - ${{ if eq(parameters.VSCODE_BUILD_ALPINE, true) }}:
                - download: current
                  artifact: copilot_runtime_linuxmusl_arm64
                  displayName: Download linuxmusl-arm64 runtime
                - download: current
                  artifact: copilot_runtime_linuxmusl_x64
                  displayName: Download linuxmusl-x64 runtime
              - ${{ if eq(parameters.VSCODE_BUILD_WINDOWS, true) }}:
                - download: current
                  artifact: copilot_runtime_win32_arm64
                  displayName: Download win32-arm64 runtime
                - download: current
                  artifact: copilot_runtime_win32_x64
                  displayName: Download win32-x64 runtime

              - script: node build/azure-pipelines/common/configure-copilot-source-registry.ts
                env:
                  COPILOT_SOURCE_REGISTRY: $(NPM_REGISTRY)
                  COPILOT_SOURCE_NPMRC: $(Agent.TempDirectory)/copilot-source.npmrc
                displayName: Configure internal NPM feed

              - task: npmAuthenticate@0
                inputs:
                  workingFile: $(Agent.TempDirectory)/copilot-source.npmrc
                displayName: Authenticate internal NPM feed

              - script: node build/azure-pipelines/common/publish-copilot-runtime.ts
                env:
                  COPILOT_RUNTIME_ARTIFACTS_DIR: $(Pipeline.Workspace)
                  COPILOT_RUNTIME_PACKAGES_DIR: $(Build.ArtifactStagingDirectory)/copilot-runtime-packages
                  COPILOT_RUNTIME_SOURCE_REF: $(COPILOT_RUNTIME_SOURCE_REF)
                  COPILOT_SOURCE_VERSION: $(COPILOT_SOURCE_VERSION)
                  COPILOT_SOURCE_REGISTRY: $(NPM_REGISTRY)
                  NPM_CONFIG_USERCONFIG: $(Agent.TempDirectory)/copilot-source.npmrc
                  VSCODE_BUILD_WINDOWS: ${{ parameters.VSCODE_BUILD_WINDOWS }}
                  VSCODE_BUILD_LINUX: ${{ parameters.VSCODE_BUILD_LINUX }}
                  VSCODE_BUILD_ALPINE: ${{ parameters.VSCODE_BUILD_ALPINE }}
                  VSCODE_BUILD_MACOS: ${{ parameters.VSCODE_BUILD_MACOS }}
                displayName: Publish Copilot runtime packages

              - script: node build/azure-pipelines/common/publish-copilot-sdk.ts
                env:
                  COPILOT_SDK_SOURCE_REF: $(COPILOT_SDK_SOURCE_REF)
                  COPILOT_SOURCE_VERSION: $(COPILOT_SOURCE_VERSION)
                  COPILOT_RUNTIME_SOURCE_VERSION: $(COPILOT_SOURCE_VERSION)
                  COPILOT_SOURCE_REGISTRY: $(NPM_REGISTRY)
                  NPM_CONFIG_USERCONFIG: $(Agent.TempDirectory)/copilot-source.npmrc
                displayName: Build and publish Copilot SDK

              - script: node build/azure-pipelines/common/queue-copilot-product-build.ts
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  VSCODE_PRODUCT_BUILD_DEFINITION_ID: ${{ parameters.VSCODE_PRODUCT_BUILD_DEFINITION_ID }}
                  VSCODE_PRODUCT_SOURCE_BRANCH: $(Build.SourceBranch)
                  VSCODE_PRODUCT_SOURCE_VERSION: $(Build.SourceVersion)
                  VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
                  NPM_REGISTRY: $(NPM_REGISTRY)
                  VSCODE_PUBLISH: ${{ parameters.VSCODE_PUBLISH }}
                  VSCODE_RELEASE: ${{ parameters.VSCODE_RELEASE }}
                  VSCODE_WAIT_FOR_PRODUCT_BUILD: ${{ parameters.VSCODE_WAIT_FOR_PRODUCT_BUILD }}
                  VSCODE_BUILD_WINDOWS: ${{ parameters.VSCODE_BUILD_WINDOWS }}
                  VSCODE_BUILD_LINUX: ${{ parameters.VSCODE_BUILD_LINUX }}
                  VSCODE_BUILD_ALPINE: ${{ parameters.VSCODE_BUILD_ALPINE }}
                  VSCODE_BUILD_MACOS: ${{ parameters.VSCODE_BUILD_MACOS }}
                  VSCODE_BUILD_WEB: ${{ parameters.VSCODE_BUILD_WEB }}
                displayName: Queue product build

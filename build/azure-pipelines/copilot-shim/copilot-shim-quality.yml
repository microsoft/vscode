steps:
  - script: rustup component add rustfmt clippy
    displayName: Install Rust quality components
    condition: and(succeeded(), eq(variables['CARGO_REGISTRY'], 'none'))

  - script: cargo fmt --check
    displayName: Check Copilot shim formatting
    workingDirectory: $(Build.SourcesDirectory)/copilot_shim

  - script: cargo test --locked
    displayName: Test Copilot shim
    workingDirectory: $(Build.SourcesDirectory)/copilot_shim

  - script: cargo clippy --all-targets --locked -- -D warnings
    displayName: Lint Copilot shim
    workingDirectory: $(Build.SourcesDirectory)/copilot_shim

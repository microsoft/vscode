parameters:
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-ubuntu-22.04-x64
  - name: VSCODE_BUILD_WEB_MOBILE
    type: boolean
    default: true

jobs:
  - template: product-build-web-job.yml
    parameters:
      VSCODE_POOL_NAME: ${{ parameters.VSCODE_POOL_NAME }}
  - ${{ if parameters.VSCODE_BUILD_WEB_MOBILE }}:
    - template: product-build-web-job.yml
      parameters:
        VSCODE_POOL_NAME: ${{ parameters.VSCODE_POOL_NAME }}
        mobile: true

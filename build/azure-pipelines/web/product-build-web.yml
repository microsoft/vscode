parameters:
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-ubuntu-22.04-x64
  - name: mobile
    type: boolean
    default: false

jobs:
  - job: ${{ iif(parameters.mobile, 'Mobile', 'Web') }}
    displayName: ${{ iif(parameters.mobile, 'Mobile', 'Web') }}
    ${{ if parameters.mobile }}:
      continueOnError: true
    timeoutInMinutes: 45
    pool:
      name: ${{ parameters.VSCODE_POOL_NAME }}
      os: linux
    variables:
      VSCODE_ARCH: x64
      WEB_MOBILE_ARCHIVE_READY: 'false'
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - ${{ if not(parameters.mobile) }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-web.tar.gz
            artifactName: vscode_web_linux_standalone_archive-unsigned
            displayName: Publish web archive
            condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-web
            sbomPackageName: "VS Code Linux x64 Web (Standalone)"
            sbomPackageVersion: $(Build.SourceVersion)
        - ${{ if parameters.mobile }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-web-mobile.tar.gz
            artifactName: vscode_web_linux_mobile_archive-unsigned
            displayName: Publish mobile web archive
            condition: and(succeeded(), eq(variables['WEB_MOBILE_ARCHIVE_READY'], 'true'), ne(variables['WEB_MOBILE_ARCHIVE_PUBLISHED'], 'true'))
            sbomEnabled: true
            isProduction: true
            sbomBuildDropPath: $(Build.SourcesDirectory)/out-mobile
            sbomPackageName: "VS Code Mobile Web"
            sbomPackageVersion: $(Build.SourceVersion)
    steps:
      - template: ../common/checkout.yml@self

      - template: ../common/setup-node.yml@self
        parameters:
          os: linux

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - script: node build/setup-npm-registry.ts $NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      - template: ../common/restore-pnpm-store.yml@self
        parameters:
          keyArgs: web
          os: linux

      - script: |
          set -e
          # Set the private NPM registry to the global npmrc file
          # so that authentication works for subfolders like build/, remote/, extensions/ etc
          # which does not have their own .npmrc file
          npm config set registry "$NPM_REGISTRY"
          echo "##vso[task.setvariable variable=NPMRC_PATH]$(npm config get userconfig)"
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM

      - task: npmAuthenticate@0
        inputs:
          workingFile: $(NPMRC_PATH)
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Authentication

      - template: ../common/install-pnpm.yml@self

      - task: NuGetAuthenticate@1
        displayName: Setup NuGet Authentication

      - script: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y libkrb5-dev
        displayName: Setup system services

      - script: pnpm run preinstall
        displayName: Install Electron headers

      - script: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-token-code-oss)"
          FOUNDRY_LOCAL_NUGET_MODE: dotnet
          FOUNDRY_LOCAL_NUGET_FEEDS: "https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/nuget/v3/index.json"
        displayName: Install dependencies

      # NuGetAuthenticate@1 exposes its access token to all later steps as the
      # VSS_NUGET_ACCESSTOKEN environment variable, from where they can write it
      # to logs. Only installing dependencies needs it, so clear it now.
      - script: echo "##vso[task.setvariable variable=VSS_NUGET_ACCESSTOKEN]"
        displayName: Clear package feed credentials
        condition: always()

      - script: node build/azure-pipelines/common/checkNativeOptionalDeps.ts
        displayName: Verify native optional dependency binaries

      - script: node build/azure-pipelines/distro/mixin-npm.ts
        displayName: Mixin distro node modules

      - template: ../common/prune-pnpm-store.yml@self
        parameters:
          os: linux

      - script: node build/azure-pipelines/distro/mixin-quality.ts
        displayName: Mixin distro quality

      - template: ../common/install-builtin-extensions.yml@self

      - script: node build/npm/electronTypes.ts
        displayName: Prepare Electron types

      - template: ../common/mixin-vscode-capi.yml@self

      - ${{ if not(parameters.mobile) }}:
        - script: pnpm run gulp core-ci
          env:
            GITHUB_TOKEN: "$(github-token-code-oss)"
          displayName: Compile

        - script: |
            set -e
            pnpm run gulp vscode-web-min-ci
            ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/out/web/vscode-web.tar.gz"
            mkdir -p $(dirname $ARCHIVE_PATH)
            tar --owner=0 --group=0 -czf $ARCHIVE_PATH -C .. vscode-web
            echo "##vso[task.setvariable variable=WEB_PATH]$ARCHIVE_PATH"
          env:
            GITHUB_TOKEN: "$(github-token-code-oss)"
          displayName: Build

      - task: AzureCLI@2
        displayName: Fetch secrets from Azure
        inputs:
          azureSubscription: vscode
          scriptType: pscore
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          inlineScript: |
            Write-Host "##vso[task.setvariable variable=AZURE_TENANT_ID]$env:tenantId"
            Write-Host "##vso[task.setvariable variable=AZURE_CLIENT_ID]$env:servicePrincipalId"
            Write-Host "##vso[task.setvariable variable=AZURE_ID_TOKEN;issecret=true]$env:idToken"

      - ${{ if not(parameters.mobile) }}:
        - script: |
            set -e
            AZURE_STORAGE_ACCOUNT="vscodeweb" \
            AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
            AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
            AZURE_ID_TOKEN="$(AZURE_ID_TOKEN)" \
              node build/azure-pipelines/upload-cdn.ts
          displayName: Upload to CDN

        - script: |
            set -e
            AZURE_STORAGE_ACCOUNT="vscodeweb" \
            AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
            AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
            AZURE_ID_TOKEN="$(AZURE_ID_TOKEN)" \
              node build/azure-pipelines/upload-sourcemaps.ts out-vscode-web-min
          displayName: Upload sourcemaps (Web)

        - script: |
            set -e
            AZURE_STORAGE_ACCOUNT="vscodeweb" \
            AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
            AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
            AZURE_ID_TOKEN="$(AZURE_ID_TOKEN)" \
              node build/azure-pipelines/upload-nlsmetadata.ts
          displayName: Upload NLS Metadata

      - ${{ if parameters.mobile }}:
        - script: |
            set -e
            trap 'echo "##vso[task.logissue type=warning]Mobile build or validation failed; continuing without a mobile archive."' ERR
            pnpm run test-mobile
            node --test build/lib/test/mobileWebPublication.test.ts
            pnpm run bundle-mobile
            mkdir -p "$(Build.ArtifactStagingDirectory)/out/web"
            tar --owner=0 --group=0 --transform='s,^out-mobile,vscode-web-mobile,' \
              -czf "$(Build.ArtifactStagingDirectory)/out/web/vscode-web-mobile.tar.gz" \
              out-mobile/out out-mobile/node_modules \
              out-mobile/extensions out-mobile/mobile.json
            echo "##vso[task.setvariable variable=WEB_MOBILE_ARCHIVE_READY]true"
          displayName: Build and validate mobile web archive

        - script: |
            set -e
            trap 'echo "##vso[task.logissue type=warning]Mobile CDN upload failed; continuing the ordinary release."' ERR
            AZURE_STORAGE_ACCOUNT="vscodeweb" \
            AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
            AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
            AZURE_ID_TOKEN="$(AZURE_ID_TOKEN)" \
              node build/azure-pipelines/upload-cdn.ts --mobile
          condition: and(succeeded(), eq(variables['WEB_MOBILE_ARCHIVE_READY'], 'true'), eq(variables['VSCODE_PUBLISH'], 'True'))
          displayName: Upload mobile web assets to the separate commit directory

        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            WEB_MOBILE_ARCHIVE_PUBLISHED vscode_web_linux_mobile_archive-unsigned
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true
          displayName: Check for a mobile archive published by an earlier attempt

      # Pipeline artifacts can't be overwritten, so a retry of this job must skip
      # the artifacts that an earlier attempt already published, for example
      # before an injected SDL step hung (see ../common/checkForArtifact.ts)
      - ${{ if not(parameters.mobile) }}:
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            WEB_ARCHIVE_PUBLISHED vscode_web_linux_standalone_archive-unsigned
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt

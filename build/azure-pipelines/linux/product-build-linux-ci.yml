parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_JOB_NAME
    type: string
  - name: VSCODE_JOB_DISPLAY_NAME
    type: string
  - name: VSCODE_TEST_IDS
    type: object
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false
  # See product-build-linux-setup.yml
  - name: VSCODE_WORKSPACE_IMAGE
    type: string
    default: none

jobs:
  - job: Linux${{ parameters.VSCODE_JOB_NAME }}
    displayName: ${{ parameters.VSCODE_JOB_DISPLAY_NAME }}
    timeoutInMinutes: 50
    variables:
      DISPLAY: ":10"
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      sdl:
        antimalwareScan:
          scanTimeoutInMinutes: '10'
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: true
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          # 1ES PT runs its binary analysis for every published output, so only publish when the logs are needed
          condition: failed()
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: x64
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_RUN_CHECKS: ${{ parameters.VSCODE_RUN_CHECKS }}
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}
          # Only what the tests of the job use: the unit and Agent Host E2E tests run out-build
          VSCODE_BUILD_CLIENT: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'copilot')) }}
          # The Smoke job checks the packaged Agent Host of the server
          VSCODE_BUILD_SERVER: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          VSCODE_BUILD_SERVER_WEB: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium')) }}
          VSCODE_BUILD_PRODUCT_ASSETS: false
          VSCODE_BUILD_INTEGRATION_TESTS: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          VSCODE_COMPILE_TEST_SUITES: ${{ or(containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}
          VSCODE_WORKSPACE_IMAGE: ${{ parameters.VSCODE_WORKSPACE_IMAGE }}

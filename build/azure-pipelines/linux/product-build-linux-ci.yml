parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_JOB_NAME
    type: string
  - name: VSCODE_JOB_DISPLAY_NAME
    type: string
  - name: VSCODE_TEST_IDS
    type: object
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false

jobs:
  - job: Linux${{ parameters.VSCODE_JOB_NAME }}
    displayName: ${{ parameters.VSCODE_JOB_DISPLAY_NAME }}
    timeoutInMinutes: 50
    variables:
      DISPLAY: ":10"
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: true
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: x64
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_RUN_CHECKS: ${{ parameters.VSCODE_RUN_CHECKS }}
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

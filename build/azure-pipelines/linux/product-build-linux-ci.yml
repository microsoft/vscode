parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_SUITE
    type: string
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false

jobs:
  - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Electron') }}:
    - template: ../common/product-test-build.yml@self
      parameters:
        jobName: LinuxElectronBuild
        displayName: Electron Build
        platform: linux
        arch: x64
        archiveExt: tar.gz
        artifactPrefix: product-ci-linux-x64-electron
        testIntegration: true
        testSmoke: true
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        extraVariables:
          - key: DISPLAY
            value: ":10"
          - key: NPM_ARCH
            value: x64
        compileSteps:
          - template: ./steps/product-build-linux-compile.yml@self
            parameters:
              VSCODE_ARCH: x64
              VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
              VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
              VSCODE_RUN_CHECKS: ${{ parameters.VSCODE_RUN_CHECKS }}
        archiveWorkspaceSteps:
          - script: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)
              tar -czf $(Build.ArtifactStagingDirectory)/repo.tar.gz --exclude=.git -C $(Build.SourcesDirectory) .
            displayName: Archive built workspace for reuse by test jobs
        archiveAppSteps:
          - script: tar -czf $(Build.ArtifactStagingDirectory)/app.tar.gz -C $(Agent.BuildDirectory) VSCode-linux-x64
            displayName: Archive packaged app for reuse by test jobs
        archiveServerSteps:
          - script: tar -czf $(Build.ArtifactStagingDirectory)/server.tar.gz -C $(Agent.BuildDirectory) vscode-server-linux-x64
            displayName: Archive packaged server for reuse by test jobs

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: LinuxElectronUnit
        buildJobName: LinuxElectronBuild
        displayName: Unit Tests
        platform: linux
        arch: x64
        testName: unit
        artifactPrefix: product-ci-linux-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
        display: ":10"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
            displayName: Extract built workspace
        setupSteps:
          - script: |
              set -e
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
                xvfb \
                libgtk-3-0 \
                libxkbfile-dev \
                libkrb5-dev \
                libgbm1 \
                rpm \
                bubblewrap \
                socat
              sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
              sudo chmod +x /etc/init.d/xvfb
              sudo update-rc.d xvfb defaults
              sudo service xvfb start
            displayName: Setup system services
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: LinuxElectronIntegration
        buildJobName: LinuxElectronBuild
        displayName: Integration Tests
        platform: linux
        arch: x64
        testName: integration
        artifactPrefix: product-ci-linux-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
        display: ":10"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-app/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-server/server.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace, app and server
        setupSteps:
          - script: |
              set -e
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
                xvfb \
                libgtk-3-0 \
                libxkbfile-dev \
                libkrb5-dev \
                libgbm1 \
                rpm \
                bubblewrap \
                socat
              sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
              sudo chmod +x /etc/init.d/xvfb
              sudo update-rc.d xvfb defaults
              sudo service xvfb start
            displayName: Setup system services
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: LinuxElectronSmoke
        buildJobName: LinuxElectronBuild
        displayName: Smoke Tests
        platform: linux
        arch: x64
        testName: smoke
        artifactPrefix: product-ci-linux-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
        display: ":10"
        extractArtifactSteps:
          - script: |
              set -e
              mkdir -p $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-ci-linux-x64-electron-app/app.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and app
        setupSteps:
          - script: |
              set -e
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
              ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
                xvfb \
                libgtk-3-0 \
                libxkbfile-dev \
                libkrb5-dev \
                libgbm1 \
                rpm \
                bubblewrap \
                socat
              sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
              sudo chmod +x /etc/init.d/xvfb
              sudo update-rc.d xvfb defaults
              sudo service xvfb start
            displayName: Setup system services
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Smoke

  - ${{ else }}:
    - job: Linux${{ parameters.VSCODE_TEST_SUITE }}
      displayName: ${{ parameters.VSCODE_TEST_SUITE }} Tests
      timeoutInMinutes: 50
      variables:
        DISPLAY: ":10"
        NPM_ARCH: x64
        VSCODE_ARCH: x64
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - template: ./steps/product-build-linux-compile.yml@self
          parameters:
            VSCODE_ARCH: x64
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
            VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
            VSCODE_RUN_CHECKS: ${{ parameters.VSCODE_RUN_CHECKS }}
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Browser') }}:
              VSCODE_RUN_BROWSER_TESTS: true
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Remote') }}:
              VSCODE_RUN_REMOTE_TESTS: true

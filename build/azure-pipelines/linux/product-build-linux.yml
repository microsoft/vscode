parameters:
  - name: NPM_ARCH
    type: string
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_BUILD_LINUX_SNAP
    type: boolean
    default: false
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false

jobs:
  - job: Linux_${{ parameters.VSCODE_ARCH }}
    displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }})
    timeoutInMinutes: 90
    variables:
      DISPLAY: ":10"
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      NPM_ARCH: ${{ parameters.NPM_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    templateContext:
      sdl:
        binskim:
          ${{ if eq(parameters.VSCODE_ARCH, 'armhf') }}:
            analyzeTargetGlob: '$(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)/**/*.node'
          ${{ else }}:
            analyzeTargetGlob: '$(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)-web/**/*.node'
          preReleaseVersion: '4.3.1'
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-linux-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/client/$(CLIENT_ARCHIVE_NAME)
          artifactName: vscode_client_linux_$(VSCODE_ARCH)_archive-unsigned
          displayName: Publish client archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Linux $(VSCODE_ARCH) (unsigned)"
          sbomPackageVersion: $(Build.SourceVersion)
        - ${{ if ne(parameters.VSCODE_ARCH, 'armhf') }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-linux-$(VSCODE_ARCH).tar.gz
            artifactName: vscode_server_linux_$(VSCODE_ARCH)_archive-unsigned
            displayName: Publish server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) Server"
            sbomPackageVersion: $(Build.SourceVersion)
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-linux-$(VSCODE_ARCH)-web.tar.gz
            artifactName: vscode_web_linux_$(VSCODE_ARCH)_archive-unsigned
            displayName: Publish web server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)-web
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) Web"
            sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/deb/$(DEB_PACKAGE_NAME)
          artifactName: vscode_client_linux_$(VSCODE_ARCH)_deb-package
          displayName: Publish deb package
          sbomBuildDropPath: .build/linux/deb
          sbomPackageName: "VS Code Linux $(VSCODE_ARCH) DEB"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/rpm/$(RPM_PACKAGE_NAME)
          artifactName: vscode_client_linux_$(VSCODE_ARCH)_rpm-package
          displayName: Publish rpm package
          sbomBuildDropPath: .build/linux/rpm
          sbomPackageName: "VS Code Linux $(VSCODE_ARCH) RPM"
          sbomPackageVersion: $(Build.SourceVersion)
        - ${{ if eq(parameters.VSCODE_BUILD_LINUX_SNAP, true) }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/snap/$(SNAP_PACKAGE_NAME)
            artifactName: vscode_client_linux_$(VSCODE_ARCH)_snap
            displayName: Publish snap package
            sbomBuildDropPath: $(SNAP_EXTRACTED_PATH)
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) SNAP"
            sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_linux_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'))
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_BUILD_LINUX_SNAP: ${{ parameters.VSCODE_BUILD_LINUX_SNAP }}
          VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
          VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
          VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
          VSCODE_RUN_CHECKS: ${{ parameters.VSCODE_RUN_CHECKS }}
          VSCODE_RUN_TESTS_IN_PARALLEL: ${{ or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Linux_${{ parameters.VSCODE_ARCH }}_Unit
        displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) Unit Tests
        platform: linux
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: unit
        artifactPrefix: product-tests-linux-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo=Linux_${{ parameters.VSCODE_ARCH }}" product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        display: ":10"
        artifacts:
          - name: repo
            displayName: Download built workspace
        extractArtifactSteps:
          - script: tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo/repo.tar.gz -C $(Build.SourcesDirectory)
            displayName: Extract built workspace
        setupSteps:
          - template: ./steps/product-build-linux-test-setup.yml@self
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Linux_${{ parameters.VSCODE_ARCH }}_Integration
        displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) Integration Tests
        platform: linux
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: integration
        artifactPrefix: product-tests-linux-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-app=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-server=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-web=Linux_${{ parameters.VSCODE_ARCH }}" product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo product-tests-linux-${{ parameters.VSCODE_ARCH }}-app product-tests-linux-${{ parameters.VSCODE_ARCH }}-server product-tests-linux-${{ parameters.VSCODE_ARCH }}-web'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        display: ":10"
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
          - name: web
            displayName: Download packaged web server
        extractArtifactSteps:
          - script: |
              set -e
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-app/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-server/server.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-web/web.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and products
        setupSteps:
          - template: ./steps/product-build-linux-test-setup.yml@self
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Linux_${{ parameters.VSCODE_ARCH }}_Smoke
        displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) Smoke Tests
        platform: linux
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: smoke
        artifactPrefix: product-tests-linux-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-app=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-server=Linux_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-linux-${{ parameters.VSCODE_ARCH }}-web=Linux_${{ parameters.VSCODE_ARCH }}" product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo product-tests-linux-${{ parameters.VSCODE_ARCH }}-app product-tests-linux-${{ parameters.VSCODE_ARCH }}-server product-tests-linux-${{ parameters.VSCODE_ARCH }}-web'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        display: ":10"
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
          - name: web
            displayName: Download packaged web server
        extractArtifactSteps:
          - script: |
              set -e
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-repo/repo.tar.gz -C $(Build.SourcesDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-app/app.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-server/server.tar.gz -C $(Agent.BuildDirectory)
              tar -xzf $(Pipeline.Workspace)/product-tests-linux-${{ parameters.VSCODE_ARCH }}-web/web.tar.gz -C $(Agent.BuildDirectory)
            displayName: Extract built workspace and products
        setupSteps:
          - template: ./steps/product-build-linux-test-setup.yml@self
        testSteps:
          - template: ./steps/product-build-linux-test.yml@self
            parameters:
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Smoke

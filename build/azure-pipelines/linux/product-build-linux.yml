parameters:
  - name: NPM_ARCH
    type: string
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_BUILD_LINUX_SNAP
    type: boolean
    default: false
  # Whether test jobs (see product-build-linux-test.yml) consume the
  # compilation artifact, which then also includes out-build.
  - name: VSCODE_RUN_TESTS
    type: boolean
    default: false
  # Whether to include the steps and jobs that need a privileged service
  # connection (signing, CDN uploads, Copilot test setup). Required: only
  # builds of main and release/* branches pass true.
  - name: VSCODE_PRIVILEGED_CONNECTIONS
    type: boolean
  # Whether a build without the privileged connections still runs the package
  # job, which then publishes the unsigned product artifacts. Only the product
  # build passes true, so that its dev builds can be downloaded.
  - name: VSCODE_PACKAGE_UNSIGNED
    type: boolean
    default: false

# The product is built by Compile and Package jobs in addition to the parallel
# CLI job. With the privileged connections, the package job signs the deb and
# rpm packages. Without them, it publishes the unsigned packages and archives
# as unsigned_<artifact>. The test jobs are declared next to this template (see
# product-build-linux-test.yml) and run in parallel with Package after Compile.
jobs:
  - job: Linux_${{ parameters.VSCODE_ARCH }}_Compile
    displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) - Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      DISPLAY: ":10"
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      NPM_ARCH: ${{ parameters.NPM_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    templateContext:
      sdl:
        binskim:
          ${{ if eq(parameters.VSCODE_ARCH, 'armhf') }}:
            analyzeTargetGlob: '$(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)/**/*.node'
          ${{ else }}:
            analyzeTargetGlob: '$(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)-web/**/*.node'
          preReleaseVersion: '4.3.1'
        antimalwareScan:
          scanTimeoutInMinutes: '10'
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/compilation
          artifactName: compilation_linux_$(VSCODE_ARCH)
          displayName: Publish compilation artifact
          sbomEnabled: false
          isProduction: false
          condition: and(succeeded(), ne(variables['COMPILATION_PUBLISHED'], 'true'))
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_linux_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'), ne(variables['AGENT_SDK_TARBALLS_PUBLISHED'], 'true'))
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: false
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_BUILD_ONLY: true
          VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(parameters.VSCODE_ARCH, 'armhf') }}:
        - script: |
            set -e
            mkdir -p $(Build.ArtifactStagingDirectory)/compilation
            tar -czf $(Build.ArtifactStagingDirectory)/compilation/builds.tar.gz \
              -C $(Agent.BuildDirectory) \
              VSCode-linux-$(VSCODE_ARCH)
          displayName: Archive client build
      - ${{ else }}:
        - script: |
            set -e
            mkdir -p $(Build.ArtifactStagingDirectory)/compilation
            tar -czf $(Build.ArtifactStagingDirectory)/compilation/builds.tar.gz \
              -C $(Agent.BuildDirectory) \
              VSCode-linux-$(VSCODE_ARCH) \
              vscode-server-linux-$(VSCODE_ARCH) \
              vscode-server-linux-$(VSCODE_ARCH)-web
          displayName: Archive client, server and web server builds

      - ${{ if eq(parameters.VSCODE_RUN_TESTS, true) }}:
        - script: |
            set -e
            tar -czf $(Build.ArtifactStagingDirectory)/compilation/out-build.tar.gz \
              -C $(Build.SourcesDirectory) \
              out-build
          displayName: Archive out-build

      # Pipeline artifacts can't be overwritten, so a retry of this job must skip
      # the artifacts that an earlier attempt already published, for example
      # before an injected SDL step hung (see ../common/checkForArtifact.ts)
      - script: >-
          node build/azure-pipelines/common/checkForArtifact.ts
          COMPILATION_PUBLISHED compilation_linux_$(VSCODE_ARCH)
          AGENT_SDK_TARBALLS_PUBLISHED agent_sdk_linux_$(VSCODE_ARCH)_tarballs
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        condition: succeededOrFailed()
        continueOnError: true
        displayName: Check for artifacts published by an earlier attempt

  # Signing needs the ESRP connection, which only builds with the privileged
  # connections may reference. The others package the product unsigned.
  - ${{ if or(eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true), eq(parameters.VSCODE_PACKAGE_UNSIGNED, true)) }}:
    - job: Linux_${{ parameters.VSCODE_ARCH }}_Sign
      ${{ if eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
        displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) - Package & Sign
      ${{ else }}:
        displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) - Package
      dependsOn:
        - Linux_${{ parameters.VSCODE_ARCH }}_Compile
        - LinuxCLI_${{ parameters.VSCODE_ARCH }}
      timeoutInMinutes: 90
      cancelTimeoutInMinutes: 10
      variables:
        DISPLAY: ":10"
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
        NPM_ARCH: ${{ parameters.NPM_ARCH }}
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      templateContext:
        sdl:
          antimalwareScan:
            scanTimeoutInMinutes: '10'
        outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/client/$(CLIENT_ARCHIVE_NAME)
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_archive-unsigned
            condition: and(succeeded(), ne(variables['CLIENT_ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish client archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) (unsigned)"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - ${{ if ne(parameters.VSCODE_ARCH, 'armhf') }}:
            - output: pipelineArtifact
              targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-linux-$(VSCODE_ARCH).tar.gz
              artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_linux_$(VSCODE_ARCH)_archive-unsigned
              condition: and(succeeded(), ne(variables['SERVER_ARCHIVE_PUBLISHED'], 'true'))
              displayName: Publish server archive
              sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)
              sbomPackageName: "VS Code Linux $(VSCODE_ARCH) Server"
              sbomPackageVersion: $(Build.SourceVersion)
              ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
                sbomEnabled: false
                isProduction: false
            - output: pipelineArtifact
              targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-linux-$(VSCODE_ARCH)-web.tar.gz
              artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_linux_$(VSCODE_ARCH)_archive-unsigned
              condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
              displayName: Publish web server archive
              sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)-web
              sbomPackageName: "VS Code Linux $(VSCODE_ARCH) Web"
              sbomPackageVersion: $(Build.SourceVersion)
              ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
                sbomEnabled: false
                isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/deb/$(DEB_PACKAGE_NAME)
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_deb-package
            condition: and(succeeded(), ne(variables['DEB_PACKAGE_PUBLISHED'], 'true'))
            displayName: Publish deb package
            sbomBuildDropPath: .build/linux/deb
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) DEB"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/rpm/$(RPM_PACKAGE_NAME)
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_rpm-package
            condition: and(succeeded(), ne(variables['RPM_PACKAGE_PUBLISHED'], 'true'))
            displayName: Publish rpm package
            sbomBuildDropPath: .build/linux/rpm
            sbomPackageName: "VS Code Linux $(VSCODE_ARCH) RPM"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - ${{ if eq(parameters.VSCODE_BUILD_LINUX_SNAP, true) }}:
            - output: pipelineArtifact
              targetPath: $(Build.ArtifactStagingDirectory)/out/snap/$(SNAP_PACKAGE_NAME)
              artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_snap
              condition: and(succeeded(), ne(variables['SNAP_PACKAGE_PUBLISHED'], 'true'))
              displayName: Publish snap package
              sbomBuildDropPath: $(SNAP_EXTRACTED_PATH)
              sbomPackageName: "VS Code Linux $(VSCODE_ARCH) SNAP"
              sbomPackageVersion: $(Build.SourceVersion)
              ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
                sbomEnabled: false
                isProduction: false
      steps:
        - template: ./steps/product-build-linux-setup.yml@self
          parameters:
            VSCODE_CIBUILD: false

        - template: ./steps/product-build-linux-download-compilation.yml@self

        - template: ./steps/product-build-linux-package.yml@self
          parameters:
            VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
            VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
            VSCODE_BUILD_LINUX_SNAP: ${{ parameters.VSCODE_BUILD_LINUX_SNAP }}
            VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

        - template: ./steps/product-build-linux-package-finalize.yml@self
          parameters:
            VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

        # Pipeline artifacts can't be overwritten, so a retry of this job must skip
        # the artifacts that an earlier attempt already published, for example
        # before timing out (see ../common/checkForArtifact.ts)
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            CLIENT_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_archive-unsigned
            SERVER_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_linux_$(VSCODE_ARCH)_archive-unsigned
            WEB_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_linux_$(VSCODE_ARCH)_archive-unsigned
            DEB_PACKAGE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_deb-package
            RPM_PACKAGE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_rpm-package
            SNAP_PACKAGE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_linux_$(VSCODE_ARCH)_snap
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt

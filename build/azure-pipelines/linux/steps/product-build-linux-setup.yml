parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_TEST_IDS
    type: object
    default: []
  - name: VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL
    type: boolean
    default: false
  # Workspace images (see build/azure-pipelines/common/workspaceImage.ts): use, for the CI test jobs,
  # which mount an image over their checkout when the cache has one, and install on top of it; build,
  # for the image job, which installs into an image when the cache has no current one.
  - name: VSCODE_WORKSPACE_IMAGE
    type: string
    default: none
    values:
      - none
      - use
      - build

# Checks out the sources and installs the dependencies that every Linux job
# needs regardless of whether it compiles, tests or packages the product.
steps:
  - template: ../../common/checkout.yml@self

  # Before anything else writes to the sources directory, which the image is mounted over
  - ${{ if ne(parameters.VSCODE_WORKSPACE_IMAGE, 'none') }}:
    - template: ../../common/setup-node.yml@self
      parameters:
        os: linux

    - template: ../../common/workspace-image.yml@self
      parameters:
        mode: ${{ parameters.VSCODE_WORKSPACE_IMAGE }}
        name: linux-$(VSCODE_ARCH)

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'copilot') }}:
    - template: ../../copilot/pull-test-cache.yml@self

  - ${{ if gt(length(parameters.VSCODE_TEST_IDS), 0) }}:
    - template: ../../common/ensure-test-artifact-directories.yml@self

  - ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'none') }}:
    - template: ../../common/setup-node.yml@self
      parameters:
        os: linux

  # An image holds neither the private repositories nor their credentials: the image job
  # installs without the distro, whose install roots the test jobs install on top of the image
  - ${{ if ne(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
    - template: ../../distro/download-distro.yml@self

  - task: AzureKeyVault@2
    displayName: "Azure Key Vault: Get Secrets"
    inputs:
      azureSubscription: vscode-oss-build-secrets
      KeyVaultName: vscode-oss-build-secrets
      SecretsFilter: "github-token-code-oss"

  - script: |
      set -e
      # Start X server
      ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
      ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
        xvfb \
        libgtk-3-0 \
        libxkbfile-dev \
        libkrb5-dev \
        libgbm1 \
        rpm \
        bubblewrap \
        socat
      sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
      sudo chmod +x /etc/init.d/xvfb
      sudo update-rc.d xvfb defaults
      sudo service xvfb start
    displayName: Setup system services
    ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
      condition: and(succeeded(), eq(variables['WORKSPACE_IMAGE_USED'], 'true'))

  - script: node build/setup-npm-registry.ts $NPM_REGISTRY
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM Registry

  - template: ../../common/apply-sdk-canary.yml@self

  # An image holds its own pnpm store, which the image job installs into without the cache
  - ${{ if ne(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
    - template: ../../common/restore-pnpm-store.yml@self
      parameters:
        # The store holds the packages for the agent's platform and architecture (which the key adds),
        # whatever architecture the job builds for (npm_config_arch only affects native builds), so all
        # Linux builds on the same agents share one store.
        keyArgs: linux
        os: linux
        ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'use') }}:
          condition: and(succeeded(), ne(variables['WORKSPACE_IMAGE_USED'], 'true'))

  - script: |
      set -e
      # Set the private NPM registry to the global npmrc file
      # so that authentication works for subfolders like build/, remote/, extensions/ etc
      # which does not have their own .npmrc file
      npm config set registry "$NPM_REGISTRY"
      echo "##vso[task.setvariable variable=NPMRC_PATH]$(npm config get userconfig)"
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM

  - task: npmAuthenticate@0
    inputs:
      workingFile: $(NPMRC_PATH)
    condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
    displayName: Setup NPM Authentication

  - template: ../../common/install-pnpm.yml@self

  - ${{ if and(eq(parameters.VSCODE_CIBUILD, false), eq(parameters.VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL, false)) }}:
    - task: NuGetAuthenticate@1
      displayName: Setup NuGet Authentication

  - script: |
      set -e

      for i in {1..5}; do # try 5 times
        pnpm install --frozen-lockfile && break
        if [ $i -eq 5 ]; then
          echo "pnpm install failed too many times" >&2
          exit 1
        fi
        echo "pnpm install failed $i, trying again..."
      done
    workingDirectory: build
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
    displayName: Install build dependencies
    ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
      condition: and(succeeded(), eq(variables['WORKSPACE_IMAGE_USED'], 'true'))

  - script: |
      set -e
      SYSROOT_ARCH=$VSCODE_ARCH
      if [ "$SYSROOT_ARCH" == "x64" ]; then
        SYSROOT_ARCH="amd64"
      fi
      export VSCODE_SYSROOT_DIR=$(Build.SourcesDirectory)/.build/sysroots/glibc-2.28-gcc-8.5.0
      SYSROOT_ARCH="$SYSROOT_ARCH" VSCODE_SYSROOT_PREFIX="-glibc-2.28-gcc-8.5.0" node -e 'import { getVSCodeSysroot } from "./build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot(process.env["SYSROOT_ARCH"]); })()'
    env:
      VSCODE_ARCH: $(VSCODE_ARCH)
      GITHUB_TOKEN: "$(github-token-code-oss)"
    displayName: Download vscode sysroots
    ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
      condition: and(succeeded(), eq(variables['WORKSPACE_IMAGE_USED'], 'true'))

  - script: |
      set -e

      source ./build/azure-pipelines/linux/setup-env.sh

      # Run preinstall script before root dependencies are installed
      # so that v8 headers are patched correctly for native modules.
      pnpm run preinstall

      for i in {1..5}; do # try 5 times
        pnpm install --frozen-lockfile && break
        if [ $i -eq 5 ]; then
          echo "pnpm install failed too many times" >&2
          exit 1
        fi
        echo "pnpm install failed $i, trying again..."
      done
    env:
      npm_config_arch: $(NPM_ARCH)
      VSCODE_ARCH: $(VSCODE_ARCH)
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ONNXRUNTIME_NODE_INSTALL: skip
      GITHUB_TOKEN: "$(github-token-code-oss)"
      ${{ if or(eq(parameters.VSCODE_CIBUILD, true), eq(parameters.VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL, true)) }}:
        FOUNDRY_LOCAL_SKIP_INSTALL: "1"
      ${{ else }}:
        FOUNDRY_LOCAL_NUGET_MODE: dotnet
        FOUNDRY_LOCAL_NUGET_FEEDS: "https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/nuget/v3/index.json"
    displayName: Install dependencies
    ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
      condition: and(succeeded(), eq(variables['WORKSPACE_IMAGE_USED'], 'true'))

  # NuGetAuthenticate@1 exposes its access token to all later steps as the
  # VSS_NUGET_ACCESSTOKEN environment variable, from where tests can write it to
  # published logs and crash dumps. Only installing dependencies needs it, so
  # clear it now. This runs in every build so that it can't fall out of sync
  # with the condition of the authentication step.
  - script: echo "##vso[task.setvariable variable=VSS_NUGET_ACCESSTOKEN]"
    displayName: Clear package feed credentials
    condition: always()

  - script: node build/azure-pipelines/common/checkNativeOptionalDeps.ts
    displayName: Verify native optional dependency binaries
    ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
      condition: and(succeeded(), eq(variables['WORKSPACE_IMAGE_USED'], 'true'))

  - ${{ if ne(parameters.VSCODE_WORKSPACE_IMAGE, 'build') }}:
    - script: node build/azure-pipelines/distro/mixin-npm.ts
      displayName: Mixin distro node modules

    - template: ../../common/prune-pnpm-store.yml@self
      parameters:
        os: linux
        ${{ if eq(parameters.VSCODE_WORKSPACE_IMAGE, 'use') }}:
          condition: and(succeeded(), ne(variables['WORKSPACE_IMAGE_USED'], 'true'))

    - script: node build/azure-pipelines/distro/mixin-quality.ts
      displayName: Mixin distro quality

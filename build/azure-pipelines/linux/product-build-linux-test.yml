parameters:
  - name: NPM_ARCH
    type: string
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_JOB_NAME
    type: string
  - name: VSCODE_JOB_DISPLAY_NAME
    type: string
  - name: VSCODE_TEST_IDS
    type: object

# Each product test job tests the builds of the compilation artifact published
# by the compile job (see product-build-linux.yml, which must set
# VSCODE_RUN_TESTS) with the selected test IDs. Retrying a test job skips the
# test tasks that already passed in an earlier attempt.
jobs:
  - job: Linux_${{ parameters.VSCODE_ARCH }}_Test_${{ parameters.VSCODE_JOB_NAME }}
    displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) - ${{ parameters.VSCODE_JOB_DISPLAY_NAME }}
    dependsOn: Linux_${{ parameters.VSCODE_ARCH }}_Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      DISPLAY: ":10"
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      NPM_ARCH: ${{ parameters.NPM_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: true
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      - template: ./steps/product-build-linux-setup.yml@self
        parameters:
          VSCODE_CIBUILD: false
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

      - template: ./steps/product-build-linux-download-compilation.yml@self
        parameters:
          VSCODE_DOWNLOAD_OUT_BUILD: true

      - template: ./steps/product-build-linux-test.yml@self
        parameters:
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}
          VSCODE_COMPILE_TEST_SUITES: true

parameters:
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_UNIT
    type: boolean
  - name: VSCODE_TEST_INTEGRATION
    type: boolean
  - name: VSCODE_TEST_SMOKE
    type: boolean
  - name: iterations
    type: object

jobs:
  # Compiles and packages VS Code exactly once for this platform. The Unit,
  # Integration and Smoke jobs below all depend on this job and reuse its
  # output (downloaded from pipeline artifacts) instead of rebuilding, so we
  # only pay for a from-source build once per platform, not once per test type.
  - job: LinuxSmokeFlakyBuild
    displayName: Linux Build (shared)
    timeoutInMinutes: 90
    variables:
      DISPLAY: ":10"
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-build-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-build-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/repo.tar.gz
          artifactName: smoke-flaky-linux-x64-repo
          displayName: Publish built workspace
          sbomEnabled: false
          isProduction: false
        - ${{ if or(eq(parameters.VSCODE_TEST_INTEGRATION, true), eq(parameters.VSCODE_TEST_SMOKE, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/app.tar.gz
            artifactName: smoke-flaky-linux-x64-app
            displayName: Publish packaged app
            sbomEnabled: false
            isProduction: false
        - ${{ if eq(parameters.VSCODE_TEST_INTEGRATION, true) }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/server.tar.gz
            artifactName: smoke-flaky-linux-x64-server
            displayName: Publish packaged server
            sbomEnabled: false
            isProduction: false
    steps:
      # The crash/log pipelineArtifact outputs above run unconditionally
      # (succeededOrFailed()), so ensure the paths exist even though this
      # compile-only job never runs tests that would create them.
      - script: mkdir -p .build/crashes .build/logs
        displayName: Ensure artifact directories exist

      # Build VS Code from source. No VSCODE_RUN_*_TESTS flags are passed, so the
      # compile template builds the client/server but skips compiling the test
      # suites and skips the unit/integration/smoke test template entirely — the
      # test jobs below compile whichever suites they need and run them.
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: x64
          VSCODE_CIBUILD: true
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL: true

      # Compiled here (rather than in the Integration/Smoke jobs) so the output
      # is captured by the workspace archive below and doesn't need recompiling
      # once per test job.
      - ${{ if eq(parameters.VSCODE_TEST_SMOKE, true) }}:
        - script: npm run compile --prefix test/smoke
          displayName: Compile smoke tests

      - ${{ if eq(parameters.VSCODE_TEST_INTEGRATION, true) }}:
        - script: |
            set -e
            npm run gulp \
              compile-extension:configuration-editing \
              compile-extension:css-language-features-server \
              compile-extension:emmet \
              compile-extension:git \
              compile-extension:github-authentication \
              compile-extension:html-language-features-server \
              compile-extension:ipynb \
              compile-extension:notebook-renderers \
              compile-extension:json-language-features-server \
              compile-extension:markdown-language-features \
              compile-extension-media \
              compile-extension:microsoft-authentication \
              compile-extension:typescript-language-features \
              compile-extension:vscode-api-tests \
              compile-extension:vscode-colorize-tests \
              compile-extension:vscode-colorize-perf-tests \
              compile-extension:vscode-test-resolver
          displayName: Build integration tests

      # Archive everything the downstream test jobs need so they can download
      # and extract instead of rebuilding. The workspace archive excludes .git
      # since test jobs never need source history, only the built output.
      - script: |
          set -e
          mkdir -p $(Build.ArtifactStagingDirectory)
          tar -czf $(Build.ArtifactStagingDirectory)/repo.tar.gz --exclude=.git -C $(Build.SourcesDirectory) .
        displayName: Archive built workspace for reuse by test jobs

      - ${{ if or(eq(parameters.VSCODE_TEST_INTEGRATION, true), eq(parameters.VSCODE_TEST_SMOKE, true)) }}:
        - script: tar -czf $(Build.ArtifactStagingDirectory)/app.tar.gz -C $(Agent.BuildDirectory) VSCode-linux-x64
          displayName: Archive packaged app for reuse by test jobs

      - ${{ if eq(parameters.VSCODE_TEST_INTEGRATION, true) }}:
        - script: tar -czf $(Build.ArtifactStagingDirectory)/server.tar.gz -C $(Agent.BuildDirectory) vscode-server-linux-x64
          displayName: Archive packaged server for reuse by test jobs

  - ${{ if eq(parameters.VSCODE_TEST_UNIT, true) }}:
    - job: LinuxSmokeFlakyUnit
      dependsOn: LinuxSmokeFlakyBuild
      displayName: Linux Unit Tests
      timeoutInMinutes: 300
      variables:
        DISPLAY: ":10"
        VSCODE_ARCH: x64
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(VSCODE_ARCH)-unit-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(VSCODE_ARCH)-unit-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-repo
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo
          displayName: Download built workspace

        - script: |
            set -e
            mkdir -p $(Build.SourcesDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo/repo.tar.gz -C $(Build.SourcesDirectory)
          displayName: Extract built workspace

        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

        - task: AzureKeyVault@2
          displayName: "Azure Key Vault: Get Secrets"
          inputs:
            azureSubscription: vscode-oss-build-secrets
            KeyVaultName: vscode-oss-build-secrets
            SecretsFilter: "github-token-code-oss"

        - script: |
            set -e
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
              xvfb \
              libgtk-3-0 \
              libxkbfile-dev \
              libkrb5-dev \
              libgbm1 \
              rpm \
              bubblewrap \
              socat
            sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
            sudo chmod +x /etc/init.d/xvfb
            sudo update-rc.d xvfb defaults
            sudo service xvfb start
          displayName: Setup system services

        - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
          env:
            GITHUB_TOKEN: "$(github-token-code-oss)"
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          displayName: Download Electron and Playwright
          retryCountOnTaskFailure: 3

        - script: |
            set -e
            ELECTRON_ROOT=.build/electron
            sudo chown root $ELECTRON_ROOT/chrome-sandbox
            sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
          displayName: Change setuid helper binary permission

        - script: mkdir -p .build/crashes .build/logs
          displayName: Ensure artifact directories exist

        # Run the Electron unit tests once per iteration. continueOnError lets
        # every iteration run even if some fail, and gives each run its own
        # timeline record so the flaky function can tally passes vs. failures.
        - ${{ each i in parameters.iterations }}:
          - script: ./scripts/test.sh --build --tfs "Unit Tests"
            env:
              VSCODE_SKIP_PRELAUNCH: '1'
            displayName: "🧪 Unit test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 15

        # Run the node.js unit tests once per iteration.
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              npm run test-node -- --build
            displayName: "🧪 Unit test iteration ${{ i }}/${{ length(parameters.iterations) }} (node.js)"
            continueOnError: true
            timeoutInMinutes: 15

  - ${{ if eq(parameters.VSCODE_TEST_INTEGRATION, true) }}:
    - job: LinuxSmokeFlakyIntegration
      dependsOn: LinuxSmokeFlakyBuild
      displayName: Linux Integration Tests
      timeoutInMinutes: 300
      variables:
        DISPLAY: ":10"
        VSCODE_ARCH: x64
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(VSCODE_ARCH)-integration-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(VSCODE_ARCH)-integration-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-repo
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo
          displayName: Download built workspace

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-app
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-app
          displayName: Download packaged app

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-server
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-server
          displayName: Download packaged server

        - script: |
            set -e
            mkdir -p $(Build.SourcesDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo/repo.tar.gz -C $(Build.SourcesDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-app/app.tar.gz -C $(Agent.BuildDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-server/server.tar.gz -C $(Agent.BuildDirectory)
          displayName: Extract built workspace, app and server

        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

        - task: AzureKeyVault@2
          displayName: "Azure Key Vault: Get Secrets"
          inputs:
            azureSubscription: vscode-oss-build-secrets
            KeyVaultName: vscode-oss-build-secrets
            SecretsFilter: "github-token-code-oss"

        - script: |
            set -e
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
              xvfb \
              libgtk-3-0 \
              libxkbfile-dev \
              libkrb5-dev \
              libgbm1 \
              rpm \
              bubblewrap \
              socat
            sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
            sudo chmod +x /etc/init.d/xvfb
            sudo update-rc.d xvfb defaults
            sudo service xvfb start
          displayName: Setup system services

        - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
          env:
            GITHUB_TOKEN: "$(github-token-code-oss)"
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          displayName: Download Electron and Playwright
          retryCountOnTaskFailure: 3

        - script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
            ELECTRON_ROOT=.build/electron
            sudo chown root $APP_ROOT/chrome-sandbox
            sudo chown root $ELECTRON_ROOT/chrome-sandbox
            sudo chmod 4755 $APP_ROOT/chrome-sandbox
            sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
          displayName: Change setuid helper binary permission

        - script: mkdir -p .build/crashes .build/logs
          displayName: Ensure artifact directories exist

        # Run the Electron integration tests once per iteration. continueOnError
        # lets every iteration run even if some fail, and gives each run its own
        # timeline record so the flaky function can tally passes vs. failures.
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
              APP_NAME=$(node -p "require(\"$APP_ROOT/resources/app/product.json\").applicationName")
              INTEGRATION_TEST_APP_NAME="$APP_NAME" \
              INTEGRATION_TEST_ELECTRON_PATH="$APP_ROOT/$APP_NAME" \
              ./scripts/test-integration.sh --build --tfs "Integration Tests"
            env:
              VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-linux-$(VSCODE_ARCH)
              VSCODE_SKIP_PRELAUNCH: '1'
            displayName: "🧪 Integration test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 20

  - ${{ if eq(parameters.VSCODE_TEST_SMOKE, true) }}:
    - job: LinuxSmokeFlakySmoke
      dependsOn: LinuxSmokeFlakyBuild
      displayName: Linux Smoke Tests
      timeoutInMinutes: 300
      variables:
        DISPLAY: ":10"
        VSCODE_ARCH: x64
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(VSCODE_ARCH)-smoke-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(VSCODE_ARCH)-smoke-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-repo
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo
          displayName: Download built workspace

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: smoke-flaky-linux-x64-app
            patterns: "**"
            path: $(Pipeline.Workspace)/smoke-flaky-linux-x64-app
          displayName: Download packaged app

        - script: |
            set -e
            mkdir -p $(Build.SourcesDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-repo/repo.tar.gz -C $(Build.SourcesDirectory)
            tar -xzf $(Pipeline.Workspace)/smoke-flaky-linux-x64-app/app.tar.gz -C $(Agent.BuildDirectory)
          displayName: Extract built workspace and app

        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

        - task: AzureKeyVault@2
          displayName: "Azure Key Vault: Get Secrets"
          inputs:
            azureSubscription: vscode-oss-build-secrets
            KeyVaultName: vscode-oss-build-secrets
            SecretsFilter: "github-token-code-oss"

        - script: |
            set -e
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
            ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
              xvfb \
              libgtk-3-0 \
              libxkbfile-dev \
              libkrb5-dev \
              libgbm1 \
              rpm \
              bubblewrap \
              socat
            sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
            sudo chmod +x /etc/init.d/xvfb
            sudo update-rc.d xvfb defaults
            sudo service xvfb start
          displayName: Setup system services

        - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
          env:
            GITHUB_TOKEN: "$(github-token-code-oss)"
            AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          displayName: Download Electron and Playwright
          retryCountOnTaskFailure: 3

        - script: |
            set -e
            APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
            ELECTRON_ROOT=.build/electron
            sudo chown root $APP_ROOT/chrome-sandbox
            sudo chown root $ELECTRON_ROOT/chrome-sandbox
            sudo chmod 4755 $APP_ROOT/chrome-sandbox
            sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
          displayName: Change setuid helper binary permission

        # Initialize fontconfig before Electron starts Pango and Chromium threads,
        # avoiding concurrent first-time FcInit calls that can corrupt its config.
        - script: |
            set -euo pipefail
            SOURCE_PATH="$(Agent.TempDirectory)/fcpreinit.c"
            SHIM_PATH="$(Agent.TempDirectory)/libfcpreinit.so"
            cat > "$SOURCE_PATH" <<'CEOF'
            #define _GNU_SOURCE
            #include <dlfcn.h>

            __attribute__((constructor))
            static void preinit_fontconfig(void)
            {
              void *handle = dlopen("libfontconfig.so.1", RTLD_NOW | RTLD_GLOBAL);
              if (handle) {
                int (*fc_init)(void) = (int (*)(void)) dlsym(handle, "FcInit");
                if (fc_init) {
                  fc_init();
                }
              }
            }
            CEOF
            gcc -shared -fPIC -O2 -Wall -Wextra -o "$SHIM_PATH" "$SOURCE_PATH" -ldl
            PRELOAD_VALUE="$SHIM_PATH${LD_PRELOAD:+:$LD_PRELOAD}"
            echo "##vso[task.setvariable variable=VSCODE_SMOKE_LD_PRELOAD]$PRELOAD_VALUE"
            echo "Built fontconfig pre-init shim at $SHIM_PATH"
          displayName: Pre-initialize fontconfig for Electron

        - script: mkdir -p .build/crashes .build/logs
          displayName: Ensure artifact directories exist

        # Run the Electron smoke test once per iteration. continueOnError lets every
        # iteration run even if some fail, and gives each run its own timeline record
        # so the SmokeFlaky function can tally passes vs. failures.
        #
        # The smoke runner wipes .build/logs/smoke-tests-electron on startup, so a
        # failing iteration's diagnostics would be destroyed by the next one and the
        # published artifact would only ever hold the last iteration. Set the failed
        # run aside under a name the runner does not touch.
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              status=0
              npm run smoketest-no-compile -- --tracing --build "$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)" || status=$?
              if [ $status -ne 0 ] && [ -d .build/logs/smoke-tests-electron ]; then
                mv .build/logs/smoke-tests-electron ".build/logs/failed-iteration-${{ i }}"
              fi
              exit $status
            env:
              TMPDIR: $(Agent.TempDirectory)
              LD_PRELOAD: $(VSCODE_SMOKE_LD_PRELOAD)
            displayName: "🧪 Smoke test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 20

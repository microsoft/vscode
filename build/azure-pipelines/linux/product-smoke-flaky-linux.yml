parameters:
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_SUITE
    type: string
  - name: iterations
    type: object

jobs:
  - job: LinuxSmokeFlaky${{ parameters.VSCODE_TEST_SUITE }}
    displayName: Linux ${{ parameters.VSCODE_TEST_SUITE }} Tests
    timeoutInMinutes: 300
    variables:
      DISPLAY: ":10"
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      # Build VS Code from source. No VSCODE_RUN_*_TESTS flags are passed, so the
      # compile template builds the client/server but skips compiling the test
      # suites and skips the unit/integration/smoke test template entirely — we
      # run the tests below with iteration loops, nothing else.
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          VSCODE_ARCH: x64
          VSCODE_CIBUILD: true
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL: true

      - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
        env:
          GITHUB_TOKEN: "$(github-token-code-oss)"
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
        displayName: Download Electron and Playwright
        retryCountOnTaskFailure: 3

      - script: |
          set -e
          APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
          ELECTRON_ROOT=.build/electron
          sudo chown root $APP_ROOT/chrome-sandbox
          sudo chown root $ELECTRON_ROOT/chrome-sandbox
          sudo chmod 4755 $APP_ROOT/chrome-sandbox
          sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
        displayName: Change setuid helper binary permission

      # The compile template only compiles the smoke suite when a test flag is
      # set; since we pass none, compile it explicitly here.
      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Smoke') }}:
        - script: npm run compile --prefix test/smoke
          displayName: Compile smoke tests

      # Initialize fontconfig before Electron starts Pango and Chromium threads,
      # avoiding concurrent first-time FcInit calls that can corrupt its config.
      - script: |
          set -euo pipefail
          SOURCE_PATH="$(Agent.TempDirectory)/fcpreinit.c"
          SHIM_PATH="$(Agent.TempDirectory)/libfcpreinit.so"
          cat > "$SOURCE_PATH" <<'CEOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>

          __attribute__((constructor))
          static void preinit_fontconfig(void)
          {
            void *handle = dlopen("libfontconfig.so.1", RTLD_NOW | RTLD_GLOBAL);
            if (handle) {
              int (*fc_init)(void) = (int (*)(void)) dlsym(handle, "FcInit");
              if (fc_init) {
                fc_init();
              }
            }
          }
          CEOF
          gcc -shared -fPIC -O2 -Wall -Wextra -o "$SHIM_PATH" "$SOURCE_PATH" -ldl
          PRELOAD_VALUE="$SHIM_PATH${LD_PRELOAD:+:$LD_PRELOAD}"
          echo "##vso[task.setvariable variable=VSCODE_SMOKE_LD_PRELOAD]$PRELOAD_VALUE"
          echo "Built fontconfig pre-init shim at $SHIM_PATH"
        displayName: Pre-initialize fontconfig for Electron

      # Build the integration test extensions that integration tests depend on.
      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Integration') }}:
        - script: |
            set -e
            npm run gulp \
              compile-extension:configuration-editing \
              compile-extension:css-language-features-server \
              compile-extension:emmet \
              compile-extension:git \
              compile-extension:github-authentication \
              compile-extension:html-language-features-server \
              compile-extension:ipynb \
              compile-extension:notebook-renderers \
              compile-extension:json-language-features-server \
              compile-extension:markdown-language-features \
              compile-extension-media \
              compile-extension:microsoft-authentication \
              compile-extension:typescript-language-features \
              compile-extension:vscode-api-tests \
              compile-extension:vscode-colorize-tests \
              compile-extension:vscode-colorize-perf-tests \
              compile-extension:vscode-test-resolver
          displayName: Build integration tests

      # Guarantee the artifact directories exist so the 1ES output publishing
      # never fails on a missing path. The smoke runner writes logs under
      # .build/logs and crash dumps under .build/crashes (only on a crash).
      - script: mkdir -p .build/crashes .build/logs
        displayName: Ensure artifact directories exist

      # Run the Electron unit tests once per iteration. continueOnError lets
      # every iteration run even if some fail, and gives each run its own
      # timeline record so the flaky function can tally passes vs. failures.
      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Unit') }}:
        - ${{ each i in parameters.iterations }}:
          - script: ./scripts/test.sh --build --tfs "Unit Tests"
            env:
              VSCODE_SKIP_PRELAUNCH: '1'
            displayName: "🧪 Unit test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 15

        # Run the node.js unit tests once per iteration.
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              npm run test-node -- --build
            displayName: "🧪 Unit test iteration ${{ i }}/${{ length(parameters.iterations) }} (node.js)"
            continueOnError: true
            timeoutInMinutes: 15

      # Run the Electron integration tests once per iteration. continueOnError
      # lets every iteration run even if some fail, and gives each run its own
      # timeline record so the flaky function can tally passes vs. failures.
      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Integration') }}:
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              APP_ROOT=$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)
              APP_NAME=$(node -p "require(\"$APP_ROOT/resources/app/product.json\").applicationName")
              INTEGRATION_TEST_APP_NAME="$APP_NAME" \
              INTEGRATION_TEST_ELECTRON_PATH="$APP_ROOT/$APP_NAME" \
              ./scripts/test-integration.sh --build --tfs "Integration Tests"
            env:
              VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)/vscode-server-linux-$(VSCODE_ARCH)
              VSCODE_SKIP_PRELAUNCH: '1'
            displayName: "🧪 Integration test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 20

      # Run the Electron smoke test once per iteration. continueOnError lets every
      # iteration run even if some fail, and gives each run its own timeline record
      # so the SmokeFlaky function can tally passes vs. failures.
      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Smoke') }}:
        - ${{ each i in parameters.iterations }}:
          - script: |
              set -e
              npm run smoketest-no-compile -- --tracing --build "$(agent.builddirectory)/VSCode-linux-$(VSCODE_ARCH)"
            env:
              TMPDIR: $(Agent.TempDirectory)
              LD_PRELOAD: $(VSCODE_SMOKE_LD_PRELOAD)
          displayName: "🧪 Smoke test iteration ${{ i }}/${{ length(parameters.iterations) }} (Electron)"
            continueOnError: true
            timeoutInMinutes: 20

parameters:
  - name: VSCODE_ARCH
    type: string

# The dependency installation of product-build-alpine-node-modules.yml, with the pnpm store restored
# from the pipeline cache instead of the node_modules folders (see common/restore-pnpm-store.yml).
# Only the host's store is cached: the dependencies of `remote` are installed in the Alpine container
# with its own store (see build/npm/postinstall.ts), which pnpm in the container would have to prune.
jobs:
  - job: LinuxAlpine_${{ parameters.VSCODE_ARCH }}
    displayName: Linux Alpine (${{ upper(parameters.VSCODE_ARCH) }})
    pool:
      name: 1es-ubuntu-22.04-x64
      os: linux
    timeoutInMinutes: 60
    variables:
      NPM_ARCH: ${{ parameters.VSCODE_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      PNPM_CONFIG_STORE_DIR: $(Pipeline.Workspace)/pnpm-store
      PNPM_CONFIG_CACHE_DIR: $(Pipeline.Workspace)/pnpm-store/cache
    steps:
      - template: ../common/checkout.yml@self

      - template: ../common/setup-node.yml@self
        parameters:
          os: linux

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - script: node build/setup-npm-registry.ts $NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      - template: ../common/apply-sdk-canary.yml@self

      - template: ../common/restore-pnpm-store.yml@self
        parameters:
          keyArgs: alpine $(VSCODE_ARCH) alpine-3.22
          os: linux

      - template: ../common/install-pnpm.yml@self
        parameters:
          setupRegistry: true
          os: linux

      - task: NuGetAuthenticate@1
        displayName: Setup NuGet Authentication

      - template: ../common/setup-qemu.yml@self
        parameters:
          condition: and(succeeded(), eq(variables['NPM_ARCH'], 'arm64'))

      - task: Docker@1
        inputs:
          azureSubscriptionEndpoint: vscode
          azureContainerRegistry: vscodehub.azurecr.io
          command: "Run an image"
          imageName: "vscode-linux-build-agent:alpine-$(VSCODE_ARCH)"
          arguments: --pull=always
          containerCommand: uname
        displayName: "Pull image"

      - script: sudo apt-get update && sudo apt-get install -y libkrb5-dev
        displayName: Install build dependencies

      - script: |
          set -e
          mkdir -p .build/nodejs-musl
          NODE_VERSION=$(node -p "require('./remote/package.json').nativeBuild.target")
          BUILD_ID=$(node -p "require('./remote/package.json').nativeBuild.msBuildId")
          az artifacts universal download \
            --organization "https://dev.azure.com/monacotools" \
            --project "Monaco" \
            --scope project \
            --feed "vscode-node" \
            --name "node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar" \
            --version "${NODE_VERSION}-${BUILD_ID}" \
            --path .build/nodejs-musl \
            --only-show-errors
          tar -xzf ".build/nodejs-musl/node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar.gz" -C ".build/nodejs-musl" --strip-components=1
          rm ".build/nodejs-musl/node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar.gz"
        env:
          AZURE_DEVOPS_EXT_PAT: "$(System.AccessToken)"
        displayName: Download NodeJS MUSL

      - script: pnpm run preinstall
        displayName: Install Electron headers

      - script: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: $(NPM_ARCH)
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-token-code-oss)"
          FOUNDRY_LOCAL_NUGET_MODE: dotnet
          FOUNDRY_LOCAL_NUGET_FEEDS: "https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/nuget/v3/index.json"
          VSCODE_REMOTE_DEPENDENCIES_CONTAINER_NAME: vscodehub.azurecr.io/vscode-linux-build-agent:alpine-$(VSCODE_ARCH)
          VSCODE_HOST_MOUNT: "/mnt/vss/_work/1/s"
          VSCODE_NPMRC_PATH: $(NPMRC_PATH)
        displayName: Install dependencies

      # NuGetAuthenticate@1 exposes its access token to all later steps as the
      # VSS_NUGET_ACCESSTOKEN environment variable, from where they can write it
      # to logs. Only installing dependencies needs it, so clear it now.
      - script: echo "##vso[task.setvariable variable=VSS_NUGET_ACCESSTOKEN]"
        displayName: Clear package feed credentials
        condition: always()

      - script: node build/azure-pipelines/common/pnpmStoreCache.ts prune
        condition: and(succeeded(), ne(variables.PNPM_STORE_RESTORED, 'true'))
        displayName: Prune pnpm store

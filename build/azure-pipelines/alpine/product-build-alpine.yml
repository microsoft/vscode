parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-ubuntu-22.04-x64

jobs:
  - job: Alpine_${{ parameters.VSCODE_ARCH }}
    displayName: Alpine (${{ upper(parameters.VSCODE_ARCH) }})
    timeoutInMinutes: 60
    pool:
      name: ${{ parameters.VSCODE_POOL_NAME }}
      os: linux
    variables:
      NPM_ARCH: ${{ parameters.VSCODE_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      VSCODE_EXTENSION_TARGET: alpine-${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
          # keep legacy name
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-linux-alpine.tar.gz
            artifactName: vscode_server_linux_alpine_archive-unsigned
            displayName: Publish x64 server archive
            condition: and(succeeded(), ne(variables['SERVER_ARCHIVE_PUBLISHED'], 'true'))
            sbomBuildDropPath: $(SERVER_DIR_PATH)
            sbomPackageName: "VS Code Alpine x64 Server"
            sbomPackageVersion: $(Build.SourceVersion)
          # keep legacy name
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-linux-alpine-web.tar.gz
            artifactName: vscode_web_linux_alpine_archive-unsigned
            displayName: Publish x64 web server archive
            condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
            sbomBuildDropPath: $(WEB_DIR_PATH)
            sbomPackageName: "VS Code Alpine x64 Web"
            sbomPackageVersion: $(Build.SourceVersion)
        - ${{ if ne(parameters.VSCODE_ARCH, 'x64') }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-alpine-$(VSCODE_ARCH).tar.gz
            artifactName: vscode_server_alpine_$(VSCODE_ARCH)_archive-unsigned
            displayName: Publish server archive
            condition: and(succeeded(), ne(variables['SERVER_ARCHIVE_PUBLISHED'], 'true'))
            sbomBuildDropPath: $(SERVER_DIR_PATH)
            sbomPackageName: "VS Code Alpine $(VSCODE_ARCH) Server"
            sbomPackageVersion: $(Build.SourceVersion)
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-alpine-$(VSCODE_ARCH)-web.tar.gz
            artifactName: vscode_web_alpine_$(VSCODE_ARCH)_archive-unsigned
            displayName: Publish web server archive
            condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
            sbomBuildDropPath: $(WEB_DIR_PATH)
            sbomPackageName: "VS Code Alpine $(VSCODE_ARCH) Web"
            sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_alpine_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'), ne(variables['AGENT_SDK_TARBALLS_PUBLISHED'], 'true'))
    steps:
      - template: ../common/checkout.yml@self

      - template: ../common/setup-node.yml@self
        parameters:
          os: linux

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - script: node build/setup-npm-registry.ts $NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      - template: ../common/restore-pnpm-store.yml@self
        parameters:
          keyArgs: alpine $(VSCODE_ARCH) alpine-3.22
          os: linux

      - script: |
          set -e
          # Set the private NPM registry to the global npmrc file
          # so that authentication works for subfolders like build/, remote/, extensions/ etc
          # which does not have their own .npmrc file
          npm config set registry "$NPM_REGISTRY"
          echo "##vso[task.setvariable variable=NPMRC_PATH]$(npm config get userconfig)"
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM

      - task: npmAuthenticate@0
        inputs:
          workingFile: $(NPMRC_PATH)
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Authentication

      - template: ../common/install-pnpm.yml@self

      - task: NuGetAuthenticate@1
        displayName: Setup NuGet Authentication

      - template: ../common/setup-qemu.yml@self
        parameters:
          condition: and(succeeded(), eq(variables['NPM_ARCH'], 'arm64'))

      - task: Docker@1
        inputs:
          azureSubscriptionEndpoint: vscode
          azureContainerRegistry: vscodehub.azurecr.io
          command: "Run an image"
          imageName: "vscode-linux-build-agent:alpine-$(VSCODE_ARCH)"
          arguments: --pull=always
          containerCommand: uname
        displayName: "Pull image"

      - script: ./build/azure-pipelines/linux/apt-install-with-retry.sh libkrb5-dev
        displayName: Install build dependencies
        timeoutInMinutes: 25

      - script: |
          set -e
          mkdir -p .build/nodejs-musl
          NODE_VERSION=$(node -p "require('./remote/package.json').nativeBuild.target")
          BUILD_ID=$(node -p "require('./remote/package.json').nativeBuild.msBuildId")
          az artifacts universal download \
            --organization "https://dev.azure.com/monacotools" \
            --project "Monaco" \
            --scope project \
            --feed "vscode-node" \
            --name "node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar" \
            --version "${NODE_VERSION}-${BUILD_ID}" \
            --path .build/nodejs-musl \
            --only-show-errors
          tar -xzf ".build/nodejs-musl/node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar.gz" -C ".build/nodejs-musl" --strip-components=1
          rm ".build/nodejs-musl/node-v${NODE_VERSION}-linux-${VSCODE_ARCH}-musl.tar.gz"
        env:
          AZURE_DEVOPS_EXT_PAT: "$(System.AccessToken)"
        displayName: Download NodeJS MUSL

      - script: pnpm run preinstall
        displayName: Install Electron headers

      - script: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: $(NPM_ARCH)
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-token-code-oss)"
          FOUNDRY_LOCAL_NUGET_MODE: dotnet
          FOUNDRY_LOCAL_NUGET_FEEDS: "https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/nuget/v3/index.json"
          VSCODE_REMOTE_DEPENDENCIES_CONTAINER_NAME: vscodehub.azurecr.io/vscode-linux-build-agent:alpine-$(VSCODE_ARCH)
          VSCODE_HOST_MOUNT: "/mnt/vss/_work/1/s"
          VSCODE_NPMRC_PATH: $(NPMRC_PATH)
        displayName: Install dependencies

      # NuGetAuthenticate@1 exposes its access token to all later steps as the
      # VSS_NUGET_ACCESSTOKEN environment variable, from where they can write it
      # to logs. Only installing dependencies needs it, so clear it now.
      - script: echo "##vso[task.setvariable variable=VSS_NUGET_ACCESSTOKEN]"
        displayName: Clear package feed credentials
        condition: always()

      - script: node build/azure-pipelines/common/checkNativeOptionalDeps.ts
        displayName: Verify native optional dependency binaries

      - script: node build/azure-pipelines/distro/mixin-npm.ts
        displayName: Mixin distro node modules

      - template: ../common/prune-pnpm-store.yml@self
        parameters:
          os: linux

      - script: node build/azure-pipelines/distro/mixin-quality.ts
        displayName: Mixin distro quality

      - script: pnpm exec deemon --detach --wait -- node build/azure-pipelines/common/waitForArtifacts.ts "--producer=unsigned_copilot_shim_alpine_$(VSCODE_ARCH)=Alpine CLI (${{ upper(parameters.VSCODE_ARCH) }})"
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: Wait for Copilot shim artifact (background)

      - template: ../common/install-builtin-extensions.yml@self

      - script: node build/npm/electronTypes.ts
        displayName: Prepare Electron types

      - template: ../common/agent-sdk-produce.yml@self
        parameters:
          vscodePlatform: alpine

      - template: ../common/mixin-vscode-capi.yml@self

      - script: pnpm run gulp core-ci
        env:
          GITHUB_TOKEN: "$(github-token-code-oss)"
        displayName: Compile

      - template: ../copilot/builtin-steps.yml@self

      - script: pnpm exec deemon --attach -- node build/azure-pipelines/common/waitForArtifacts.ts "--producer=unsigned_copilot_shim_alpine_$(VSCODE_ARCH)=Alpine CLI (${{ upper(parameters.VSCODE_ARCH) }})"
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: Wait for Copilot shim artifact

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: unsigned_copilot_shim_alpine_$(VSCODE_ARCH)
          patterns: "**"
          path: $(Build.ArtifactStagingDirectory)/copilot-shim
        displayName: Download Copilot shim

      - script: |
          set -e
          TARGET=$([ "$VSCODE_ARCH" == "x64" ] && echo "linux-alpine" || echo "alpine-arm64") # TODO@joaomoreno
          pnpm run gulp vscode-reh-$TARGET-min-ci
          (cd .. && mv vscode-reh-$TARGET vscode-server-$TARGET) # TODO@joaomoreno
          tar -xzf $(Build.ArtifactStagingDirectory)/copilot-shim/*.tar.gz -C $(Build.ArtifactStagingDirectory)/copilot-shim
          install -D -m 755 $(Build.ArtifactStagingDirectory)/copilot-shim/copilot ../vscode-server-$TARGET/bin/copilot-shim/copilot
          ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/out/server/vscode-server-$TARGET.tar.gz"
          DIR_PATH="$(realpath ../vscode-server-$TARGET)"
          mkdir -p $(dirname $ARCHIVE_PATH)
          tar --owner=0 --group=0 -czf $ARCHIVE_PATH -C .. vscode-server-$TARGET
          echo "##vso[task.setvariable variable=SERVER_DIR_PATH]$DIR_PATH"
          echo "##vso[task.setvariable variable=SERVER_PATH]$ARCHIVE_PATH"
        env:
          GITHUB_TOKEN: "$(github-token-code-oss)"
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
        displayName: Build server

      - script: |
          set -e
          TARGET=$([ "$VSCODE_ARCH" == "x64" ] && echo "linux-alpine" || echo "alpine-arm64")
          pnpm run gulp vscode-reh-web-$TARGET-min-ci
          (cd .. && mv vscode-reh-web-$TARGET vscode-server-$TARGET-web) # TODO@joaomoreno
          ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/out/web/vscode-server-$TARGET-web.tar.gz"
          DIR_PATH="$(realpath ../vscode-server-$TARGET-web)"
          mkdir -p $(dirname $ARCHIVE_PATH)
          tar --owner=0 --group=0 -czf $ARCHIVE_PATH -C .. vscode-server-$TARGET-web
          echo "##vso[task.setvariable variable=WEB_DIR_PATH]$DIR_PATH"
          echo "##vso[task.setvariable variable=WEB_PATH]$ARCHIVE_PATH"
        env:
          GITHUB_TOKEN: "$(github-token-code-oss)"
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
        displayName: Build server (web)

      # Pipeline artifacts can't be overwritten, so a retry of this job must skip
      # the artifacts that an earlier attempt already published, for example
      # before an injected SDL step hung (see ../common/checkForArtifact.ts)
      - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            SERVER_ARCHIVE_PUBLISHED vscode_server_linux_alpine_archive-unsigned
            WEB_ARCHIVE_PUBLISHED vscode_web_linux_alpine_archive-unsigned
            AGENT_SDK_TARBALLS_PUBLISHED agent_sdk_alpine_$(VSCODE_ARCH)_tarballs
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          condition: succeededOrFailed()
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt
      - ${{ else }}:
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            SERVER_ARCHIVE_PUBLISHED vscode_server_alpine_$(VSCODE_ARCH)_archive-unsigned
            WEB_ARCHIVE_PUBLISHED vscode_web_alpine_$(VSCODE_ARCH)_archive-unsigned
            AGENT_SDK_TARBALLS_PUBLISHED agent_sdk_alpine_$(VSCODE_ARCH)_tarballs
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          condition: succeededOrFailed()
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt

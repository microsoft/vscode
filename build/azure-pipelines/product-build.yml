# Temporary hosted validation for microsoft/vscode#345082. Do not merge this branch.
trigger: none
pr: none

name: dns-capture-validation-$(Date:yyyyMMdd).$(Rev:r)

variables:
  VSCODE_ARCH: x64
  VSCODE_PUBLISH: false
  VSCODE_RELEASE: false

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool: 1es-windows-2022-x64
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    stages:
      - stage: DiagnosticValidation
        displayName: Windows network diagnostic validation
        pool:
          name: 1es-windows-2022-x64
          os: windows
        jobs:
          - job: Capture
            displayName: Inject failure and retain network evidence
            timeoutInMinutes: 15
            cancelTimeoutInMinutes: 5
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.SourcesDirectory)/.build/logs/network
                  artifactName: network-diagnostics-windows-$(VSCODE_ARCH)-compile-$(System.JobAttempt)
                  displayName: Publish network failure diagnostics
                  sbomEnabled: false
                  isProduction: false
                  condition: and(failed(), eq(variables['VSCODE_NETWORK_DIAGNOSTICS_CAPTURED'], 'true'))
            steps:
              - checkout: self
                clean: true

              - template: build/azure-pipelines/common/setup-node.yml@self

              - powershell: |
                  Write-Host "DNS_CAPTURE_VALIDATION_INJECTED_FAILURE: intentionally failing without changing network or isolation state."
                  exit 1
                displayName: Inject harmless validation failure

              - pwsh: node build/azure-pipelines/common/runWithTimeout.ts 45 -- powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build/azure-pipelines/win32/collect-network-diagnostics.ps1 -OutputDirectory "$(Build.SourcesDirectory)\.build\logs\network"
                displayName: Collect Windows network failure diagnostics
                condition: failed()
                continueOnError: true
                timeoutInMinutes: 2

pr: none

schedules:
  - cron: "0 5 * * Mon-Fri"
    displayName: Mon-Fri at 5:00 UTC (build, publish, and release)
    branches:
      include:
        - main
  - cron: "0 11 * * Mon-Fri"
    displayName: Mon-Fri at 11:00 UTC (build, and publish)
    branches:
      include:
        - main
  - cron: "0 17 * * Mon-Fri"
    displayName: Mon-Fri at 17:00 UTC (build, publish, and release)
    branches:
      include:
        - main
  - cron: "0 23 * * Mon-Fri"
    displayName: Mon-Fri at 23:00 UTC (build, and publish)
    branches:
      include:
        - main

# The CI builds of main and release/* commits run in product-build-ci.yml.
trigger: none

parameters:
  - name: VSCODE_QUALITY
    displayName: Quality
    type: string
    default: insider
    values:
      - exploration
      - insider
      - stable
  - name: NPM_REGISTRY
    displayName: "Custom NPM Registry"
    type: string
    default: 'https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/npm/registry/'
  - name: CARGO_REGISTRY
    displayName: "Custom Cargo Registry"
    type: string
    default: 'sparse+https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/Cargo/index/'
  - name: VSCODE_BUILD_WIN32
    displayName: "🎯 Windows x64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_WIN32_ARM64
    displayName: "🎯 Windows arm64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_LINUX
    displayName: "🎯 Linux x64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_LINUX_SNAP
    displayName: "🎯 Linux x64 Snap"
    type: boolean
    default: true
  - name: VSCODE_BUILD_LINUX_ARM64
    displayName: "🎯 Linux arm64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_LINUX_ARMHF
    displayName: "🎯 Linux armhf"
    type: boolean
    default: true
  - name: VSCODE_BUILD_ALPINE
    displayName: "🎯 Alpine x64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_ALPINE_ARM64
    displayName: "🎯 Alpine arm64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_MACOS
    displayName: "🎯 macOS x64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_MACOS_ARM64
    displayName: "🎯 macOS arm64"
    type: boolean
    default: true
  - name: VSCODE_BUILD_MACOS_UNIVERSAL
    displayName: "🎯 macOS universal"
    type: boolean
    default: true
  - name: VSCODE_BUILD_WEB
    displayName: "🎯 Web"
    type: boolean
    default: true
  - name: VSCODE_BUILD_WEB_MOBILE
    displayName: "🎯 Mobile"
    type: boolean
    default: true
  - name: VSCODE_PUBLISH
    displayName: "Publish to builds.code.visualstudio.com (ONLY FOR MAIN AND RELEASE BRANCHES)"
    type: boolean
    default: true
  - name: VSCODE_RELEASE
    displayName: "Release build if successful (ONLY FOR INSIDER)"
    type: boolean
    default: false
  - name: VSCODE_USE_LEGACY_OSS_NOTICE
    displayName: "Use legacy OSS Notice"
    type: boolean
    default: false
  # SDK -> VS Code integration: override Copilot dependencies with versions
  # already published to the private feed. 'none' = use the OSS SDK version.
  # See microsoft/vscode-engineering specs/sdk-vscode-integration.spec.md.
  - name: VSCODE_SDK_CANARY_VERSION
    displayName: "SDK canary: @microsoft/copilot-sdk version ('none' = normal build)"
    type: string
    default: none
  - name: VSCODE_CLI_CANARY_VERSION
    displayName: "Expected SDK-bundled runtime version ('auto' = infer from SDK)"
    type: string
    default: auto

variables:
  - name: VSCODE_PRIVATE_BUILD
    value: ${{ ne(variables['Build.Repository.Uri'], 'https://github.com/microsoft/vscode.git') }}
  - name: NPM_REGISTRY
    value: ${{ parameters.NPM_REGISTRY }}
  # Normalize sentinels back to empty so the override script can distinguish
  # the normal SDK and inferred runtime paths.
  - name: VSCODE_SDK_CANARY_VERSION
    ${{ if eq(parameters.VSCODE_SDK_CANARY_VERSION, 'none') }}:
      value: ""
    ${{ else }}:
      value: ${{ parameters.VSCODE_SDK_CANARY_VERSION }}
  - name: VSCODE_CLI_CANARY_VERSION
    ${{ if eq(parameters.VSCODE_CLI_CANARY_VERSION, 'auto') }}:
      value: ""
    ${{ else }}:
      value: ${{ parameters.VSCODE_CLI_CANARY_VERSION }}
  - name: CARGO_REGISTRY
    value: ${{ parameters.CARGO_REGISTRY }}
  - name: VSCODE_QUALITY
    value: ${{ parameters.VSCODE_QUALITY }}
  # Builds of branches other than main and release/* are dev builds. They neither sign nor publish, so the
  # shared templates drop every step and job that needs a signing, publishing or release service connection
  # (see sdk-validation-build.yml), and those connections can be restricted to the main and release branches.
  - name: VSCODE_PRIVILEGED_CONNECTIONS
    value: ${{ or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}
  - name: VSCODE_BUILD_STAGE_LINUX
    value: ${{ or(eq(parameters.VSCODE_BUILD_LINUX, true), eq(parameters.VSCODE_BUILD_LINUX_SNAP, true), eq(parameters.VSCODE_BUILD_LINUX_ARMHF, true), eq(parameters.VSCODE_BUILD_LINUX_ARM64, true)) }}
  - name: VSCODE_BUILD_STAGE_ALPINE
    value: ${{ or(eq(parameters.VSCODE_BUILD_ALPINE, true), eq(parameters.VSCODE_BUILD_ALPINE_ARM64, true)) }}
  - name: VSCODE_BUILD_STAGE_MACOS
    value: ${{ or(eq(parameters.VSCODE_BUILD_MACOS, true), eq(parameters.VSCODE_BUILD_MACOS_ARM64, true)) }}
  - name: VSCODE_BUILD_STAGE_WEB
    value: ${{ eq(parameters.VSCODE_BUILD_WEB, true) }}
  # The shared templates (and the quality checks at runtime) read this; CI builds
  # run in product-build-ci.yml.
  - name: VSCODE_CIBUILD
    value: false
  # Each architecture builds in its own stage.
  - name: VSCODE_BUILD_STAGE_LINUX_X64
    value: ${{ or(eq(parameters.VSCODE_BUILD_LINUX, true), eq(parameters.VSCODE_BUILD_LINUX_SNAP, true)) }}
  - name: VSCODE_BUILD_STAGE_LINUX_ARM64
    value: ${{ eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}
  - name: VSCODE_BUILD_STAGE_LINUX_ARMHF
    value: ${{ eq(parameters.VSCODE_BUILD_LINUX_ARMHF, true) }}
  # The Windows stage holds the x64 jobs, the WindowsARM64 stage the arm64 jobs,
  # so that each stage lists its jobs in build order.
  - name: VSCODE_BUILD_STAGE_WINDOWS
    value: ${{ eq(parameters.VSCODE_BUILD_WIN32, true) }}
  - name: VSCODE_BUILD_STAGE_WINDOWS_ARM64
    value: ${{ eq(parameters.VSCODE_BUILD_WIN32_ARM64, true) }}
  - name: VSCODE_BUILD_STAGE_MACOS_X64
    value: ${{ eq(parameters.VSCODE_BUILD_MACOS, true) }}
  - name: VSCODE_BUILD_STAGE_MACOS_ARM64
    value: ${{ eq(parameters.VSCODE_BUILD_MACOS_ARM64, true) }}
  # The universal job only merges and signs the x64 and arm64 clients, so dev builds skip it.
  - name: VSCODE_BUILD_STAGE_MACOS_UNIVERSAL
    value: ${{ and(eq(variables.VSCODE_PRIVILEGED_CONNECTIONS, true), eq(parameters.VSCODE_BUILD_MACOS, true), eq(parameters.VSCODE_BUILD_MACOS_ARM64, true), eq(parameters.VSCODE_BUILD_MACOS_UNIVERSAL, true)) }}
  - name: VSCODE_PUBLISH
    value: ${{ and(eq(variables.VSCODE_PRIVILEGED_CONNECTIONS, true), eq(parameters.VSCODE_PUBLISH, true)) }}
  - name: VSCODE_WINDOWS_POOL
    ${{ if eq(variables.VSCODE_PUBLISH, true) }}:
      value: 1es-windows-2022-x64-publishing
    ${{ else }}:
      value: 1es-windows-2022-x64
  - name: VSCODE_UBUNTU_POOL
    ${{ if eq(variables.VSCODE_PUBLISH, true) }}:
      value: 1es-ubuntu-22.04-x64-publishing
    ${{ else }}:
      value: 1es-ubuntu-22.04-x64
  - name: VSCODE_SCHEDULEDBUILD
    value: ${{ eq(variables['Build.Reason'], 'Schedule') }}
  - name: VSCODE_PUBLISH_COUNTER_PREFIX
    value: $[format('{0:yyyyMMdd}-{1}-{2}-{3}', pipeline.startTime, variables['VSCODE_QUALITY'], variables['VSCODE_PUBLISH'], variables['Build.SourceBranch'])]
  - name: VSCODE_PUBLISH_COUNTER
    value: $[counter(variables['VSCODE_PUBLISH_COUNTER_PREFIX'], 1)]
  # Derived as an explicit lowercase string literal so downloadNotice.ts's
  # case-sensitive JS check (process.env['VSCODE_OVERWRITE_TPN'] === 'false')
  # works. ${{ eq(...) }} would emit 'True'/'False' (capitalized) and silently
  # fail that comparison. Checkbox on => keep legacy notice ('false' = no
  # overwrite); off => apply CG notice ('true').
  - name: VSCODE_OVERWRITE_TPN
    ${{ if eq(parameters.VSCODE_USE_LEGACY_OSS_NOTICE, true) }}:
      value: 'false'
    ${{ else }}:
      value: 'true'
  - name: VSCODE_BUILD_MACOS_UNIVERSAL
    value: ${{ and(eq(parameters.VSCODE_BUILD_MACOS, true), eq(parameters.VSCODE_BUILD_MACOS_ARM64, true), eq(parameters.VSCODE_BUILD_MACOS_UNIVERSAL, true)) }}
  - name: VSCODE_STAGING_BLOB_STORAGE_ACCOUNT_NAME
    value: vscodeesrp
  - name: PRSS_CDN_URL
    value: https://vscode.download.prss.microsoft.com/dbazure/download
  - name: VSCODE_ESRP_SERVICE_CONNECTION_ID
    value: fe07e6ce-6ffb-4df9-8d27-d129523a3f3e
  - name: VSCODE_ESRP_TENANT_ID
    value: 975f013f-7f24-47e8-a7d3-abc4752bf346
  - name: VSCODE_ESRP_CLIENT_ID
    value: 4ac7ed59-b5e9-4f66-9c30-8d1afa72d32d
  - name: ESRP_TENANT_ID
    value: 975f013f-7f24-47e8-a7d3-abc4752bf346
  - name: ESRP_CLIENT_ID
    value: c24324f7-e65f-4c45-8702-ed2d4c35df99
  - name: AZURE_DOCUMENTDB_ENDPOINT
    value: https://vscode.documents.azure.com/
  - name: VSCODE_MIXIN_REPO
    value: microsoft/vscode-distro
  - name: skipComponentGovernanceDetection
    value: false
  - name: ComponentDetection.Timeout
    value: 600
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: ARTIFACT_PREFIX
    value: ''

name: "$(Date:yyyyMMdd).$(Rev:r) (${{ parameters.VSCODE_QUALITY }})"

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: distro
      type: github
      name: microsoft/vscode-distro
      endpoint: Monaco
      ref: main
    - repository: capi
      type: github
      name: microsoft/vscode-capi
      endpoint: Monaco
      ref: main
    - repository: encrypt
      type: github
      name: microsoft/vscode-encrypt
      endpoint: Monaco
      ref: main
    - repository: vsda
      type: github
      name: microsoft/vsda
      endpoint: Monaco
      ref: main
    - repository: regexp
      type: github
      name: microsoft/vscode-regexp-languagedetection
      endpoint: Monaco
      ref: main
    - repository: vscode_loc
      type: github
      name: microsoft/vscode-extensions-loc
      endpoint: Monaco
      ref: main

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceRepositoriesToScan:
        exclude:
          - repository: distro
          - repository: capi
          - repository: encrypt
          - repository: vsda
          - repository: regexp
          - repository: vscode_loc
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/build/azure-pipelines/config/tsaoptions.json
      binskim:
        analyzeTargetGlob: '+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.exe;+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.dll;+:file|$(Agent.BuildDirectory)/VSCode-*/**/*.node;-:file|$(Agent.BuildDirectory)/VSCode-*/**/resources/**/*.exe;-:file|$(Agent.BuildDirectory)/VSCode-*/**/resources/**/*.node;-:file|$(Build.SourcesDirectory)/.build/**/system-setup/VSCodeSetup*.exe;-:file|$(Build.SourcesDirectory)/.build/**/user-setup/VSCodeUserSetup*.exe'
      codeql:
        runSourceLanguagesInSourceAnalysis: true
        compiled:
          enabled: false
          justificationForDisabling: "CodeQL breaks ESRP CodeSign on macOS (ICM #520035761, githubcustomers/microsoft-codeql-support#198)"
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/build/azure-pipelines/config/CredScanSuppressions.json
      eslint:
        enabled: true
        enableExclusions: true
        exclusionsFilePath: $(Build.SourcesDirectory)/.eslint-ignore
      antimalwareScan:
        scanTimeoutInMinutes: '10'
      sourceAnalysisPool: ${{ variables.VSCODE_WINDOWS_POOL }}
      createAdoIssuesForJustificationsForDisablement: false
    containers:
      ubuntu-2004-arm64:
        image: onebranch.azurecr.io/linux/ubuntu-2004-arm64:latest
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    stages:
      - stage: Quality
        dependsOn: []
        pool:
          name: ${{ variables.VSCODE_UBUNTU_POOL }}
          os: linux
        jobs:
          - template: build/azure-pipelines/product-quality-checks.yml@self
            parameters:
              VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_WINDOWS'], true) }}:
        - stage: Windows
          displayName: Windows X64
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_WINDOWS_POOL }}
            os: windows
          jobs:
            - template: build/azure-pipelines/win32/product-build-win32-cli.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_WINDOWS_POOL }}

            - template: build/azure-pipelines/win32/product-build-win32.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_RUN_TESTS: true
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

            # Same test jobs as the Windows CI jobs of product-build-ci.yml
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: UnitElectron
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Electron)
                VSCODE_TEST_IDS:
                  - unit-electron
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Unit
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Node.js & Browser)
                VSCODE_TEST_IDS:
                  - unit-node
                  - unit-browser-chromium
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: BrowserRemote
                VSCODE_JOB_DISPLAY_NAME: Browser & Remote Tests
                VSCODE_TEST_IDS:
                  - integration-browser-firefox
                  - integration-remote
                  - smoke-browser-chromium
                  - smoke-remote
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Integration
                VSCODE_JOB_DISPLAY_NAME: Integration Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-electron
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: AgentHostE2E
                VSCODE_JOB_DISPLAY_NAME: Agent Host E2E Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-agent-host-e2e
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Smoke
                VSCODE_JOB_DISPLAY_NAME: Smoke Tests (Electron)
                VSCODE_TEST_IDS:
                  - smoke-electron
                  - smoke-wsl-kerberos-proxy
                  - smoke-wsl-basic-proxy
                  - smoke-wsl-basic-pac-proxy
                VSCODE_LINUX_X64_COMPILATION_ARTIFACT: ${{ eq(variables['VSCODE_BUILD_STAGE_LINUX_X64'], true) }}
            - template: build/azure-pipelines/win32/product-build-win32-test.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Copilot
                VSCODE_JOB_DISPLAY_NAME: Copilot Tests
                VSCODE_TEST_IDS:
                  - copilot

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_WINDOWS_ARM64'], true) }}:
        - stage: WindowsARM64
          displayName: Windows ARM64
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_WINDOWS_POOL }}
            os: windows
          jobs:
            - template: build/azure-pipelines/win32/product-build-win32-cli.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_WINDOWS_POOL }}
            - template: build/azure-pipelines/win32/product-build-win32.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_LINUX_X64'], true) }}:
        - stage: LinuxX64
          displayName: Linux X64
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_UBUNTU_POOL }}
            os: linux
          jobs:
            - template: build/azure-pipelines/linux/product-build-linux-cli.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}

            - template: build/azure-pipelines/linux/product-build-linux.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_RUN_TESTS: true
                VSCODE_BUILD_LINUX_SNAP: ${{ parameters.VSCODE_BUILD_LINUX_SNAP }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

            # Same test jobs as the Linux CI jobs of product-build-ci.yml
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: UnitElectron
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Electron)
                VSCODE_TEST_IDS:
                  - unit-electron
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: Unit
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Node.js & Browser)
                VSCODE_TEST_IDS:
                  - unit-node
                  - unit-browser-chromium
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: BrowserRemote
                VSCODE_JOB_DISPLAY_NAME: Browser & Remote Tests
                VSCODE_TEST_IDS:
                  - integration-browser-chromium
                  - integration-remote
                  - smoke-browser-chromium
                  - smoke-remote
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: Integration
                VSCODE_JOB_DISPLAY_NAME: Integration Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-electron
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: AgentHostE2E
                VSCODE_JOB_DISPLAY_NAME: Agent Host E2E Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-agent-host-e2e
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: Smoke
                VSCODE_JOB_DISPLAY_NAME: Smoke Tests (Electron)
                VSCODE_TEST_IDS:
                  - smoke-electron
            - template: build/azure-pipelines/linux/product-build-linux-test.yml@self
              parameters:
                NPM_ARCH: x64
                VSCODE_ARCH: x64
                VSCODE_JOB_NAME: Copilot
                VSCODE_JOB_DISPLAY_NAME: Copilot Tests
                VSCODE_TEST_IDS:
                  - copilot

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_LINUX_ARM64'], true) }}:
        - stage: LinuxARM64
          displayName: Linux ARM64
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_UBUNTU_POOL }}
            os: linux
          jobs:
            - template: build/azure-pipelines/linux/product-build-linux-cli.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}

            - template: build/azure-pipelines/linux/product-build-linux.yml@self
              parameters:
                NPM_ARCH: arm64
                VSCODE_ARCH: arm64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_LINUX_ARMHF'], true) }}:
        - stage: LinuxARMHF
          displayName: Linux ARMHF
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_UBUNTU_POOL }}
            os: linux
          jobs:
            - template: build/azure-pipelines/linux/product-build-linux-cli.yml@self
              parameters:
                VSCODE_ARCH: armhf
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}

            - template: build/azure-pipelines/linux/product-build-linux.yml@self
              parameters:
                NPM_ARCH: arm
                VSCODE_ARCH: armhf
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_ALPINE'], true) }}:
        - stage: Alpine
          dependsOn: []
          jobs:
            - ${{ if eq(parameters.VSCODE_BUILD_ALPINE, true) }}:
              - template: build/azure-pipelines/alpine/product-build-alpine.yml@self
                parameters:
                  VSCODE_ARCH: x64
                  VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}
                  VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}
              - template: build/azure-pipelines/alpine/product-build-alpine-cli.yml@self
                parameters:
                  VSCODE_ARCH: x64
                  VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                  VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}
            - ${{ if eq(parameters.VSCODE_BUILD_ALPINE_ARM64, true) }}:
              - template: build/azure-pipelines/alpine/product-build-alpine.yml@self
                parameters:
                  VSCODE_ARCH: arm64
                  VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}
                  VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}
              - template: build/azure-pipelines/alpine/product-build-alpine-cli.yml@self
                parameters:
                  VSCODE_ARCH: arm64
                  VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                  VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_MACOS_X64'], true) }}:
        - stage: macOSX64
          displayName: macOS X64
          dependsOn: []
          pool:
            name: AcesShared
            os: macOS
            demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            BUILDSECMON_OPT_IN: true
          jobs:
            - template: build/azure-pipelines/darwin/product-build-darwin-cli.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

            - template: build/azure-pipelines/darwin/product-build-darwin.yml@self
              parameters:
                VSCODE_ARCH: x64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_MACOS_ARM64'], true) }}:
        - stage: macOSARM64
          displayName: macOS ARM64
          dependsOn: []
          pool:
            name: AcesShared
            os: macOS
            demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            BUILDSECMON_OPT_IN: true
          jobs:
            - template: build/azure-pipelines/darwin/product-build-darwin-cli.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

            - template: build/azure-pipelines/darwin/product-build-darwin.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_RUN_TESTS: true
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

            # Same test jobs as the macOS CI jobs of product-build-ci.yml
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: UnitElectron
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Electron)
                VSCODE_TEST_IDS:
                  - unit-electron
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Unit
                VSCODE_JOB_DISPLAY_NAME: Unit Tests (Node.js & Browser)
                VSCODE_TEST_IDS:
                  - unit-node
                  - unit-browser-webkit
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: BrowserRemote
                VSCODE_JOB_DISPLAY_NAME: Browser & Remote Tests
                VSCODE_TEST_IDS:
                  - integration-browser-webkit
                  - integration-remote
                  - smoke-browser-chromium
                  - smoke-remote
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Integration
                VSCODE_JOB_DISPLAY_NAME: Integration Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-electron
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: AgentHostE2E
                VSCODE_JOB_DISPLAY_NAME: Agent Host E2E Tests (Electron)
                VSCODE_TEST_IDS:
                  - integration-agent-host-e2e
            - template: build/azure-pipelines/darwin/product-build-darwin-test.yml@self
              parameters:
                VSCODE_ARCH: arm64
                VSCODE_CIBUILD: ${{ variables.VSCODE_CIBUILD }}
                VSCODE_JOB_NAME: Smoke
                VSCODE_JOB_DISPLAY_NAME: Smoke Tests (Electron)
                VSCODE_TEST_IDS:
                  - smoke-electron
                  - smoke-agents-pac-proxy
                  - smoke-agents-kerberos-pac-proxy
                  - smoke-agents-basic-proxy

      # The universal job waits for the unsigned x64 and arm64 client artifacts
      # instead of depending on their stages, so that it runs in parallel.
      - ${{ if eq(variables['VSCODE_BUILD_STAGE_MACOS_UNIVERSAL'], true) }}:
        - stage: macOSUniversal
          displayName: macOS UNIVERSAL
          dependsOn: []
          pool:
            name: AcesShared
            os: macOS
            demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
          variables:
            BUILDSECMON_OPT_IN: true
          jobs:
            - template: build/azure-pipelines/darwin/product-build-darwin-universal.yml@self

      - ${{ if eq(variables['VSCODE_BUILD_STAGE_WEB'], true) }}:
        - stage: Web
          dependsOn: []
          jobs:
            - template: build/azure-pipelines/web/product-build-web.yml@self
              parameters:
                VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(parameters.VSCODE_BUILD_WEB_MOBILE, true) }}:
        - stage: Mobile
          dependsOn: []
          jobs:
            - template: build/azure-pipelines/web/product-build-web.yml@self
              parameters:
                VSCODE_POOL_NAME: ${{ variables.VSCODE_UBUNTU_POOL }}
                mobile: true
                VSCODE_PRIVILEGED_CONNECTIONS: ${{ variables.VSCODE_PRIVILEGED_CONNECTIONS }}

      - ${{ if eq(variables['VSCODE_PUBLISH'], true) }}:
        - stage: Publish
          dependsOn: []
          jobs:
            - template: build/azure-pipelines/product-publish.yml@self
              parameters:
                VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}
                VSCODE_SCHEDULEDBUILD: ${{ variables.VSCODE_SCHEDULEDBUILD }}
                VSCODE_POOL_NAME: ${{ variables.VSCODE_WINDOWS_POOL }}
                VSCODE_BUILD_WEB_MOBILE: ${{ parameters.VSCODE_BUILD_WEB_MOBILE }}

      - ${{ if and(eq(variables['VSCODE_PUBLISH'], true), parameters.VSCODE_RELEASE, eq(variables['VSCODE_QUALITY'], 'insider'), eq(variables['VSCODE_PRIVATE_BUILD'], false)) }}:
        - stage: ApproveRelease
          dependsOn: [] # run in parallel to compile stage
          pool:
            name: ${{ variables.VSCODE_UBUNTU_POOL }}
            os: linux
          jobs:
            - job: ApproveRelease
              displayName: "Approve Release"
              variables:
                - group: VSCodePeerApproval
                - name: skipComponentGovernanceDetection
                  value: true

        - stage: Release
          dependsOn:
            - Publish
            - ApproveRelease
          pool:
            name: ${{ variables.VSCODE_UBUNTU_POOL }}
            os: linux
          jobs:
            - job: ReleaseBuild
              displayName: Release Build
              steps:
                - template: build/azure-pipelines/product-release.yml@self
                  parameters:
                    VSCODE_RELEASE: ${{ parameters.VSCODE_RELEASE }}

      # Azure rejects empty stages; Web and Mobile have no jobs in this native test matrix.
      - ${{ if and(eq(variables['VSCODE_PUBLISH'], 'true'), or(parameters.VSCODE_BUILD_MACOS, parameters.VSCODE_BUILD_MACOS_ARM64, parameters.VSCODE_BUILD_WIN32, parameters.VSCODE_BUILD_WIN32_ARM64, parameters.VSCODE_BUILD_ALPINE, parameters.VSCODE_BUILD_ALPINE_ARM64, parameters.VSCODE_BUILD_LINUX, parameters.VSCODE_BUILD_LINUX_ARM64, parameters.VSCODE_BUILD_LINUX_ARMHF)) }}:
        - stage: SanityTests
          displayName: Sanity Tests
          dependsOn:
            - Publish
          variables:
            - name: BUILD_COMMIT
              value: $(Build.SourceVersion)
            - name: BUILD_QUALITY
              value: ${{ variables.VSCODE_QUALITY }}
          jobs:
            # macOS
            - ${{ if eq(parameters.VSCODE_BUILD_MACOS, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: macos_x64
                  displayName: macOS x64 (no runtime)
                  poolName: AcesShared
                  os: macOS
                  args: --no-detection --grep "darwin-x64"

            - ${{ if eq(parameters.VSCODE_BUILD_MACOS_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: macos_arm64
                  displayName: macOS arm64
                  poolName: AcesShared
                  os: macOS

            # Windows
            - ${{ if eq(parameters.VSCODE_BUILD_WIN32, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: windows_x64
                  displayName: Windows x64
                  poolName: 1es-windows-2022-x64
                  os: windows

            - ${{ if eq(parameters.VSCODE_BUILD_WIN32_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: windows_arm64
                  displayName: Windows arm64
                  poolName: 1es-windows-2022-arm64
                  os: windows
                  arch: arm64

            # Alpine 3.22
            - ${{ if eq(parameters.VSCODE_BUILD_ALPINE, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: alpine_amd64
                  displayName: Alpine 3.22 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: alpine
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_ALPINE_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: alpine_arm64
                  displayName: Alpine 3.22 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: alpine
                  arch: arm64

            # CentOS Stream 9
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: centos_stream9_amd64
                  displayName: CentOS Stream 9 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: centos
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: centos_stream9_arm64
                  displayName: CentOS Stream 9 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: centos
                  arch: arm64

            # Debian 13
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: debian_13_amd64
                  displayName: Debian 13 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: debian-13
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: debian_13_arm64
                  displayName: Debian 13 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: debian-13
                  arch: arm64

            # Debian 12
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: debian_12_amd64
                  displayName: Debian 12 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: debian-12
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARMHF, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: debian_12_arm32
                  displayName: Debian 12 arm32
                  poolName: 1es-azure-linux-3-arm64
                  container: debian-12
                  arch: arm

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: debian_12_arm64
                  displayName: Debian 12 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: debian-12
                  arch: arm64

            # Fedora 42
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: fedora_42_amd64
                  displayName: Fedora 42 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: fedora-42
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: fedora_42_arm64
                  displayName: Fedora 42 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: fedora-42
                  arch: arm64

            # Fedora 43
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: fedora_43_amd64
                  displayName: Fedora 43 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: fedora-43
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: fedora_43_arm64
                  displayName: Fedora 43 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: fedora-43
                  arch: arm64

            # openSUSE Leap 16.0
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: opensuse_leap_amd64
                  displayName: openSUSE Leap 16.0 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: opensuse
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: opensuse_leap_arm64
                  displayName: openSUSE Leap 16.0 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: opensuse
                  arch: arm64

            # Red Hat UBI 9
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: redhat_ubi9_amd64
                  displayName: Red Hat UBI 9 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: redhat
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: redhat_ubi9_arm64
                  displayName: Red Hat UBI 9 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: redhat
                  arch: arm64

            # Ubuntu 22.04 Native (Snap coverage)
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_native_x64
                  displayName: Ubuntu 22.04 x64 Native
                  poolName: 1es-ubuntu-22.04-x64
                  os: linux
                  ${{ if eq(parameters.VSCODE_BUILD_LINUX_SNAP, false) }}:
                    args: --grep "^(?!desktop-linux-snap-x64$)"

            # Ubuntu 22.04
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_22_04_amd64
                  displayName: Ubuntu 22.04 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: ubuntu-22
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARMHF, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_22_04_arm32
                  displayName: Ubuntu 22.04 arm32
                  poolName: 1es-azure-linux-3-arm64
                  container: ubuntu-22
                  arch: arm

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_22_04_arm64
                  displayName: Ubuntu 22.04 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: ubuntu-22
                  arch: arm64

            # Ubuntu 24.04
            - ${{ if eq(parameters.VSCODE_BUILD_LINUX, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_24_04_amd64
                  displayName: Ubuntu 24.04 amd64
                  poolName: 1es-ubuntu-22.04-x64
                  container: ubuntu-24
                  arch: amd64

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARMHF, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_24_04_arm32
                  displayName: Ubuntu 24.04 arm32
                  poolName: 1es-azure-linux-3-arm64
                  container: ubuntu-24
                  arch: arm

            - ${{ if eq(parameters.VSCODE_BUILD_LINUX_ARM64, true) }}:
              - template: build/azure-pipelines/common/sanity-tests.yml@self
                parameters:
                  name: ubuntu_24_04_arm64
                  displayName: Ubuntu 24.04 arm64
                  poolName: 1es-azure-linux-3-arm64
                  container: ubuntu-24
                  arch: arm64

      # APIScan authenticates through the vscode-apiscan connection, so builds without the privileged connections skip it.
      - ${{ if eq(variables.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
        - stage: APIScan
          dependsOn: []
          pool:
            name: ${{ variables.VSCODE_WINDOWS_POOL }}
            os: windows
          jobs:
            - job: WindowsAPIScan
              steps:
                - template: build/azure-pipelines/win32/sdl-scan-win32.yml@self
                  parameters:
                    VSCODE_ARCH: x64
                    VSCODE_QUALITY: ${{ variables.VSCODE_QUALITY }}

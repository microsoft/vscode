parameters:
  - name: artifact
    type: string

jobs:
  - job: WaitForPublish
    displayName: Wait for ${{ parameters.artifact }}
    pool:
      name: 1es-ubuntu-22.04-x64
      os: linux
    variables:
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      skipComponentGovernanceDetection: true
      Codeql.SkipTaskAutoInjection: true
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
        sparseCheckoutDirectories: build/azure-pipelines/common .nvmrc
        retryCountOnTaskFailure: 3
        displayName: Checkout publish wait script

      - task: NodeTool@0
        inputs:
          versionSource: fromFile
          versionFilePath: .nvmrc

      - script: node build/azure-pipelines/common/waitForArtifacts.ts "--producer=${{ parameters.artifact }}=PublishBuild" ${{ parameters.artifact }}
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: Wait for platform artifacts to publish

parameters:
  - name: jobName
    type: string
  - name: buildJobName
    type: string
    default: ""
  - name: waitForArtifactsArgs
    type: string
    default: ""
  - name: displayName
    type: string
  - name: platform
    type: string
  - name: arch
    type: string
  - name: testName
    type: string
  - name: artifactPrefix
    type: string
  - name: artifacts
    type: object
  - name: keyVaultDisplayName
    type: string
    default: "Azure Key Vault: Get Secrets"
  - name: display
    type: string
    default: ""
  - name: extractArtifactSteps
    type: stepList
    default: []
  - name: setupSteps
    type: stepList
    default: []
  # Steps that must run after Electron/Playwright are downloaded (e.g. patching
  # the freshly-downloaded chrome-sandbox binary) but before the test steps.
  - name: postSetupSteps
    type: stepList
    default: []
  - name: timeoutInMinutes
    type: number
    default: 300
  - name: publishNodeModulesOnFailure
    type: boolean
    default: false
  - name: publishCrashReportsOnFailureOnly
    type: boolean
    default: false
  - name: downloadElectronAndPlaywright
    type: boolean
    default: true
  - name: testSteps
    type: stepList
    default: []

jobs:
  - job: ${{ parameters.jobName }}
    ${{ if ne(parameters.buildJobName, '') }}:
      dependsOn: ${{ parameters.buildJobName }}
    ${{ else }}:
      dependsOn: []
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    variables:
      VSCODE_ARCH: ${{ parameters.arch }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      ${{ if ne(parameters.display, '') }}:
        DISPLAY: ${{ parameters.display }}
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-${{ parameters.platform }}-$(VSCODE_ARCH)-${{ parameters.testName }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          ${{ if eq(parameters.publishCrashReportsOnFailureOnly, true) }}:
            condition: failed()
          ${{ else }}:
            condition: succeededOrFailed()
        - ${{ if eq(parameters.publishNodeModulesOnFailure, true) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-${{ parameters.platform }}-$(VSCODE_ARCH)-${{ parameters.testName }}-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-${{ parameters.platform }}-$(VSCODE_ARCH)-${{ parameters.testName }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      - ${{ if ne(parameters.waitForArtifactsArgs, '') }}:
        - checkout: self
          fetchDepth: 1
          fetchTags: false
          sparseCheckoutDirectories: build/azure-pipelines/common .nvmrc
          retryCountOnTaskFailure: 3
          displayName: Checkout artifact wait script

        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

        - script: node build/azure-pipelines/common/waitForArtifacts.ts ${{ parameters.waitForArtifactsArgs }}
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          displayName: Wait for product test artifacts

      - ${{ else }}:
        - checkout: none

      # These paths must exist for the unconditional crash/log artifact outputs.
      - ${{ if eq(parameters.platform, 'windows') }}:
        - powershell: New-Item -ItemType Directory -Force -Path .build\crashes, .build\logs | Out-Null
          displayName: Ensure artifact directories exist
      - ${{ else }}:
        - script: mkdir -p .build/crashes .build/logs
          displayName: Ensure artifact directories exist

      - ${{ each artifact in parameters.artifacts }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: ${{ parameters.artifactPrefix }}-${{ artifact.name }}
            patterns: "**"
            path: $(Pipeline.Workspace)/${{ parameters.artifactPrefix }}-${{ artifact.name }}
          displayName: ${{ artifact.displayName }}

      - ${{ each step in parameters.extractArtifactSteps }}:
        - ${{ step }}

      - ${{ if eq(parameters.waitForArtifactsArgs, '') }}:
        - task: NodeTool@0
          inputs:
            versionSource: fromFile
            versionFilePath: .nvmrc

      - task: AzureKeyVault@2
        displayName: ${{ parameters.keyVaultDisplayName }}
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - ${{ each step in parameters.setupSteps }}:
        - ${{ step }}

      - ${{ if eq(parameters.downloadElectronAndPlaywright, true) }}:
        - ${{ if eq(parameters.platform, 'windows') }}:
          - powershell: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
            env:
              GITHUB_TOKEN: "$(github-token-code-oss)"
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
            displayName: Download Electron and Playwright
            retryCountOnTaskFailure: 3
        - ${{ else }}:
          - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
            env:
              GITHUB_TOKEN: "$(github-token-code-oss)"
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
            displayName: Download Electron and Playwright
            retryCountOnTaskFailure: 3

      - ${{ each step in parameters.postSetupSteps }}:
        - ${{ step }}

      - ${{ each step in parameters.testSteps }}:
        - ${{ step }}

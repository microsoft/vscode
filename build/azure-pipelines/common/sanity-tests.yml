parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: poolName
    type: string
  - name: os
    type: string
    default: linux
  - name: container
    type: string
    default: ""
  - name: arch
    type: string
    default: amd64
  - name: args
    type: string
    default: ""
  # Build pipeline artifacts to download before running. When set, targets resolve from them
  # instead of the update service, which only serves published builds.
  - name: artifacts
    type: object
    default: []
  - name: continueOnError
    type: boolean
    default: true

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    continueOnError: ${{ parameters.continueOnError }}
    pool:
      name: ${{ parameters.poolName }}
      os: ${{ parameters.os }}
      # ARM32 sanity targets also execute on ARM64 hosts.
      ${{ if in(parameters.arch, 'arm', 'arm64') }}:
        hostArchitecture: arm64
      ${{ else }}:
        hostArchitecture: amd64
      ${{ if eq(parameters.os, 'macOS') }}:
        demands:
          - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    timeoutInMinutes: 30
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(SCREENSHOTS_DIR)
          artifactName: screenshots-${{ parameters.name }}-$(System.JobAttempt)
          displayName: Publish Screenshots
          condition: and(succeededOrFailed(), eq(variables.HAS_SCREENSHOTS, 'true'))
          continueOnError: true
          sbomEnabled: false
        - output: pipelineArtifact
          targetPath: $(CRASH_DUMPS_DIR)
          artifactName: crash-dumps-${{ parameters.name }}-$(System.JobAttempt)
          displayName: Publish Crash Dumps
          condition: and(succeededOrFailed(), eq(variables.HAS_CRASH_DUMPS, 'true'))
          continueOnError: true
          sbomEnabled: false
    variables:
      - name: SANITY_NODE_VERSION_SPEC
        value: 24.x
      # The sanity tests, with only their dependencies, which `pnpm deploy` copies out of the workspace
      # below: a filtered `pnpm install` would also install the root project's dependencies.
      - name: TEST_DIR
        value: $(Build.SourcesDirectory)/.build/sanity
      - name: LOG_FILE
        value: $(TEST_DIR)/results.xml
      - name: SCREENSHOTS_DIR
        value: $(TEST_DIR)/screenshots
      - name: CRASH_DUMPS_DIR
        value: $(TEST_DIR)/crash-dumps
      # Kept under TEST_DIR so container runs see it through the volume run-docker.sh mounts at /root.
      - name: ARTIFACTS_DIR
        value: $(TEST_DIR)/artifacts
      - name: ARTIFACTS_ARG
        ${{ if eq(length(parameters.artifacts), 0) }}:
          value: ""
        ${{ elseif ne(parameters.container, '') }}:
          value: --artifacts-dir /root/artifacts
        ${{ else }}:
          value: --artifacts-dir $(ARTIFACTS_DIR)
      # The pnpm store that the cache below restores (restore-pnpm-store.yml needs more of the
      # repository than this job checks out). The job installs only test/sanity, so pnpm's metadata
      # cache, which saves little here, isn't cached with it.
      - name: PNPM_CONFIG_STORE_DIR
        value: $(Pipeline.Workspace)/pnpm-store
      - name: SETUID_SANDBOX_GREP
        ${{ if or(eq(length(parameters.artifacts), 0), and(contains(join(',', parameters.artifacts), '_deb-package'), contains(join(',', parameters.artifacts), '_rpm-package'))) }}:
          value: desktop-linux-(deb|rpm)-
        ${{ elseif contains(join(',', parameters.artifacts), '_deb-package') }}:
          value: desktop-linux-deb-
        ${{ elseif contains(join(',', parameters.artifacts), '_rpm-package') }}:
          value: desktop-linux-rpm-
        ${{ else }}:
          value: ""
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
        # The root files of the workspace are always checked out; build/npm has the pnpmfile's hooks and
        # the patches of the lockfile.
        sparseCheckoutDirectories: build/azure-pipelines/config build/azure-pipelines/common build/azure-pipelines/win32 build/checksums build/npm test/sanity .nvmrc
        retryCountOnTaskFailure: 3
        displayName: Checkout test/sanity

      - ${{ if and(eq(parameters.os, 'windows'), eq(parameters.arch, 'arm64')) }}:
        - task: NuGetAuthenticate@1
          displayName: Setup NuGet Authentication

        - script: |
            @echo off
            setlocal enabledelayedexpansion

            set "PACKAGE_VERSION=10.0.26100.1"
            set "SDK_VERSION=10.0.26100.0"
            set "EXPECTED_HASH=7e37f35384a7b146730fa67dde243d46b97ce5ca73aaeb1c3141cd812b286395"
            set "SDK_ROOT=$(Agent.TempDirectory)\windows-sdk-build-tools"
            set "SIGNTOOL_ROOT=!SDK_ROOT!\bin\!SDK_VERSION!\arm64"
            set "SIGNTOOL_EXE=!SIGNTOOL_ROOT!\signtool.exe"

            if not exist "!SIGNTOOL_EXE!" (
              if exist "!SDK_ROOT!" rmdir /s /q "!SDK_ROOT!"

              set "SDK_PACKAGE=$(Agent.TempDirectory)\windows-sdk-build-tools.nupkg"
              curl.exe -fsSL --retry 5 --retry-delay 2 --retry-all-errors -u "vscode:%VSS_NUGET_ACCESSTOKEN%" "https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/nuget/v3/flat2/microsoft.windows.sdk.buildtools/!PACKAGE_VERSION!/microsoft.windows.sdk.buildtools.!PACKAGE_VERSION!.nupkg" -o "!SDK_PACKAGE!"

              set "ACTUAL_HASH="
              for /f "skip=1" %%A in ('certutil -hashfile "!SDK_PACKAGE!" SHA256') do if not defined ACTUAL_HASH set "ACTUAL_HASH=%%A"
              if /I not "!ACTUAL_HASH!"=="!EXPECTED_HASH!" (
                echo Hash mismatch for windows-sdk-build-tools.nupkg
                echo   expected: !EXPECTED_HASH!
                echo   actual:   !ACTUAL_HASH!
                del "!SDK_PACKAGE!"
                exit /b 1
              )

              mkdir "!SDK_ROOT!"
              tar -xf "!SDK_PACKAGE!" -C "!SDK_ROOT!"
              del "!SDK_PACKAGE!"
            )

            echo ##vso[task.prependpath]!SIGNTOOL_ROOT!
          displayName: Install SignTool (Windows ARM64)

        # The NuGet access token is only needed to download SignTool. Clear it so
        # that the sanity tests cannot write it to their logs or crash dumps.
        - powershell: echo "##vso[task.setvariable variable=VSS_NUGET_ACCESSTOKEN]"
          displayName: Clear NuGet access token
          condition: always()

      # Resolve the latest release before restoring caches so a new Node.js release gets fresh caches.
      - ${{ if eq(parameters.os, 'windows') }}:
        - powershell: |
            $ErrorActionPreference = 'Stop'
            $sums = & curl.exe -fsSL --connect-timeout 20 --max-time 60 --retry 3 "https://nodejs.org/dist/latest-v$(SANITY_NODE_VERSION_SPEC)/SHASUMS256.txt"
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the latest Node.js release' }
            $match = [regex]::Match(($sums -join "`n"), 'node-v(24\.\d+\.\d+)-')
            if (-not $match.Success) { throw 'No Node.js 24 release found' }
            Write-Host "##vso[task.setvariable variable=SANITY_NODE_VERSION]$($match.Groups[1].Value)"
          displayName: Resolve latest Node.js 24 release

      - ${{ else }}:
        - bash: |
            set -euo pipefail
            sums=$(curl -fsSL --connect-timeout 20 --max-time 60 --retry 3 "https://nodejs.org/dist/latest-v$(SANITY_NODE_VERSION_SPEC)/SHASUMS256.txt")
            version=$(printf '%s\n' "$sums" | sed -n 's/.* node-v\(24\.[0-9]*\.[0-9]*\)-.*/\1/p' | sort -u)
            if [[ ! "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Could not resolve the latest Node.js 24 release' >&2
              exit 1
            fi
            echo "##vso[task.setvariable variable=SANITY_NODE_VERSION]$version"
          displayName: Resolve latest Node.js 24 release

      # Node.js comes from the pipeline cache when possible. nodejs.org stalls from the shared
      # agent pools at times, so the bounded download below is only the fallback.
      - task: Cache@2
        inputs:
          key: '"sanity-node" | "$(SANITY_NODE_VERSION)" | "$(Agent.OS)" | "$(Agent.OSArchitecture)"'
          path: $(Agent.ToolsDirectory)/sanity-node
        displayName: Restore Node.js cache
        retryCountOnTaskFailure: 2
        continueOnError: true

      - ${{ if eq(parameters.os, 'windows') }}:
        - powershell: build/azure-pipelines/common/install-node.ps1 -Version $(SANITY_NODE_VERSION) -InstallDir "$(Agent.ToolsDirectory)/sanity-node"
          displayName: Install Node.js

      - ${{ else }}:
        - bash: bash build/azure-pipelines/common/install-node.sh $(SANITY_NODE_VERSION) "$(Agent.ToolsDirectory)/sanity-node"
          displayName: Install Node.js

      - ${{ if eq(parameters.os, 'macOS') }}:
        - script: node build/azure-pipelines/common/captureDarwinMemory.ts
          displayName: Capture macOS memory before dependency setup
          continueOnError: true

      - task: Cache@2
        inputs:
          key: '"pnpm_store" | "sanity" | "$(Agent.OS)" | "${{ parameters.arch }}" | $(Build.SourcesDirectory)/pnpm-lock.yaml'
          restoreKeys: '"pnpm_store" | "sanity" | "$(Agent.OS)" | "${{ parameters.arch }}"'
          path: $(PNPM_CONFIG_STORE_DIR)
          cacheHitVar: PNPM_STORE_RESTORED
        displayName: Restore pnpm store cache
        retryCountOnTaskFailure: 2
        continueOnError: true

      # Sets the registry and its authentication in the user npm configuration, as the product build
      # jobs do: `npm install -g pnpm` (also on a cache hit) doesn't read a project .npmrc, and these
      # agents can't reach registry.npmjs.org. `pnpm deploy` below uses the same configuration.
      - template: ./install-pnpm.yml@self
        parameters:
          setupRegistry: true
          os: ${{ parameters.os }}

      # Copies test/sanity to TEST_DIR, with its dependencies from the root pnpm-lock.yaml in its own
      # node_modules, so that the container runs, which mount only TEST_DIR, see them too. The
      # dependencies don't build anything.
      - script: pnpm --filter code-oss-dev-sanity-test deploy --frozen-lockfile --ignore-scripts "$(TEST_DIR)"
        workingDirectory: $(Build.SourcesDirectory)
        displayName: Install Dependencies

      - template: ./prune-pnpm-store.yml@self
        parameters:
          os: ${{ parameters.os }}

      # After the deploy, which needs an empty folder.
      - ${{ each artifact in parameters.artifacts }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: ${{ artifact }}
            path: $(ARTIFACTS_DIR)/${{ artifact }}
          retryCountOnTaskFailure: 3
          displayName: Download ${{ artifact }}

      - ${{ if eq(parameters.os, 'windows') }}:
        - script: mkdir "$(SCREENSHOTS_DIR)"
          displayName: Create Screenshots Directory

      - ${{ else }}:
        - bash: mkdir -p "$(SCREENSHOTS_DIR)"
          displayName: Create Screenshots Directory

      - ${{ if eq(parameters.os, 'windows') }}:
        - script: mkdir "$(CRASH_DUMPS_DIR)"
          displayName: Create Crash Dumps Directory

      - ${{ else }}:
        - bash: mkdir -p "$(CRASH_DUMPS_DIR)"
          displayName: Create Crash Dumps Directory

      - script: pnpm run compile
        workingDirectory: $(TEST_DIR)
        displayName: Compile Sanity Tests

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode
          KeyVaultName: vscode-build-secrets
          SecretsFilter: "sanity-tests-account,sanity-tests-password"

      # Windows
      # run-win32.cmd installs the WSL release pinned in build/checksums/wsl.txt on x64
      - ${{ if and(eq(parameters.os, 'windows'), eq(parameters.arch, 'amd64')) }}:
        - task: Cache@2
          inputs:
            key: '"wsl-installer" | "win32-x64" | build/checksums/wsl.txt'
            path: $(Build.SourcesDirectory)/.build/wsl-installer
          displayName: Restore WSL installer cache

      - ${{ if eq(parameters.os, 'windows') }}:
        - script: $(TEST_DIR)/scripts/run-win32.cmd -c $(BUILD_COMMIT) -q $(BUILD_QUALITY) -t $(LOG_FILE) -s $(SCREENSHOTS_DIR) -d $(CRASH_DUMPS_DIR) -v $(ARTIFACTS_ARG) ${{ parameters.args }}
          workingDirectory: $(TEST_DIR)
          displayName: Run Sanity Tests
          env:
            GITHUB_ACCOUNT: $(sanity-tests-account)
            GITHUB_PASSWORD: $(sanity-tests-password)
            WSL_INSTALLER_CACHE_DIR: $(Build.SourcesDirectory)/.build/wsl-installer

      # macOS
      - ${{ if eq(parameters.os, 'macOS') }}:
        - script: node build/azure-pipelines/common/captureDarwinMemory.ts
          displayName: Capture macOS memory before sanity tests
          continueOnError: true

        - bash: node "$(Build.SourcesDirectory)/build/azure-pipelines/common/captureDarwinMemory.ts" -- $(TEST_DIR)/scripts/run-macOS.sh -c $(BUILD_COMMIT) -q $(BUILD_QUALITY) -t $(LOG_FILE) -s $(SCREENSHOTS_DIR) -d $(CRASH_DUMPS_DIR) -v $(ARTIFACTS_ARG) ${{ parameters.args }}
          workingDirectory: $(TEST_DIR)
          displayName: Run Sanity Tests
          env:
            GITHUB_ACCOUNT: $(sanity-tests-account)
            GITHUB_PASSWORD: $(sanity-tests-password)

        - script: node build/azure-pipelines/common/captureDarwinMemory.ts
          displayName: Capture macOS memory after sanity tests
          condition: always()
          continueOnError: true

      # Native Linux host
      - ${{ if and(eq(parameters.container, ''), eq(parameters.os, 'linux')) }}:
        - bash: $(TEST_DIR)/scripts/run-ubuntu.sh -c $(BUILD_COMMIT) -q $(BUILD_QUALITY) -t $(LOG_FILE) -s $(SCREENSHOTS_DIR) -d $(CRASH_DUMPS_DIR) -v $(ARTIFACTS_ARG) ${{ parameters.args }}
          workingDirectory: $(TEST_DIR)
          displayName: Run Sanity Tests
          env:
            GITHUB_ACCOUNT: $(sanity-tests-account)
            GITHUB_PASSWORD: $(sanity-tests-password)

      # Linux Docker container
      - ${{ if ne(parameters.container, '') }}:
        - task: Docker@1
          displayName: Login to Container Registry
          inputs:
            azureSubscriptionEndpoint: vscode
            azureContainerRegistry: vscodehub.azurecr.io
            command: login

        - bash: |
            $(TEST_DIR)/scripts/run-docker.sh \
              --container "${{ parameters.container }}" \
              --arch "${{ parameters.arch }}" \
              --quality "$(BUILD_QUALITY)" \
              --commit "$(BUILD_COMMIT)" \
              --test-results "/root/results.xml" \
              --screenshots-dir "/root/screenshots" \
              --crash-dumps-dir "/root/crash-dumps" \
              --verbose \
              $(ARTIFACTS_ARG) \
              ${{ parameters.args }}
          workingDirectory: $(TEST_DIR)
          displayName: Run Sanity Tests
          env:
            GITHUB_ACCOUNT: $(sanity-tests-account)
            GITHUB_PASSWORD: $(sanity-tests-password)

      # Installed DEB/RPM packages must also work without the user namespace sandbox.
      - ${{ if and(eq(parameters.os, 'linux'), ne(parameters.container, ''), ne(parameters.container, 'alpine'), ne(parameters.arch, 'arm'), ne(variables.SETUID_SANDBOX_GREP, '')) }}:
        - bash: |
            $(TEST_DIR)/scripts/run-docker.sh \
              --container "${{ parameters.container }}" \
              --arch "${{ parameters.arch }}" \
              --quality "$(BUILD_QUALITY)" \
              --commit "$(BUILD_COMMIT)" \
              --test-results "/root/results-setuid.xml" \
              --screenshots-dir "/root/screenshots" \
              --crash-dumps-dir "/root/crash-dumps" \
              --verbose \
              $(ARTIFACTS_ARG) \
              --setuid-sandbox \
              --grep "$(SETUID_SANDBOX_GREP)"
          workingDirectory: $(TEST_DIR)
          displayName: Run DEB/RPM Sanity Tests (Setuid Sandbox)

      - ${{ if eq(parameters.os, 'windows') }}:
        - script: |
            @echo off
            dir /b "$(SCREENSHOTS_DIR)" 2>nul | findstr . >nul
            if %errorlevel%==0 (
              echo ##vso[task.setvariable variable=HAS_SCREENSHOTS]true
            )
            dir /b "$(CRASH_DUMPS_DIR)" 2>nul | findstr . >nul
            if %errorlevel%==0 (
              echo ##vso[task.setvariable variable=HAS_CRASH_DUMPS]true
            )
            exit /b 0
          displayName: Check Screenshots
          condition: succeededOrFailed()

      - ${{ else }}:
        - bash: |
            if [ -n "$(ls -A "$(SCREENSHOTS_DIR)" 2>/dev/null)" ]; then
              echo "##vso[task.setvariable variable=HAS_SCREENSHOTS]true"
            fi
            if [ -n "$(ls -A "$(CRASH_DUMPS_DIR)" 2>/dev/null)" ]; then
              echo "##vso[task.setvariable variable=HAS_CRASH_DUMPS]true"
            fi
          displayName: Check Screenshots
          condition: succeededOrFailed()

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: |
            $(LOG_FILE)
            $(TEST_DIR)/results-setuid.xml
          testRunTitle: ${{ parameters.displayName }}
        displayName: Publish Test Results
        condition: succeededOrFailed()

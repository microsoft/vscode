parameters:
  - name: testId
    type: string
  - name: testStep
    type: step

steps:
  # Step parameters arrive normalized (e.g. `powershell:` as `task: PowerShell@2`),
  # so the test step is copied as is and the checkpoint is recorded by its own step
  - ${{ each pair in parameters.testStep }}:
      ${{ if ne(pair.key, 'condition') }}:
        ${{ pair.key }}: ${{ pair.value }}
    condition: and(${{ coalesce(parameters.testStep.condition, 'succeeded()') }}, ne(variables['TEST_CHECKPOINT_${{ upper(replace(parameters.testId, '-', '_')) }}_HIT'], 'true'))

  - template: ./publish-test-checkpoint.yml@self
    parameters:
      testId: ${{ parameters.testId }}
      # Same condition as the test step, so that the checkpoint is recorded and published whenever the test runs
      condition: and(${{ coalesce(parameters.testStep.condition, 'succeeded()') }}, ne(variables['TEST_CHECKPOINT_${{ upper(replace(parameters.testId, '-', '_')) }}_HIT'], 'true'))

parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-windows-2022-x64

# The dependency installation of product-build-win32-node-modules.yml, with the pnpm store restored
# from the pipeline cache instead of the node_modules folders (see common/restore-pnpm-store.yml).
jobs:
  - job: WindowsPnpmStore_${{ parameters.VSCODE_ARCH }}
    displayName: Windows pnpm store (${{ upper(parameters.VSCODE_ARCH) }})
    pool:
      name: ${{ parameters.VSCODE_POOL_NAME }}
      os: windows
    timeoutInMinutes: 60
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      PNPM_CONFIG_STORE_DIR: $(Pipeline.Workspace)/pnpm-store
      PNPM_CONFIG_CACHE_DIR: $(Pipeline.Workspace)/pnpm-store/cache
    steps:
      - template: ../common/checkout.yml@self

      - template: ../common/setup-node.yml@self
        parameters:
          os: windows

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.x"
          addToPath: true

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - powershell: node build/setup-npm-registry.ts $env:NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      - template: ../common/apply-sdk-canary.yml@self
        parameters:
          windows: true

      - template: ../common/restore-pnpm-store.yml@self
        parameters:
          keyArgs: win32 $(VSCODE_ARCH)
          os: windows

      - template: ../common/install-pnpm.yml@self
        parameters:
          setupRegistry: true
          os: windows

      - powershell: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { pnpm install --frozen-lockfile }
        env:
          npm_config_arch: $(VSCODE_ARCH)
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-token-code-oss)"
          FOUNDRY_LOCAL_SKIP_INSTALL: "1"
        retryCountOnTaskFailure: 5
        displayName: Install dependencies

      - script: node build/azure-pipelines/common/pnpmStoreCache.ts prune
        condition: and(succeeded(), ne(variables.PNPM_STORE_RESTORED, 'true'))
        displayName: Prune pnpm store

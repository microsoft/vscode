parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  # Whether test jobs (see product-build-win32-test.yml) consume the
  # compilation artifact, which then also includes out-build.
  - name: VSCODE_RUN_TESTS
    type: boolean
    default: false
  # Whether to include the steps and jobs that need a privileged service
  # connection (signing, CDN uploads, Copilot test setup). Required: only
  # builds of main and release/* branches pass true.
  - name: VSCODE_PRIVILEGED_CONNECTIONS
    type: boolean
  # Whether a build without the privileged connections still runs the package
  # job, which then publishes the unsigned product artifacts. Only the product
  # build passes true, so that its dev builds can be downloaded.
  - name: VSCODE_PACKAGE_UNSIGNED
    type: boolean
    default: false

# The product is built by the following jobs, so that retrying a failed job
# never repeats the work of the jobs that already succeeded:
#   1. Compile: compiles the client, server and web server builds and
#      publishes them as the compilation_win32_<arch> artifact.
#   2. Package: adds the CLI and the Copilot shim to the builds of the
#      compilation artifact, packages them and publishes the product
#      artifacts. With the privileged connections, it code signs the builds
#      and the setup packages and also publishes the standalone CLI. Without
#      them, it publishes the unsigned packages as unsigned_<artifact>.
# The test jobs are declared next to this template (see
# product-build-win32-test.yml) and depend on the compile job. The package job
# also depends on the CLI job (see product-build-win32-cli.yml), which builds
# the unsigned CLI and Copilot shim in parallel with the compile job, so the
# CLI job must be part of the same stage. The package and test jobs run in
# parallel, but the Publish stage only publishes the x64 product artifacts once
# all Windows_<arch>_Test_<name> jobs have succeeded (see artifactsByGatingJob
# in ../common/publishGate.ts).
jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}_Compile
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/compilation
          artifactName: compilation_win32_$(VSCODE_ARCH)
          displayName: Publish compilation artifact
          sbomEnabled: false
          isProduction: false
          condition: and(succeeded(), ne(variables['COMPILATION_PUBLISHED'], 'true'))
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_win32_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'), ne(variables['AGENT_SDK_TARBALLS_PUBLISHED'], 'true'))
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs/network
          artifactName: network-diagnostics-windows-$(VSCODE_ARCH)-compile-$(System.JobAttempt)
          displayName: Publish network failure diagnostics
          sbomEnabled: false
          isProduction: false
          condition: and(failed(), eq(variables['VSCODE_NETWORK_DIAGNOSTICS_CAPTURED'], 'true'))
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

      # See ./steps/product-build-win32-download-compilation.yml for the consumer
      - powershell: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          $ArtifactPath = "$(Build.ArtifactStagingDirectory)\compilation"
          New-Item -ItemType Directory -Path $ArtifactPath -Force | Out-Null
          Push-Location "$(Agent.BuildDirectory)"
          try {
            exec { 7z.exe a -mx1 "$ArtifactPath\builds.7z" "VSCode-win32-$(VSCODE_ARCH)" "vscode-server-win32-$(VSCODE_ARCH)" "vscode-server-win32-$(VSCODE_ARCH)-web" }
          } finally {
            Pop-Location
          }
        displayName: Archive client, server and web server builds

      # The unit and node.js integration tests run from out-build
      - ${{ if eq(parameters.VSCODE_RUN_TESTS, true) }}:
        - powershell: |
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            exec { 7z.exe a -mx1 "$(Build.ArtifactStagingDirectory)\compilation\out-build.7z" "out-build" }
          displayName: Archive out-build

      # Pipeline artifacts can't be overwritten, so a retry of this job must skip
      # the artifacts that an earlier attempt already published, for example
      # before an injected SDL step hung (see ../common/checkForArtifact.ts)
      - script: >-
          node build/azure-pipelines/common/checkForArtifact.ts
          COMPILATION_PUBLISHED compilation_win32_$(VSCODE_ARCH)
          AGENT_SDK_TARBALLS_PUBLISHED agent_sdk_win32_$(VSCODE_ARCH)_tarballs
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        condition: succeededOrFailed()
        continueOnError: true
        displayName: Check for artifacts published by an earlier attempt

  # Signing needs the ESRP connection, which only builds with the privileged
  # connections may reference. The others package the product unsigned.
  - ${{ if or(eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true), eq(parameters.VSCODE_PACKAGE_UNSIGNED, true)) }}:
    - job: Windows_${{ parameters.VSCODE_ARCH }}_Sign
      ${{ if eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
        displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Package & Sign
      ${{ else }}:
        displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Package
      dependsOn:
        - Windows_${{ parameters.VSCODE_ARCH }}_Compile
        - Windows_${{ parameters.VSCODE_ARCH }}_CLI
      timeoutInMinutes: 90
      cancelTimeoutInMinutes: 10
      variables:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/system-setup/VSCodeSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_setup
            condition: and(succeeded(), ne(variables['SETUP_PUBLISHED'], 'true'))
            displayName: Publish system setup
            sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Windows $(VSCODE_ARCH) System Setup"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/user-setup/VSCodeUserSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_user-setup
            condition: and(succeeded(), ne(variables['USER_SETUP_PUBLISHED'], 'true'))
            displayName: Publish user setup
            sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Windows $(VSCODE_ARCH) User Setup"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/archive/VSCode-win32-$(VSCODE_ARCH)-$(VSCODE_VERSION).zip
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_archive
            condition: and(succeeded(), ne(variables['ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Windows $(VSCODE_ARCH)"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-win32-$(VSCODE_ARCH).zip
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_win32_$(VSCODE_ARCH)_archive
            condition: and(succeeded(), ne(variables['SERVER_ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)
            sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Server"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-win32-$(VSCODE_ARCH)-web.zip
            artifactName: ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_win32_$(VSCODE_ARCH)_archive
            condition: and(succeeded(), ne(variables['WEB_ARCHIVE_PUBLISHED'], 'true'))
            displayName: Publish web server archive
            sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)-web
            sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Web"
            sbomPackageVersion: $(Build.SourceVersion)
            ${{ if ne(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
              sbomEnabled: false
              isProduction: false
          # Without the privileged connections, the CLI job already publishes
          # the standalone CLI as unsigned_vscode_cli_win32_<arch>_cli.
          - ${{ if eq(parameters.VSCODE_PRIVILEGED_CONNECTIONS, true) }}:
            - output: pipelineArtifact
              targetPath: $(Build.ArtifactStagingDirectory)/out/cli/vscode_cli_win32_$(VSCODE_ARCH)_cli.zip
              artifactName: vscode_cli_win32_$(VSCODE_ARCH)_cli
              condition: and(succeeded(), ne(variables['CLI_PUBLISHED'], 'true'))
              displayName: Publish CLI
              sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/cli-standalone
              sbomPackageName: "VS Code Windows $(VSCODE_ARCH) CLI"
              sbomPackageVersion: $(Build.SourceVersion)
        sdl:
          suppression:
            suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
      steps:
        - template: ./steps/product-build-win32-setup.yml@self
          parameters:
            VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}

        - template: ./steps/product-build-win32-download-compilation.yml@self

        - template: ./steps/product-build-win32-sign.yml@self
          parameters:
            VSCODE_PRIVILEGED_CONNECTIONS: ${{ parameters.VSCODE_PRIVILEGED_CONNECTIONS }}

        # Pipeline artifacts can't be overwritten, so a retry of this job must skip
        # the artifacts that an earlier attempt already published, for example
        # before timing out (see ../common/checkForArtifact.ts)
        - script: >-
            node build/azure-pipelines/common/checkForArtifact.ts
            SETUP_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_setup
            USER_SETUP_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_user-setup
            ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_client_win32_$(VSCODE_ARCH)_archive
            SERVER_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_server_win32_$(VSCODE_ARCH)_archive
            WEB_ARCHIVE_PUBLISHED ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, '', 'unsigned_') }}vscode_web_win32_$(VSCODE_ARCH)_archive
            ${{ iif(parameters.VSCODE_PRIVILEGED_CONNECTIONS, 'CLI_PUBLISHED vscode_cli_win32_$(VSCODE_ARCH)_cli', '') }}
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true
          displayName: Check for artifacts published by an earlier attempt

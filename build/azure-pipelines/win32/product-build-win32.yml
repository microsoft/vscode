parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false

jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }})
    timeoutInMinutes: 90
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/system-setup/VSCodeSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_setup
          displayName: Publish system setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) System Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/user-setup/VSCodeUserSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_user-setup
          displayName: Publish user setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) User Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/archive/VSCode-win32-$(VSCODE_ARCH)-$(VSCODE_VERSION).zip
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_archive
          displayName: Publish archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-win32-$(VSCODE_ARCH).zip
          artifactName: vscode_server_win32_$(VSCODE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-win32-$(VSCODE_ARCH)-web.zip
          artifactName: vscode_web_win32_$(VSCODE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)-web
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_win32_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'))
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
          VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
          VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
          VSCODE_RUN_TESTS_IN_PARALLEL: ${{ or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Windows_${{ parameters.VSCODE_ARCH }}_Unit
        displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) Unit Tests
        platform: windows
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: unit
        artifactPrefix: product-tests-windows-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo=Windows_${{ parameters.VSCODE_ARCH }}" product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Windows_${{ parameters.VSCODE_ARCH }}_Integration
        displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) Integration Tests
        platform: windows
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: integration
        artifactPrefix: product-tests-windows-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-app=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-server=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-web=Windows_${{ parameters.VSCODE_ARCH }}" product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo product-tests-windows-${{ parameters.VSCODE_ARCH }}-app product-tests-windows-${{ parameters.VSCODE_ARCH }}-server product-tests-windows-${{ parameters.VSCODE_ARCH }}-web'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
          - name: web
            displayName: Download packaged web server
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-app\app.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of app.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-server\server.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of server.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-web\web.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of web.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace and products
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: Windows_${{ parameters.VSCODE_ARCH }}_Smoke
        displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) Smoke Tests
        platform: windows
        arch: ${{ parameters.VSCODE_ARCH }}
        testName: smoke
        artifactPrefix: product-tests-windows-${{ parameters.VSCODE_ARCH }}
        waitForArtifactsArgs: '"--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-app=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-server=Windows_${{ parameters.VSCODE_ARCH }}" "--producer=product-tests-windows-${{ parameters.VSCODE_ARCH }}-web=Windows_${{ parameters.VSCODE_ARCH }}" product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo product-tests-windows-${{ parameters.VSCODE_ARCH }}-app product-tests-windows-${{ parameters.VSCODE_ARCH }}-server product-tests-windows-${{ parameters.VSCODE_ARCH }}-web'
        timeoutInMinutes: 60
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
          - name: web
            displayName: Download packaged web server
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-app\app.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of app.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-server\server.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of server.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-tests-windows-${{ parameters.VSCODE_ARCH }}-web\web.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of web.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace and products
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
              VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
              VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
              VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}
              VSCODE_TEST_TYPE: Smoke

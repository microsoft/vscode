parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: VSCODE_RUN_REMOTE_TESTS
    type: boolean
    default: false

# The product is built by three jobs, so that retrying a failed job never
# repeats the work of the jobs that already succeeded:
#   1. Compile: compiles the client, server and web server builds and
#      publishes them as the compilation_win32_<arch> artifact.
#   2. Test: tests the builds of the compilation artifact (only when tests run).
#      Retrying it skips the test tasks that already passed in an earlier
#      attempt (see ../common/test-checkpoints.md).
#   3. Sign: code signs the builds of the compilation artifact together with
#      the CLI, packages them and publishes the product artifacts, including
#      the standalone CLI.
# The test job depends on the compile job. The sign job also depends on the
# CLI job (see product-build-win32-cli.yml), which builds the unsigned CLI in
# parallel with the compile job, so the CLI job must be part of the same stage.
jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}_Compile
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/compilation
          artifactName: compilation_win32_$(VSCODE_ARCH)
          displayName: Publish compilation artifact
          sbomEnabled: false
          isProduction: false
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/agent-sdk/tarballs
          artifactName: agent_sdk_win32_$(VSCODE_ARCH)_tarballs
          displayName: Publish agent SDK tarballs
          sbomEnabled: false
          condition: and(succeededOrFailed(), eq(variables['AGENT_SDK_TARBALLS_PRODUCED'], 'true'))
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-compile.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}

      # See ./steps/product-build-win32-download-compilation.yml for the consumer
      - powershell: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          $ArtifactPath = "$(Build.ArtifactStagingDirectory)\compilation"
          New-Item -ItemType Directory -Path $ArtifactPath -Force | Out-Null
          Push-Location "$(Agent.BuildDirectory)"
          try {
            exec { 7z.exe a -mx1 "$ArtifactPath\builds.7z" "VSCode-win32-$(VSCODE_ARCH)" "vscode-server-win32-$(VSCODE_ARCH)" "vscode-server-win32-$(VSCODE_ARCH)-web" }
          } finally {
            Pop-Location
          }
        displayName: Archive client, server and web server builds

      # The unit tests run from out-build
      - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
        - powershell: |
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            exec { 7z.exe a -mx1 "$(Build.ArtifactStagingDirectory)\compilation\out-build.7z" "out-build" }
          displayName: Archive out-build

  - ${{ if or(eq(parameters.VSCODE_RUN_ELECTRON_TESTS, true), eq(parameters.VSCODE_RUN_BROWSER_TESTS, true), eq(parameters.VSCODE_RUN_REMOTE_TESTS, true)) }}:
    - job: Windows_${{ parameters.VSCODE_ARCH }}_Test
      displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Test
      dependsOn: Windows_${{ parameters.VSCODE_ARCH }}_Compile
      timeoutInMinutes: 90
      cancelTimeoutInMinutes: 10
      variables:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-windows-$(VSCODE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: always()
        sdl:
          suppression:
            suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
      steps:
        - template: ./steps/product-build-win32-setup.yml@self
          parameters:
            VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
            VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
            VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
            VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}

        - template: ./steps/product-build-win32-download-compilation.yml@self
          parameters:
            VSCODE_DOWNLOAD_OUT_BUILD: true

        - template: ./steps/product-build-win32-test.yml@self
          parameters:
            VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
            VSCODE_RUN_ELECTRON_TESTS: ${{ parameters.VSCODE_RUN_ELECTRON_TESTS }}
            VSCODE_RUN_BROWSER_TESTS: ${{ parameters.VSCODE_RUN_BROWSER_TESTS }}
            VSCODE_RUN_REMOTE_TESTS: ${{ parameters.VSCODE_RUN_REMOTE_TESTS }}

  - job: Windows_${{ parameters.VSCODE_ARCH }}_Sign
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Sign
    dependsOn:
      - Windows_${{ parameters.VSCODE_ARCH }}_Compile
      - Windows_${{ parameters.VSCODE_ARCH }}_CLI
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/system-setup/VSCodeSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_setup
          displayName: Publish system setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) System Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/user-setup/VSCodeUserSetup-$(VSCODE_ARCH)-$(VSCODE_VERSION).exe
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_user-setup
          displayName: Publish user setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) User Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/archive/VSCode-win32-$(VSCODE_ARCH)-$(VSCODE_VERSION).zip
          artifactName: vscode_client_win32_$(VSCODE_ARCH)_archive
          displayName: Publish archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-win32-$(VSCODE_ARCH).zip
          artifactName: vscode_server_win32_$(VSCODE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-win32-$(VSCODE_ARCH)-web.zip
          artifactName: vscode_web_win32_$(VSCODE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(VSCODE_ARCH)-web
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/cli/vscode_cli_win32_$(VSCODE_ARCH)_cli.zip
          artifactName: vscode_cli_win32_$(VSCODE_ARCH)_cli
          displayName: Publish CLI
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/cli-standalone
          sbomPackageName: "VS Code Windows $(VSCODE_ARCH) CLI"
          sbomPackageVersion: $(Build.SourceVersion)
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-setup.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}

      - template: ./steps/product-build-win32-download-compilation.yml@self

      - template: ./steps/product-build-win32-sign.yml@self

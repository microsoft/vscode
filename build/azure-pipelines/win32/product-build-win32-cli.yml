parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CHECK_ONLY
    type: boolean
    default: false
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-windows-2022-x64

jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}_CLI
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - CLI
    pool:
      name: ${{ parameters.VSCODE_POOL_NAME }}
      os: windows
    timeoutInMinutes: 90
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    steps:
      - template: ../common/checkout.yml@self

      - task: NodeTool@0
        inputs:
          versionSource: fromFile
          versionFilePath: .nvmrc

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get GitHub token"
        inputs:
          azureSubscription: vscode-oss-build-secrets
          KeyVaultName: vscode-oss-build-secrets
          SecretsFilter: "github-token-code-oss"

      - template: ../cli/cli-apply-patches.yml@self

      - task: Npm@1
        displayName: Download openssl prebuilt
        inputs:
          command: custom
          customCommand: pack @vscode-internal/openssl-prebuilt@0.0.11
          customRegistry: useFeed
          customFeed: "Monaco/openssl-prebuilt"
          workingDir: $(Build.ArtifactStagingDirectory)

      - powershell: |
          mkdir $(Build.ArtifactStagingDirectory)/openssl
          tar -xvzf $(Build.ArtifactStagingDirectory)/vscode-internal-openssl-prebuilt-0.0.11.tgz --strip-components=1 --directory=$(Build.ArtifactStagingDirectory)/openssl
        displayName: Extract openssl prebuilt

      - template: ./steps/product-build-win32-install-rust.yml@self
        parameters:
          targets:
            - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              - x86_64-pc-windows-msvc
            - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
              - aarch64-pc-windows-msvc

      - template: ../cli/cli-compile.yml@self
        parameters:
          VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
          ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
            VSCODE_CLI_TARGET: x86_64-pc-windows-msvc
          ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
            VSCODE_CLI_TARGET: aarch64-pc-windows-msvc
          VSCODE_CLI_ARTIFACT: unsigned_vscode_cli_win32_$(VSCODE_ARCH)_cli
          VSCODE_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}
          VSCODE_CLI_ENV:
            OPENSSL_LIB_DIR: $(Build.ArtifactStagingDirectory)/openssl/$(VSCODE_ARCH)-windows-static/lib
            OPENSSL_INCLUDE_DIR: $(Build.ArtifactStagingDirectory)/openssl/$(VSCODE_ARCH)-windows-static/include
            ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT"
            ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT:NO"
            CFLAGS: "/guard:cf /Qspectre"

      # The Windows sign job (see product-build-win32.yml) signs the CLI, adds it
      # to the client build and publishes the standalone vscode_cli_win32_<arch>_cli.
      - ${{ if not(parameters.VSCODE_CHECK_ONLY) }}:
        - template: ../common/publish-artifact.yml@self
          parameters:
            targetPath: $(Build.ArtifactStagingDirectory)/unsigned_vscode_cli_win32_$(VSCODE_ARCH)_cli.zip
            artifactName: unsigned_vscode_cli_win32_$(VSCODE_ARCH)_cli
            displayName: Publish unsigned CLI
            sbomEnabled: false

      - template: ../copilot-shim/copilot-shim-compile.yml@self
        parameters:
          ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
            COPILOT_SHIM_TARGET: x86_64-pc-windows-msvc
          ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
            COPILOT_SHIM_TARGET: aarch64-pc-windows-msvc
          COPILOT_SHIM_ARTIFACT: unsigned_copilot_shim_win32_$(VSCODE_ARCH)
          COPILOT_SHIM_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}
          COPILOT_SHIM_ENV:
            ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT"
            ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT:NO"

      # The Windows sign job adds the Copilot shim to the client and server builds, which signs it.
      - ${{ if not(parameters.VSCODE_CHECK_ONLY) }}:
        - template: ../common/publish-artifact.yml@self
          parameters:
            targetPath: $(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_win32_$(VSCODE_ARCH).zip
            artifactName: unsigned_copilot_shim_win32_$(VSCODE_ARCH)
            displayName: Publish unsigned Copilot shim
            sbomEnabled: false

      - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
        - template: ../copilot-shim/copilot-shim-quality.yml@self

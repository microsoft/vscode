parameters:
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_SUITE
    type: string

jobs:
  - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Electron') }}:
    - template: ../common/product-test-build.yml@self
      parameters:
        jobName: WindowsElectronBuild
        displayName: Electron Build
        platform: windows
        arch: x64
        archiveExt: zip
        artifactPrefix: product-ci-windows-x64-electron
        testIntegration: true
        testSmoke: true
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        compileSteps:
          - template: ./steps/product-build-win32-compile.yml@self
            parameters:
              VSCODE_ARCH: x64
              VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
              VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
        archiveWorkspaceSteps:
          - powershell: |
              . build/azure-pipelines/win32/exec.ps1
              $ErrorActionPreference = "Stop"
              exec { 7z.exe a -tzip "$(Build.ArtifactStagingDirectory)\repo.zip" "$(Build.SourcesDirectory)\*" "-xr!.git" }
            displayName: Archive built workspace for reuse by test jobs
        archiveAppSteps:
          - powershell: |
              . $(Build.SourcesDirectory)/build/azure-pipelines/win32/exec.ps1
              $ErrorActionPreference = "Stop"
              exec { 7z.exe a -tzip $(Build.ArtifactStagingDirectory)\app.zip VSCode-win32-x64 }
            workingDirectory: $(Agent.BuildDirectory)
            displayName: Archive packaged app for reuse by test jobs
        archiveServerSteps:
          - powershell: |
              . $(Build.SourcesDirectory)/build/azure-pipelines/win32/exec.ps1
              $ErrorActionPreference = "Stop"
              exec { 7z.exe a -tzip $(Build.ArtifactStagingDirectory)\server.zip vscode-server-win32-x64 }
            workingDirectory: $(Agent.BuildDirectory)
            displayName: Archive packaged server for reuse by test jobs

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: WindowsElectronUnit
        buildJobName: WindowsElectronBuild
        displayName: Unit Tests
        platform: windows
        arch: x64
        testName: unit
        artifactPrefix: product-ci-windows-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              New-Item -ItemType Directory -Force -Path $(Build.SourcesDirectory) | Out-Null
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: x64
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Unit

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: WindowsElectronIntegration
        buildJobName: WindowsElectronBuild
        displayName: Integration Tests
        platform: windows
        arch: x64
        testName: integration
        artifactPrefix: product-ci-windows-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
          - name: server
            displayName: Download packaged server
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              New-Item -ItemType Directory -Force -Path $(Build.SourcesDirectory) | Out-Null
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-app\app.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of app.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-server\server.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of server.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace, app and server
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: x64
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Integration

    - template: ../common/product-test-job.yml@self
      parameters:
        jobName: WindowsElectronSmoke
        buildJobName: WindowsElectronBuild
        displayName: Smoke Tests
        platform: windows
        arch: x64
        testName: smoke
        artifactPrefix: product-ci-windows-x64-electron
        timeoutInMinutes: 50
        publishNodeModulesOnFailure: true
        publishCrashReportsOnFailureOnly: true
        downloadElectronAndPlaywright: false
        artifacts:
          - name: repo
            displayName: Download built workspace
          - name: app
            displayName: Download packaged app
        extractArtifactSteps:
          - powershell: |
              $ErrorActionPreference = "Stop"
              New-Item -ItemType Directory -Force -Path $(Build.SourcesDirectory) | Out-Null
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-repo\repo.zip -o"$(Build.SourcesDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of repo.zip failed with exit code $LASTEXITCODE" }
              7z.exe x $(Pipeline.Workspace)\product-ci-windows-x64-electron-app\app.zip -o"$(Agent.BuildDirectory)" -y
              if ($LASTEXITCODE -ne 0) { throw "7z extract of app.zip failed with exit code $LASTEXITCODE" }
            displayName: Extract built workspace and app
        testSteps:
          - template: ./steps/product-build-win32-test.yml@self
            parameters:
              VSCODE_ARCH: x64
              VSCODE_RUN_ELECTRON_TESTS: true
              VSCODE_RUN_BROWSER_TESTS: false
              VSCODE_RUN_REMOTE_TESTS: false
              VSCODE_TEST_TYPE: Smoke

  - ${{ else }}:
    - job: Windows${{ parameters.VSCODE_TEST_SUITE }}
      displayName: ${{ parameters.VSCODE_TEST_SUITE }} Tests
      timeoutInMinutes: 50
      variables:
        VSCODE_ARCH: x64
        BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      templateContext:
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: true
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
      steps:
        - template: ./steps/product-build-win32-compile.yml@self
          parameters:
            VSCODE_ARCH: x64
            VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
            VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Browser') }}:
              VSCODE_RUN_BROWSER_TESTS: true
            ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Remote') }}:
              VSCODE_RUN_REMOTE_TESTS: true

parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_IDS
    type: object
    default: []
  - name: VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL
    type: boolean
    default: false

steps:
  - template: product-build-win32-setup.yml@self
    parameters:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
      VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL: ${{ parameters.VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL }}
      VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

  # Start pulling the CG-generated NOTICE from the parallel Quality stage
  # in the background (overwrites repo-root ThirdPartyNotices.txt before packaging).
  # Publish builds only (CIBUILD=false) — CI test jobs never ship a notice.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - pwsh: npx deemon --detach --wait -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Pull CG NOTICE (background)

  - template: ../../common/install-builtin-extensions.yml@self

  - powershell: node build/npm/electronTypes.ts
    displayName: Prepare Electron types

  - template: ../../common/agent-sdk-produce.yml@self
    parameters:
      vscodePlatform: win32

  - template: ../../common/dictation-runtime-produce.yml@self
    parameters:
      vscodePlatform: win32

  - pwsh: npx deemon --detach --wait -- node build/azure-pipelines/common/downloadCopilotVsix.ts
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Download Copilot VSIX (background)

  - template: ../../common/mixin-vscode-capi.yml@self

  - powershell: npm run gulp core-ci
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
    displayName: Compile

  - script: node build/azure-pipelines/common/extract-telemetry.ts
    displayName: Generate lists of telemetry events

  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - powershell: |
        npm run copy-policy-dto --prefix build
        node build\lib\policies\policyGenerator.ts build\lib\policies\policyData.jsonc win32
      displayName: Generate Group Policy definitions
      retryCountOnTaskFailure: 3

  - ${{ if and(ne(parameters.VSCODE_CIBUILD, true), ne(parameters.VSCODE_QUALITY, 'exploration')) }}:
    - powershell: node build/win32/explorer-dll-fetcher.ts .build/win32/appx
      displayName: Download Explorer dll

  - pwsh: npx deemon --attach -- node build/azure-pipelines/common/downloadCopilotVsix.ts
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Download Copilot VSIX

  # Block on the CG NOTICE download and overwrite ThirdPartyNotices.txt
  # right before gulp packages it. Non-fatal: falls back to legacy on any problem.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - pwsh: npx deemon --attach -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Apply CG NOTICE
      # deemon --attach can exit non-zero if the background daemon died; never fail for that.
      continueOnError: true

  - powershell: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      # Add Windows SDK to PATH for patchWin32DependenciesTask signtool usage.
      $sdk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
      $env:PATH = "$sdk;$env:PATH"
      exec { npm run gulp "vscode-win32-$(VSCODE_ARCH)-min-ci" }
      exec { npm run gulp "vscode-win32-$(VSCODE_ARCH)-inno-updater" }
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build client

  # Note: the appx prepare step has to follow Build client step since build step replaces the template
  # strings in the raw manifest file at resources/win32/appx/AppxManifest.xml and places it under
  # <build-out-dir>/appx/manifest, we need a separate step to prepare the appx package with the
  # final contents. In our case only the manifest file is bundled into the appx package.
  - ${{ if and(ne(parameters.VSCODE_CIBUILD, true), ne(parameters.VSCODE_QUALITY, 'exploration')) }}:
    - powershell: |
        . build/azure-pipelines/win32/exec.ps1
        $ErrorActionPreference = "Stop"
        # Add Windows SDK to path
        $sdk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
        $env:PATH = "$sdk;$env:PATH"
        $AppxName = if ('$(VSCODE_QUALITY)' -eq 'stable') { 'code' } else { 'code_insider' }
        makeappx pack /d "$(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)/appx/manifest" /p "$(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)/appx/${AppxName}_$(VSCODE_ARCH).appx" /nv
        # Remove the raw manifest folder
        Remove-Item -Path "$(Agent.BuildDirectory)/VSCode-win32-$(VSCODE_ARCH)/appx/manifest" -Recurse -Force
      displayName: Prepare appx package

  - powershell: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      # Add Windows SDK to PATH for patchWin32DependenciesTask signtool usage.
      $sdk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
      $env:PATH = "$sdk;$env:PATH"
      exec { npm run gulp "vscode-reh-win32-$(VSCODE_ARCH)-min-ci" }
      mv ..\vscode-reh-win32-$(VSCODE_ARCH) ..\vscode-server-win32-$(VSCODE_ARCH) # TODO@joaomoreno
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build server

  # Compile-only CI jobs, such as flaky-smoke builds, also check the packaged host.
  - ${{ if and(eq(parameters.VSCODE_ARCH, 'x64'), or(ne(parameters.VSCODE_CIBUILD, true), eq(length(parameters.VSCODE_TEST_IDS), 0), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'))) }}:
    - powershell: node build/azure-pipelines/common/smokeTestAgentHost.ts "$(Agent.BuildDirectory)\vscode-server-win32-$(VSCODE_ARCH)"
      displayName: 🧪 Smoke test packaged Agent Host

  - powershell: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      # Add Windows SDK to PATH for patchWin32DependenciesTask signtool usage.
      $sdk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
      $env:PATH = "$sdk;$env:PATH"
      exec { npm run gulp "vscode-reh-web-win32-$(VSCODE_ARCH)-min-ci" }
      mv ..\vscode-reh-web-win32-$(VSCODE_ARCH) ..\vscode-server-win32-$(VSCODE_ARCH)-web # TODO@joaomoreno
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build server (web)

  - ${{ if gt(length(parameters.VSCODE_TEST_IDS), 0) }}:
    - template: product-build-win32-test.yml@self
      parameters:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

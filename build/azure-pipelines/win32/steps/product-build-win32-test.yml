parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_TEST_IDS
    type: object
    default: []
  # Whether this run's Linux x64 compile job publishes the compilation_linux_x64 artifact, whose server the WSL
  # Kerberos proxy smoke tests use to open an editor window with this build's client.
  - name: VSCODE_LINUX_X64_COMPILATION_ARTIFACT
    type: boolean
    default: false
  # Reruns failed unit, Agent Host E2E and node.js integration tests, like the
  # pull request workflows do (the extension host suites are not rerun). Only
  # the product build test jobs set it.
  - name: VSCODE_RERUN_FAILED_TESTS
    type: boolean
    default: false

# Each test task records a checkpoint once it passes, and retries of the job
# skip the test tasks that already passed in an earlier attempt of the same
# run (see ../../common/test-checkpoints.md).
steps:
  - template: ../../common/restore-test-checkpoints.yml@self

  - powershell: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      exec { pnpm -C test/smoke run compile }
      exec { pnpm -C test/integration/browser run compile }
    displayName: Compile test suites (non-OSS)
    condition: and(succeeded(), eq(variables['VSCODE_STEP_ON_IT'], 'false'))

  - template: ../../common/restore-playwright-browsers.yml@self

  - powershell: pnpm exec npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Download Electron and Playwright
    retryCountOnTaskFailure: 3

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'unit-electron') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: unit-electron
        testStep:
          powershell: .\scripts\test.bat --build --tfs "Unit Tests"${{ iif(eq(parameters.VSCODE_RERUN_FAILED_TESTS, true), ' --rerun-failed-files 2', '') }}
          env:
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run unit tests (Electron)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'unit-node') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: unit-node
        testStep:
          powershell: |
            New-Item -ItemType Directory -Force -Path .build\crashes | Out-Null
            pnpm run test-node --build${{ iif(eq(parameters.VSCODE_RERUN_FAILED_TESTS, true), ' --rerun-failed-files 2', '') }}
          env:
            NODE_OPTIONS: "--report-on-fatalerror --report-uncaught-exception --report-directory=.build/crashes"
          displayName: 🧪 Run unit tests (node.js)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'unit-browser-chromium') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: unit-browser-chromium
        testStep:
          powershell: pnpm run test-browser-no-install --build --browser chromium --tfs "Browser Unit Tests"${{ iif(eq(parameters.VSCODE_RERUN_FAILED_TESTS, true), ' --rerun-failed-files 2', '') }}
          displayName: 🧪 Run unit tests (Browser, Chromium)
          timeoutInMinutes: 30

  - powershell: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      exec { pnpm run gulp `
        compile-extension:configuration-editing `
        compile-extension:css-language-features-server `
        compile-extension:emmet `
        compile-extension:git `
        compile-extension:git-base `
        compile-extension:github-authentication `
        compile-extension:html-language-features-server `
        compile-extension:ipynb `
        compile-extension:notebook-renderers `
        compile-extension:json-language-features-client `
        compile-extension:json-language-features-server `
        compile-extension:markdown-language-features `
        compile-extension-media `
        compile-extension:microsoft-authentication `
        compile-extension:typescript-language-features `
        compile-extension:vscode-api-tests `
        compile-extension:vscode-colorize-tests `
        compile-extension:vscode-colorize-perf-tests `
        compile-extension:vscode-test-resolver `
      }
    displayName: Build integration tests

  - powershell: .\build\azure-pipelines\win32\listprocesses.bat
    displayName: Diagnostics before integration test runs
    continueOnError: true
    condition: succeededOrFailed()

  - powershell: |
      # Copy client, server and web builds to a separate test directory, to avoid Access Denied errors in codesign
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      $TestDir = "$(agent.builddirectory)\test"
      New-Item -ItemType Directory -Path $TestDir -Force
      Copy-Item -Path "$(agent.builddirectory)\VSCode-win32-$(VSCODE_ARCH)" -Destination "$TestDir\VSCode-win32-$(VSCODE_ARCH)" -Recurse -Force
      Copy-Item -Path "$(agent.builddirectory)\vscode-server-win32-$(VSCODE_ARCH)" -Destination "$TestDir\vscode-server-win32-$(VSCODE_ARCH)" -Recurse -Force
      Copy-Item -Path "$(agent.builddirectory)\vscode-server-win32-$(VSCODE_ARCH)-web" -Destination "$TestDir\vscode-server-win32-$(VSCODE_ARCH)-web" -Recurse -Force
    displayName: Copy builds to test directory

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'integration-agent-host-e2e') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: integration-agent-host-e2e
        testStep:
          powershell: |
            # Figure out the full absolute path of the product we just built
            # including the remote server and configure the integration tests
            # to run with these builds instead of running out of sources.
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            $AppRoot = "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
            $ProductJsonPath = (Get-ChildItem -Path "$AppRoot" -Name "product.json" -Recurse | Select-Object -First 1)
            $AppProductJson = Get-Content -Raw -Path "$AppRoot\$ProductJsonPath" | ConvertFrom-Json
            $AppNameShort = $AppProductJson.nameShort
            $env:INTEGRATION_TEST_ELECTRON_PATH = "$AppRoot\$AppNameShort.exe"
            $env:VSCODE_REMOTE_SERVER_PATH = "$(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)"
            exec { .\scripts\test-agent-host-e2e.bat --build --tfs "Integration Tests"${{ iif(eq(parameters.VSCODE_RERUN_FAILED_TESTS, true), ' --rerun-failed-files 2', '') }} }
          env:
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run Agent Host E2E tests (Electron)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'integration-electron') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: integration-electron
        testStep:
          powershell: |
            # Figure out the full absolute path of the product we just built
            # including the remote server and configure the integration tests
            # to run with these builds instead of running out of sources.
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            $AppRoot = "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
            $ProductJsonPath = (Get-ChildItem -Path "$AppRoot" -Name "product.json" -Recurse | Select-Object -First 1)
            $AppProductJson = Get-Content -Raw -Path "$AppRoot\$ProductJsonPath" | ConvertFrom-Json
            $AppNameShort = $AppProductJson.nameShort
            $env:INTEGRATION_TEST_ELECTRON_PATH = "$AppRoot\$AppNameShort.exe"
            $env:VSCODE_REMOTE_SERVER_PATH = "$(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)"
            exec { .\scripts\test-integration.bat --build --tfs "Integration Tests"${{ iif(eq(parameters.VSCODE_RERUN_FAILED_TESTS, true), ' --rerun-failed-files 2', '') }} }
          env:
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run integration tests (Electron)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'integration-browser-firefox') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: integration-browser-firefox
        testStep:
          powershell: |
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            $env:VSCODE_REMOTE_SERVER_PATH = "$(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)-web"
            exec { .\scripts\test-web-integration.bat --browser firefox }
          displayName: 🧪 Run integration tests (Browser, Firefox)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'integration-remote') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: integration-remote
        testStep:
          powershell: |
            . build/azure-pipelines/win32/exec.ps1
            $ErrorActionPreference = "Stop"
            $AppRoot = "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
            $ProductJsonPath = (Get-ChildItem -Path "$AppRoot" -Name "product.json" -Recurse | Select-Object -First 1)
            $AppProductJson = Get-Content -Raw -Path "$AppRoot\$ProductJsonPath" | ConvertFrom-Json
            $AppNameShort = $AppProductJson.nameShort
            $env:INTEGRATION_TEST_ELECTRON_PATH = "$AppRoot\$AppNameShort.exe"
            $env:VSCODE_REMOTE_SERVER_PATH = "$(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)"
            exec { .\scripts\test-remote-integration.bat }
          env:
            VSCODE_SKIP_PRELAUNCH: '1'
          displayName: 🧪 Run integration tests (Remote)
          timeoutInMinutes: 30

  - powershell: .\build\azure-pipelines\win32\listprocesses.bat
    displayName: Diagnostics after integration test runs
    continueOnError: true
    condition: succeededOrFailed()

  - ${{ if or(containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-wsl-kerberos-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}:
    - powershell: .\build\azure-pipelines\win32\listprocesses.bat
      displayName: Diagnostics before smoke test run
      continueOnError: true
      condition: succeededOrFailed()

  # The WSL Dev Container setup only serves the Electron and WSL Kerberos proxy smoke tests, so it is skipped together
  # with them when they already passed in this run.
  - ${{ if and(eq(parameters.VSCODE_ARCH, 'x64'), or(containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-wsl-kerberos-proxy'))) }}:
    - task: Cache@2
      displayName: Restore WSL installer cache
      inputs:
        key: '"wsl-installer" | "win32-x64" | build/checksums/wsl.txt'
        path: $(Build.SourcesDirectory)/.build/wsl-installer
      condition: and(succeeded(), or(ne(variables['TEST_CHECKPOINT_SMOKE_ELECTRON_HIT'], 'true'), ne(variables['TEST_CHECKPOINT_SMOKE_WSL_KERBEROS_PROXY_HIT'], 'true')))
      retryCountOnTaskFailure: 2

    - pwsh: .\test\smoke\wslDevContainer.ps1 -CI AzureDevOps
      displayName: Prepare WSL Dev Container smoke tests
      timeoutInMinutes: 15
      env:
        WSL_INSTALLER_CACHE_DIR: $(Build.SourcesDirectory)/.build/wsl-installer
      condition: and(succeeded(), or(ne(variables['TEST_CHECKPOINT_SMOKE_ELECTRON_HIT'], 'true'), ne(variables['TEST_CHECKPOINT_SMOKE_WSL_KERBEROS_PROXY_HIT'], 'true')))

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: smoke-electron
        testStep:
          powershell: |
            pnpm run smoketest-no-compile --tracing --build "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
          env:
            VSCODE_SMOKE_TEST_POLICY: '1'
            ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              VSCODE_SMOKE_TEST_WSL_REQUIRED: '1'
              VSCODE_SMOKE_TEST_WSL_DISTRO: $(WSL_SMOKE_DISTRO)
              VSCODE_SMOKE_TEST_WSL_SERVER_PATH: $(WSL_SMOKE_SERVER_PATH)
          displayName: 🧪 Run smoke tests (Electron)
          timeoutInMinutes: 30

  # The packaged client can only open an editor window on a server of its own commit, so the editor window suite runs
  # with the Linux server of this run's Linux x64 compile job, and only the Agents Window suite runs without one. The
  # script configures a test Kerberos realm, CA and PAC on the elevated agent and reverts them.
  - ${{ if and(eq(parameters.VSCODE_ARCH, 'x64'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-wsl-kerberos-proxy')) }}:
    - ${{ if eq(parameters.VSCODE_LINUX_X64_COMPILATION_ARTIFACT, true) }}:
      - powershell: node build/azure-pipelines/common/waitForArtifacts.ts "--producer=compilation_linux_x64=Linux (X64) - Compile"
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: Wait for the Linux x64 compilation artifact
        timeoutInMinutes: 65
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_SMOKE_WSL_KERBEROS_PROXY_HIT'], 'true'))

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: compilation_linux_x64
          patterns: builds.tar.gz
          path: $(Agent.TempDirectory)/compilation-linux-x64
        displayName: Download the Linux x64 compilation artifact
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_SMOKE_WSL_KERBEROS_PROXY_HIT'], 'true'))

      - pwsh: .\test\smoke\wslDevContainer.ps1 -CI AzureDevOps -Operation AddServer -Distribution $env:WSL_SMOKE_DISTRO -Archive "$(Agent.TempDirectory)\compilation-linux-x64\builds.tar.gz"
        displayName: Add the Linux x64 server to the WSL distribution
        timeoutInMinutes: 15
        env:
          WSL_SMOKE_DISTRO: $(WSL_SMOKE_DISTRO)
        condition: and(succeeded(), ne(variables['TEST_CHECKPOINT_SMOKE_WSL_KERBEROS_PROXY_HIT'], 'true'))

    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: smoke-wsl-kerberos-proxy
        testStep:
          pwsh: .\test\smoke\scripts\run-agents-window-wsl-kerberos-proxy.ps1 -Distribution $env:WSL_SMOKE_DISTRO -WslServerPath $env:WSL_KERBEROS_SERVER_PATH -Suites $env:WSL_KERBEROS_SUITES --build "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)" --skip-stable-build
          env:
            WSL_SMOKE_DISTRO: $(WSL_SMOKE_DISTRO)
            ${{ if eq(parameters.VSCODE_LINUX_X64_COMPILATION_ARTIFACT, true) }}:
              WSL_KERBEROS_SERVER_PATH: $(WSL_SMOKE_BUILD_SERVER_PATH)
              WSL_KERBEROS_SUITES: All
            ${{ else }}:
              WSL_KERBEROS_SERVER_PATH: $(WSL_SMOKE_SERVER_PATH)
              WSL_KERBEROS_SUITES: AgentsWindow
          displayName: 🧪 Run WSL Kerberos proxy smoke tests (Electron)
          timeoutInMinutes: 30

  - ${{ if and(eq(parameters.VSCODE_ARCH, 'x64'), or(containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-wsl-kerberos-proxy'))) }}:
    - pwsh: .\test\smoke\wslDevContainer.ps1 -CI AzureDevOps -Operation Cleanup -Distribution $env:WSL_SMOKE_DISTRO -Root $env:WSL_SMOKE_ROOT
      displayName: Clean up WSL Dev Container smoke tests
      condition: and(always(), ne(variables['WSL_SMOKE_ROOT'], ''))
      timeoutInMinutes: 5
      env:
        WSL_SMOKE_DISTRO: $(WSL_SMOKE_DISTRO)
        WSL_SMOKE_ROOT: $(WSL_SMOKE_ROOT)

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: smoke-browser-chromium
        testStep:
          powershell: pnpm run smoketest-no-compile --web --tracing --headless
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)-web
          displayName: 🧪 Run smoke tests (Browser, Chromium)
          timeoutInMinutes: 30

  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote') }}:
    - template: ../../common/run-test-with-checkpoint.yml@self
      parameters:
        testId: smoke-remote
        testStep:
          powershell: pnpm run smoketest-no-compile --tracing --remote --build "$(agent.builddirectory)\test\VSCode-win32-$(VSCODE_ARCH)"
          env:
            VSCODE_REMOTE_SERVER_PATH: $(agent.builddirectory)\test\vscode-server-win32-$(VSCODE_ARCH)
          displayName: 🧪 Run smoke tests (Remote)
          timeoutInMinutes: 30

  - ${{ if or(containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-wsl-kerberos-proxy'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-browser-chromium'), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-remote')) }}:
    - powershell: .\build\azure-pipelines\win32\listprocesses.bat
      displayName: Diagnostics after smoke test run
      continueOnError: true
      condition: succeededOrFailed()

  # The copilot ID runs all three checkpointed Copilot tests with shared setup.
  - ${{ if containsValue(parameters.VSCODE_TEST_IDS, 'copilot') }}:
    - template: ../../copilot/test-integration-steps.yml@self
      parameters:
        OS: win32

  - powershell: node build/azure-pipelines/common/testCheckpoint.ts collect-results
    displayName: Check test output availability
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: Publish Tests Results
    inputs:
      testResultsFiles: "*-results.xml"
      searchFolder: "$(Build.ArtifactStagingDirectory)/test-results"
    # All test tasks may have been skipped in a retry of the job
    condition: and(succeededOrFailed(), eq(variables['TEST_CHECKPOINT_RESULTS_AVAILABLE'], 'true'))

  # Force-kill any lingering test processes that still hold smoke-test log
  # files open and would otherwise break the 1ES "Publish Log Files" output.
  - powershell: |
      $ErrorActionPreference = "Continue"
      $testRoot = "$(agent.builddirectory)\test"
      Get-CimInstance Win32_Process -Filter "ExecutablePath IS NOT NULL" -ErrorAction SilentlyContinue |
        Where-Object { $_.ExecutablePath -like "$testRoot\*" } |
        ForEach-Object {
          Write-Host "Killing lingering test process: pid=$($_.ProcessId), name=$($_.Name), path=$($_.ExecutablePath)"
          try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }
          catch { Write-Host "  failed: $($_.Exception.Message)" }
        }
      # Processes that run from elsewhere, such as a git.exe started by an extension host, can hold the log files too
      & "$(Build.SourcesDirectory)\build\azure-pipelines\win32\stop-log-file-holders.ps1" -Path "$(Build.SourcesDirectory)\.build\logs"
    displayName: Kill lingering test processes
    continueOnError: true
    condition: always()

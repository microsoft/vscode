steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      artifact: unsigned_copilot_shim_win32_$(VSCODE_ARCH)
      patterns: unsigned_copilot_shim_win32_$(VSCODE_ARCH).zip
      path: $(Build.ArtifactStagingDirectory)/copilot-shim-download
    displayName: Download unsigned Copilot shim

  - pwsh: |
      $ErrorActionPreference = "Stop"
      $ArchivePath = "$(Build.ArtifactStagingDirectory)/copilot-shim-download/unsigned_copilot_shim_win32_$(VSCODE_ARCH).zip"
      $SigningDirectory = "$(Build.ArtifactStagingDirectory)/copilot-shim-signing"
      New-Item -ItemType Directory -Force -Path $SigningDirectory | Out-Null
      Expand-Archive -LiteralPath $ArchivePath -DestinationPath $SigningDirectory

      $Entries = @(Get-ChildItem -LiteralPath $SigningDirectory)
      if ($Entries.Count -ne 1 -or $Entries[0].Name -ne "copilot.exe" -or $Entries[0].PSIsContainer -or $Entries[0].Length -eq 0) {
        throw "Unsigned Copilot shim archive must contain exactly one non-empty root copilot.exe"
      }
    displayName: Extract and validate unsigned Copilot shim

  - task: NodeTool@0
    inputs:
      versionSource: fromFile
      versionFilePath: .nvmrc

  - task: UseDotNet@2
    inputs:
      version: 6.x

  - task: EsrpCodeSigning@6
    inputs:
      UseMSIAuthentication: true
      ConnectedServiceName: vscode-esrp
      AppRegistrationClientId: $(ESRP_CLIENT_ID)
      AppRegistrationTenantId: $(ESRP_TENANT_ID)
      AuthAKVName: vscode-esrp
      AuthSignCertName: esrp-sign
      FolderPath: .
      Pattern: noop
    displayName: 'Install ESRP Tooling'

  - pwsh: |
      $ErrorActionPreference = "Stop"
      $EsrpCodeSigningTool = (Get-ChildItem -Directory -Filter EsrpCodeSigning_* "$(Agent.RootDirectory)/_tasks" | Select-Object -Last 1).FullName
      $Version = (Get-ChildItem -Directory $EsrpCodeSigningTool | Select-Object -Last 1).FullName
      Write-Host "##vso[task.setvariable variable=EsrpCliDllPath]$Version/net6.0/esrpcli.dll"
    displayName: Find ESRP CLI

  - pwsh: |
      . build/azure-pipelines/win32/exec.ps1
      $ErrorActionPreference = "Stop"
      exec { node build/azure-pipelines/common/sign.ts "$(EsrpCliDllPath)" sign-windows "$(Build.ArtifactStagingDirectory)/copilot-shim-signing" "copilot.exe" }
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: ✍️ Codesign Copilot shim

  - pwsh: |
      $ErrorActionPreference = "Stop"
      $ExecutablePath = "$(Build.ArtifactStagingDirectory)/copilot-shim-signing/copilot.exe"
      $Signature = Get-AuthenticodeSignature -LiteralPath $ExecutablePath
      if ($Signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
        throw "Copilot shim Authenticode signature is not valid: $($Signature.Status) - $($Signature.StatusMessage)"
      }
    displayName: Verify Copilot shim signature

  - pwsh: |
      $ErrorActionPreference = "Stop"
      $SigningDirectory = "$(Build.ArtifactStagingDirectory)/copilot-shim-signing"
      $SigningEntries = @(Get-ChildItem -LiteralPath $SigningDirectory)
      if ($SigningEntries.Count -ne 1 -or $SigningEntries[0].Name -ne "copilot.exe" -or $SigningEntries[0].PSIsContainer -or $SigningEntries[0].Length -eq 0) {
        throw "Signed Copilot shim staging must contain exactly one non-empty root copilot.exe"
      }

      $PackageDirectory = "$(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH)"
      New-Item -ItemType Directory -Force -Path $PackageDirectory | Out-Null
      Copy-Item -LiteralPath "$SigningDirectory/copilot.exe" -Destination "$PackageDirectory/copilot.exe"
    displayName: Stage signed Copilot shim

  - task: ArchiveFiles@2
    displayName: Archive signed Copilot shim
    inputs:
      rootFolderOrFile: $(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH)/copilot.exe
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH).zip

  - pwsh: |
      $ErrorActionPreference = "Stop"
      $ArchivePath = "$(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH).zip"
      Add-Type -AssemblyName System.IO.Compression.FileSystem
      $Archive = [System.IO.Compression.ZipFile]::OpenRead($ArchivePath)
      try {
        $Entries = @($Archive.Entries)
        if ($Entries.Count -ne 1 -or $Entries[0].FullName -ne "copilot.exe" -or $Entries[0].Length -eq 0) {
          throw "Signed Copilot shim archive must contain exactly one non-empty root copilot.exe"
        }
      } finally {
        $Archive.Dispose()
      }
    displayName: Validate signed Copilot shim archive

  - template: ../../common/publish-artifact.yml@self
    parameters:
      targetPath: $(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH).zip
      artifactName: copilot_shim_win32_$(VSCODE_ARCH)
      displayName: Publish signed Copilot shim
      sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/copilot_shim_win32_$(VSCODE_ARCH)
      sbomPackageName: "VS Code Copilot Shim Windows $(VSCODE_ARCH)"
      sbomPackageVersion: $(Build.SourceVersion)

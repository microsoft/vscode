parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CHECK_ONLY
    type: boolean
    default: false
  - name: VSCODE_POOL_NAME
    type: string
    default: 1es-windows-2022-x64

jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}_CopilotShim
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Copilot Shim
    pool:
      name: ${{ parameters.VSCODE_POOL_NAME }}
      os: windows
    timeoutInMinutes: 90
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
    steps:
      - template: ../common/checkout.yml@self

      - template: ./steps/product-build-win32-install-rust.yml@self
        parameters:
          targets:
            - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
              - x86_64-pc-windows-msvc
            - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
              - aarch64-pc-windows-msvc

      - script: rustup component add rustfmt clippy
        displayName: Install Rust quality components
        condition: and(succeeded(), eq(variables['CARGO_REGISTRY'], 'none'))

      - template: ../copilot-shim/copilot-shim-quality.yml@self

      - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
        - template: ../copilot-shim/copilot-shim-compile.yml@self
          parameters:
            COPILOT_SHIM_TARGET: x86_64-pc-windows-msvc
            COPILOT_SHIM_ARTIFACT: unsigned_copilot_shim_win32_x64
            COPILOT_SHIM_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}
            COPILOT_SHIM_ENV:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT"

      - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
        - template: ../copilot-shim/copilot-shim-compile.yml@self
          parameters:
            COPILOT_SHIM_TARGET: aarch64-pc-windows-msvc
            COPILOT_SHIM_ARTIFACT: unsigned_copilot_shim_win32_arm64
            COPILOT_SHIM_CHECK_ONLY: ${{ parameters.VSCODE_CHECK_ONLY }}
            COPILOT_SHIM_ENV:
              RUSTFLAGS: "-Ctarget-feature=+crt-static -Clink-args=/guard:cf -Clink-args=/CETCOMPAT:NO"

      - ${{ if not(parameters.VSCODE_CHECK_ONLY) }}:
        - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
          - template: ../common/publish-artifact.yml@self
            parameters:
              targetPath: $(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_win32_x64.zip
              artifactName: unsigned_copilot_shim_win32_x64
              displayName: Publish unsigned Copilot shim
              sbomEnabled: false
        - ${{ if eq(parameters.VSCODE_ARCH, 'arm64') }}:
          - template: ../common/publish-artifact.yml@self
            parameters:
              targetPath: $(Build.ArtifactStagingDirectory)/unsigned_copilot_shim_win32_arm64.zip
              artifactName: unsigned_copilot_shim_win32_arm64
              displayName: Publish unsigned Copilot shim
              sbomEnabled: false

  - ${{ if not(parameters.VSCODE_CHECK_ONLY) }}:
    - job: Windows_${{ parameters.VSCODE_ARCH }}_CopilotShimSign
      displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - Sign Copilot Shim
      dependsOn: Windows_${{ parameters.VSCODE_ARCH }}_CopilotShim
      pool:
        name: ${{ parameters.VSCODE_POOL_NAME }}
        os: windows
      timeoutInMinutes: 90
      variables:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      steps:
        - template: ../common/checkout.yml@self

        - template: ./steps/product-sign-win32-copilot-shim.yml@self

parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_JOB_NAME
    type: string
  - name: VSCODE_JOB_DISPLAY_NAME
    type: string
  - name: VSCODE_TEST_IDS
    type: object

# Each product test job tests the builds of the compilation artifact published
# by the compile job (see product-build-win32.yml, which must set
# VSCODE_RUN_TESTS) with the selected test IDs. Retrying a test job skips the
# test tasks that already passed in an earlier attempt (see
# ../common/test-checkpoints.md).
jobs:
  - job: Windows_${{ parameters.VSCODE_ARCH }}_Test_${{ parameters.VSCODE_JOB_NAME }}
    displayName: Windows (${{ upper(parameters.VSCODE_ARCH) }}) - ${{ parameters.VSCODE_JOB_DISPLAY_NAME }}
    dependsOn: Windows_${{ parameters.VSCODE_ARCH }}_Compile
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 10
    variables:
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: true
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-windows-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_JOB_NAME) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: always()
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-setup.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

      - template: ./steps/product-build-win32-download-compilation.yml@self
        parameters:
          VSCODE_DOWNLOAD_OUT_BUILD: true

      - template: ./steps/product-build-win32-test.yml@self
        parameters:
          VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
          VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

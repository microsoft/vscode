# Generated from the npm configuration by build/npm/pnpm/convert.ts during the npm to pnpm migration.
# Setting names must be in knownSettingNames in build/npm/pnpm/workspaceConfig.ts.
pnpmfile: .pnpmfile.mjs
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: false
dedupePeerDependents: false
fetchTimeout: 180000
engineStrict: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@vscode/*'
strictDepBuilds: true
sideEffectsCache: false
verifyDepsBeforeRun: false
pmOnFail: ignore
skills:
  dirs: []
allowBuilds:
  '@vscode/vsce-sign@2.1.0': true
  esbuild@0.27.2: true
  fsevents@2.3.3: true
  keytar@7.9.0: true
  tree-sitter-javascript@0.23.1: true
  tree-sitter-typescript@0.23.2: true
  tree-sitter@0.25.1: true
overrides:
  path-scurry>lru-cache: 11.2.1
  yauzl: ^3.3.1

name: @@NAME@@
version: '@@VERSION@@'
summary: Code editing. Redefined.
description: |
  Visual Studio Code is a new choice of tool that combines the
  simplicity of a code editor with what developers need for the core
  edit-build-debug cycle.

@@ARCHITECTURES@@

grade: stable
confinement: classic
base: @@SNAP_BASE@@
compression: lzo

parts:
  code:
    plugin: dump
    source: .
    stage-packages:
      - ca-certificates
      - @@LIBASOUND@@
      - @@LIBATK_BRIDGE@@
      - @@LIBATK@@
      - @@LIBATSPI@@
      - libcairo2
      - libcanberra-gtk3-module
      - @@LIBCURL@@
      - libegl1
      - libdrm2
      - libgbm1
      - libgl1
      - libgles2
      - @@LIBGLIB@@
      - @@LIBGTK@@
      - libibus-1.0-5
      - libnss3
      - libpango-1.0-0
      - libsecret-1-0
      - libwayland-egl1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxkbcommon0
      - libxkbfile1
      - libxrandr2
      - libxss1
      - locales-all
      - packagekit-gtk3-module
      - xdg-utils
    prime:
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/icons
      - -usr/share/lintian
      - -usr/share/man
    override-build: |
      craftctl default
      patchelf --force-rpath --set-rpath '$ORIGIN/../../lib/@@MULTIARCH@@:$ORIGIN:/snap/@@SNAP_BASE@@/current/lib/@@MULTIARCH@@' "$CRAFT_PART_INSTALL/usr/share/@@NAME@@/chrome_crashpad_handler"
      chmod 0755 "$CRAFT_PART_INSTALL/usr/share/@@NAME@@/chrome-sandbox"
  cleanup:
    after:
      - code
    plugin: nil
    build-snaps:
      - @@SNAP_BASE@@
    override-prime: |
      set -eux
      for snap in "@@SNAP_BASE@@"; do
        cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" \;
      done
      patchelf --print-rpath "$CRAFT_PRIME/usr/share/@@NAME@@/chrome_crashpad_handler"


apps:
  @@NAME@@:
    command: electron-launch $SNAP/usr/share/@@NAME@@/bin/@@NAME@@ --no-sandbox
    common-id: @@NAME@@.desktop

  url-handler:
    command: electron-launch $SNAP/usr/share/@@NAME@@/bin/@@NAME@@ --open-url --no-sandbox

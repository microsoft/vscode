version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "MOVE_SELF_TARGET_READY".
    response:
      content: MOVE_SELF_TARGET_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call move_session exactly once with into "agent-host-session://claude/${uuid_0}", then reply exactly "scheduled".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__move_session
          input:
            into: agent-host-session://claude/${uuid_0}
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call move_session exactly once with into "agent-host-session://claude/${uuid_0}", then reply exactly "scheduled".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__move_session
              input:
                into: agent-host-session://claude/${uuid_0}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'This chat will be moved into agent-host-session://claude/${uuid_0} when this turn ends. Make this your final tool call: reply with one short sentence, then end the turn. Do not call move_session again for this chat.'
    response:
      content: scheduled
      stopReason: end_turn

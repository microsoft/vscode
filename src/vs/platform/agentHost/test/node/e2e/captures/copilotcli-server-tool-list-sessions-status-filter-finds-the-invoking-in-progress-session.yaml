version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["inProgress"], then reply exactly "filtered".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: list_sessions
          input:
            status:
              - inProgress
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["inProgress"], then reply exactly "filtered".
        - role: assistant
          content:
            - type: tool_use
              name: list_sessions
              input:
                status:
                  - inProgress
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"copilotcli:/${uuid_0}","title":"Call list_sessions exactly once with status [\"inProgress\"], then reply exactly \"filtered\".","status":"inProgress","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-02T04:38:28.206Z","modifiedAt":"2026-08-02T04:38:27.038Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"copilotcli:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"copilotcli:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'
    response:
      content: filtered
      stopReason: end_turn

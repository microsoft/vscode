version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"outgoingCalls","line":1,"character":4}. Set the file parameter to this exact absolute path: ${workdir}/fixture.rtlang. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: lsp
          input:
            operation: outgoingCalls
            file: ${workdir}/fixture.rtlang
            line: 1
            character: 4
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"outgoingCalls","line":1,"character":4}. Set the file parameter to this exact absolute path: ${workdir}/fixture.rtlang. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
        - role: assistant
          content:
            - type: tool_use
              name: lsp
              input:
                operation: outgoingCalls
                file: ${workdir}/fixture.rtlang
                line: 1
                character: 4
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Outgoing calls from runtimeTarget:

                runtimeCallee (function) - ${workdir}/definition.rtlang:1 [called at: line 3]
    response:
      content: RUNTIME_LSP_DONE
      stopReason: end_turn

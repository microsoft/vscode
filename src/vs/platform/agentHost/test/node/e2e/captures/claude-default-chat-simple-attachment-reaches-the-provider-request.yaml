version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content:
            - type: text
              text: Reply with only the value provided directly in the attachment. Do not inspect the workspace or use tools.
            - type: text
              text: ATTACHMENT_SIMPLE_VALUE
    response:
      content: ATTACHMENT_SIMPLE_VALUE
      stopReason: end_turn

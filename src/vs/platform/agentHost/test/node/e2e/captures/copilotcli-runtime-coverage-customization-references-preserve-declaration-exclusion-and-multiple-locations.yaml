version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"findReferences","line":1,"character":4,"includeDeclaration":false}. Set the file parameter to this exact absolute path: ${workdir}/fixture.rtlang. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: lsp
          input:
            operation: findReferences
            file: ${workdir}/fixture.rtlang
            line: 1
            character: 4
            includeDeclaration: false
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"findReferences","line":1,"character":4,"includeDeclaration":false}. Set the file parameter to this exact absolute path: ${workdir}/fixture.rtlang. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
        - role: assistant
          content:
            - type: tool_use
              name: lsp
              input:
                operation: findReferences
                file: ${workdir}/fixture.rtlang
                line: 1
                character: 4
                includeDeclaration: false
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Found 2 reference(s) on line '😀 alpha' at ${workdir}/fixture.rtlang:1:4:

                  ${workdir}/fixture.rtlang:
                    1:1
                  ${workdir}/reference.rtlang:
                    2:1
    response:
      content: RUNTIME_LSP_DONE
      stopReason: end_turn

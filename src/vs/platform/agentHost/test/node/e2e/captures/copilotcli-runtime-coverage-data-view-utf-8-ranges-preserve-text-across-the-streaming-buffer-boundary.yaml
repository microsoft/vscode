version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call view exactly once on "${workdir}/utf8.txt" using view_range [1, 1] and forceReadLargeFiles true. Do not use another tool. Reply exactly UTF8_CHECKED.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/utf8.txt
            view_range:
              - 1
              - 1
            forceReadLargeFiles: true
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call view exactly once on "${workdir}/utf8.txt" using view_range [1, 1] and forceReadLargeFiles true. Do not use another tool. Reply exactly UTF8_CHECKED.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/utf8.txt
                view_range:
                  - 1
                  - 1
                forceReadLargeFiles: true
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: é
    response:
      content: UTF8_CHECKED
      stopReason: end_turn

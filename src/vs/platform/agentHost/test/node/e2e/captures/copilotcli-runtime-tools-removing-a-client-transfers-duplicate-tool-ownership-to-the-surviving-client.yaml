version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.6-sol
      system: ${system}
      messages:
        - role: user
          content: Call route_probe exactly once, then reply with only its exact result.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: route_probe
          input: {}
      stopReason: tool_use
  - request:
      model: gpt-5.6-sol
      system: ${system}
      messages:
        - role: user
          content: Call route_probe exactly once, then reply with only its exact result.
        - role: assistant
          content:
            - type: tool_use
              name: route_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: SURVIVING_CLIENT_RESULT
    response:
      content: SURVIVING_CLIENT_RESULT
      stopReason: end_turn

      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word VIOLET_REHYDRATE. Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word VIOLET_REHYDRATE. Reply exactly "READY".
        - role: assistant
          content: READY

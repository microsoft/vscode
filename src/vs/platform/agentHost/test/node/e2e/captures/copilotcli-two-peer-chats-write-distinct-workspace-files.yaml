version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/first-peer.txt containing exactly FIRST_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: create
          input:
            path: ${workdir}/first-peer.txt
            file_text: FIRST_PEER
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/first-peer.txt containing exactly FIRST_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: create
              input:
                path: ${workdir}/first-peer.txt
                file_text: FIRST_PEER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Created file ${workdir}/first-peer.txt with 10 characters
    response:
      content: created
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/second-peer.txt containing exactly SECOND_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: create
          input:
            path: ${workdir}/second-peer.txt
            file_text: SECOND_PEER
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/second-peer.txt containing exactly SECOND_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: create
              input:
                path: ${workdir}/second-peer.txt
                file_text: SECOND_PEER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: Created file ${workdir}/second-peer.txt with 11 characters
    response:
      content: created
      stopReason: end_turn

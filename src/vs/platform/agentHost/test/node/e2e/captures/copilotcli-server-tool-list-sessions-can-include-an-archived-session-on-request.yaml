version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ARCHIVED_TARGET_READY".
    response:
      content: ARCHIVED_TARGET_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["archived"], then reply exactly "listed".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: list_sessions
          input:
            status:
              - archived
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["archived"], then reply exactly "listed".
        - role: assistant
          content:
            - type: tool_use
              name: list_sessions
              input:
                status:
                  - archived
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"copilotcli:/${uuid_0}","title":"Reply exactly \"ARCHIVED_TARGET_READY\".","status":"idle,archived","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-02T02:18:46.000Z","modifiedAt":"2026-08-02T02:18:47.173Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"copilotcli:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"copilotcli:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'
    response:
      content: listed
      stopReason: end_turn

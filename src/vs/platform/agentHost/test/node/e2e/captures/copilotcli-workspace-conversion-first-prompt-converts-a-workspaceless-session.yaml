version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'First use the available user-input tool exactly once to ask which workspace setup to use, with one choice: "file://${workdir} directly without isolation". After I answer, call set_workspace with that workspace and isolation false as the turn''s final tool call. After the workspace is attached, do not inspect, read, or modify it and do not call another tool; reply exactly "converted".'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: ask_user
          input:
            question: Which workspace setup should I use?
            choices:
              - file://${workdir} directly without isolation
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'First use the available user-input tool exactly once to ask which workspace setup to use, with one choice: "file://${workdir} directly without isolation". After I answer, call set_workspace with that workspace and isolation false as the turn''s final tool call. After the workspace is attached, do not inspect, read, or modify it and do not call another tool; reply exactly "converted".'
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: ask_user
              input:
                question: Which workspace setup should I use?
                choices:
                  - file://${workdir} directly without isolation
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'User selected: file://${workdir} directly without isolation'
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: set_workspace
          input:
            workspaceFolder: file://${workdir}
            isolation: false
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'First use the available user-input tool exactly once to ask which workspace setup to use, with one choice: "file://${workdir} directly without isolation". After I answer, call set_workspace with that workspace and isolation false as the turn''s final tool call. After the workspace is attached, do not inspect, read, or modify it and do not call another tool; reply exactly "converted".'
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: ask_user
              input:
                question: Which workspace setup should I use?
                choices:
                  - file://${workdir} directly without isolation
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'User selected: file://${workdir} directly without isolation'
        - role: assistant
          content:
            - type: tool_use
              name: set_workspace
              input:
                workspaceFolder: file://${workdir}
                isolation: false
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: Workspace will be set to file://${workdir} after this turn ends. End this turn now without calling more tools or replying; the host will continue the original task automatically in the selected workspace.
    response:
      content: converted
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'First use the available user-input tool exactly once to ask which workspace setup to use, with one choice: "file://${workdir} directly without isolation". After I answer, call set_workspace with that workspace and isolation false as the turn''s final tool call. After the workspace is attached, do not inspect, read, or modify it and do not call another tool; reply exactly "converted".'
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: ask_user
              input:
                question: Which workspace setup should I use?
                choices:
                  - file://${workdir} directly without isolation
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'User selected: file://${workdir} directly without isolation'
        - role: assistant
          content:
            - type: tool_use
              name: set_workspace
              input:
                workspaceFolder: file://${workdir}
                isolation: false
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: Workspace will be set to file://${workdir} after this turn ends. End this turn now without calling more tools or replying; the host will continue the original task automatically in the selected workspace.
        - role: assistant
          content: converted
        - role: user
          content: The current session is now attached to ${workdir}. Continue the user's original task in this workspace. Do not request another session or workspace conversion.
    response:
      content: Workspace conversion complete — this session is now attached to the target workspace. Let me know what you'd like to work on next.
      stopReason: end_turn

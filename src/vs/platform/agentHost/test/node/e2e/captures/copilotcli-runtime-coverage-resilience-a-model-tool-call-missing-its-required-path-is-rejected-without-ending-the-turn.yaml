version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: If a tool reports an error, do not retry it or call another tool. Reply exactly TOOL_FAULT_HANDLED.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            forceReadLargeFiles: not-a-boolean
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: If a tool reports an error, do not retry it or call another tool. Reply exactly TOOL_FAULT_HANDLED.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                forceReadLargeFiles: not-a-boolean
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Invalid input: Multiple validation errors:
                - "path": Required
                - "forceReadLargeFiles": Expected boolean, received string
    response:
      content: TOOL_FAULT_HANDLED
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: If a tool reports an error, do not retry it or call another tool. Reply exactly TOOL_FAULT_HANDLED.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                forceReadLargeFiles: not-a-boolean
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Invalid input: Multiple validation errors:
                - "path": Required
                - "forceReadLargeFiles": Expected boolean, received string
        - role: assistant
          content: TOOL_FAULT_HANDLED
        - role: user
          content: Call view exactly once on "${workdir}/recovery.txt". Do not use other tools. Reply exactly RECOVERY_READ.
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: view
          input:
            path: ${workdir}/recovery.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: If a tool reports an error, do not retry it or call another tool. Reply exactly TOOL_FAULT_HANDLED.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                forceReadLargeFiles: not-a-boolean
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Invalid input: Multiple validation errors:
                - "path": Required
                - "forceReadLargeFiles": Expected boolean, received string
        - role: assistant
          content: TOOL_FAULT_HANDLED
        - role: user
          content: Call view exactly once on "${workdir}/recovery.txt". Do not use other tools. Reply exactly RECOVERY_READ.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/recovery.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: LOCAL_TRANSPORT_RECOVERY
    response:
      content: RECOVERY_READ
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Edit
          input:
            file_path: ${workdir}/paired.txt
            old_string: PAIR_BEFORE
            new_string: PAIR_AFTER
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/paired.txt
                old_string: PAIR_BEFORE
                new_string: PAIR_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The file ${workdir}/paired.txt has been updated successfully.
    response:
      content: EDIT_DONE
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/paired.txt
                old_string: PAIR_BEFORE
                new_string: PAIR_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The file ${workdir}/paired.txt has been updated successfully.
        - role: assistant
          content: EDIT_DONE
        - role: user
          content: Reply exactly "HISTORY_READY". Do not use tools.
    response:
      content: HISTORY_READY
      stopReason: end_turn

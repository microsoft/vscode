version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Read the attached resource and reply with only its exact contents.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/resource.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Read the attached resource and reply with only its exact contents.
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/resource.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tATTACHMENT_RESOURCE_VALUE"
    response:
      content: ATTACHMENT_RESOURCE_VALUE
      stopReason: end_turn

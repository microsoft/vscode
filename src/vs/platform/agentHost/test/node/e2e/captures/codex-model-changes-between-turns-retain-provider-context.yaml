version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.6-terra
      system: ''
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
        - role: assistant
          content: ready
        - role: user
          content: Reply with only the exact code word I asked you to remember.
    response:
      content: MARIGOLD
      stopReason: end_turn

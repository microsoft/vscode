version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "DELETE_TARGET_READY".
    response:
      content: DELETE_TARGET_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call delete_session exactly once with session "copilotcli:/e2e-server-tools-delete-session-target", then reply exactly "deleted".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: delete_session
          input:
            session: copilotcli:/e2e-server-tools-delete-session-target
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call delete_session exactly once with session "copilotcli:/e2e-server-tools-delete-session-target", then reply exactly "deleted".
        - role: assistant
          content:
            - type: tool_use
              name: delete_session
              input:
                session: copilotcli:/e2e-server-tools-delete-session-target
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Deleted session copilotcli:/e2e-server-tools-delete-session-target. Reply with one short sentence confirming the session was deleted.
    response:
      content: deleted
      stopReason: end_turn

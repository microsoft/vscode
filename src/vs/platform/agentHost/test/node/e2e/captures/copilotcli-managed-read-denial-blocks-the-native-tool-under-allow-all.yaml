version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use view exactly once to read input.txt anew, even if you read it before. Do not use a shell. If denied, stop and reply denied.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/input.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use view exactly once to read input.txt anew, even if you read it before. Do not use a shell. If denied, stop and reply denied.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/input.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Permission to run this tool was denied due to the following rules: `Read`'
    response:
      content: Denied.
      stopReason: end_turn

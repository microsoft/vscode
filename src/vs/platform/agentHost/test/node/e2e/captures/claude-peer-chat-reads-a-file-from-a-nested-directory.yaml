version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Read the file at ${workdir}/nested/peer.txt and reply with its exact contents only.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/nested/peer.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Read the file at ${workdir}/nested/peer.txt and reply with its exact contents only.
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/nested/peer.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tPEER_NESTED_READ"
    response:
      content: PEER_NESTED_READ
      stopReason: end_turn

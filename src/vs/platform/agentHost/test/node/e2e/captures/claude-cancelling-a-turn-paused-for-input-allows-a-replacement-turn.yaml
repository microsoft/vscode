version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: AskUserQuestion
          input:
            questions:
              - question: Which fruit?
                header: Fruit
                multiSelect: false
                options:
                  - label: Apple
                    description: Apple
                  - label: Banana
                    description: Banana
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit.
        - role: assistant
          content:
            - type: tool_use
              name: AskUserQuestion
              input:
                questions:
                  - question: Which fruit?
                    header: Fruit
                    multiSelect: false
                    options:
                      - label: Apple
                        description: Apple
                      - label: Banana
                        description: Banana
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The user doesn't want to proceed with this tool use. The tool use was rejected (eg. if it was a file edit, the new_string was NOT written to the file). STOP what you are doing and wait for the user to tell you how to proceed.
            - type: text
              text: '[Request interrupted by user for tool use]'
        - role: assistant
          content: No response requested.
        - role: user
          content: Reply exactly "replacement".
    response:
      content: replacement
      stopReason: end_turn

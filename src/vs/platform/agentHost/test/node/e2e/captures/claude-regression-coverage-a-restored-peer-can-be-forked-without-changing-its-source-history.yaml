version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember DEFAULT_FORK_EXCLUDED. Reply exactly "DEFAULT_READY".
    response:
      content: DEFAULT_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
    response:
      content: PEER_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
    response:
      content: PEER_LATER_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Reply exactly "FORK_CONTINUED". Do not use tools.
    response:
      content: FORK_CONTINUED
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
        - role: assistant
          content: PEER_LATER_READY
        - role: user
          content: Read source-continues.txt with Read, then use Edit exactly once to replace SOURCE_BEFORE with SOURCE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/source-continues.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
        - role: assistant
          content: PEER_LATER_READY
        - role: user
          content: Read source-continues.txt with Read, then use Edit exactly once to replace SOURCE_BEFORE with SOURCE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/source-continues.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tSOURCE_BEFORE\n2"
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: Edit
          input:
            file_path: ${workdir}/source-continues.txt
            old_string: SOURCE_BEFORE
            new_string: SOURCE_AFTER
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
        - role: assistant
          content: PEER_LATER_READY
        - role: user
          content: Read source-continues.txt with Read, then use Edit exactly once to replace SOURCE_BEFORE with SOURCE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/source-continues.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tSOURCE_BEFORE\n2"
        - role: assistant
          content:
            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/source-continues.txt
                old_string: SOURCE_BEFORE
                new_string: SOURCE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: The file ${workdir}/source-continues.txt has been updated successfully. (file state is current in your context — no need to Read it back)
    response:
      content: EDIT_DONE
      stopReason: end_turn

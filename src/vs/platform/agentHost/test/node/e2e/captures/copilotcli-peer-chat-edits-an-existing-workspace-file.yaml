version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Replace the complete contents of ${workdir}/peer-edit.txt with AFTER_PEER. Use your file tools; do not run a shell command.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/peer-edit.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Replace the complete contents of ${workdir}/peer-edit.txt with AFTER_PEER. Use your file tools; do not run a shell command.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: view
              input:
                path: ${workdir}/peer-edit.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 1. BEFORE_PEER
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: edit
          input:
            path: ${workdir}/peer-edit.txt
            old_str: BEFORE_PEER
            new_str: AFTER_PEER
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Replace the complete contents of ${workdir}/peer-edit.txt with AFTER_PEER. Use your file tools; do not run a shell command.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: view
              input:
                path: ${workdir}/peer-edit.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 1. BEFORE_PEER
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/peer-edit.txt
                old_str: BEFORE_PEER
                new_str: AFTER_PEER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: File ${workdir}/peer-edit.txt updated with changes.
    response:
      content: Done — [peer-edit.txt](${workdir}/peer-edit.txt) now contains only `AFTER_PEER`.
      stopReason: end_turn

version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember DEFAULT_NOT_IN_PEER. Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SIBLING_NOT_IN_PEER. Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace FIRST_BEFORE with FIRST_AFTER in first-peer.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: text
          text: Applying one direct patch to `first-peer.txt` now.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: |-
              apply_patch <<'PATCH'
              *** Begin Patch
              *** Update File: first-peer.txt
              @@
              -FIRST_BEFORE
              +FIRST_AFTER
              *** End Patch
              PATCH
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace FIRST_BEFORE with FIRST_AFTER in first-peer.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content: Applying one direct patch to `first-peer.txt` now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: |-
                  apply_patch <<'PATCH'
                  *** Begin Patch
                  *** Update File: first-peer.txt
                  @@
                  -FIRST_BEFORE
                  +FIRST_AFTER
                  *** End Patch
                  PATCH
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Wall time: 0.0000 seconds
                Output:
                Exit code: 0
                Wall time: 0 seconds
                Output:
                Success. Updated the following files:
                M first-peer.txt
    response:
      content: EDIT_DONE
      stopReason: end_turn

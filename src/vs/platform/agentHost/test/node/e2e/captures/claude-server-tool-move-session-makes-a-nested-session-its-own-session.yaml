version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "PEER_READY".
    response:
      content: PEER_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call move_session exactly once with session "agent-host-session://claude/${uuid_0}?chat=${uuid_1}" and relationship "independent", then reply exactly "moved".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__move_session
          input:
            session: agent-host-session://claude/${uuid_0}?chat=${uuid_1}
            relationship: independent
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call move_session exactly once with session "agent-host-session://claude/${uuid_0}?chat=${uuid_1}" and relationship "independent", then reply exactly "moved".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__move_session
              input:
                session: agent-host-session://claude/${uuid_0}?chat=${uuid_1}
                relationship: independent
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Nested session moved to its own session (agent-host-session://ahp-session/${uuid_2}).
    response:
      content: moved
      stopReason: end_turn

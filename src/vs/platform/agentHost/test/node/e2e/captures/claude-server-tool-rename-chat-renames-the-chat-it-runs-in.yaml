version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call the rename_chat tool exactly once with title "Coverage audit", then reply with exactly "renamed".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__rename_chat
          input:
            title: Coverage audit
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call the rename_chat tool exactly once with title "Coverage audit", then reply with exactly "renamed".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__rename_chat
              input:
                title: Coverage audit
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Renamed chat to "Coverage audit".
    response:
      content: renamed
      stopReason: end_turn

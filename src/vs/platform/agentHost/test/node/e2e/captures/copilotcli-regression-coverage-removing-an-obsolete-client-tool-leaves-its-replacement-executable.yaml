version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY". Do not call tools.
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY". Do not call tools.
        - role: assistant
          content: READY
        - role: user
          content: Call obsolete_probe exactly once and report its result.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: obsolete_probe
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY". Do not call tools.
        - role: assistant
          content: READY
        - role: user
          content: Call obsolete_probe exactly once and report its result.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: obsolete_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: LIVE_PROBE_RESULT
    response:
      content: 'The result of calling `obsolete_probe` is: **LIVE_PROBE_RESULT**'
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY". Do not call tools.
        - role: assistant
          content: READY
        - role: user
          content: Call obsolete_probe exactly once and report its result.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: obsolete_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: LIVE_PROBE_RESULT
        - role: assistant
          content: 'The result of calling `obsolete_probe` is: **LIVE_PROBE_RESULT**'
        - role: user
          content: Call replacement_probe exactly once. The obsolete_probe tool has been removed; do not call it.
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: replacement_probe
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY". Do not call tools.
        - role: assistant
          content: READY
        - role: user
          content: Call obsolete_probe exactly once and report its result.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: obsolete_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: LIVE_PROBE_RESULT
        - role: assistant
          content: 'The result of calling `obsolete_probe` is: **LIVE_PROBE_RESULT**'
        - role: user
          content: Call replacement_probe exactly once. The obsolete_probe tool has been removed; do not call it.
        - role: assistant
          content:
            - type: tool_use
              name: replacement_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: LIVE_PROBE_RESULT
    response:
      content: 'The result of calling `replacement_probe` is: **LIVE_PROBE_RESULT**'
      stopReason: end_turn

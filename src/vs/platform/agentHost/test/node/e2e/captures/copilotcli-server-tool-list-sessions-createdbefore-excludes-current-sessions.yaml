version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with createdBefore "2000-01-01T00:00:00Z", then reply exactly "filtered".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: list_sessions
          input:
            createdBefore: '2000-01-01T00:00:00Z'
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with createdBefore "2000-01-01T00:00:00Z", then reply exactly "filtered".
        - role: assistant
          content:
            - type: tool_use
              name: list_sessions
              input:
                createdBefore: '2000-01-01T00:00:00Z'
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[]}'
    response:
      content: filtered
      stopReason: end_turn

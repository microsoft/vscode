version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SHARED_FORK_PREFIX. Reply exactly "PREFIX_READY".
    response:
      content: PREFIX_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SHARED_FORK_PREFIX. Reply exactly "PREFIX_READY".
        - role: assistant
          content: PREFIX_READY
        - role: user
          content: Remember FORK_BRANCH_ONLY. Reply exactly "BRANCH_READY".
    response:
      content: BRANCH_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SHARED_FORK_PREFIX. Reply exactly "PREFIX_READY".
        - role: assistant
          content: PREFIX_READY
        - role: user
          content: Remember SOURCE_ADVANCE_ONLY. Reply exactly "SOURCE_ADVANCED".
    response:
      content: SOURCE_ADVANCED
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SHARED_FORK_PREFIX. Reply exactly "PREFIX_READY".
        - role: assistant
          content: PREFIX_READY
        - role: user
          content: Remember FORK_BRANCH_ONLY. Reply exactly "BRANCH_READY".
        - role: assistant
          content: BRANCH_READY
        - role: user
          content: Reply exactly "BRANCH_RESUMED". Do not use tools.
    response:
      content: BRANCH_RESUMED
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember SHARED_FORK_PREFIX. Reply exactly "PREFIX_READY".
        - role: assistant
          content: PREFIX_READY
        - role: user
          content: Remember SOURCE_ADVANCE_ONLY. Reply exactly "SOURCE_ADVANCED".
        - role: assistant
          content: SOURCE_ADVANCED
        - role: user
          content: Reply exactly "SOURCE_RESUMED". Do not use tools.
    response:
      content: SOURCE_RESUMED
      stopReason: end_turn

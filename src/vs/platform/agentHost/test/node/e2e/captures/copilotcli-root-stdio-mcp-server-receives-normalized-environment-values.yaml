version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call root_probe exactly once, then reply with only its exact result.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: root_probe_server-root_probe
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call root_probe exactly once, then reply with only its exact result.
        - role: assistant
          content:
            - type: tool_use
              name: root_probe_server-root_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: ROOT_MCP:7:unset
    response:
      content: ROOT_MCP:7:unset
      stopReason: end_turn

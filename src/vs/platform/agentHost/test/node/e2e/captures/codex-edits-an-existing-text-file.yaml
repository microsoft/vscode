version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''edit.txt'',''AFTER_VALUE'')"`. Then reply exactly "done".'
    response:
      content:
        - type: text
          text: Executing your exact command now, then I’ll reply with the exact requested text.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "require('fs').writeFileSync('edit.txt','AFTER_VALUE')"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''edit.txt'',''AFTER_VALUE'')"`. Then reply exactly "done".'
        - role: assistant
          content: Executing your exact command now, then I’ll reply with the exact requested text.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "require('fs').writeFileSync('edit.txt','AFTER_VALUE')"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: 9817fe
                Wall time: 0.0000 seconds
                Process exited with code 0
                Original token count: 0
                Output:
    response:
      content: done
      stopReason: end_turn

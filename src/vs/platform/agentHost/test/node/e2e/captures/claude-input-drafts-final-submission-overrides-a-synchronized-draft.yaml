version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit. If the question is cancelled, reply exactly "cancelled" and do not ask again.
    response:
      content:
        - type: text
          text: I'll ask you to pick.
        - type: tool_use
          id: toolcall_0
          name: AskUserQuestion
          input:
            questions:
              - question: Which fruit?
                header: Fruit
                options:
                  - label: Apple
                    description: Pick apple.
                  - label: Banana
                    description: Pick banana.
                multiSelect: false
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit. If the question is cancelled, reply exactly "cancelled" and do not ask again.
        - role: assistant
          content:
            - type: text
              text: I'll ask you to pick.
            - type: tool_use
              name: AskUserQuestion
              input:
                questions:
                  - question: Which fruit?
                    header: Fruit
                    options:
                      - label: Apple
                        description: Pick apple.
                      - label: Banana
                        description: Pick banana.
                    multiSelect: false
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Your questions have been answered: "Which fruit?"="Banana". You can now continue with these answers in mind.'
    response:
      content: Banana
      stopReason: end_turn

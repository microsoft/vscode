version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "otel-capture-first".
    response:
      content: otel-capture-first
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "otel-capture-second".
    response:
      content: otel-capture-second
      stopReason: end_turn

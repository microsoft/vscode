version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"hover","line":1,"character":1}. Set the file parameter to this exact absolute path: ${workdir}/unsupported.txt. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: lsp
          input:
            operation: hover
            line: 1
            character: 1
            file: ${workdir}/unsupported.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'The workspace is ${workdir}. Call lsp exactly once with these parameters: {"operation":"hover","line":1,"character":1}. Set the file parameter to this exact absolute path: ${workdir}/unsupported.txt. Do not call other tools. After the tool finishes, reply exactly RUNTIME_LSP_DONE.'
        - role: assistant
          content:
            - type: tool_use
              name: lsp
              input:
                operation: hover
                line: 1
                character: 1
                file: ${workdir}/unsupported.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'No language server available for file: ${workdir}/unsupported.txt. Supported languages: runtime-primary'
    response:
      content: RUNTIME_LSP_DONE
      stopReason: end_turn

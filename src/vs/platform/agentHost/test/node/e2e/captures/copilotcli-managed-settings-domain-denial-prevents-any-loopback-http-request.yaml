version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch with this exact input: {"url":"${url_managedsettings}/managed-probe"}. Call only the named tool exactly once. Do not retry, use a fallback, or call any other tool. If access is denied, report it without trying again. Work only with the specified synthetic fixture. Then reply exactly MANAGED_CHECK_COMPLETE.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: web_fetch
          input:
            url: ${url_managedsettings}/managed-probe
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch with this exact input: {"url":"${url_managedsettings}/managed-probe"}. Call only the named tool exactly once. Do not retry, use a fallback, or call any other tool. If access is denied, report it without trying again. Work only with the specified synthetic fixture. Then reply exactly MANAGED_CHECK_COMPLETE.'
        - role: assistant
          content:
            - type: tool_use
              name: web_fetch
              input:
                url: ${url_managedsettings}/managed-probe
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Permission to access this URL was denied.
    response:
      content: MANAGED_CHECK_COMPLETE
      stopReason: end_turn

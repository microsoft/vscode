version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "MOVE_REFUSED_READY".
    response:
      content: MOVE_REFUSED_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: You must call move_session exactly once with session "agent-host-session://copilotcli/e2e-server-tools-move-refused-other" and into "agent-host-session://copilotcli/e2e-server-tools-move-refused" so the host can check the move. Do not refuse on your own. After the tool fails, reply exactly "refused".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: move_session
          input:
            session: agent-host-session://copilotcli/e2e-server-tools-move-refused-other
            into: agent-host-session://copilotcli/e2e-server-tools-move-refused
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: You must call move_session exactly once with session "agent-host-session://copilotcli/e2e-server-tools-move-refused-other" and into "agent-host-session://copilotcli/e2e-server-tools-move-refused" so the host can check the move. Do not refuse on your own. After the tool fails, reply exactly "refused".
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: move_session
              input:
                session: agent-host-session://copilotcli/e2e-server-tools-move-refused-other
                into: agent-host-session://copilotcli/e2e-server-tools-move-refused
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Cannot move: This session has nested sessions; move them out first, or move each nested session on its own.'
    response:
      content: refused
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call customization_elicit_form exactly once. If the elicitation is cancelled, reply exactly "elicitation cancelled".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: customization_probe_server-customization_elicit_form
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call customization_elicit_form exactly once. If the elicitation is cancelled, reply exactly "elicitation cancelled".
        - role: assistant
          content:
            - type: tool_use
              name: customization_probe_server-customization_elicit_form
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: ELICIT_FORM:cancel:undefined:undefined:undefined
    response:
      content: elicitation cancelled
      stopReason: end_turn

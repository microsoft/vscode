version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: |-
            Create streaming.txt containing exactly these three lines, with no other content:
            STREAM_ALPHA
            STREAM_BETA
            STREAM_GAMMA
            Use your file creation tool; do not run a shell command. Then reply exactly "done".
    response:
      content:
        - type: text
          text: I'll create the file.
        - type: tool_use
          id: toolcall_0
          name: Write
          input:
            file_path: ${workdir}/streaming.txt
            content: |
              STREAM_ALPHA
              STREAM_BETA
              STREAM_GAMMA
      stopReason: tool_use
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: |-
            Create streaming.txt containing exactly these three lines, with no other content:
            STREAM_ALPHA
            STREAM_BETA
            STREAM_GAMMA
            Use your file creation tool; do not run a shell command. Then reply exactly "done".
        - role: assistant
          content:
            - type: text
              text: I'll create the file.
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/streaming.txt
                content: |
                  STREAM_ALPHA
                  STREAM_BETA
                  STREAM_GAMMA
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'File created successfully at: ${workdir}/streaming.txt (file state is current in your context — no need to Read it back)'
    response:
      content: done
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `echo SHELL_VALUE_73`. Then reply with that exact value only.'
    response:
      content:
        - type: text
          text: I'll run that command.
        - type: tool_use
          id: toolcall_0
          name: Bash
          input:
            command: echo SHELL_VALUE_73
            description: Echo shell value
      stopReason: tool_use
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `echo SHELL_VALUE_73`. Then reply with that exact value only.'
        - role: assistant
          content:
            - type: text
              text: I'll run that command.
            - type: tool_use
              name: Bash
              input:
                command: echo SHELL_VALUE_73
                description: Echo shell value
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: SHELL_VALUE_73
    response:
      content: SHELL_VALUE_73
      stopReason: end_turn

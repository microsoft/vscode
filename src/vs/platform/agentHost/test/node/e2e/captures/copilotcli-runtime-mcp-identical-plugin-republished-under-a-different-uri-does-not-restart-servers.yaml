version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly MCP_READY. Do not call tools.
    response:
      content: MCP_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly MCP_READY. Do not call tools.
        - role: assistant
          content: MCP_READY
        - role: user
          content: Reply exactly MCP_STILL_READY. Do not call tools.
    response:
      content: MCP_STILL_READY
      stopReason: end_turn

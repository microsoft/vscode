version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "DEFAULT_READY".
    response:
      content: DEFAULT_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_RED_ONLY. Reply exactly "RED_READY".
    response:
      content: RED_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_BLUE_ONLY. Reply exactly "BLUE_READY".
    response:
      content: BLUE_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_BLUE_ONLY. Reply exactly "BLUE_READY".
        - role: assistant
          content: BLUE_READY
        - role: user
          content: Reply with the code word I gave this chat. Do not use tools.
    response:
      content: PEER_BLUE_ONLY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_RED_ONLY. Reply exactly "RED_READY".
        - role: assistant
          content: RED_READY
        - role: user
          content: Reply with the code word I gave this chat. Do not use tools.
    response:
      content: PEER_RED_ONLY
      stopReason: end_turn

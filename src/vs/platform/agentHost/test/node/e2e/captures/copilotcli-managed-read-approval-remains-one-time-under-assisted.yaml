version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use view exactly once to read input.txt anew, even if you read it before. Do not use a shell. If denied, stop and reply denied.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/input.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:

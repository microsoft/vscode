version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Create cancelled.lock containing exactly CANCELLED_CONTENT using your file creation tool, then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Write
          input:
            file_path: ${workdir}/cancelled.lock
            content: CANCELLED_CONTENT
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Create cancelled.lock containing exactly CANCELLED_CONTENT using your file creation tool, then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/cancelled.lock
                content: CANCELLED_CONTENT
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The user doesn't want to proceed with this tool use. The tool use was rejected (eg. if it was a file edit, the new_string was NOT written to the file). STOP what you are doing and wait for the user to tell you how to proceed.
            - type: text
              text: '[Request interrupted by user for tool use]'
        - role: assistant
          content: No response requested.
        - role: user
          content: Reply exactly "replacement".
    response:
      content: replacement
      stopReason: end_turn

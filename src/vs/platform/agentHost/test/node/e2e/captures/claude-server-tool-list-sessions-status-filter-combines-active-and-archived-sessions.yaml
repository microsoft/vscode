version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "COMBINED_TARGET_READY".
    response:
      content: COMBINED_TARGET_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["inProgress", "archived"], then reply exactly "filtered".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__list_sessions
          input:
            status:
              - inProgress
              - archived
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with status ["inProgress", "archived"], then reply exactly "filtered".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__list_sessions
              input:
                status:
                  - inProgress
                  - archived
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"claude:/${uuid_0}","title":"Call list_sessions exactly once with status [\"inProgress\", \"archived\"], then reply exactly \"filtered\".","status":"inProgress","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-28T00:10:37.432Z","modifiedAt":"2026-08-28T00:10:33.383Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"claude:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"claude:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]},{"session":"claude:/${uuid_1}","title":"Reply exactly \"COMBINED_TARGET_READY\".","status":"idle,archived","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-28T00:10:29.702Z","modifiedAt":"2026-08-28T00:10:29.126Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"claude:/${uuid_1}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"claude:/${uuid_1}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'
    response:
      content: filtered
      stopReason: end_turn

version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(JSON.parse(require(''fs'').readFileSync(''config.json'',''utf8'')).answer)"`. Then reply with its exact output only.'
    response:
      content:
        - type: text
          text: I’m running your exact command now and will return only the command output.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "console.log(JSON.parse(require('fs').readFileSync('config.json','utf8')).answer)"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(JSON.parse(require(''fs'').readFileSync(''config.json'',''utf8'')).answer)"`. Then reply with its exact output only.'
        - role: assistant
          content: I’m running your exact command now and will return only the command output.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "console.log(JSON.parse(require('fs').readFileSync('config.json','utf8')).answer)"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: 121db8
                Wall time: 0.0667 seconds
                Process exited with code 0
                Original token count: 1
                Output:
                42
    response:
      content: '42'
      stopReason: end_turn

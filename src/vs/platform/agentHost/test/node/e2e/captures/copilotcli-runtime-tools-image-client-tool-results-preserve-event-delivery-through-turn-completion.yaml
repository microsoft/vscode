version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call get_test_image exactly once. After receiving the image, reply with only its acknowledgement token.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: get_test_image
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call get_test_image exactly once. After receiving the image, reply with only its acknowledgement token.
        - role: assistant
          content:
            - type: tool_use
              name: get_test_image
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content:
                - type: text
                  text: 'Acknowledgement token: IMAGE_DELIVERED'
                - type: image
    response:
      content: IMAGE_DELIVERED
      stopReason: end_turn

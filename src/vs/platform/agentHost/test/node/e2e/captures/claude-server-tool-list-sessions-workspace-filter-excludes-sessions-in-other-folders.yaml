version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "WORKSPACE_TARGET_READY".
    response:
      content: WORKSPACE_TARGET_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}/other", then reply exactly "filtered".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__list_sessions
          input:
            workspace: ${workdir}/other
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}/other", then reply exactly "filtered".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__list_sessions
              input:
                workspace: ${workdir}/other
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"claude:/${uuid_0}","openLink":"agent-host-session://claude/${uuid_0}","title":"Reply exactly \"WORKSPACE_TARGET_READY\".","status":"idle","workingDirectory":"file://${workdir}/other","unread":true,"createdAt":"2026-09-24T04:50:35.127Z","modifiedAt":"2026-09-24T04:50:36.899Z","changes":{"additions":0,"deletions":0,"files":0}}]}'
    response:
      content: filtered
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - method: POST
    path: /v1/messages
    response:
      status: 400
      headers:
        content-type: application/json
        x-should-retry: 'false'
        retry-after: '0'
      body: '{"type":"error","error":{"type":"invalid_request_error","code":"invalid_request_error","message":"Injected E2E bad request failure."},"request_id":"e2e-classified-error"}'
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
        - role: assistant
          content: READY
        - role: user
          content: Reply exactly "UNEXPECTED_SUCCESS".
    response:
      content: UNEXPECTED_SUCCESS
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
        - role: assistant
          content: READY
        - role: user
          content: Reply exactly "UNEXPECTED_SUCCESS".
        - role: assistant
          content: UNEXPECTED_SUCCESS
        - role: user
          content: Reply exactly "RECOVERED".
    response:
      content: RECOVERED
      stopReason: end_turn

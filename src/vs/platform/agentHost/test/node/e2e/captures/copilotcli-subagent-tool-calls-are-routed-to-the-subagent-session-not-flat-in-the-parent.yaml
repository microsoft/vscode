version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use the `task` tool to spawn a subagent to list the files in the current working directory. The subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to enumerate the directory; do not run a shell command. Do not enumerate the directory yourself — delegate to the subagent.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: task
          input:
            name: list-cwd-files
            agent_type: explore
            mode: sync
            description: List files in current working directory
            prompt: Use the `view` tool with path "${workdir}" to list the files and directories in that directory. Do not run any shell command. Just call view once on that path and report back the list of files/folders it contains.
      stopReason: tool_use
  - request:
      model: claude-haiku-4.5
      system: ${system}
      messages:
        - role: user
          content: Use the `view` tool with path "${workdir}" to list the files and directories in that directory. Do not run any shell command. Just call view once on that path and report back the list of files/folders it contains.
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: view
          input:
            path: ${workdir}
      stopReason: tool_use
  - request:
      model: claude-haiku-4.5
      system: ${system}
      messages:
        - role: user
          content: Use the `view` tool with path "${workdir}" to list the files and directories in that directory. Do not run any shell command. Just call view once on that path and report back the list of files/folders it contains.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: view
              input:
                path: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: |-
                file-a.txt
                file-b.txt
    response:
      content: |-
        The directory `${workdir}` contains the following files:

        1. **file-a.txt**
        2. **file-b.txt**
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use the `task` tool to spawn a subagent to list the files in the current working directory. The subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to enumerate the directory; do not run a shell command. Do not enumerate the directory yourself — delegate to the subagent.
        - role: assistant
          content:
            - type: tool_use
              name: task
              input:
                name: list-cwd-files
                agent_type: explore
                mode: sync
                description: List files in current working directory
                prompt: Use the `view` tool with path "${workdir}" to list the files and directories in that directory. Do not run any shell command. Just call view once on that path and report back the list of files/folders it contains.
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                The directory `${workdir}` contains the following files:

                1. **file-a.txt**
                2. **file-b.txt**
    response:
      content: |-
        The subagent found two files in the current working directory:

        1. `file-a.txt`
        2. `file-b.txt`
      stopReason: end_turn

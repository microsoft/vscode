version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use the `task` tool to spawn a subagent to list the files in the current working directory. Explicitly set the subagent model to `claude-sonnet-5`. The subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to enumerate the directory; do not run a shell command. Do not enumerate the directory yourself — delegate to the subagent.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: task
          input:
            name: list-directory-files
            agent_type: explore
            model: claude-sonnet-5
            description: List files in current directory
            prompt: |-
              List the files and directories in the current working directory: ${workdir}

              Use a single read-only file-listing tool call (e.g. `view` on that directory path, or `glob` with pattern "*") to enumerate its contents. Do not run any shell command. Report back the list of files/directories found.
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            List the files and directories in the current working directory: ${workdir}

            Use a single read-only file-listing tool call (e.g. `view` on that directory path, or `glob` with pattern "*") to enumerate its contents. Do not run any shell command. Report back the list of files/directories found.
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: view
          input:
            path: ${workdir}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            List the files and directories in the current working directory: ${workdir}

            Use a single read-only file-listing tool call (e.g. `view` on that directory path, or `glob` with pattern "*") to enumerate its contents. Do not run any shell command. Report back the list of files/directories found.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: |-
                file-a.txt
                file-b.txt
    response:
      content: |-
        Contents of the directory:
        - file-a.txt
        - file-b.txt
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use the `task` tool to spawn a subagent to list the files in the current working directory. Explicitly set the subagent model to `claude-sonnet-5`. The subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to enumerate the directory; do not run a shell command. Do not enumerate the directory yourself — delegate to the subagent.
        - role: assistant
          content:
            - type: tool_use
              name: task
              input:
                name: list-directory-files
                agent_type: explore
                model: claude-sonnet-5
                description: List files in current directory
                prompt: |-
                  List the files and directories in the current working directory: ${workdir}

                  Use a single read-only file-listing tool call (e.g. `view` on that directory path, or `glob` with pattern "*") to enumerate its contents. Do not run any shell command. Report back the list of files/directories found.
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Contents of the directory:
                - file-a.txt
                - file-b.txt
    response:
      content: |-
        The subagent (running on `claude-sonnet-5`) listed the current directory using a single read-only tool call and found:

        - [file-a.txt](${workdir}/file-a.txt)
        - [file-b.txt](${workdir}/file-b.txt)
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: 'Call add_artifact_or_reference exactly once with an items array containing two entries: type "website", label "Agent Host guide", isArtifact false, and link "https://example.com/agent-host"; then type "file", label "Agent Host report", isArtifact true, and uri "file:///agent-host-report.md". Then reply with exactly "recorded".'
    response:
      content:
        - type: text
          text: I'll record both entries in a single call.
        - type: tool_use
          id: toolcall_0
          name: mcp__host__add_artifact_or_reference
          input:
            items:
              - type: website
                label: Agent Host guide
                isArtifact: false
                link: https://example.com/agent-host
              - type: file
                label: Agent Host report
                isArtifact: true
                uri: file:///agent-host-report.md
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: 'Call add_artifact_or_reference exactly once with an items array containing two entries: type "website", label "Agent Host guide", isArtifact false, and link "https://example.com/agent-host"; then type "file", label "Agent Host report", isArtifact true, and uri "file:///agent-host-report.md". Then reply with exactly "recorded".'
        - role: assistant
          content:
            - type: text
              text: I'll record both entries in a single call.
            - type: tool_use
              name: mcp__host__add_artifact_or_reference
              input:
                items:
                  - type: website
                    label: Agent Host guide
                    isArtifact: false
                    link: https://example.com/agent-host
                  - type: file
                    label: Agent Host report
                    isArtifact: true
                    uri: file:///agent-host-report.md
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Added reference: ${uuid_0} (website, reference) Agent Host guide — https://example.com/agent-host
                Added artifact: ${uuid_1} (file, artifact) Agent Host report — file:///agent-host-report.md
    response:
      content: recorded
      stopReason: end_turn

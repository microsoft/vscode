version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "WORKSPACE_TARGET_READY".
    response:
      content: WORKSPACE_TARGET_READY
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}/other", then reply exactly "filtered".
    response:
      content:
        - type: text
          text: I will run `list_sessions` once for the specified workspace, then return the exact required reply.
        - type: tool_use
          id: toolcall_0
          name: list_sessions
          input:
            workspace: ${workdir}/other
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}/other", then reply exactly "filtered".
        - role: assistant
          content: I will run `list_sessions` once for the specified workspace, then return the exact required reply.
        - role: assistant
          content:
            - type: tool_use
              name: list_sessions
              input:
                workspace: ${workdir}/other
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"codex:/${uuid_0}","title":"Reply exactly \"WORKSPACE_TARGET_READY\".","status":"idle","workingDirectory":"file://${workdir}/other","unread":true,"createdAt":"2026-08-02T02:20:50.000Z","modifiedAt":"2026-08-02T02:20:52.303Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"codex:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"codex:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'
    response:
      content: filtered
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace EDIT_ZERO with EDIT_ONE in successive.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Edit
          input:
            file_path: ${workdir}/successive.txt
            old_string: EDIT_ZERO
            new_string: EDIT_ONE
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}

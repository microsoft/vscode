      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Read successive.txt with Read, then use Edit exactly once to replace EDIT_ZERO with EDIT_ONE. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/successive.txt
      stopReason: tool_use

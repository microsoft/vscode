            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/successive.txt
                old_string: EDIT_ZERO
                new_string: EDIT_ONE
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The file ${workdir}/successive.txt has been updated successfully.
    response:
      content: EDIT_DONE

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Remember DIRECTORY_MEMORY. Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Remember DIRECTORY_MEMORY. Reply exactly "ready".
        - role: assistant
          content: ready
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''restored.txt'', require(''fs'').readFileSync(''marker.txt''))"`. Use the shell''s existing working directory: omit workdir, cwd, and all directory overrides from the tool arguments; do not prefix the command with cd or replace relative paths. Then reply exactly "done".'
    response:
      content:
        - type: text
          text: I'll run that command as-is in the current working directory.
        - type: tool_use
          id: toolcall_0
          name: Bash
          input:
            command: node -e "require('fs').writeFileSync('restored.txt', require('fs').readFileSync('marker.txt'))"
            description: Copy marker.txt to restored.txt via node
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Remember DIRECTORY_MEMORY. Reply exactly "ready".
        - role: assistant
          content: ready
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''restored.txt'', require(''fs'').readFileSync(''marker.txt''))"`. Use the shell''s existing working directory: omit workdir, cwd, and all directory overrides from the tool arguments; do not prefix the command with cd or replace relative paths. Then reply exactly "done".'
        - role: assistant
          content:
            - type: text
              text: I'll run that command as-is in the current working directory.
            - type: tool_use
              name: Bash
              input:
                command: node -e "require('fs').writeFileSync('restored.txt', require('fs').readFileSync('marker.txt'))"
                description: Copy marker.txt to restored.txt via node
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: (Bash completed with no output)
    response:
      content: done
      stopReason: end_turn

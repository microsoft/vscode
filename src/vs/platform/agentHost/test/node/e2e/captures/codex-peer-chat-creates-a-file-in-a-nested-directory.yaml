version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "const fs=require(''fs'');fs.mkdirSync(''peer-output'',{recursive:true});fs.writeFileSync(''peer-output/report.txt'',''PEER_NESTED'')"`. Then reply with exactly "created".'
    response:
      content:
        - type: text
          text: Got it — I’ll run that exact command now.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "const fs=require('fs');fs.mkdirSync('peer-output',{recursive:true});fs.writeFileSync('peer-output/report.txt','PEER_NESTED')"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "const fs=require(''fs'');fs.mkdirSync(''peer-output'',{recursive:true});fs.writeFileSync(''peer-output/report.txt'',''PEER_NESTED'')"`. Then reply with exactly "created".'
        - role: assistant
          content: Got it — I’ll run that exact command now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "const fs=require('fs');fs.mkdirSync('peer-output',{recursive:true});fs.writeFileSync('peer-output/report.txt','PEER_NESTED')"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: 0046ef
                Wall time: 0.0000 seconds
                Process exited with code 0
                Original token count: 0
                Output:
    response:
      content: created
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call listComments exactly once, then reply exactly "listed".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: listComments
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call listComments exactly once, then reply exactly "listed".
        - role: assistant
          content:
            - type: tool_use
              name: listComments
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                {
                  "comments": [
                    {
                      "id": "accepted-comment",
                      "resourceUri": "untitled://server-tools/reviewed.ts",
                      "range": {
                        "startLineNumber": 2,
                        "startColumn": 3,
                        "endLineNumber": 2,
                        "endColumn": 9
                      },
                      "text": "visible",
                      "kind": "codeReview",
                      "resolved": false,
                      "replies": [
                        "reply"
                      ]
                    }
                  ],
                  "note": "There is 1 code review comment which the user has not reviewed yet. If the user wants you to tackle them, call the `viewUnreviewedComments` tool to view them."
                }
    response:
      content: listed
      stopReason: end_turn

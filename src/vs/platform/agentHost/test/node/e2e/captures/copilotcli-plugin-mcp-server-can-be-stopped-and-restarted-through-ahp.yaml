version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ready".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: customization_probe_server-customization_probe
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ready".
        - role: assistant
          content:
            - type: tool_use
              name: customization_probe_server-customization_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: MCP_PLUGIN_RESULT
    response:
      content: ready
      stopReason: end_turn

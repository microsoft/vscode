            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: e9b22f
                Wall time: 0.1643 seconds
                Process exited with code 0
                Original token count: 4
                Output:
                NESTED_VALUE_42
    response:
      content: NESTED_VALUE_42
      stopReason: end_turn

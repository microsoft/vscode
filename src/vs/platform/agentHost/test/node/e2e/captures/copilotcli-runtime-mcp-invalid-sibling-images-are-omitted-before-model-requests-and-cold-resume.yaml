version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call runtime_probe exactly once with tag "images", then reply exactly MCP_IMAGES_READY. Do not call any other tools.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: runtime-probe-runtime_probe
          input:
            tag: images
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call runtime_probe exactly once with tag "images", then reply exactly MCP_IMAGES_READY. Do not call any other tools.
        - role: assistant
          content:
            - type: tool_use
              name: runtime-probe-runtime_probe
              input:
                tag: images
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content:
                - type: text
                  text: |-
                    MCP_PROBE:images
                    [MCP image omitted because its data was invalid or its MIME type unsupported]
                - type: image
    response:
      content: MCP_IMAGES_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call runtime_probe exactly once with tag "images", then reply exactly MCP_IMAGES_READY. Do not call any other tools.
        - role: assistant
          content:
            - type: tool_use
              name: runtime-probe-runtime_probe
              input:
                tag: images
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content:
                - type: text
                  text: |-
                    MCP_PROBE:images
                    [MCP image omitted because its data was invalid or its MIME type unsupported]
                - type: image
        - role: assistant
          content: MCP_IMAGES_READY
        - role: user
          content: Reply exactly MCP_IMAGES_RESUMED. Do not call tools.
    response:
      content: MCP_IMAGES_RESUMED
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content:
            - type: text
              text: Reply with only the value from the attachment.
            - type: text
              text: |-
                <attachment mimeType="text/plain" name="facts.txt">
                ATTACHMENT_SIMPLE_VALUE
                </attachment>
    response:
      content: ATTACHMENT_SIMPLE_VALUE
      stopReason: end_turn

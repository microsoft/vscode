version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readdirSync(''.'').join('' ''))"`. Then reply with the filenames it printed and nothing else.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: ${shell}
          input:
            command: node -e "console.log(require('fs').readdirSync('.').join(' '))"
            description: List files in current directory
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readdirSync(''.'').join('' ''))"`. Then reply with the filenames it printed and nothing else.'
        - role: assistant
          content:
            - type: tool_use
              name: bash
              input:
                command: node -e "console.log(require('fs').readdirSync('.').join(' '))"
                description: List files in current directory
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                first.txt second.md
                <shellId: 0 completed with exit code 0>
    response:
      content: first.txt second.md
      stopReason: end_turn

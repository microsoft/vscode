version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
    response:
      content: SEED_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Use your file editing tool exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER in middle.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: edit
          input:
            path: ${workdir}/middle.txt
            old_str: MIDDLE_BEFORE
            new_str: MIDDLE_AFTER
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Use your file editing tool exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER in middle.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/middle.txt
                old_str: MIDDLE_BEFORE
                new_str: MIDDLE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/middle.txt updated with changes.
    response:
      content: EDIT_DONE
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Use your file editing tool exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER in middle.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/middle.txt
                old_str: MIDDLE_BEFORE
                new_str: MIDDLE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/middle.txt updated with changes.
        - role: assistant
          content: EDIT_DONE
        - role: user
          content: Remember AFTER_BOUNDARY_EXCLUDED. Reply exactly "EXCLUDED_READY".
    response:
      content: EXCLUDED_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Use your file editing tool exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER in middle.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/middle.txt
                old_str: MIDDLE_BEFORE
                new_str: MIDDLE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/middle.txt updated with changes.
        - role: assistant
          content: EDIT_DONE
        - role: user
          content: Reply exactly "FORK_HISTORY_READY". Do not use tools.
    response:
      content: FORK_HISTORY_READY
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            Read the attached resource and reply with only its exact contents.

            <tagged_files>
            * ${workdir}/resource.txt (1 lines)
            </tagged_files>
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/resource.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            Read the attached resource and reply with only its exact contents.

            <tagged_files>
            * ${workdir}/resource.txt (1 lines)
            </tagged_files>
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/resource.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 1. ATTACHMENT_RESOURCE_VALUE
    response:
      content: ATTACHMENT_RESOURCE_VALUE
      stopReason: end_turn

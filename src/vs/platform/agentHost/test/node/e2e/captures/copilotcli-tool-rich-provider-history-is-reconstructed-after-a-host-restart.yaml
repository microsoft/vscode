version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use edit exactly once to replace before with after in history.txt. Do not run a shell command. Then reply exactly "history-ready".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: edit
          input:
            path: ${workdir}/history.txt
            old_str: before
            new_str: after
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use edit exactly once to replace before with after in history.txt. Do not run a shell command. Then reply exactly "history-ready".
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/history.txt
                old_str: before
                new_str: after
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/history.txt updated with changes.
    response:
      content: history-ready
      stopReason: end_turn

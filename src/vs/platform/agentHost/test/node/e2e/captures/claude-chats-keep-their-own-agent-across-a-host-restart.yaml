version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "alpha".
    response:
      content: alpha
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "beta".
    response:
      content: beta
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "alpha".
        - role: assistant
          content: alpha
        - role: user
          content: Reply exactly "delta".
    response:
      content: delta
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "beta".
        - role: assistant
          content: beta
        - role: user
          content: Reply exactly "epsilon".
    response:
      content: epsilon
      stopReason: end_turn

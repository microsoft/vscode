version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Remember the code word OLD_PEER. Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "new".
    response:
      content: new
      stopReason: end_turn

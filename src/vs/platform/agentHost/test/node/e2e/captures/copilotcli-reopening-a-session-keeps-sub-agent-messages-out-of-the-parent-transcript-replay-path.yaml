version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Use the `task` tool to spawn a subagent to list the files in the current working directory. Explicitly set the subagent model to `claude-sonnet-5`. Instruct the subagent to begin its response with this sentence on its own line: subagent replay note sentinel-7f3a. Then the subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to list the files; do not run a shell command. After the subagent completes, you, the main agent, must reply exactly "SUBAGENT_DONE" and must not repeat that sentence.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: task
          input:
            name: list-files
            agent_type: explore
            model: claude-sonnet-5
            description: List files in cwd
            prompt: |-
              Begin your response with this exact sentence on its own line: subagent replay note sentinel-7f3a

              Then, using a single read-only file-listing tool call (e.g. `view` on the current working directory, or `glob`), list the files in the current working directory. Do not run any shell command. Report the resulting file list.
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            Begin your response with this exact sentence on its own line: subagent replay note sentinel-7f3a

            Then, using a single read-only file-listing tool call (e.g. `view` on the current working directory, or `glob`), list the files in the current working directory. Do not run any shell command. Report the resulting file list.
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: view
          input:
            path: ${workdir}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: |-
            Begin your response with this exact sentence on its own line: subagent replay note sentinel-7f3a

            Then, using a single read-only file-listing tool call (e.g. `view` on the current working directory, or `glob`), list the files in the current working directory. Do not run any shell command. Report the resulting file list.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: |-
                file-a.txt
                file-b.txt
    response:
      content: |-
        subagent replay note sentinel-7f3a

        Files in the current working directory:
        - file-a.txt
        - file-b.txt
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Use the `task` tool to spawn a subagent to list the files in the current working directory. Explicitly set the subagent model to `claude-sonnet-5`. Instruct the subagent to begin its response with this sentence on its own line: subagent replay note sentinel-7f3a. Then the subagent should call a single read-only file-listing tool (e.g. `Glob` or `view`) to list the files; do not run a shell command. After the subagent completes, you, the main agent, must reply exactly "SUBAGENT_DONE" and must not repeat that sentence.'
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: task
              input:
                name: list-files
                agent_type: explore
                model: claude-sonnet-5
                description: List files in cwd
                prompt: |-
                  Begin your response with this exact sentence on its own line: subagent replay note sentinel-7f3a

                  Then, using a single read-only file-listing tool call (e.g. `view` on the current working directory, or `glob`), list the files in the current working directory. Do not run any shell command. Report the resulting file list.
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                subagent replay note sentinel-7f3a

                Files in the current working directory:
                - file-a.txt
                - file-b.txt
    response:
      content: SUBAGENT_DONE
      stopReason: end_turn

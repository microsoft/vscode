version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call ask_user exactly once to ask "Which option?" with choices "Alpha" and "Beta". If the answer says the user is unavailable, reply exactly "AUTO_REPLIED".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: ask_user
          input:
            question: Which option?
            choices:
              - Alpha
              - Beta
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call ask_user exactly once to ask "Which option?" with choices "Alpha" and "Beta". If the answer says the user is unavailable, reply exactly "AUTO_REPLIED".
        - role: assistant
          content:
            - type: tool_use
              name: ask_user
              input:
                question: Which option?
                choices:
                  - Alpha
                  - Beta
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'User responded: The user is not available to answer your question. Choose a pragmatic option best aligned with the context of the request.'
    response:
      content: AUTO_REPLIED
      stopReason: end_turn

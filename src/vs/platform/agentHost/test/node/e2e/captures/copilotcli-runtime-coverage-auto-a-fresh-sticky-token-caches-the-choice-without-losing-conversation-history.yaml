      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word AUTO_STICKY. Do not use tools. Reply exactly READY.
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word AUTO_STICKY. Do not use tools. Reply exactly READY.

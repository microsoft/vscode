version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call get_magic_word exactly once, then reply with only its result.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: get_magic_word
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call get_magic_word exactly once, then reply with only its result.
        - role: assistant
          content:
            - type: tool_use
              name: get_magic_word
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: XYLOPHONE
    response:
      content: XYLOPHONE
      stopReason: end_turn

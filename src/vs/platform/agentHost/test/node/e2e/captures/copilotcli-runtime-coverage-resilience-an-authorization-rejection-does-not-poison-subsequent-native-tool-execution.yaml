version: 1
dialect: anthropic
exchanges:
  - method: POST
    path: /v1/messages
    response:
      status: 403
      headers:
        content-type: application/json
      body: '{"type":"error","error":{"type":"api_error","message":"RESILIENCE_FORBIDDEN","code":"RESILIENCE_FORBIDDEN"}}'
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content:
            - type: text
              text: Reply exactly TRANSPORT_READY. Do not call any tools.
            - type: text
              text: Call view exactly once on "${workdir}/recovery.txt". Do not use other tools. Reply exactly RECOVERY_READ.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/recovery.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content:
            - type: text
              text: Reply exactly TRANSPORT_READY. Do not call any tools.
            - type: text
              text: Call view exactly once on "${workdir}/recovery.txt". Do not use other tools. Reply exactly RECOVERY_READ.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: view
              input:
                path: ${workdir}/recovery.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: LOCAL_TRANSPORT_RECOVERY
    response:
      content: RECOVERY_READ
      stopReason: end_turn

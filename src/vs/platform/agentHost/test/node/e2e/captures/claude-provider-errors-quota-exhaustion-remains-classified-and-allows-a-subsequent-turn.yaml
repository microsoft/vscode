version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - method: POST
    path: /v1/messages
    response:
      status: 402
      headers:
        content-type: application/json
        x-should-retry: 'false'
        retry-after: '0'
      body: '{"type":"error","error":{"type":"quota_exceeded","code":"quota_exceeded","message":"Injected E2E quota exhaustion failure."},"request_id":"e2e-classified-error"}'
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
        - role: assistant
          content: READY
        - role: user
          content:
            - type: text
              text: Reply exactly "UNEXPECTED_SUCCESS".
            - type: text
              text: Reply exactly "RECOVERED".
    response:
      content: RECOVERED
      stopReason: end_turn

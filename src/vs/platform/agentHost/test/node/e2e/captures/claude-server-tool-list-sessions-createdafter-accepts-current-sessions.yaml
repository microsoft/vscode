version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}" and createdAfter "2000-01-01T00:00:00Z", then reply exactly "filtered".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: mcp__host__list_sessions
          input:
            workspace: ${workdir}
            createdAfter: '2000-01-01T00:00:00Z'
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}" and createdAfter "2000-01-01T00:00:00Z", then reply exactly "filtered".
        - role: assistant
          content:
            - type: tool_use
              name: mcp__host__list_sessions
              input:
                workspace: ${workdir}
                createdAfter: '2000-01-01T00:00:00Z'
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"claude:/${uuid_0}","title":"Call list_sessions exactly once with workspace \"${workdir}\" and createdAfter \"2000-01-01T00:00:00Z\", then reply exa","status":"inProgress","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-02T04:56:45.593Z","modifiedAt":"2026-08-02T04:56:44.589Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"claude:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"claude:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'

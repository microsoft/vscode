              content: LIVE_PROBE_RESULT
        - role: assistant
          content: LIVE_PROBE_RESULT
        - role: user
          content: Call shared_probe exactly once with newLabel set to default. Use its current schema.
    response:
      content:
        - type: tool_use
          id: toolcall_2
          name: shared_probe
          input:
            newLabel: default
      stopReason: tool_use
  - request:

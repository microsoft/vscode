        - role: user
          content: Call shared_probe exactly once with oldLabel set to peer.
        - role: assistant
          content:
            - type: tool_use
              name: shared_probe
              input:
                oldLabel: peer
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: LIVE_PROBE_RESULT
    response:
      content: 'The probe returned: **LIVE_PROBE_RESULT**'
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create default-provider.txt containing exactly DEFAULT_PROVIDER using your file creation tool; do not run a shell command. Then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Write
          input:
            file_path: ${workdir}/default-provider.txt
            content: |
              DEFAULT_PROVIDER
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create default-provider.txt containing exactly DEFAULT_PROVIDER using your file creation tool; do not run a shell command. Then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/default-provider.txt
                content: |
                  DEFAULT_PROVIDER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'File created successfully at: ${workdir}/default-provider.txt (file state is current in your context — no need to Read it back)'
    response:
      content: created
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create peer-provider.txt containing exactly PEER_PROVIDER using your file creation tool; do not run a shell command. Then reply exactly "created".
    response:
      content:
        - type: text
          text: I'll create the file with the Write tool.
        - type: tool_use
          id: toolcall_1
          name: Write
          input:
            file_path: ${workdir}/peer-provider.txt
            content: PEER_PROVIDER
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create peer-provider.txt containing exactly PEER_PROVIDER using your file creation tool; do not run a shell command. Then reply exactly "created".
        - role: assistant
          content:
            - type: text
              text: I'll create the file with the Write tool.
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/peer-provider.txt
                content: PEER_PROVIDER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: 'File created successfully at: ${workdir}/peer-provider.txt (file state is current in your context — no need to Read it back)'
    response:
      content: created
      stopReason: end_turn

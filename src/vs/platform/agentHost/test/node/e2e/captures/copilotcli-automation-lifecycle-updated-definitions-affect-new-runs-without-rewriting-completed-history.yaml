version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "AUTOMATION_FIRST".
    response:
      content: AUTOMATION_FIRST
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "AUTOMATION_SECOND".
    response:
      content: AUTOMATION_SECOND
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Try to read ${workdir}/peer-missing.txt. If it does not exist, reply exactly "missing". Use your file tools; do not run a shell command.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: view
          input:
            path: ${workdir}/peer-missing.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Try to read ${workdir}/peer-missing.txt. If it does not exist, reply exactly "missing". Use your file tools; do not run a shell command.
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/peer-missing.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Path ${workdir}/peer-missing.txt does not exist. Please provide a valid path.
    response:
      content: missing
      stopReason: end_turn

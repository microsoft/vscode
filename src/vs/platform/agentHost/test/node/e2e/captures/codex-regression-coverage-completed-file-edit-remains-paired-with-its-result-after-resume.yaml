version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: text
          text: Applying the requested single edit now.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: |-
              apply_patch <<'PATCH'
              *** Begin Patch
              *** Update File: paired.txt
              @@
              -PAIR_BEFORE
              +PAIR_AFTER
              *** End Patch
              PATCH
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content: Applying the requested single edit now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: |-
                  apply_patch <<'PATCH'
                  *** Begin Patch
                  *** Update File: paired.txt
                  @@
                  -PAIR_BEFORE
                  +PAIR_AFTER
                  *** End Patch
                  PATCH
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Wall time: 0.0000 seconds
                Output:
                Exit code: 0
                Wall time: 0 seconds
                Output:
                Success. Updated the following files:
                M paired.txt
    response:
      content: EDIT_DONE
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PAIR_BEFORE with PAIR_AFTER in paired.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content: Applying the requested single edit now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: |-
                  apply_patch <<'PATCH'
                  *** Begin Patch
                  *** Update File: paired.txt
                  @@
                  -PAIR_BEFORE
                  +PAIR_AFTER
                  *** End Patch
                  PATCH
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Wall time: 0.0000 seconds
                Output:
                Exit code: 0
                Wall time: 0 seconds
                Output:
                Success. Updated the following files:
                M paired.txt
        - role: assistant
          content: EDIT_DONE
        - role: user
          content: Reply exactly "HISTORY_READY". Do not use tools.
    response:
      content: HISTORY_READY
      stopReason: end_turn

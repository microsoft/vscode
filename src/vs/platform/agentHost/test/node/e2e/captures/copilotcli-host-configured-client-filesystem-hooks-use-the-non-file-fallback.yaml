version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call customization_probe exactly once, then reply that the tool was denied.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: customization_probe_server-customization_probe
          input: {}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call customization_probe exactly once, then reply that the tool was denied.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: customization_probe_server-customization_probe
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Denied by preToolUse hook: non-file fallback denied'
    response:
      content: The tool call was denied.
      stopReason: end_turn

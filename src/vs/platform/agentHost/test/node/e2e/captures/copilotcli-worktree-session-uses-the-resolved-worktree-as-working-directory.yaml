version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
    response:
      content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
        - role: assistant
          content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
        - role: user
          content: 'Run the shell command: pwd'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: ${shell}
          input:
            command: pwd
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
        - role: assistant
          content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
        - role: user
          content: 'Run the shell command: pwd'
        - role: assistant
          content:
            - type: tool_use
              name: bash
              input:
                command: pwd
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "Shell ID: ${uuid_0}\nExit code: 0\n${workdir}.worktrees/what-is-your-current-working-directory-reply-wit\r\n%"
    response:
      content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
      stopReason: end_turn

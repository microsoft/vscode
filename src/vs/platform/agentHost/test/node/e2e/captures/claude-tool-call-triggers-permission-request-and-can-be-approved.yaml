version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: 'Run the shell command: echo "hello from test"'
    response:
      content:
        - type: text
          text: I'll run that command for you.
        - type: tool_use
          id: toolcall_0
          name: Bash
          input:
            command: echo "hello from test"
            description: Echo a test message
      stopReason: tool_use
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: 'Run the shell command: echo "hello from test"'
        - role: assistant
          content:
            - type: text
              text: I'll run that command for you.
            - type: tool_use
              name: Bash
              input:
                command: echo "hello from test"
                description: Echo a test message
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: hello from test
    response:
      content: 'Output: `hello from test`'
      stopReason: end_turn

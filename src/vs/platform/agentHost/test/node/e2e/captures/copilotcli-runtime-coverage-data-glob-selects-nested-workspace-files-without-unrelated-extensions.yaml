version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call glob exactly once with pattern "src/**/*.ts" in the workspace. Do not use another tool. Reply exactly GLOB_CHECKED.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: glob
          input:
            pattern: src/**/*.ts
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call glob exactly once with pattern "src/**/*.ts" in the workspace. Do not use another tool. Reply exactly GLOB_CHECKED.
        - role: assistant
          content:
            - type: tool_use
              name: glob
              input:
                pattern: src/**/*.ts
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                .\src\one.ts
                .\src\nested\two.ts
    response:
      content: GLOB_CHECKED
      stopReason: end_turn

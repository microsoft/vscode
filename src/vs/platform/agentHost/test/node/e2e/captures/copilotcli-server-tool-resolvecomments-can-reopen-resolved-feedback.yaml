        - role: user
          content: Call resolveComments exactly once with commentIds ["reopen-me"] and resolved false, then reply exactly "reopened".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: resolveComments
          input:
            commentIds:
              - reopen-me
            resolved: false
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call resolveComments exactly once with commentIds ["reopen-me"] and resolved false, then reply exactly "reopened".
        - role: assistant
          content:
            - type: tool_use
              name: resolveComments
              input:
                commentIds:
                  - reopen-me
                resolved: false
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                {
                  "resolved": false,
                  "updatedCommentIds": [
                    "reopen-me"
                  ],
                  "notFoundCommentIds": [],
                  "comments": [
                    {
                      "id": "reopen-me",
                      "resourceUri": "untitled://server-tools/reviewed.ts",
                      "range": {
                        "startLineNumber": 2,
                        "startColumn": 3,
                        "endLineNumber": 2,
                        "endColumn": 9
                      },
                      "text": "reopen",
                      "kind": "codeReview",
                      "resolved": false
                    }

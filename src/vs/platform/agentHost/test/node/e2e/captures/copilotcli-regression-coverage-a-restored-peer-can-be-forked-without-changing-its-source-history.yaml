version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember DEFAULT_FORK_EXCLUDED. Reply exactly "DEFAULT_READY".
    response:
      content: DEFAULT_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
    response:
      content: PEER_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
    response:
      content: PEER_LATER_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Reply exactly "FORK_CONTINUED". Do not use tools.
    response:
      content: FORK_CONTINUED
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
        - role: assistant
          content: PEER_LATER_READY
        - role: user
          content: Use your file editing tool exactly once to replace SOURCE_BEFORE with SOURCE_AFTER in source-continues.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: edit
          input:
            path: ${workdir}/source-continues.txt
            old_str: SOURCE_BEFORE
            new_str: SOURCE_AFTER
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Remember PEER_FORK_INCLUDED. Reply exactly "PEER_READY".
        - role: assistant
          content: PEER_READY
        - role: user
          content: Remember PEER_LATER_EXCLUDED. Reply exactly "PEER_LATER_READY".
        - role: assistant
          content: PEER_LATER_READY
        - role: user
          content: Use your file editing tool exactly once to replace SOURCE_BEFORE with SOURCE_AFTER in source-continues.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/source-continues.txt
                old_str: SOURCE_BEFORE
                new_str: SOURCE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/source-continues.txt updated with changes.
    response:
      content: EDIT_DONE
      stopReason: end_turn

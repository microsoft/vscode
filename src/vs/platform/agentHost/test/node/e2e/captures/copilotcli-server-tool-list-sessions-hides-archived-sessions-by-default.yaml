version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ARCHIVED_HIDDEN_READY".
    response:
      content: ARCHIVED_HIDDEN_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}", then reply exactly "listed".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: list_sessions
          input:
            workspace: ${workdir}
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call list_sessions exactly once with workspace "${workdir}", then reply exactly "listed".
        - role: assistant
          content:
            - type: tool_use
              name: list_sessions
              input:
                workspace: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: '{"sessions":[{"session":"copilotcli:/${uuid_0}","title":"Call list_sessions exactly once with workspace \"${workdir}\", then reply exactly \"listed\".","status":"inProgress","workingDirectory":"file://${workdir}","unread":true,"createdAt":"2026-08-15T23:05:12.573Z","modifiedAt":"2026-08-15T23:05:12.170Z","changesets":[{"label":"All Changes","changeKind":"session","uriTemplate":"copilotcli:/${uuid_0}/changeset/session","description":"Show all changes made in this session"},{"label":"This Turn","changeKind":"turn","uriTemplate":"copilotcli:/${uuid_0}/changeset/turn/{turnId}","description":"Show changes made in this turn"}]}]}'
    response:
      content: listed
      stopReason: end_turn

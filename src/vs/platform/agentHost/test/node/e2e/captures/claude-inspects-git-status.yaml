version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Inspect git status. Reply with the names of the modified and untracked files only.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Bash
          input:
            command: git status --short
            description: Show git status
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Inspect git status. Reply with the names of the modified and untracked files only.
        - role: assistant
          content:
            - type: tool_use
              name: Bash
              input:
                command: git status --short
                description: Show git status
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                M tracked.txt
                ?? untracked.txt
    response:
      content: |-
        Modified: `tracked.txt`
        Untracked: `untracked.txt`
      stopReason: end_turn

version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - method: POST
    path: /responses
    response:
      status: 402
      headers:
        content-type: application/json
        x-should-retry: 'false'
        retry-after: '0'
      body: '{"type":"error","error":{"type":"quota_exceeded","code":"quota_exceeded","message":"Injected E2E quota exhaustion failure."},"request_id":"e2e-classified-error"}'
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
        - role: assistant
          content: READY
        - role: user
          content: Reply exactly "UNEXPECTED_SUCCESS".
    response:
      content: UNEXPECTED_SUCCESS
      stopReason: end_turn
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "READY".
        - role: assistant
          content: READY
        - role: user
          content: Reply exactly "UNEXPECTED_SUCCESS".
        - role: assistant
          content: UNEXPECTED_SUCCESS
        - role: user
          content: Reply exactly "RECOVERED".
    response:
      content: RECOVERED
      stopReason: end_turn

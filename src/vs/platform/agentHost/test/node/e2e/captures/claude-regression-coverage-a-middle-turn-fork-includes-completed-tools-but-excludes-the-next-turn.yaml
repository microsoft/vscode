        - role: assistant
          content: EDIT_DONE
        - role: user
          content: Remember AFTER_BOUNDARY_EXCLUDED. Reply exactly "EXCLUDED_READY".
    response:
      content: EXCLUDED_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5

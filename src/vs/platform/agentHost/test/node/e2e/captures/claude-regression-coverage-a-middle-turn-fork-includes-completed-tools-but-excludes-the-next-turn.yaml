version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
    response:
      content: SEED_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Read middle.txt with Read, then use Edit exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/middle.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".

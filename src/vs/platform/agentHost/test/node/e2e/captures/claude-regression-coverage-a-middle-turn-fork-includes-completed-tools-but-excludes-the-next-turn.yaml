          content: Read middle.txt with Read, then use Edit exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/middle.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tMIDDLE_BEFORE\n2"
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: Edit
          input:
            file_path: ${workdir}/middle.txt
            old_string: MIDDLE_BEFORE
            new_string: MIDDLE_AFTER
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY
        - role: user
          content: Read middle.txt with Read, then use Edit exactly once to replace MIDDLE_BEFORE with MIDDLE_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/middle.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tMIDDLE_BEFORE\n2"
        - role: assistant
          content:
            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/middle.txt
                old_string: MIDDLE_BEFORE
                new_string: MIDDLE_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: The file ${workdir}/middle.txt has been updated successfully. (file state is current in your context — no need to Read it back)
    response:
      content: EDIT_DONE
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember MIDDLE_FORK_SEED. Reply exactly "SEED_READY".
        - role: assistant
          content: SEED_READY

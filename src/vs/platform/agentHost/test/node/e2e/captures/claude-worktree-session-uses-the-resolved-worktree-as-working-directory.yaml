version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
    response:
      content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
      stopReason: end_turn
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
        - role: assistant
          content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
        - role: user
          content: 'Run exactly this shell command, with no modifications, in the session current working directory: `node -e "console.log(process.cwd())"`. Do not specify a working-directory override.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Bash
          input:
            command: node -e "console.log(process.cwd())"
            description: Print Node.js current working directory
      stopReason: tool_use
  - request:
      model: claude-opus-4.8
      system: ${system}
      messages:
        - role: user
          content: What is your current working directory? Reply with just the absolute path and nothing else.
        - role: assistant
          content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
        - role: user
          content: 'Run exactly this shell command, with no modifications, in the session current working directory: `node -e "console.log(process.cwd())"`. Do not specify a working-directory override.'
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: Bash
              input:
                command: node -e "console.log(process.cwd())"
                description: Print Node.js current working directory
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
    response:
      content: ${workdir}.worktrees/what-is-your-current-working-directory-reply-wit
      stopReason: end_turn

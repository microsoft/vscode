version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "otel-capture-denied".
    response:
      content: otel-capture-denied
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "otel-capture-enabled".
    response:
      content: otel-capture-enabled
      stopReason: end_turn

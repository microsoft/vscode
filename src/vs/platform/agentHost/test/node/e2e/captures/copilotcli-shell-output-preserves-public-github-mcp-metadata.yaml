version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Run exactly `node -e "console.log('https://github.com/github/copilot-sdk/pull/1')"` with your shell tool. Then reply exactly "DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: ${shell}
          input:
            command: node -e "console.log('https://github.com/github/copilot-sdk/pull/1')"
            description: Print a URL string
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Run exactly `node -e "console.log('https://github.com/github/copilot-sdk/pull/1')"` with your shell tool. Then reply exactly "DONE".
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: bash
              input:
                command: node -e "console.log('https://github.com/github/copilot-sdk/pull/1')"
                description: Print a URL string
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                https://github.com/github/copilot-sdk/pull/1
                <shellId: 0 completed with exit code 0>
    response:
      content: DONE
      stopReason: end_turn

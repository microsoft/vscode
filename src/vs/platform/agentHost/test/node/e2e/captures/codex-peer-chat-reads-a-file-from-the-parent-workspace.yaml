version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "process.stdout.write(require(''fs'').readFileSync(''peer-note.txt'',''utf8''))"`. Then reply with its exact output only.'
    response:
      content:
        - type: text
          text: Got it — running that exact command now.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "process.stdout.write(require('fs').readFileSync('peer-note.txt','utf8'))"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "process.stdout.write(require(''fs'').readFileSync(''peer-note.txt'',''utf8''))"`. Then reply with its exact output only.'
        - role: assistant
          content: Got it — running that exact command now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "process.stdout.write(require('fs').readFileSync('peer-note.txt','utf8'))"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: ee9e06
                Wall time: 0.0000 seconds
                Process exited with code 0
                Original token count: 4
                Output:
                PEER_FILE_VALUE
    response:
      content: PEER_FILE_VALUE
      stopReason: end_turn

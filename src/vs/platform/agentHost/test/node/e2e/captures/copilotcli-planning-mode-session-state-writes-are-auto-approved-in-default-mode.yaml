      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: '[[PLAN]] Help me implement a Python script that prints "hello world" to stdout. Write the shortest possible plan to your session plan.md and use the `exit_plan_mode` tool to ask me to approve it before writing any code.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: create
          input:
            path: ${homedir}/.copilot/session-state/${uuid_0}/plan.md
            file_text: |
              # Plan: Hello World Script

              Create `hello.py` that prints `hello world` to stdout.

              ## Todo
              - Create `hello.py` with `print("hello world")`
        - type: tool_use
          id: toolcall_1
          name: sql
          input:
            query: INSERT INTO todos (id, title, description) VALUES ('create-hello-script', 'Creating hello world script', 'Create hello.py containing print("hello world") so running `python hello.py` prints hello world to stdout.')
            description: Insert hello world todo
      stopReason: tool_use

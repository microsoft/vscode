          content: 'Call web_fetch exactly once with this exact JSON input: {"url":"${url_web}/bom"}. Do not use any other tools, retry, or follow links. If the tool fails, do not use a fallback. Then reply exactly WEB_CHECKED.'
        - role: assistant
          content:
            - type: tool_use
              name: web_fetch
              input:
                url: ${url_web}/bom
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Contents of ${url_web}/bom:
                # BOM_MARKER café 🙂
    response:
      content: WEB_CHECKED

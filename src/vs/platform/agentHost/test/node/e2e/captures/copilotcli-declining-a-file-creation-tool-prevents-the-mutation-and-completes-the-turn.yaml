version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create denied.txt containing exactly DENIED_CONTENT using your file creation tool. If permission is denied, reply exactly "denied".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: create
          input:
            path: ${workdir}/denied.txt
            file_text: DENIED_CONTENT
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Create denied.txt containing exactly DENIED_CONTENT using your file creation tool. If permission is denied, reply exactly "denied".
        - role: assistant
          content:
            - type: tool_use
              name: create
              input:
                path: ${workdir}/denied.txt
                file_text: DENIED_CONTENT
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Failed to execute with arguments: {"path":"${workdir}/denied.txt","file_text":"DENIED_CONTENT","command":"create"} due to error: Error: host effect requestPermission failed: Error: permission host returned malformed payload: unknown variant `denied-interactively-by-user`, expected one of `approve-once`, `approve-for-session`, `approve-for-location`, `reject`, `user-not-available`, `approved`'
    response:
      content: denied
      stopReason: end_turn

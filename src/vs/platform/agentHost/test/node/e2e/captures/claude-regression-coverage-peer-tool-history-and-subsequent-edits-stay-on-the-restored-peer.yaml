                replace_all: false
                file_path: ${workdir}/peer-edit.txt
                old_string: PEER_BEFORE
                new_string: PEER_MIDDLE
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: The file ${workdir}/peer-edit.txt has been updated successfully.
    response:
      content: EDIT_DONE

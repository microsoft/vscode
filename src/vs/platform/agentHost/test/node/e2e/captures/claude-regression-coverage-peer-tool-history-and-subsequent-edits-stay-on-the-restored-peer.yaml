version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember DEFAULT_HISTORY_ONLY. Reply exactly "DEFAULT_READY".
    response:
      content: DEFAULT_READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PEER_BEFORE with PEER_MIDDLE in peer-edit.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Edit
          input:
            file_path: ${workdir}/peer-edit.txt
            old_string: PEER_BEFORE
            new_string: PEER_MIDDLE
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace PEER_BEFORE with PEER_MIDDLE in peer-edit.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".

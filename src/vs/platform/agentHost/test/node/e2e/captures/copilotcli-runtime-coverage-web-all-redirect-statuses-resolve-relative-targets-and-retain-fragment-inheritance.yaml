version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch exactly once with this exact JSON input: {"url":"${url_web}/redirect/start#chapter"}. Do not use any other tools, retry, or follow links. If the tool fails, do not use a fallback. Then reply exactly WEB_CHECKED.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: web_fetch
          input:
            url: ${url_web}/redirect/start#chapter
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch exactly once with this exact JSON input: {"url":"${url_web}/redirect/start#chapter"}. Do not use any other tools, retry, or follow links. If the tool fails, do not use a fallback. Then reply exactly WEB_CHECKED.'
        - role: assistant
          content:
            - type: tool_use
              name: web_fetch
              input:
                url: ${url_web}/redirect/start#chapter
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Contents of ${url_web}/redirect/final?fixture=synthetic#chapter (redirected from ${url_web}/redirect/start#chapter):
                REDIRECT_FINAL_MARKER
    response:
      content: WEB_CHECKED
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-4.6
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
        - role: assistant
          content: ready
        - role: user
          content:
            - type: text
              text: '<local-command-caveat>Caveat: The messages below were generated by the user while running local commands. DO NOT respond to these messages or otherwise consider them in your response unless the user explicitly asks you to.</local-command-caveat>'
            - type: text
              text: |-
                <command-name>/model</command-name>
                            <command-message>model</command-message>
                            <command-args>claude-opus-5</command-args>
            - type: text
              text: <local-command-stdout>Set model to `claude-opus-5`</local-command-stdout>
            - type: text
              text: Reply with only the exact code word I asked you to remember.
    response:
      content: MARIGOLD
      stopReason: end_turn

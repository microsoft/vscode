version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
    response:
      content: ready
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember the exact code word MARIGOLD. Reply exactly "ready".
        - role: assistant
          content: ready
        - role: user
          content:
            - type: text
              text: <local-command-caveat>The command below was run directly in Claude Code, not sent to you as a request, and its output goes straight to the user. It's recorded here as context for later messages.</local-command-caveat>
            - type: text
              text: |-
                <command-name>/model</command-name>
                            <command-message>model</command-message>
                            <command-args>claude-opus-5-5</command-args>
            - type: text
              text: <local-command-stdout>Set model to `claude-opus-5-5`</local-command-stdout>
            - type: text
              text: Reply with only the exact code word I asked you to remember.
    response:
      content: MARIGOLD
      stopReason: end_turn

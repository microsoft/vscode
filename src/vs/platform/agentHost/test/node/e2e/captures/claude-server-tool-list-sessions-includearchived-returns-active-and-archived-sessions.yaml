version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "ARCHIVED_INCLUDED_READY".
    response:
      content: ARCHIVED_INCLUDED_READY
      stopReason: end_turn

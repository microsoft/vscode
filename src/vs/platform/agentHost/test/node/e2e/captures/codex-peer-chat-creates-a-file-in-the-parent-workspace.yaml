version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''peer-created.txt'',''PEER_CREATED'')"`. Then reply exactly "created".'
    response:
      content:
        - type: text
          text: Running that exact command now.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "require('fs').writeFileSync('peer-created.txt','PEER_CREATED')"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "require(''fs'').writeFileSync(''peer-created.txt'',''PEER_CREATED'')"`. Then reply exactly "created".'
        - role: assistant
          content: Running that exact command now.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "require('fs').writeFileSync('peer-created.txt','PEER_CREATED')"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: b4137b
                Wall time: 0.0000 seconds
                Process exited with code 0
                Original token count: 0
                Output:
    response:
      content: created
      stopReason: end_turn

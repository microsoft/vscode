version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch with this exact input: {"url":"${url_deniedorigin}/probe"}. Call only that named tool exactly once, without retries, fallbacks, wrappers, or any other tool. Use only the specified synthetic fixture. After success or refusal, reply exactly DIAGNOSTICS_COMPLETE.'
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: web_fetch
          input:
            url: ${url_deniedorigin}/probe
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: 'Call web_fetch with this exact input: {"url":"${url_deniedorigin}/probe"}. Call only that named tool exactly once, without retries, fallbacks, wrappers, or any other tool. Use only the specified synthetic fixture. After success or refusal, reply exactly DIAGNOSTICS_COMPLETE.'
        - role: assistant
          content:
            - type: tool_use
              name: web_fetch
              input:
                url: ${url_deniedorigin}/probe
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Permission to access this URL was denied.
    response:
      content: DIAGNOSTICS_COMPLETE
      stopReason: end_turn

          content: 'Call web_fetch with this exact input: {"url":"${url_allowedorigin}/probe"}. Call only that named tool exactly once, without retries, fallbacks, wrappers, or any other tool. Use only the specified synthetic fixture. After success or refusal, reply exactly DIAGNOSTICS_COMPLETE.'

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Count the lines in lines.txt and reply with the number only. Use your file tools; do not run a shell command.
    response:
      content:
        - type: text
          text: I'll read the file to count its lines.
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/lines.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Count the lines in lines.txt and reply with the number only. Use your file tools; do not run a shell command.
        - role: assistant
          content:
            - type: text
              text: I'll read the file to count its lines.
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/lines.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tone\n2\ttwo\n3\tthree\n4\tfour"
    response:
      content: '4'
      stopReason: end_turn

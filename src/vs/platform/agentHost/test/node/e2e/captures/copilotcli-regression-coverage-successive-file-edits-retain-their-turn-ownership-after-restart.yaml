            - type: thinking
            - type: tool_use
              name: edit
              input:
                path: ${workdir}/successive.txt
                old_str: EDIT_ZERO
                new_str: EDIT_ONE
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: File ${workdir}/successive.txt updated with changes.
    response:
      content: EDIT_DONE
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace EDIT_ZERO with EDIT_ONE in successive.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: edit
          input:
            path: ${workdir}/successive.txt
            old_str: EDIT_ZERO
            new_str: EDIT_ONE
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Use your file editing tool exactly once to replace EDIT_ZERO with EDIT_ONE in successive.txt. Do not inspect or search for files and do not run a shell command. Then reply exactly "EDIT_DONE".

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call viewUnreviewedComments exactly once, then reply exactly "viewed".
    response:
      content:
        - type: text
          text: I'll check for unreviewed comments.
        - type: tool_use
          id: toolcall_0
          name: mcp__host__viewUnreviewedComments
          input: {}
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Call viewUnreviewedComments exactly once, then reply exactly "viewed".
        - role: assistant
          content:
            - type: text
              text: I'll check for unreviewed comments.
            - type: tool_use
              name: mcp__host__viewUnreviewedComments
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                {
                  "comments": [
                    {
                      "id": "reveal-me",
                      "resourceUri": "untitled://server-tools/reviewed.ts",
                      "range": {
                        "startLineNumber": 2,
                        "startColumn": 3,
                        "endLineNumber": 2,
                        "endColumn": 9
                      },
                      "text": "revealed",
                      "kind": "prReview",
                      "resolved": false
                    }
                  ]
                }
    response:
      content: viewed
      stopReason: end_turn

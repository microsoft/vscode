version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember DEFAULT_NOT_IN_PEER. Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Remember SIBLING_NOT_IN_PEER. Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Read first-peer.txt with Read, then use Edit exactly once to replace FIRST_BEFORE with FIRST_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Read
          input:
            file_path: ${workdir}/first-peer.txt
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Read first-peer.txt with Read, then use Edit exactly once to replace FIRST_BEFORE with FIRST_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/first-peer.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tFIRST_BEFORE\n2"
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: Edit
          input:
            file_path: ${workdir}/first-peer.txt
            old_string: FIRST_BEFORE
            new_string: FIRST_AFTER
      stopReason: tool_use
  - request:
      model: claude-opus-5.5
      system: ${system}
      messages:
        - role: user
          content: Read first-peer.txt with Read, then use Edit exactly once to replace FIRST_BEFORE with FIRST_AFTER. Do not search for files or run a shell command. Then reply exactly "EDIT_DONE".
        - role: assistant
          content:
            - type: tool_use
              name: Read
              input:
                file_path: ${workdir}/first-peer.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: "1\tFIRST_BEFORE\n2"
        - role: assistant
          content:
            - type: tool_use
              name: Edit
              input:
                replace_all: false
                file_path: ${workdir}/first-peer.txt
                old_string: FIRST_BEFORE
                new_string: FIRST_AFTER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: The file ${workdir}/first-peer.txt has been updated successfully. (file state is current in your context — no need to Read it back)
    response:
      content: EDIT_DONE
      stopReason: end_turn

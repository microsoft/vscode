version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: AskUserQuestion
          input:
            questions:
              - question: Which fruit?
                header: Fruit
                multiSelect: false
                options:
                  - label: Apple
                    description: Choose apple.
                  - label: Banana
                    description: Choose banana.
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Use AskUserQuestion exactly once to ask "Which fruit?" with options "Apple" and "Banana". After the answer, reply with only the selected fruit.
        - role: assistant
          content:
            - type: tool_use
              name: AskUserQuestion
              input:
                questions:
                  - question: Which fruit?
                    header: Fruit
                    multiSelect: false
                    options:
                      - label: Apple
                        description: Choose apple.
                      - label: Banana
                        description: Choose banana.
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'Your questions have been answered: "Which fruit?"="Apple". You can now continue with these answers in mind.'
    response:
      content: Apple
      stopReason: end_turn

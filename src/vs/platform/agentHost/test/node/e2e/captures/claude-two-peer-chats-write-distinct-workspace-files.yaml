version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/first-peer.txt containing exactly FIRST_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: Write
          input:
            file_path: ${workdir}/first-peer.txt
            content: FIRST_PEER
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/first-peer.txt containing exactly FIRST_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/first-peer.txt
                content: FIRST_PEER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: 'File created successfully at: ${workdir}/first-peer.txt (file state is current in your context — no need to Read it back)'
    response:
      content: created
      stopReason: end_turn
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/second-peer.txt containing exactly SECOND_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: Write
          input:
            file_path: ${workdir}/second-peer.txt
            content: SECOND_PEER
      stopReason: tool_use
  - request:
      model: claude-opus-5
      system: ${system}
      messages:
        - role: user
          content: Create the file at ${workdir}/second-peer.txt containing exactly SECOND_PEER with no trailing newline. Use your file tools; do not run a shell command. Do not verify it with another tool. Then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: Write
              input:
                file_path: ${workdir}/second-peer.txt
                content: SECOND_PEER
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: 'File created successfully at: ${workdir}/second-peer.txt (file state is current in your context — no need to Read it back)'
    response:
      content: created
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call create_session exactly once with relationship "currentSession", prompt "/rename", and title "Explicit Peer", then reply exactly "created".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: create_session
          input:
            relationship: currentSession
            prompt: /rename
            title: Explicit Peer
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call create_session exactly once with relationship "currentSession", prompt "/rename", and title "Explicit Peer", then reply exactly "created".
        - role: assistant
          content:
            - type: tool_use
              name: create_session
              input:
                relationship: currentSession
                prompt: /rename
                title: Explicit Peer
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Chat created in the current session (agent-host-session://copilotcli/${uuid_0}?chat=${uuid_1}). Reply with one short sentence confirming the chat was created; do not print the URL or mention a button.
    response:
      content: created
      stopReason: end_turn

version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readdirSync(''.'').join('' ''))"`. Then reply with the filenames it printed and nothing else.'
    response:
      content:
        - type: text
          text: Running the exact command now and I’ll return only the filenames it prints.
        - type: tool_use
          id: toolcall_0
          name: exec_command
          input:
            cmd: node -e "console.log(require('fs').readdirSync('.').join(' '))"
            workdir: ${workdir}
      stopReason: tool_use
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readdirSync(''.'').join('' ''))"`. Then reply with the filenames it printed and nothing else.'
        - role: assistant
          content: Running the exact command now and I’ll return only the filenames it prints.
        - role: assistant
          content:
            - type: tool_use
              name: exec_command
              input:
                cmd: node -e "console.log(require('fs').readdirSync('.').join(' '))"
                workdir: ${workdir}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: |-
                Chunk ID: e12fae
                Wall time: 0.0000 seconds
                Process exited with code 0
                Original token count: 5
                Output:
                first.txt second.md
    response:
      content: first.txt second.md
      stopReason: end_turn

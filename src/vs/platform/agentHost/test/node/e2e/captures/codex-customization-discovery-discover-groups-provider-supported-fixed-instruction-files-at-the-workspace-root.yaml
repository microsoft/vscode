version: 1
dialect: responses
exchanges:
  - request:
      model: gpt-5.3-codex
      system: ${system}
      messages:
        - role: user
          content: |-
            # AGENTS.md instructions for ${workdir}

            <INSTRUCTIONS>
            Instructions from ${workdir}/AGENTS.md
            </INSTRUCTIONS>
        - role: user
          content: Reply exactly "READY".
    response:
      content: READY
      stopReason: end_turn

version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply with exactly turn-install-setup.
    response:
      content: turn-install-setup
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply with exactly turn-reuse-installed.
    response:
      content: turn-reuse-installed
      stopReason: end_turn

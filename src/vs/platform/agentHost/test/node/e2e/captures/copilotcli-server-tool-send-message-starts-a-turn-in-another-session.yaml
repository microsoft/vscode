version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly "TARGET_MATERIALIZED".
    response:
      content: TARGET_MATERIALIZED
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call send_message exactly once with session "copilotcli:/e2e-server-tools-send-message-target" and message "/rename Target Via Send", then reply exactly "sent".
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: send_message
          input:
            session: copilotcli:/e2e-server-tools-send-message-target
            message: /rename Target Via Send
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Call send_message exactly once with session "copilotcli:/e2e-server-tools-send-message-target" and message "/rename Target Via Send", then reply exactly "sent".
        - role: assistant
          content:
            - type: tool_use
              name: send_message
              input:
                session: copilotcli:/e2e-server-tools-send-message-target
                message: /rename Target Via Send
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: Message sent (agent-host-session://copilotcli/e2e-server-tools-send-message-target). Reply with one short sentence confirming the message was sent; do not print the URL or mention a button.
    response:
      content: sent
      stopReason: end_turn

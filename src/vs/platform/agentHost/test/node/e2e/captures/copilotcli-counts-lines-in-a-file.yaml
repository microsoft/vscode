version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Count the lines in lines.txt and reply with the number only. Use your file tools rather than running a shell command.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: glob
          input:
            pattern: '**/lines.txt'
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Count the lines in lines.txt and reply with the number only. Use your file tools rather than running a shell command.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: glob
              input:
                pattern: '**/lines.txt'
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: ./lines.txt
    response:
      content:
        - type: tool_use
          id: toolcall_1
          name: view
          input:
            path: ${workdir}/lines.txt
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Count the lines in lines.txt and reply with the number only. Use your file tools rather than running a shell command.
        - role: assistant
          content:
            - type: thinking
            - type: tool_use
              name: glob
              input:
                pattern: '**/lines.txt'
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: ./lines.txt
        - role: assistant
          content:
            - type: tool_use
              name: view
              input:
                path: ${workdir}/lines.txt
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_1
              content: |-
                1. one
                2. two
                3. three
                4. four
    response:
      content: '4'
      stopReason: end_turn

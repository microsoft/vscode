version: 1
dialect: anthropic
exchanges:
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly MCP_AUTH_READY. Do not call tools or run commands.
    response:
      content: MCP_AUTH_READY
      stopReason: end_turn
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly MCP_AUTH_READY. Do not call tools or run commands.
        - role: assistant
          content: MCP_AUTH_READY
        - role: user
          content: Call authorization_probe exactly once with {"tag":"scopes-authorized"}. Do not retry it or call other tools. Afterwards reply exactly MCP_AUTH_DONE.
    response:
      content:
        - type: tool_use
          id: toolcall_0
          name: runtime-authorization-authorization_probe
          input:
            tag: scopes-authorized
      stopReason: tool_use
  - request:
      model: claude-sonnet-5
      system: ${system}
      messages:
        - role: user
          content: Reply exactly MCP_AUTH_READY. Do not call tools or run commands.
        - role: assistant
          content: MCP_AUTH_READY
        - role: user
          content: Call authorization_probe exactly once with {"tag":"scopes-authorized"}. Do not retry it or call other tools. Afterwards reply exactly MCP_AUTH_DONE.
        - role: assistant
          content:
            - type: tool_use
              name: runtime-authorization-authorization_probe
              input:
                tag: scopes-authorized
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolcall_0
              content: RUNTIME_MCP_AUTHORIZED:scopes-authorized
    response:
      content: MCP_AUTH_DONE
      stopReason: end_turn

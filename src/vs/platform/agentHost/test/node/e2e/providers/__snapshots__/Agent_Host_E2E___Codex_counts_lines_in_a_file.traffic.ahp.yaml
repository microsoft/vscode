version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readFileSync(''lines.txt'',''utf8'').split(/\r?\n/).length)"`. Then reply with its exact output only.'
            origin:
              kind: user
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: 'Run exactly this shell command, with no modifications: `node -e "console.log(require(''fs'').readFileSync(''lines.txt'',''utf8'').split(/\r?\n/).length)"`. Then reply with its exact output only.'
            origin:
              kind: user
      - channel: ${session_0}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_0}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: Running your exact command now.
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          toolName: shell
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: |-


              4
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}

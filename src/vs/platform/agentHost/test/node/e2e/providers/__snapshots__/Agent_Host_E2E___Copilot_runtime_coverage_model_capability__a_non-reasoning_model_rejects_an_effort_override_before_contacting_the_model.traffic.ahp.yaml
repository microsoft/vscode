version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Do not use tools. Reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-haiku-4.5
      - channel: ${session_1}
        action:
          type: root/configChanged
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Do not use tools. Reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-haiku-4.5
      - channel: ${session_0}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_0}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/error
          turnId: ${turn_0}
          part:
            kind: error
            error:
              errorType: query
              message: 'Execution failed: Reasoning effort ''high'' is not supported for model ''claude-haiku-4.5''.'
            resumable: true
      - channel: ${chat_0}
        action:
          type: chat/isReadChanged
      - channel: ${session_1}
        action:
          type: root/configChanged

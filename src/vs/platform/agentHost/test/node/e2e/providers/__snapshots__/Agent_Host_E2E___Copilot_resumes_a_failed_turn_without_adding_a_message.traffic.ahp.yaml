version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: $error
            origin:
              kind: user
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: $error
            origin:
              kind: user
      - channel: ${session_0}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_0}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/error
          turnId: ${turn_0}
          error:
            errorType: query
            message: 'Execution failed: CAPIError: 400 Injected recoverable E2E failure.'
          resumable: true
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnResumed
          turnId: ${turn_0}
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnResumed
          turnId: ${turn_0}
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: It looks like your message came through empty — there's no error content or question attached. Could you share what error you're seeing (the message, stack trace, or steps to reproduce)?
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}

version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Use the task tool exactly once with agent_type "general-purpose" and mode "background". Tell it to reply exactly "CHILD_INITIAL_DONE" and not use tools. Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_INITIAL_DONE". Do not stop the subagent.
            origin:
              kind: user
      - method: subscribe
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Use the task tool exactly once with agent_type "general-purpose" and mode "background". Tell it to reply exactly "CHILD_INITIAL_DONE" and not use tools. Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_INITIAL_DONE". Do not stop the subagent.
            origin:
              kind: user
      - channel: ${session_0}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_0}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          toolName: task
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: Waiting for the background subagent to finish before continuing.
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_1}
          toolName: read_agent
      - channel: ${session_0}
        action:
          type: session/chatAdded
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_1}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: PARENT_INITIAL_DONE
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}
      - responseTo: subscribe
        result: success
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_1}
          message:
            text: 'Use write_agent exactly once to send the same retained subagent this message: "Reply exactly CHILD_FOLLOWUP_ONE_DONE and do not use tools." Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_FOLLOWUP_ONE_DONE". Do not start or stop a subagent.'
            origin:
              kind: user
      - method: subscribe
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_1}
          message:
            text: 'Use write_agent exactly once to send the same retained subagent this message: "Reply exactly CHILD_FOLLOWUP_ONE_DONE and do not use tools." Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_FOLLOWUP_ONE_DONE". Do not start or stop a subagent.'
            origin:
              kind: user
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_1}
          toolCallId: ${toolCall_2}
          toolName: write_agent
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_1}
          toolCallId: ${toolCall_2}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_1}
          toolCallId: ${toolCall_3}
          toolName: read_agent
      - channel: ${chat_1}
        action:
          type: chat/turnStarted
          turnId: ${turn_2}
          message:
            text: Reply exactly CHILD_FOLLOWUP_ONE_DONE and do not use tools.
            origin:
              kind: user
      - channel: ${chat_1}
        action:
          type: chat/responsePart
          turnId: ${turn_2}
          part:
            kind: markdown
            content: CHILD_FOLLOWUP_ONE_DONE
      - channel: ${chat_1}
        action:
          type: chat/turnComplete
          turnId: ${turn_2}
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_1}
          toolCallId: ${toolCall_3}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_1}
          part:
            kind: markdown
            content: PARENT_FOLLOWUP_ONE_DONE
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_1}
      - responseTo: subscribe
        result: success
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_3}
          message:
            text: 'Use write_agent exactly once to send the same retained subagent this message: "Reply exactly CHILD_FOLLOWUP_TWO_DONE and do not use tools." Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_FOLLOWUP_TWO_DONE". Do not start or stop a subagent.'
            origin:
              kind: user
      - method: subscribe
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_3}
          message:
            text: 'Use write_agent exactly once to send the same retained subagent this message: "Reply exactly CHILD_FOLLOWUP_TWO_DONE and do not use tools." Wait for its completion notification, call read_agent with wait true, then reply exactly "PARENT_FOLLOWUP_TWO_DONE". Do not start or stop a subagent.'
            origin:
              kind: user
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_3}
          toolCallId: ${toolCall_4}
          toolName: write_agent
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_3}
          toolCallId: ${toolCall_4}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_3}
          toolCallId: ${toolCall_5}
          toolName: read_agent
      - channel: ${chat_1}
        action:
          type: chat/turnStarted
          turnId: ${turn_4}
          message:
            text: Reply exactly CHILD_FOLLOWUP_TWO_DONE and do not use tools.
            origin:
              kind: user
      - channel: ${chat_1}
        action:
          type: chat/responsePart
          turnId: ${turn_4}
          part:
            kind: markdown
            content: CHILD_FOLLOWUP_TWO_DONE
      - channel: ${chat_1}
        action:
          type: chat/turnComplete
          turnId: ${turn_4}
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_3}
          toolCallId: ${toolCall_5}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_3}
          part:
            kind: markdown
            content: PARENT_FOLLOWUP_TWO_DONE
      - channel: ${chat_0}

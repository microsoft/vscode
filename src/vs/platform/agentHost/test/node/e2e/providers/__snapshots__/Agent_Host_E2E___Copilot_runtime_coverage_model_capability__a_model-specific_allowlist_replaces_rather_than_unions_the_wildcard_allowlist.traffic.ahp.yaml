version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Use grep exactly once with pattern "CAPABILITY_NATIVE_FILE", path "capability.txt", and output_mode "content". Do not use other tools. Then reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-sonnet-5
      - method: subscribe
      - method: subscribe
      - method: subscribe
      - channel: ${session_0}
        action:
          type: root/configChanged
    serverToClient:
      - channel: ${session_0}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Use grep exactly once with pattern "CAPABILITY_NATIVE_FILE", path "capability.txt", and output_mode "content". Do not use other tools. Then reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-sonnet-5
      - channel: ${session_1}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_1}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          toolName: grep
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: CAPABILITY_COMPLETE
      - channel: ${session_0}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - channel: ${session_0}
        action:
          type: root/configChanged

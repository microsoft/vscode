version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Do not use tools. Reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-opus-4.6
      - method: subscribe
      - method: subscribe
      - method: subscribe
      - channel: ${session_0}
        action:
          type: root/configChanged
    serverToClient:
      - channel: ${session_0}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Do not use tools. Reply exactly CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-opus-4.6
      - channel: ${session_1}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_1}
        action:
          type: session/ready
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: CAPABILITY_COMPLETE
      - channel: ${session_0}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - channel: ${session_0}
        action:
          type: root/configChanged

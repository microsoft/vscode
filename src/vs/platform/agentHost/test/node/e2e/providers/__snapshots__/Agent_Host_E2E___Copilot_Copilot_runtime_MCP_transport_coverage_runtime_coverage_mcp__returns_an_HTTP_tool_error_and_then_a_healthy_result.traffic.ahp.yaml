version: 1
rounds:
  - clientToServer:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Call coverage_probe exactly once with {"tag":"failure"}. Do not retry it, call other tools, run commands, or change the arguments. Afterwards reply exactly MCP_TURN_DONE.
            origin:
              kind: user
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_1}
          message:
            text: Call coverage_probe exactly once with {"tag":"healthy"}. Do not retry it, call other tools, run commands, or change the arguments. Afterwards reply exactly MCP_TURN_DONE.
            origin:
              kind: user
      - method: subscribe
    serverToClient:
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Call coverage_probe exactly once with {"tag":"failure"}. Do not retry it, call other tools, run commands, or change the arguments. Afterwards reply exactly MCP_TURN_DONE.
            origin:
              kind: user
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          toolName: runtime-transport-coverage_probe
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          result:
            success: false
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: MCP_TURN_DONE
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_1}
          message:
            text: Call coverage_probe exactly once with {"tag":"healthy"}. Do not retry it, call other tools, run commands, or change the arguments. Afterwards reply exactly MCP_TURN_DONE.
            origin:
              kind: user
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_1}
          toolCallId: ${toolCall_1}
          toolName: runtime-transport-coverage_probe
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_1}
          toolCallId: ${toolCall_1}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_1}
          part:
            kind: markdown
            content: MCP_TURN_DONE
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_1}
      - responseTo: subscribe
        result: success

version: 1
rounds:
  - clientToServer:
      - channel: ${session_0}
        action:
          type: session/activeClientSet
          activeClient:
            clientId: runtime-model-capability-client
            tools: []
      - method: subscribe
      - responseTo: resourceResolve
        result: success
      - responseTo: resourceList
        result: success
      - responseTo: resourceResolve
        result: success
      - responseTo: resourceList
        result: success
      - responseTo: resourceRead
        result: success
      - responseTo: resourceRead
        result: success
      - responseTo: resourceRead
        result: success
      - method: subscribe
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Call the capability_read tool from capability-probe exactly once with tag "CAPABILITY_INPUT" and options {"count":2,"label":null}. Do not use other tools. Then reply CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-sonnet-5
      - method: subscribe
      - method: subscribe
      - method: subscribe
      - channel: ${session_1}
        action:
          type: root/configChanged
    serverToClient:
      - channel: ${session_0}
        action:
          type: session/activeClientSet
          activeClient:
            clientId: runtime-model-capability-client
            tools: []
      - responseTo: subscribe
        result: success
      - method: resourceResolve
      - method: resourceList
      - method: resourceResolve
      - method: resourceList
      - method: resourceRead
      - method: resourceRead
      - method: resourceRead
      - responseTo: subscribe
        result: success
      - channel: ${session_1}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnStarted
          turnId: ${turn_0}
          message:
            text: Call the capability_read tool from capability-probe exactly once with tag "CAPABILITY_INPUT" and options {"count":2,"label":null}. Do not use other tools. Then reply CAPABILITY_COMPLETE.
            origin:
              kind: user
            model:
              id: claude-sonnet-5
      - channel: ${session_0}
        action:
          type: session/titleChanged
      - method: root/sessionAdded
      - channel: ${session_0}
        action:
          type: session/ready
      - channel: ${session_0}
        action:
          type: session/mcpServerStateChanged
      - channel: ${session_0}
        action:
          type: session/mcpServerStateChanged
      - channel: ${chat_0}
        action:
          type: chat/toolCallStart
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          toolName: capability-probe-capability_read
      - channel: ${chat_0}
        action:
          type: chat/toolCallComplete
          turnId: ${turn_0}
          toolCallId: ${toolCall_0}
          result:
            success: true
      - channel: ${chat_0}
        action:
          type: chat/responsePart
          turnId: ${turn_0}
          part:
            kind: markdown
            content: CAPABILITY_COMPLETE
      - channel: ${session_1}
        action:
          type: root/activeSessionsChanged
      - channel: ${chat_0}
        action:
          type: chat/turnComplete
          turnId: ${turn_0}
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - responseTo: subscribe
        result: success
      - channel: ${session_1}
        action:
          type: root/configChanged

<!DOCTYPE html>
<html>
	<head>
		<script nonce="{{WORKBENCH_SCRIPT_NONCE}}">
			performance.mark('code/didStartRenderer');
		</script>
		<meta charset="utf-8" />

		<!-- Mobile tweaks -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Code">
		<link rel="apple-touch-icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/code-192.png" />

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Workbench Configuration -->
		<meta id="vscode-workbench-web-configuration" data-settings="{{WORKBENCH_WEB_CONFIGURATION}}">
		<meta id="vscode-workbench-web-base-url" data-settings="{{WORKBENCH_WEB_BASE_URL}}">

		<!-- Workbench Auth Session -->
		<meta id="vscode-workbench-auth-session" data-settings="{{WORKBENCH_AUTH_SESSION}}">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/manifest.json" crossorigin="use-credentials" />
		<link rel="stylesheet" href="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.css">

		<!-- Startup fallback: shown only if the scripts below never run, e.g. because a proxy,
			extension or content filter blocked or rewrote them. Styles are inlined and hardcoded
			because no theme or workbench CSS has loaded at that point. -->
		<style>
			#vscode-startup-fallback {
				visibility: hidden;
				animation: vscode-startup-fallback-reveal 0s linear 10s forwards;
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: safe center;
				margin: 0;
				overflow: auto;
				padding: 0 24px;
				text-align: center;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
				color: #3b3b3b;
				background-color: #f8f8f8;
			}

			@keyframes vscode-startup-fallback-reveal {
				to { visibility: visible; }
			}

			#vscode-startup-fallback h1 {
				margin: 0 0 8px;
				font-size: 16px;
				font-weight: 600;
			}

			#vscode-startup-fallback p {
				margin: 0;
				max-width: 52ch;
				font-size: 13px;
				line-height: 1.5;
			}

			@media (prefers-color-scheme: dark) {
				#vscode-startup-fallback {
					color: #cccccc;
					background-color: #1f1f1f;
				}
			}
		</style>

	</head>

	<body aria-label="">
		<div id="vscode-startup-fallback">
			<h1>The editor failed to load</h1>
			<p>A proxy, browser extension or content filter may be blocking or modifying this page's scripts. Check the browser developer tools console for Content Security Policy errors.</p>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script nonce="{{WORKBENCH_SCRIPT_NONCE}}">
		const baseUrl = new URL(document.getElementById('vscode-workbench-web-base-url').getAttribute('data-settings'), window.location.origin).toString();
		globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
	</script>
	<script nonce="{{WORKBENCH_SCRIPT_NONCE}}">
		performance.mark('code/willLoadWorkbenchMain');
	</script>
	<!-- always ensure built in english NLS messages -->
	<script type="module" src="{{WORKBENCH_NLS_FALLBACK_URL}}"></script>
	<!-- attempt to load NLS messages in case non-english -->
	<script type="module" src="{{WORKBENCH_NLS_URL}}"></script>
	<script type="module" src="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.js"></script>
</html>

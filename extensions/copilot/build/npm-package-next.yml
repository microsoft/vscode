trigger: none

pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco
  pipelines:
    - pipeline: vscode
      source: '⭐️ VS Code'
      trigger:
        stages:
          - Release
        branches:
          include:
            - main
            - release/*

parameters:
  - name: NPM_REGISTRY
    displayName: "Custom NPM Registry"
    type: string
    default: 'https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/vscode/npm/registry/'

name: "$(Date:yyyyMMdd).$(Rev:r)"

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: vscode-copilot-chat
        buildSteps:
          - task: NodeTool@0
            inputs:
              versionSpec: 24.x
              checkLatest: true
            displayName: 🛠 Install Node.js

          - template: extensions/copilot/build/steps/setup-npm.yml@self
            parameters:
              NPM_REGISTRY: ${{ parameters.NPM_REGISTRY }}

          - template: build/azure-pipelines/common/install-pnpm.yml@self

          # Every platform build of VS Code ships the built-in Copilot extension with the
          # version that the build stamped, so the Windows x64 server archive has it.
          - download: vscode
            artifact: vscode_server_win32_x64_archive
            displayName: 📥 Download VS Code server (Windows x64)
            condition: and(succeeded(), ne(variables['resources.pipeline.vscode.runName'], ''))

          - bash: |
              set -e
              ARCHIVE="$(Pipeline.Workspace)/vscode/vscode_server_win32_x64_archive/vscode-server-win32-x64.zip"
              if [ -f "$ARCHIVE" ]; then
                VERSION=$(unzip -p "$ARCHIVE" 'vscode-server-win32-x64/extensions/copilot/package.json' | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                  pkg.version = '$VERSION';
                  fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                "
                echo "Set extension version to $VERSION"
              else
                echo "No VS Code server archive found, using version from package.json"
              fi
            displayName: 📋 Sync version from extension
            workingDirectory: extensions/copilot

          # chat-lib and Copilot are members of the root pnpm workspace. pnpm runs the root install scripts,
          # which install the whole repository, on every install that runs scripts, filtered or not: the
          # install skips them, then builds Copilot's dependencies and runs its postinstall. The extraction
          # sets chat-lib's dependencies to Copilot's versions, in its package.json and in the root
          # pnpm-lock.yaml. The rebuild ignores the root .pnpmfile.mjs, which builds native modules for
          # Electron: chat-lib runs in Node.js, and network isolation blocks the Electron headers.
          - bash: |
              set -e
              pnpm install --frozen-lockfile --ignore-scripts --filter copilot-chat --filter @vscode/chat-lib
              pnpm --ignore-pnpmfile --filter copilot-chat --filter @vscode/chat-lib rebuild
              pnpm run postinstall
              pnpm run extract-chat-lib
            displayName: 📂 Extract chat-lib
            workingDirectory: extensions/copilot
            env:
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

          - bash: |
              set -e
              VERSION=$(node -p "require('../package.json').version")
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$VERSION';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
              echo "Set chat-lib version to $VERSION"
            displayName: 📋 Sync chat-lib version
            workingDirectory: extensions/copilot/chat-lib

          # Installs chat-lib's dependencies for the versions that the extraction set, without the root
          # install scripts, then runs chat-lib's postinstall, which copies static files next to the
          # extracted sources. Then removes the packages in the node_modules folders above
          # extensions/copilot (every install adds the root project's), so that chat-lib only resolves
          # its own dependencies and Copilot's.
          - script: pnpm install --frozen-lockfile --ignore-scripts --filter @vscode/chat-lib && pnpm --dir chat-lib run postinstall && pnpm exec tsx script/build/isolateChatLib.ts
            displayName: 📦 Install chat-lib dependencies
            workingDirectory: extensions/copilot
            env:
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

          - script: pnpm run build
            displayName: 🔨 Build chat-lib
            workingDirectory: extensions/copilot/chat-lib
        testPlatforms:
          - name: Linux
            nodeVersions: [24.x]
            # chat-lib is consumed by other products, which don't share our GLIBC requirements.
            useSysroot: false
          - name: MacOS
            nodeVersions: [24.x]
          - name: Windows
            nodeVersions: [24.x]
        workingDirectory: extensions/copilot/chat-lib
        testSteps:
          - template: extensions/copilot/build/steps/test-chat-lib.yml@self
            parameters:
              NPM_REGISTRY: ${{ parameters.NPM_REGISTRY }}
        # Triggered by ⭐️ VS Code pipeline → always publish to next
        publishPackage: true
        publishRequiresApproval: false
        tag: next
        ghCreateRelease: false
        ghReleaseAddChangeLog: false

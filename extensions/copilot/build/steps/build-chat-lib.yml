parameters:
  - name: NPM_REGISTRY
    type: string

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: 24.x
      checkLatest: true
    displayName: 🛠 Install Node.js

  - template: setup-npm.yml
    parameters:
      NPM_REGISTRY: ${{ parameters.NPM_REGISTRY }}

  - template: ../../../../build/azure-pipelines/common/install-pnpm.yml@self

  # chat-lib and Copilot are members of the root pnpm workspace. pnpm runs the root install scripts,
  # which install the whole repository, on every install that runs scripts, filtered or not: the
  # install skips them, then builds Copilot's dependencies and runs its postinstall. The extraction
  # sets chat-lib's dependencies to Copilot's versions, in its package.json and in the root
  # pnpm-lock.yaml. The rebuild ignores the root .pnpmfile.mjs, which builds native modules for
  # Electron: chat-lib runs in Node.js, and network isolation blocks the Electron headers.
  - bash: |
      set -e
      pnpm install --frozen-lockfile --ignore-scripts --filter copilot-chat --filter @vscode/chat-lib
      pnpm --ignore-pnpmfile --filter copilot-chat --filter @vscode/chat-lib rebuild
      pnpm run postinstall
      pnpm run extract-chat-lib
    displayName: 📂 Extract chat-lib
    workingDirectory: extensions/copilot
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

  - bash: |
      set -e
      VERSION=$(node -p "require('../package.json').version")
      node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        pkg.version = '$VERSION';
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
      "
      echo "Set chat-lib version to $VERSION"
    displayName: 📋 Sync chat-lib version
    workingDirectory: extensions/copilot/chat-lib

  # Installs chat-lib's dependencies for the versions that the extraction set, without the root
  # install scripts, then runs chat-lib's postinstall, which copies static files next to the
  # extracted sources. Then removes the packages in the node_modules folders above
  # extensions/copilot (every install adds the root project's), so that chat-lib only resolves
  # its own dependencies and Copilot's.
  - script: pnpm install --frozen-lockfile --ignore-scripts --filter @vscode/chat-lib && pnpm --dir chat-lib run postinstall && pnpm exec tsx script/build/isolateChatLib.ts
    displayName: 📦 Install chat-lib dependencies
    workingDirectory: extensions/copilot
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

  - script: pnpm run build
    displayName: 🔨 Build chat-lib
    workingDirectory: extensions/copilot/chat-lib

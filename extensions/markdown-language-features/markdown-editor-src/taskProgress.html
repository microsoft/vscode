<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; padding: 0; min-height: 0; background: transparent; }
		body { color: var(--vscode-editor-foreground, CanvasText); font-family: var(--vscode-font-family, system-ui); font-size: var(--vscode-font-size, 13px); }
		main { padding: 12px 16px; background: transparent; }
		header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 8px; }
		#summary { color: var(--vscode-descriptionForeground, var(--vscode-editor-foreground, CanvasText)); }
		#progress { height: 8px; border-radius: 4px; overflow: hidden; background: var(--vscode-scrollbarSlider-background, color-mix(in srgb, var(--vscode-editor-foreground, CanvasText) 16%, transparent)); }
		#fill { width: 100%; height: 100%; background: var(--vscode-progressBar-background, var(--vscode-focusBorder, Highlight)); transform: scaleX(var(--task-progress-ratio, 0)); transform-origin: left; transition: transform 220ms ease; }
		@media (prefers-reduced-motion: reduce) { #fill { transition: none; } }
		@media (forced-colors: active) { #progress { border: 1px solid CanvasText; background: Canvas; } #fill { background: Highlight; } }
	</style>
</head>
<body>
	<main hidden>
		<header>
			<strong id="title"></strong>
			<span id="summary" role="status" aria-live="polite" aria-atomic="true"></span>
		</header>
		<div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-labelledby="title" aria-describedby="summary">
			<div id="fill"></div>
		</div>
	</main>
	<script src="./taskProgressGuest.ts"></script>
</body>
</html>

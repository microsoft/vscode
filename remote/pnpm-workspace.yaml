packages:
  - web
pnpmfile: .pnpmfile.mjs
nodeLinker: isolated
strictPeerDependencies: false
autoInstallPeers: false
dedupePeerDependents: false
fetchTimeout: 180000
engineStrict: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@github/copilot*'
  - '@vscode/*'
  - '@xterm/*'
  - node-pty
strictDepBuilds: true
sideEffectsCache: false
verifyDepsBeforeRun: false
# See pmOnFail in the root pnpm-workspace.yaml
pmOnFail: download
skills:
  dirs: []
ignoredOptionalDependencies:
  - '@parcel/watcher-*'
allowBuilds:
  '@parcel/watcher@2.5.6': true
  '@vscode/deviceid@0.1.5': true
  '@vscode/fs-copyfile@2.0.0': true
  '@vscode/native-watchdog@1.4.6': true
  '@vscode/spdlog@0.15.8': true
  '@vscode/sqlite3@5.1.12-vscode': true
  '@vscode/windows-ca-certs@0.3.4': true
  '@vscode/windows-process-tree@0.8.0': true
  '@vscode/windows-registry@1.3.0': true
  cpu-features: false
  kerberos@2.1.1: true
  koffi@3.2.1: false
  node-pty@1.2.0-beta.18: true
  ssh2: false
overrides:
  node-gyp-build: 4.8.1
  kerberos@2.1.1>node-addon-api: 7.1.0
  koffi: 3.2.1
  yauzl: ^3.3.1

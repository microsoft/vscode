name: Test chat-lib
description: Extracts the chat-lib package from the Copilot extension, then builds and tests it. Expects the repository to be checked out.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: extensions/copilot/.nvmrc
        cache: npm
        cache-dependency-path: |
          extensions/copilot/package-lock.json
          extensions/copilot/chat-lib/package-lock.json

    - name: Extract chat-lib
      shell: bash
      working-directory: extensions/copilot
      run: |
        npm ci
        npm run extract-chat-lib
        rm -rf node_modules

    - name: Install chat-lib dependencies
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm ci

    - name: Build chat-lib
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm run build

    - name: Test chat-lib
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm test

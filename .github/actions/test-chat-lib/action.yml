name: Test chat-lib
description: Extracts the chat-lib package from the Copilot extension, then builds and tests it. Expects the repository to be checked out.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: extensions/copilot/.nvmrc

    # Reuse the Copilot node_modules cache that .github/workflows/pr-node-modules.yml keeps warm on
    # `main` (Linux and Windows only). Never save: PR-scoped caches are not shared with other PRs
    # and only evict the shared ones.
    - name: Restore Copilot node_modules cache
      id: cache-node-modules
      if: runner.os == 'Linux' || runner.os == 'Windows'
      uses: ./.github/actions/restore-node-modules
      with:
        key-prefix: copilot-node_modules-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
        key-args: "$(node -p process.platform) $(node -p process.arch)"

    - name: Install Copilot dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: extensions/copilot
      run: npm ci

    # Remove the Copilot and the (cached) root node_modules so that chat-lib only resolves its own dependencies.
    - name: Extract chat-lib
      shell: bash
      working-directory: extensions/copilot
      run: |
        npm run extract-chat-lib
        rm -rf node_modules ../../node_modules

    - name: Install chat-lib dependencies
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm ci

    - name: Build chat-lib
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm run build

    - name: Test chat-lib
      shell: bash
      working-directory: extensions/copilot/chat-lib
      run: npm test

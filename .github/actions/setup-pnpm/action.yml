name: Setup pnpm
description: Installs the pnpm version that the `packageManager` field of the root package.json pins. Expects the repository to be checked out.

runs:
  using: composite
  steps:
    # Reads the version from `packageManager` in package.json, so the version lives in one place.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

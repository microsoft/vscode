name: Restore node_modules cache
description: Computes the node_modules cache key, restores the cache, and extracts it on a hit.

inputs:
  key-prefix:
    description: Prefix for the cache key. The hash of the lockfiles is appended automatically.
    required: true
  key-args:
    description: Arguments passed to build/azure-pipelines/common/computeNodeModulesCacheKey.ts.
    required: true
  lookup-only:
    description: When 'true', only checks whether the cache entry exists (sets cache-hit) without downloading or extracting the archive. Use for cache-warming jobs that only need the cache-hit result.
    default: 'false'

outputs:
  cache-hit:
    description: "'true' when the node_modules cache was restored from an exact key match."
    value: ${{ steps.restore.outputs.cache-hit }}
  previous-cache-hit:
    description: "'true' when there was no exact key match, and the node_modules of other dependencies were restored for `pnpm install` to update (see previousCache.ts)."
    value: ${{ steps.previous.outputs.usable == 'true' || steps.previous-windows.outputs.usable == 'true' }}

runs:
  using: composite
  steps:
    - name: Prepare node_modules cache key
      if: runner.os != 'Windows'
      shell: bash
      run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts ${{ inputs.key-args }} > .build/packagelockhash

    - name: Prepare node_modules cache key
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir .build -ea 0
        node build/azure-pipelines/common/computeNodeModulesCacheKey.ts ${{ inputs.key-args }} > .build/packagelockhash

    # Without a cache of their dependencies, pull requests restore the latest cache of other dependencies,
    # which the dependency installation then updates when it fits this job (see previousCache.ts). Only on
    # GitHub-hosted runners, which install to the same pnpm store as the jobs that save the caches. The
    # jobs that save caches don't run on pull requests, so they always install every dependency.
    - name: Restore node_modules cache
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .build/node_modules_cache
        key: "${{ inputs.key-prefix }}-${{ hashFiles('.build/packagelockhash') }}"
        restore-keys: ${{ github.event_name == 'pull_request' && runner.environment == 'github-hosted' && inputs.lookup-only != 'true' && format('{0}-', inputs.key-prefix) || '' }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Describe node_modules
      id: previous
      if: runner.os != 'Windows' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: node .github/actions/restore-node-modules/previousCache.ts describe ${{ inputs.key-args }}
      env:
        NODE_MODULES_PREVIOUS_CACHE_KEY: ${{ steps.restore.outputs.cache-matched-key }}

    - name: Describe node_modules
      id: previous-windows
      if: runner.os == 'Windows' && steps.restore.outputs.cache-hit != 'true'
      shell: pwsh
      run: node .github/actions/restore-node-modules/previousCache.ts describe ${{ inputs.key-args }}
      env:
        NODE_MODULES_PREVIOUS_CACHE_KEY: ${{ steps.restore.outputs.cache-matched-key }}

    - name: Export node_modules cache key
      if: runner.os != 'Windows'
      shell: bash
      run: echo "NODE_MODULES_CACHE_KEY=${{ steps.restore.outputs.cache-primary-key }}" >> "$GITHUB_ENV"

    - name: Export node_modules cache key
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_ENV -Value "NODE_MODULES_CACHE_KEY=${{ steps.restore.outputs.cache-primary-key }}"

    - name: Extract node_modules cache
      if: runner.os != 'Windows' && inputs.lookup-only != 'true' && (steps.restore.outputs.cache-hit == 'true' || steps.previous.outputs.usable == 'true')
      shell: bash
      run: ./.github/workflows/node_modules_cache/cache.sh extract

    - name: Extract node_modules cache
      if: runner.os == 'Windows' && inputs.lookup-only != 'true' && (steps.restore.outputs.cache-hit == 'true' || steps.previous-windows.outputs.usable == 'true')
      shell: pwsh
      run: ./.github/workflows/node_modules_cache/cache.ps1 extract

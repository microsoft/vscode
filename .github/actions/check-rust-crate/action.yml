name: Check Rust crate
description: Installs Rust, then lints and tests a Rust crate.

inputs:
  working-directory:
    description: Folder of the crate to check.
    required: true
  rustup-toolchain:
    description: Rust toolchain to install and use.
    required: true
  format:
    description: "'true' to check formatting with rustfmt."
    required: false
    default: 'false'
  locked:
    description: "'true' to require Cargo.lock to be up to date."
    required: false
    default: 'false'
  all-targets:
    description: "'true' to lint all targets, including tests."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        set -e
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain $RUSTUP_TOOLCHAIN
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}

    - name: Set Rust version
      shell: bash
      run: |
        set -e
        rustup default $RUSTUP_TOOLCHAIN
        rustup update $RUSTUP_TOOLCHAIN
        rustup component add clippy
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}

    - name: Install Rust formatting component
      if: ${{ inputs.format == 'true' }}
      shell: bash
      run: rustup component add rustfmt
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}

    - name: Check Rust versions
      shell: bash
      run: |
        set -e
        rustc --version
        cargo --version
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}

    - name: Check formatting
      if: ${{ inputs.format == 'true' }}
      shell: bash
      run: cargo fmt --check
      working-directory: ${{ inputs.working-directory }}
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}

    - name: Clippy lint
      shell: bash
      run: |
        set -e
        args=()
        if [[ "$CARGO_ALL_TARGETS" == "true" ]]; then
          args+=(--all-targets)
        fi
        if [[ "$CARGO_LOCKED" == "true" ]]; then
          args+=(--locked)
        fi
        cargo clippy "${args[@]}" -- -D warnings
      working-directory: ${{ inputs.working-directory }}
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}
        CARGO_ALL_TARGETS: ${{ inputs.all-targets }}
        CARGO_LOCKED: ${{ inputs.locked }}

    - name: 🧪 Run unit tests
      shell: bash
      run: |
        set -e
        args=()
        if [[ "$CARGO_LOCKED" == "true" ]]; then
          args+=(--locked)
        fi
        cargo test "${args[@]}"
      working-directory: ${{ inputs.working-directory }}
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rustup-toolchain }}
        CARGO_LOCKED: ${{ inputs.locked }}

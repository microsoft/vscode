<svg xmlns="http://www.w3.org/2000/svg" width="960" height="856" viewBox="0 0 960 856" role="img" aria-labelledby="title description" style="color-scheme: light dark">
	<!-- Copyright (c) Microsoft Corporation. Licensed under the MIT License. -->
	<title id="title">One management shell, three task structures</title>
	<desc id="description">Three equal-sized schematic frames share a full-width host header and trailing close position. Customizations adds category navigation, scope, a collection, and optional detail. Automations uses ownership groups, a table, and details beside the selected row. Remote environments omits the rail and keeps local sharing setup above an inventory. Geometry and text sizes are illustrative, not product measurements.</desc>
	<defs>
		<g id="shell" fill="none" stroke="CanvasText" stroke-width="1">
			<rect width="896" height="176" rx="8"/>
			<path d="M0 36H896"/>
		</g>
	</defs>
	<rect width="960" height="856" fill="Canvas"/>
	<g font-family="system-ui, sans-serif" fill="CanvasText" font-size="14">
		<text x="32" y="34" font-size="22" font-weight="600">One shell. Different task structures.</text>
		<text x="32" y="60">Structural comparison only: equal frames isolate what stays shared and what changes.</text>

		<text x="32" y="104" font-weight="600">Customizations</text>
		<text x="250" y="104">Category navigation + collection + optional detail</text>
		<g transform="translate(32 120)">
			<use href="#shell"/>
			<text x="16" y="24" font-weight="600">Host title</text>
			<text x="762" y="24">Host actions / close</text>
			<path d="M176 36V176M176 76H896M176 118H896" fill="none" stroke="CanvasText"/>
			<text x="16" y="66" font-weight="600">Categories</text>
			<text x="16" y="92">Change collection</text>
			<text x="192" y="62">Scope</text>
			<text x="192" y="102" font-weight="600">Content title</text>
			<text x="626" y="102">Collection tools / create</text>
			<text x="192" y="149">Collection</text>
			<path d="M594 118V176" fill="none" stroke="CanvasText" stroke-dasharray="4 4"/>
			<text x="610" y="149">Optional file detail</text>
		</g>
		<text x="32" y="320">The category names a collection; scope narrows its context. Detail stays subordinate.</text>

		<text x="32" y="366" font-weight="600">Automations</text>
		<text x="250" y="366">Ownership groups + collection + details beside it</text>
		<g transform="translate(32 382)">
			<use href="#shell"/>
			<text x="16" y="24" font-weight="600">Host title</text>
			<text x="762" y="24">Host actions / close</text>
			<path d="M176 36V176M176 78H896" fill="none" stroke="CanvasText"/>
			<text x="16" y="66" font-weight="600">Groups</text>
			<text x="16" y="92">Personal, cloud, repo</text>
			<text x="192" y="62" font-weight="600">Content title</text>
			<text x="700" y="62">Filter / search / create</text>
			<text x="192" y="110">Collection</text>
			<text x="192" y="144">Table rows</text>
			<path d="M620 78V176" fill="none" stroke="CanvasText" stroke-dasharray="4 4"/>
			<text x="636" y="110">Selected row details</text>
			<text x="636" y="144">Local close</text>
		</g>
		<text x="32" y="582">Groups name lasting scopes; filters narrow. Details close without closing the manager.</text>

		<text x="32" y="628" font-weight="600">Remote environments</text>
		<text x="250" y="628">Local sharing setup + environment inventory; no required rail</text>
		<g transform="translate(32 644)">
			<use href="#shell"/>
			<text x="16" y="24" font-weight="600">Host title</text>
			<text x="762" y="24">Host actions / close</text>
			<text x="16" y="64" font-weight="600">This computer</text>
			<text x="670" y="64">Explicit sharing actions</text>
			<text x="16" y="94">Inline setup, when expanded</text>
			<path d="M0 108H896" fill="none" stroke="CanvasText"/>
			<text x="16" y="133" font-weight="600">Other environments</text>
			<text x="570" y="133">Collection tools / view options / refresh</text>
			<text x="16" y="161">Inventory and contextual setup or recovery</text>
		</g>
		<text x="32" y="844">Shared contour and host header; task-specific navigation, content, and action consequences.</text>
	</g>
</svg>

on:
  workflow_call:
    inputs:
      job_name:
        type: string
        required: true
      electron_tests:
        type: boolean
        default: false
      browser_tests:
        type: boolean
        default: false
      remote_tests:
        type: boolean
        default: false
      unit_tests:
        type: boolean
        default: true
      integration_tests:
        type: boolean
        default: true
      smoke_tests:
        type: boolean
        default: true
      smoke_shard_index:
        description: 1-based index of the Electron smoke test shard to run
        type: number
        default: 1
      smoke_shard_total:
        description: Number of shards the Electron smoke tests are split into
        type: number
        default: 1
      # TEMPORARY inputs for runner benchmarks, see https://github.com/microsoft/vscode-engineering/issues/4273
      runner:
        description: Runner label to run on instead of the 1ES pool. Also makes the WSL Dev Container setup optional, since the runner may not support WSL2
        type: string
        default: ''
      smoke_parallel_shards:
        description: When greater than 0, runs this many Electron smoke test shards at the same time in this job, instead of the shard in smoke_shard_index
        type: number
        default: 0
      parallel_test_steps:
        description: Runs the integration and smoke test steps of the Remote job at the same time. Needs integration_tests and smoke_tests
        type: boolean
        default: false

jobs:
  windows-test:
    name: ${{ inputs.job_name }}
    # JobId must be unique per job, so smoke test shards and the browser unit tests part add a suffix
    runs-on: ${{ inputs.runner || fromJSON(format('["self-hosted","1ES.Pool=1es-vscode-oss-windows-2022-x64","JobId=windows-test-{0}{1}{2}-{3}-{4}-{5}"]', inputs.job_name, (inputs.unit_tests && !inputs.integration_tests && '-unit') || '', (inputs.smoke_shard_total > 1 && format('-shard{0}', inputs.smoke_shard_index)) || '', github.run_id, github.run_number, github.run_attempt)) }}
    env:
      ARTIFACT_NAME: ${{ (inputs.electron_tests && 'electron') || (inputs.browser_tests && 'browser') || (inputs.remote_tests && 'remote') || 'unknown' }}${{ (inputs.unit_tests && !inputs.integration_tests && '-unit') || (!inputs.unit_tests && !inputs.integration_tests && inputs.smoke_tests && '-smoke') || '' }}${{ inputs.smoke_shard_total > 1 && format('-shard{0}', inputs.smoke_shard_index) || '' }}${{ inputs.runner && format('-{0}', inputs.runner) || '' }}${{ inputs.smoke_parallel_shards > 0 && format('-x{0}', inputs.smoke_parallel_shards) || '' }}${{ inputs.parallel_test_steps && '-parallel' || '' }}
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # The WSL steps only run in shard 1, which is where test/smoke/src/shard.ts pins the WSL suite.
      # pr-node-modules.yml fills this cache on main, so pull requests don't download the installer.
      - name: Restore WSL installer
        if: ${{ inputs.electron_tests && inputs.smoke_tests && inputs.smoke_shard_index == 1 }}
        uses: ./.github/actions/restore-wsl-installer

      - name: Prepare WSL Dev Container smoke tests
        id: wsl-dev-container
        if: ${{ inputs.electron_tests && inputs.smoke_tests && inputs.smoke_shard_index == 1 }}
        # Runner benchmarks continue without the WSL suite when the runner does not support WSL2
        continue-on-error: ${{ inputs.runner != '' }}
        timeout-minutes: 15
        shell: pwsh
        run: .\test\smoke\wslDevContainer.ps1
        env:
          WSL_INSTALLER_CACHE_DIR: ${{ github.workspace }}\.build\wsl-installer

      - name: Detect Agent Host E2E changes
        if: ${{ inputs.electron_tests && inputs.integration_tests }}
        id: agent-host-e2e-changes
        uses: ./.github/actions/detect-agent-host-e2e-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: "true"
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .build folder
        shell: pwsh
        run: mkdir .build -ea 0

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client and extensions
        shell: pwsh
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"

      - name: Setup Electron
        if: ${{ inputs.electron_tests || inputs.remote_tests }}
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile browser integration test runner
        if: ${{ inputs.browser_tests && inputs.integration_tests }}
        working-directory: test/integration/browser
        run: npm run compile

      - name: Install Playwright Chromium
        if: ${{ inputs.browser_tests }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm exec -- playwright install --only-shell chromium }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "Install failed after 3 attempts"
                throw
              }
              Write-Host "Install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }

      - name: 🧪 Run unit tests (Electron)
        if: ${{ inputs.electron_tests && inputs.unit_tests }}
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\test.bat --tfs "Unit Tests"
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run unit tests (node.js)
        if: ${{ inputs.electron_tests && inputs.unit_tests }}
        timeout-minutes: 15
        shell: pwsh
        run: npm run test-node

      - name: 🧪 Run unit tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.unit_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: node test/unit/browser/index.js --browser chromium --tfs "Browser Unit Tests"
        env:
          DEBUG: "*browser*"

      - name: Compile extensions for integration tests & smoke tests
        if: ${{ inputs.integration_tests || inputs.smoke_tests }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { npm run gulp `
            compile-extension:configuration-editing `
            compile-extension:css-language-features-server `
            compile-extension:emmet `
            compile-extension:git `
            compile-extension:github-authentication `
            compile-extension:html-language-features-server `
            compile-extension:ipynb `
            compile-extension:notebook-renderers `
            compile-extension:json-language-features-client `
            compile-extension:json-language-features-server `
            compile-extension:markdown-language-features `
            compile-extension-media `
            compile-extension:microsoft-authentication `
            compile-extension:typescript-language-features `
            compile-extension:vscode-api-tests `
            compile-extension:vscode-colorize-tests `
            compile-extension:vscode-colorize-perf-tests `
            compile-extension:vscode-test-resolver `
          }

      - name: Diagnostics before integration test runs
        if: ${{ inputs.integration_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run Agent Host E2E tests (Electron)
        id: agent-host-e2e
        if: ${{ inputs.electron_tests && inputs.integration_tests }}
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\test-agent-host-e2e.bat --tfs "Integration Tests"
        env:
          VSCODE_SKIP_AGENT_HOST_E2E: ${{ steps.agent-host-e2e-changes.outputs.affected == 'false' && '1' || '0' }}
          AGENT_HOST_TEST_PROFILE: ${{ steps.agent-host-e2e-changes.outputs.profile || 'full' }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ steps.agent-host-e2e-changes.outputs.reason || 'Change detection unavailable' }}
          VSCODE_SKIP_PRELAUNCH: '1'

      # Runs even when Agent Host E2E failed, so that one does not hide the other.
      - name: 🧪 Run integration tests (Electron)
        if: ${{ inputs.electron_tests && inputs.integration_tests && !cancelled() && (success() || steps.agent-host-e2e.outcome == 'failure') }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-integration.bat --tfs "Integration Tests"
        env:
          AGENT_HOST_TEST_PROFILE: ${{ steps.agent-host-e2e-changes.outputs.profile || 'full' }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ steps.agent-host-e2e-changes.outputs.reason || 'Change detection unavailable' }}
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run integration tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.integration_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-web-integration.bat --browser chromium

      - name: 🧪 Run integration tests (Remote)
        if: ${{ inputs.remote_tests && inputs.integration_tests && !inputs.parallel_test_steps }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-remote-integration.bat
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Diagnostics after integration test runs
        if: ${{ inputs.integration_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true


      - name: Compile smoke tests
        if: ${{ inputs.smoke_tests }}
        working-directory: test/smoke
        shell: pwsh
        run: npm run compile

      - name: Compile Copilot Chat extension for smoke tests
        if: ${{ inputs.smoke_tests && !inputs.browser_tests }}
        working-directory: extensions/copilot
        run: npm run compile

      - name: Diagnostics before smoke test run
        if: ${{ inputs.smoke_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run smoke tests (Electron)
        if: ${{ inputs.electron_tests && inputs.smoke_tests && inputs.smoke_parallel_shards == 0 }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --tracing --shard ${{ inputs.smoke_shard_index }}/${{ inputs.smoke_shard_total }}
        env:
          VSCODE_SMOKE_TEST_POLICY: '1'
          # Set in every shard so all shards register the WSL suite and compute the same split
          VSCODE_SMOKE_TEST_WSL_REQUIRED: ${{ (inputs.runner == '' || steps.wsl-dev-container.outcome == 'success') && '1' || '0' }}
          VSCODE_SMOKE_TEST_WSL_DISTRO: ${{ steps.wsl-dev-container.outputs.distro }}
          VSCODE_SMOKE_TEST_WSL_SERVER_PATH: ${{ steps.wsl-dev-container.outputs.serverPath }}

      # Every shard gets its own temp directory, see .github/workflows/run-parallel.ts
      - name: 🧪 Run smoke tests (Electron, ${{ inputs.smoke_parallel_shards }} shards in parallel)
        if: ${{ inputs.electron_tests && inputs.smoke_tests && inputs.smoke_parallel_shards > 0 }}
        timeout-minutes: 30
        shell: pwsh
        run: node .github/workflows/run-parallel.ts --label "Electron smoke x${{ inputs.smoke_parallel_shards }}" --shards ${{ inputs.smoke_parallel_shards }} --shard-command "npm run smoketest-no-compile -- --tracing"
        env:
          VSCODE_SMOKE_TEST_POLICY: '1'
          VSCODE_SMOKE_TEST_WSL_REQUIRED: ${{ (inputs.runner == '' || steps.wsl-dev-container.outcome == 'success') && '1' || '0' }}
          VSCODE_SMOKE_TEST_WSL_DISTRO: ${{ steps.wsl-dev-container.outputs.distro }}
          VSCODE_SMOKE_TEST_WSL_SERVER_PATH: ${{ steps.wsl-dev-container.outputs.serverPath }}

      - name: Clean up WSL Dev Container smoke tests
        if: ${{ always() && steps.wsl-dev-container.outputs.root != '' }}
        timeout-minutes: 5
        shell: pwsh
        env:
          WSL_SMOKE_DISTRO: ${{ steps.wsl-dev-container.outputs.distro }}
          WSL_SMOKE_ROOT: ${{ steps.wsl-dev-container.outputs.root }}
        run: .\test\smoke\wslDevContainer.ps1 -Operation Cleanup -Distribution $env:WSL_SMOKE_DISTRO -Root $env:WSL_SMOKE_ROOT

      - name: 🧪 Run smoke tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.smoke_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --web --tracing --headless

      - name: 🧪 Run smoke tests (Remote)
        if: ${{ inputs.remote_tests && inputs.smoke_tests && !inputs.parallel_test_steps }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --remote --tracing

      # Both runs start the server out of sources, which downloads the remote node when it is
      # missing, so download it first instead of in both runs at the same time.
      - name: 🧪 Run integration & smoke tests (Remote, in parallel)
        if: ${{ inputs.remote_tests && inputs.integration_tests && inputs.smoke_tests && inputs.parallel_test_steps }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { npm run gulp node }
          exec { node .github/workflows/run-parallel.ts --label "Remote integration & smoke" --task "integration=.\scripts\test-remote-integration.bat" --task "smoke=npm run smoketest-no-compile -- --remote --tracing" }
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Diagnostics after smoke test run
        if: ${{ inputs.smoke_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: Publish Crash Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('crash-dump-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/crashes
          if-no-files-found: ignore

      # In order to properly symbolify above crash reports
      # (if any), we need the compiled native modules too
      - name: Publish Node Modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('node-modules-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: node_modules
          if-no-files-found: ignore

      - name: Publish Log Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: ${{ format('logs-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/logs
          if-no-files-found: ignore

on:
  workflow_call:
    inputs:
      job_name:
        type: string
        required: true
      electron_tests:
        type: boolean
        default: false
      browser_tests:
        type: boolean
        default: false
      remote_tests:
        type: boolean
        default: false
      unit_tests:
        type: boolean
        default: true
      integration_tests:
        type: boolean
        default: true
      smoke_tests:
        type: boolean
        default: true

jobs:
  windows-test:
    name: ${{ inputs.job_name }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-windows-2022-x64, "JobId=windows-test-${{ inputs.job_name }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    env:
      ARTIFACT_NAME: ${{ (inputs.electron_tests && 'electron') || (inputs.browser_tests && 'browser') || (inputs.remote_tests && 'remote') || 'unknown' }}${{ (inputs.unit_tests && !inputs.integration_tests && '-unit') || (!inputs.unit_tests && !inputs.integration_tests && inputs.smoke_tests && '-smoke') || '' }}
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # TEMPORARY: verify the pool can boot WSL2 before provisioning Docker.
      - name: Probe WSL2 capability
        id: wsl2-probe
        if: ${{ inputs.electron_tests && inputs.smoke_tests }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, VMMonitorModeExtensions, SecondLevelAddressTranslationExtensions | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List
          foreach ($feature in @('Microsoft-Windows-Subsystem-Linux', 'VirtualMachinePlatform')) {
            try {
              Get-WindowsOptionalFeature -Online -FeatureName $feature | Select-Object FeatureName, State | Format-List
            } catch {
              Write-Warning "Cannot inspect ${feature}: $_"
            }
          }
          $wsl = Join-Path $env:SystemRoot 'System32\wsl.exe'
          if (-not (Test-Path -LiteralPath $wsl)) {
            throw 'WSL2 probe failed: wsl.exe is unavailable. No feature changes or reboot will be attempted.'
          }
          & $wsl --version
          Write-Host "WSL version exit code: $LASTEXITCODE"
          & $wsl --status
          Write-Host "WSL status exit code: $LASTEXITCODE"
          & $wsl --list --verbose
          Write-Host "WSL list exit code: $LASTEXITCODE"

          $distro = "vscode-wsl2-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N'))"
          $root = Join-Path $env:GITHUB_WORKSPACE ".build\$distro"
          New-Item -ItemType Directory -Path $root | Out-Null
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $archive = Join-Path $root 'ubuntu-rootfs.tar.gz'
          $install = Join-Path $root 'distro'
          $url = 'https://cloud-images.ubuntu.com/wsl/jammy/20250318/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz'
          $expectedHash = '1483cc5c1dce13064f774834cbffdff226559fd522a67a381a8ea77d63fb4109'
          curl.exe --fail --location --retry 2 --connect-timeout 30 --max-time 180 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "WSL2 rootfs download failed with exit code $LASTEXITCODE."
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'WSL2 rootfs SHA256 mismatch.'
          }
          New-Item -ItemType Directory -Path $install | Out-Null
          "distro=$distro" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & $wsl --import $distro $install $archive --version 2
          if ($LASTEXITCODE -ne 0) {
            throw "Explicit WSL2 import failed with exit code $LASTEXITCODE. No WSL1 fallback, feature changes, or reboot will be attempted."
          }
          & $wsl --distribution $distro --user root --exec /bin/sh -ec 'uname -a; cat /etc/os-release; echo WSL2_PROBE_BOOT_OK'
          if ($LASTEXITCODE -ne 0) {
            throw "WSL2 distribution failed to boot with exit code $LASTEXITCODE."
          }
          $listing = & $wsl --list --verbose
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot verify the imported WSL distribution version.'
          }
          $listingText = ($listing -join "`n") -replace "`0", ''
          Write-Host $listingText
          if ($listingText -notmatch ('(?m)^\s*\*?\s*' + [regex]::Escape($distro) + '\s+.+\s+2\s*$')) {
            throw "$distro is not reported as WSL version 2."
          }
          Write-Host 'WSL2 capability probe passed: explicit version-2 import and Linux boot succeeded.'

      - name: Clean up WSL2 capability probe
        if: ${{ always() && inputs.electron_tests && inputs.smoke_tests && steps.wsl2-probe.outputs.root != '' }}
        timeout-minutes: 3
        shell: pwsh
        env:
          PROBE_DISTRO: ${{ steps.wsl2-probe.outputs.distro }}
          PROBE_ROOT: ${{ steps.wsl2-probe.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:PROBE_DISTRO) {
            if ($env:PROBE_DISTRO -notmatch '^vscode-wsl2-probe-\d+-\d+-[0-9a-f]{32}$') {
              throw 'Refusing cleanup of an unexpected distribution name.'
            }
            $registered = & wsl.exe --list --quiet
            $listExitCode = $LASTEXITCODE
            $names = @($registered | ForEach-Object { ($_ -replace "`0", '').Trim() })
            if ($listExitCode -ne 0 -or $names -contains $env:PROBE_DISTRO) {
              & wsl.exe --terminate $env:PROBE_DISTRO
              & wsl.exe --unregister $env:PROBE_DISTRO
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to unregister $env:PROBE_DISTRO. Leaving its files intact."
              }
            }
          }
          $root = [IO.Path]::GetFullPath($env:PROBE_ROOT)
          if ([IO.Path]::GetDirectoryName($root) -ne [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.build')) -or [IO.Path]::GetFileName($root) -notmatch '^vscode-wsl2-probe-\d+-\d+-[0-9a-f]{32}$') {
            throw 'Refusing cleanup of an unexpected probe directory.'
          }
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          exit 0

      - name: Detect Agent Host E2E changes
        if: ${{ inputs.electron_tests && inputs.integration_tests }}
        id: agent-host-e2e-changes
        uses: ./.github/actions/detect-agent-host-e2e-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: "true"
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .build folder
        shell: pwsh
        run: mkdir .build -ea 0

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client and extensions
        shell: pwsh
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"

      - name: Setup Electron
        if: ${{ inputs.electron_tests || inputs.remote_tests }}
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile browser integration test runner
        if: ${{ inputs.browser_tests && inputs.integration_tests }}
        working-directory: test/integration/browser
        run: npm run compile

      - name: Install Playwright Chromium
        if: ${{ inputs.browser_tests }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm exec -- playwright install --only-shell chromium }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "Install failed after 3 attempts"
                throw
              }
              Write-Host "Install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }

      - name: 🧪 Run unit tests (Electron)
        if: ${{ inputs.electron_tests && inputs.unit_tests }}
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\test.bat --tfs "Unit Tests"
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run unit tests (node.js)
        if: ${{ inputs.electron_tests && inputs.unit_tests }}
        timeout-minutes: 15
        shell: pwsh
        run: npm run test-node

      - name: 🧪 Run unit tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.unit_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: node test/unit/browser/index.js --browser chromium --tfs "Browser Unit Tests"
        env:
          DEBUG: "*browser*"

      - name: Compile extensions for integration tests & smoke tests
        if: ${{ inputs.integration_tests || inputs.smoke_tests }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { npm run gulp `
            compile-extension:configuration-editing `
            compile-extension:css-language-features-server `
            compile-extension:emmet `
            compile-extension:git `
            compile-extension:github-authentication `
            compile-extension:html-language-features-server `
            compile-extension:ipynb `
            compile-extension:notebook-renderers `
            compile-extension:json-language-features-server `
            compile-extension:markdown-language-features `
            compile-extension-media `
            compile-extension:microsoft-authentication `
            compile-extension:typescript-language-features `
            compile-extension:vscode-api-tests `
            compile-extension:vscode-colorize-tests `
            compile-extension:vscode-colorize-perf-tests `
            compile-extension:vscode-test-resolver `
          }

      - name: Diagnostics before integration test runs
        if: ${{ inputs.integration_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run integration tests (Electron)
        if: ${{ inputs.electron_tests && inputs.integration_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-integration.bat --tfs "Integration Tests"
        env:
          VSCODE_SKIP_AGENT_HOST_E2E: ${{ steps.agent-host-e2e-changes.outputs.affected == 'false' && '1' || '0' }}
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run integration tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.integration_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-web-integration.bat --browser chromium

      - name: 🧪 Run integration tests (Remote)
        if: ${{ inputs.remote_tests && inputs.integration_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-remote-integration.bat
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Diagnostics after integration test runs
        if: ${{ inputs.integration_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true


      - name: Compile smoke tests
        if: ${{ inputs.smoke_tests }}
        working-directory: test/smoke
        shell: pwsh
        run: npm run compile

      - name: Compile Copilot Chat extension for smoke tests
        if: ${{ inputs.smoke_tests && !inputs.browser_tests }}
        working-directory: extensions/copilot
        run: npm run compile

      - name: Diagnostics before smoke test run
        if: ${{ inputs.smoke_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run smoke tests (Electron)
        if: ${{ inputs.electron_tests && inputs.smoke_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --tracing
        env:
          VSCODE_SMOKE_TEST_POLICY: '1'

      - name: 🧪 Run smoke tests (Browser, Chromium)
        if: ${{ inputs.browser_tests && inputs.smoke_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --web --tracing --headless

      - name: 🧪 Run smoke tests (Remote)
        if: ${{ inputs.remote_tests && inputs.smoke_tests }}
        timeout-minutes: 20
        shell: pwsh
        run: npm run smoketest-no-compile -- --remote --tracing

      - name: Diagnostics after smoke test run
        if: ${{ inputs.smoke_tests && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: Publish Crash Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('crash-dump-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/crashes
          if-no-files-found: ignore

      # In order to properly symbolify above crash reports
      # (if any), we need the compiled native modules too
      - name: Publish Node Modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('node-modules-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: node_modules
          if-no-files-found: ignore

      - name: Publish Log Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: ${{ format('logs-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/logs
          if-no-files-found: ignore

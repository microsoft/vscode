on:
  workflow_call:
    inputs:
      electron_unit_affected:
        description: Whether the pull request can affect the Electron-Unit job, which is skipped when false
        type: boolean
        default: true
      electron_affected:
        description: Whether the pull request can affect the Electron (extension host) job, which is skipped when false
        type: boolean
        default: true
      agent_host_e2e_affected:
        description: Whether the pull request can affect the Agent-Host-E2E jobs, which are skipped when false
        type: boolean
        default: true
      electron_smoke_affected:
        description: Whether the pull request can affect the Electron-Smoke jobs, which are skipped when false
        type: boolean
        default: true
      browser_unit_affected:
        description: Whether the pull request can affect the Browser-Unit job, which is skipped when false
        type: boolean
        default: true
      browser_affected:
        description: Whether the pull request can affect the Browser jobs, which are skipped when false
        type: boolean
        default: true
      remote_affected:
        description: Whether the pull request can affect the Remote jobs, which are skipped when false
        type: boolean
        default: true
      node_integration_tests:
        description: Whether the plan selects node.js integration tests for the Electron (node.js) job, which is skipped when false
        type: boolean
        default: true
      agent_host_test_profile:
        description: Agent Host test profile, 'pr' or 'full' (see .github/actions/detect-agent-host-e2e-changes)
        type: string
        default: full
      agent_host_test_profile_reason:
        description: Reason for selecting the Agent Host test profile
        type: string
        default: Change detection unavailable
      workspace_image_branch:
        description: The branch whose workspace images the jobs use (see .github/workflows/workspace_image/README.md)
        type: string
        default: main

env:
  NPM_ARCH: x64
  VSCODE_ARCH: x64
  VSCODE_SKIP_PRELAUNCH: '1'

# Each job reports as "Windows / <job name>", for example "Windows / Electron-Unit", whether it runs
# or not: the names are fixed, as GitHub does not evaluate the expressions in the name of a skipped
# job. The jobs run the steps of the first one (steps: &steps), and their env selects which of them
# run (a flag is on when it is 'true'):
# - ELECTRON_TESTS, BROWSER_TESTS or REMOTE_TESTS: the test runner
# - UNIT_TESTS, INTEGRATION_TESTS, SMOKE_TESTS and AGENT_HOST_E2E_TESTS: the kinds of tests
# - INTEGRATION_TEST_SUITE: the integration tests of an Electron job, 'node' for the node.js integration
#   tests or 'extension-host' for the extension host tests, or both when unset
# - TEST_SELECTION: run only the test files listed in the test-plan artifact of the workflow run, when
#   the Detect Changes job of pr.yml uploaded one, instead of every test of the kinds that it plans
#   (unit.txt for the unit tests, integration.txt for the node.js integration tests and Agent Host E2E)
# - AGENT_HOST_E2E_SHARD_INDEX and AGENT_HOST_E2E_SHARD_TOTAL: the 1-based index of the Agent Host E2E
#   shard to run, and the number of shards
# - SMOKE_SHARD_INDEX and SMOKE_SHARD_TOTAL: the 1-based index of the Electron or remote smoke test
#   shard to run, and the number of shards
# - WSL_SMOKE_TESTS: with ELECTRON_TESTS and SMOKE_TESTS, provision WSL and run only the WSL Dev Container
#   smoke suite and the WSL Kerberos proxy smoke tests, instead of a shard of the smoke tests
# - ARTIFACT_NAME: identifies the job in the names of the artifacts that it publishes
jobs:
  electron-unit:
    name: Electron-Unit
    if: ${{ inputs.electron_unit_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-unit
      ELECTRON_TESTS: 'true'
      UNIT_TESTS: 'true'
      TEST_SELECTION: 'true'
    steps: &steps
      # A workspace image of main holds a workspace whose dependencies, Electron and Playwright browsers
      # are installed, which the checkout updates (see .github/workflows/workspace_image/README.md). Its
      # scripts run before the checkout, so they come from the API, at the commit that the job tests, as
      # in pr-workspace-images.yml. The WSL smoke test job keeps its workspace on drive C (see the Dev
      # Drive step below), and sets up without an image.
      - name: Download the workspace image scripts
        id: image-scripts
        if: ${{ env.WSL_SMOKE_TESTS != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/workspace-image"
          mkdir -p "$dir"
          echo '{ "type": "module" }' > "$dir/package.json"
          # The scripts keep their folders below workspace_image, such as win32/vhd.ps1
          files=(.nvmrc .github/workflows/workspace_image/{image.ts,win32/vhd.ps1,win32/Vhd.cs})
          args=()
          for file in "${files[@]}"; do
            args+=(-o "$dir/${file#.github/workflows/workspace_image/}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA")
          done
          curl -fsSL --retry 3 --parallel --create-dirs -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw' "${args[@]}"
          for file in "${files[@]}"; do
            [ -s "$dir/${file#.github/workflows/workspace_image/}" ]
          done
          echo "node-version=$(tr -d '[:space:]' < "$dir/.nvmrc")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.image-scripts.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.image-scripts.outputs.node-version }}

      # The image is a Dev Drive in a VHDX, mounted at the parent of the workspace like the Dev Drive
      # below, which the job creates without an image. The first PowerShell of a job takes seconds to
      # start, so this step runs in bash, and the PowerShell that attaches the image (vhd.ps1) starts
      # while the image downloads. image.ts gives up before the timeout of the step, which could stop it
      # with the image half attached, and then detaches the image as after any other error, so that the
      # job sets up as without an image. Pull requests to release branches look for images of their own
      # branch, which pr-workspace-images.yml doesn't build.
      - name: Restore the workspace image
        id: image
        if: steps.image-scripts.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ runner.temp }}
        run: node "$RUNNER_TEMP/workspace-image/image.ts" restore --name workspace-image-win32-x64.img --branch "$WORKSPACE_IMAGE_BRANCH" --timeout-seconds 240
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_IMAGE_BRANCH: ${{ inputs.workspace_image_branch }}

      # The larger runners keep the workspace on the OS disk, where creating many small files, such as
      # extracting node_modules, takes twice as long as on the 1ES runners' temporary disk. A Dev Drive in
      # a VHDX on the same disk is faster than both. It is mounted at the parent of the workspace, so that
      # the workspace keeps its path and is an ordinary, empty folder for actions/checkout, which cannot
      # clear the root of a volume. The WSL smoke test job runs on the 1ES pool (see the runs-on of
      # electron-smoke-wsl), and WSL cannot open folders on a volume that is mounted in a folder of drive C:
      # anyway.
      - name: Move the workspace to a Dev Drive
        if: ${{ steps.image.outputs.used != 'true' && env.WSL_SMOKE_TESTS != 'true' }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $mount = Split-Path $workspace -Parent
          $vhd = Join-Path $env:RUNNER_TEMP 'workspace.vhdx'
          try {
            if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
            @(
              "create vdisk file=`"$vhd`" maximum=204800 type=expandable"
              "select vdisk file=`"$vhd`""
              'attach vdisk'
              'create partition primary'
              'assign letter=W'
            ) | Set-Content diskpart.txt
            diskpart /s diskpart.txt | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart exited with $LASTEXITCODE" }
            Format-Volume -DriveLetter W -DevDrive -Confirm:$false -Force | Out-Host
            Remove-Item $workspace
            if (Get-ChildItem -Force $mount) { throw "$mount holds more than the workspace" }
            Add-PartitionAccessPath -DriveLetter W -AccessPath "$mount\"
            # Without a drive letter, the native realpath of the workspace files stays under $mount.
            Remove-PartitionAccessPath -DriveLetter W -AccessPath 'W:\'
            New-Item -ItemType Directory -Path $workspace | Out-Null
            fsutil devdrv query $mount | Out-Host
          } catch {
            Write-Output "::warning::The workspace stays on the OS disk: $_"
            New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          }
          exit 0

      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      # The WSL steps only run in the WSL smoke test job (electron-smoke-wsl).
      # pr-node-modules.yml fills this cache on main, so pull requests don't download the installer.
      - name: Restore WSL installer
        if: ${{ env.WSL_SMOKE_TESTS == 'true' }}
        uses: ./.github/actions/restore-wsl-installer

      # The wsl-distro job of pr-workspace-images.yml prepares the WSL distribution on main every day, so that the
      # setup imports it instead of building it. Its key hashes the files that define it, and the restore key finds the
      # newest one. Without one, or when it cannot be used, wslDevContainer.ps1 builds the distribution.
      - name: Restore prepared WSL distribution
        if: ${{ env.WSL_SMOKE_TESTS == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/wsl-distro
          key: "wsl-distro-v1-${{ runner.os }}-${{ hashFiles('test/smoke/wslDevContainer.ps1', 'build/checksums/wsl.txt') }}"
          restore-keys: "wsl-distro-v1-${{ runner.os }}-${{ hashFiles('test/smoke/wslDevContainer.ps1', 'build/checksums/wsl.txt') }}-"

      # The WSL setup takes 2 to 4 minutes, mostly downloads and package installs, so it runs in the background
      # while the steps below install and build, and "Wait for the WSL Dev Container smoke test setup" waits for
      # it before the smoke tests. The setup writes its step outputs, log and exit code to files. Start-Process
      # without redirection doesn't pass the output handles of this step to the setup, so the step ends at once.
      - name: Start the WSL Dev Container smoke test setup
        id: wsl-dev-container-start
        if: ${{ env.WSL_SMOKE_TESTS == 'true' }}
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'wsl-dev-container'
          $logDirectory = Join-Path $env:GITHUB_WORKSPACE '.build\logs\wsl-dev-container'
          New-Item -ItemType Directory -Force -Path $state, $logDirectory | Out-Null
          $env:GITHUB_OUTPUT = Join-Path $state 'outputs.txt'
          $env:WSL_SMOKE_SETUP_LOG = Join-Path $logDirectory 'setup.log'
          $env:WSL_SMOKE_SETUP_EXIT_CODE = Join-Path $state 'exit-code.txt'
          New-Item -ItemType File -Force -Path $env:GITHUB_OUTPUT | Out-Null
          Set-Content -LiteralPath (Join-Path $state 'setup.ps1') -Value @'
          $ErrorActionPreference = 'Stop'
          $code = 1
          try {
            & "$env:GITHUB_WORKSPACE\test\smoke\wslDevContainer.ps1" *> $env:WSL_SMOKE_SETUP_LOG
            $code = if (Test-Path variable:\LASTEXITCODE) { $LASTEXITCODE } else { 0 }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $env:WSL_SMOKE_SETUP_LOG
          } finally {
            Set-Content -LiteralPath $env:WSL_SMOKE_SETUP_EXIT_CODE -Value $code
          }
          '@
          $process = Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-File', (Join-Path $state 'setup.ps1') -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          # The start time tells the setup apart from a later process with the same ID.
          Set-Content -LiteralPath (Join-Path $state 'process.txt') -Value "$($process.Id) $($process.StartTime.ToFileTimeUtc())"
          Set-Content -LiteralPath (Join-Path $state 'deadline.txt') -Value ([DateTime]::UtcNow.AddMinutes(15).ToString('o'))
        env:
          WSL_INSTALLER_CACHE_DIR: ${{ github.workspace }}\.build\wsl-installer
          WSL_PREPARED_DISTRO_VHD: ${{ github.workspace }}\.build\wsl-distro\vscode-wsl-smoke.vhdx

      - name: Setup Node.js
        if: steps.image-scripts.outcome != 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # A workspace image holds the node_modules of its commit, which the install step updates
      - name: Restore node_modules cache
        id: cache-node-modules
        if: steps.image.outputs.used != 'true'
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      # On a workspace image, pnpm installs only what changed since the commit of the image
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { pnpm run preinstall }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { pnpm install --frozen-lockfile }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "pnpm install failed after 5 attempts"
                throw
              }
              Write-Host "pnpm install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .build folder
        shell: pwsh
        run: mkdir .build -ea 0

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client and extensions
        shell: pwsh
        run: pnpm run gulp "transpile-client-esbuild" "transpile-extensions"

      - name: Setup Electron
        if: ${{ env.ELECTRON_TESTS == 'true' || env.REMOTE_TESTS == 'true' }}
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile browser integration test runner
        if: ${{ env.BROWSER_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        working-directory: test/integration/browser
        run: pnpm run compile

      # pr-node-modules.yml fills this cache on main, so pull requests don't download the browsers.
      # A workspace image holds them already, and points PLAYWRIGHT_BROWSERS_PATH at them, which this
      # action would point into the workspace.
      - name: Restore Playwright browsers
        if: ${{ env.BROWSER_TESTS == 'true' && steps.image.outputs.used != 'true' }}
        uses: ./.github/actions/restore-playwright
        with:
          browsers: --only-shell chromium

      - name: Install Playwright Chromium
        if: ${{ env.BROWSER_TESTS == 'true' }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { pnpm exec playwright install --only-shell chromium }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "Install failed after 3 attempts"
                throw
              }
              Write-Host "Install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }

      - name: Download test plan
        id: download-plan
        if: ${{ env.TEST_SELECTION == 'true' }}
        # Without a plan (Detect Changes only uploads one when the selection applies), the test
        # steps below run every test. A pattern, unlike a name, downloads nothing instead of
        # failing when there is no plan.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-plan
          path: .build/test-plan

      # A failed download (such as a digest mismatch, reported after extracting) can leave a partial
      # plan behind: without one, the test steps below run every test.
      - name: Discard a failed test plan download
        if: ${{ steps.download-plan.outcome == 'failure' }}
        shell: pwsh
        run: if (Test-Path .build/test-plan) { Remove-Item -Recurse -Force .build/test-plan }

      - name: 🧪 Run unit tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.UNIT_TESTS == 'true' && (hashFiles('.build/test-plan/plan.json') == '' || hashFiles('.build/test-plan/unit.txt') != '') }}
        timeout-minutes: 25
        shell: pwsh
        run: .\scripts\test.bat --tfs "Unit Tests" --workers 4 --rerun-failed-files 2 ${{ hashFiles('.build/test-plan/plan.json') != '' && '--runList .build/test-plan/unit.txt' || '' }}
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run unit tests (node.js)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.UNIT_TESTS == 'true' && (hashFiles('.build/test-plan/plan.json') == '' || hashFiles('.build/test-plan/unit.txt') != '') }}
        timeout-minutes: 25
        shell: pwsh
        run: pnpm run test-node --workers 4 --rerun-failed-files 2 ${{ hashFiles('.build/test-plan/plan.json') != '' && '--runList .build/test-plan/unit.txt' || '' }}

      - name: 🧪 Run unit tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.UNIT_TESTS == 'true' && (hashFiles('.build/test-plan/plan.json') == '' || hashFiles('.build/test-plan/unit.txt') != '') }}
        timeout-minutes: 25
        shell: pwsh
        run: node test/unit/browser/index.js --browser chromium --tfs "Browser Unit Tests" --workers 4 --rerun-failed-files 2 ${{ hashFiles('.build/test-plan/plan.json') != '' && '--runList .build/test-plan/unit.txt' || '' }}
        env:
          DEBUG: "*browser*"

      - name: Compile extensions for integration tests & smoke tests
        if: ${{ env.INTEGRATION_TESTS == 'true' || env.SMOKE_TESTS == 'true' }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { pnpm run gulp `
            compile-extension:configuration-editing `
            compile-extension:css-language-features-server `
            compile-extension:emmet `
            compile-extension:git `
            compile-extension:git-base `
            compile-extension:github-authentication `
            compile-extension:html-language-features-server `
            compile-extension:ipynb `
            compile-extension:notebook-renderers `
            compile-extension:json-language-features-client `
            compile-extension:json-language-features-server `
            compile-extension:markdown-language-features `
            compile-extension-media `
            compile-extension:microsoft-authentication `
            compile-extension:typescript-language-features `
            compile-extension:vscode-api-tests `
            compile-extension:vscode-colorize-tests `
            compile-extension:vscode-colorize-perf-tests `
            compile-extension:vscode-test-resolver `
          }

      - name: Diagnostics before integration test runs
        if: ${{ (env.INTEGRATION_TESTS == 'true' || env.AGENT_HOST_E2E_TESTS == 'true') && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run Agent Host E2E tests (Electron)
        id: agent-host-e2e
        if: ${{ env.ELECTRON_TESTS == 'true' && env.AGENT_HOST_E2E_TESTS == 'true' }}
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\test-agent-host-e2e.bat --rerun-failed-files 2${{ env.AGENT_HOST_E2E_SHARD_TOTAL > 1 && format(' --shard {0}/{1}', env.AGENT_HOST_E2E_SHARD_INDEX, env.AGENT_HOST_E2E_SHARD_TOTAL) || '' }} --tfs "Integration Tests" ${{ hashFiles('.build/test-plan/integration.txt') != '' && '--runList .build/test-plan/integration.txt' || '' }}
        env:
          AGENT_HOST_TEST_PROFILE: ${{ inputs.agent_host_test_profile }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ inputs.agent_host_test_profile_reason }}
          VSCODE_SKIP_PRELAUNCH: '1'

      # Runs even when Agent Host E2E failed in the same job, so that one does not hide the other.
      # Reruns the failed tests in a fresh window.
      - name: 🧪 Run integration tests (Electron)
        id: node-integration-tests
        if: ${{ env.ELECTRON_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' && env.INTEGRATION_TEST_SUITE != 'extension-host' && !cancelled() && (success() || steps.agent-host-e2e.outcome == 'failure') }}
        timeout-minutes: 25
        shell: pwsh
        run: .\scripts\test-integration.bat --only-node-tests --rerun-failed-files 2 --tfs "Integration Tests" ${{ hashFiles('.build/test-plan/integration.txt') != '' && '--runList .build/test-plan/integration.txt' || '' }}
        env:
          AGENT_HOST_TEST_PROFILE: ${{ inputs.agent_host_test_profile }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ inputs.agent_host_test_profile_reason }}
          VSCODE_SKIP_PRELAUNCH: '1'

      # Runs even when the node.js integration tests or Agent Host E2E failed in the same job.
      # The extension host suites are not rerun.
      - name: 🧪 Run extension host integration tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' && env.INTEGRATION_TEST_SUITE != 'node' && !cancelled() && (success() || steps.agent-host-e2e.outcome == 'failure' || steps.node-integration-tests.outcome == 'failure') }}
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\test-integration.bat --only-extension-host-tests
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      # The web and remote tests start the server out of sources, which downloads its Node.js from nodejs.org unless
      # the runner already has that version.
      - name: Use the runner's Node.js for the server
        if: ${{ (env.BROWSER_TESTS == 'true' || env.REMOTE_TESTS == 'true') && (env.INTEGRATION_TESTS == 'true' || env.SMOKE_TESTS == 'true') }}
        shell: pwsh
        run: node build/azure-pipelines/common/useRunnerNodeForServer.ts

      - name: 🧪 Run integration tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-web-integration.bat --browser chromium

      - name: 🧪 Run integration tests (Remote)
        if: ${{ env.REMOTE_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\test-remote-integration.bat
        env:
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Diagnostics after integration test runs
        if: ${{ (env.INTEGRATION_TESTS == 'true' || env.AGENT_HOST_E2E_TESTS == 'true') && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true


      - name: Compile smoke tests
        if: ${{ env.SMOKE_TESTS == 'true' }}
        working-directory: test/smoke
        shell: pwsh
        run: pnpm run compile

      - name: Compile Copilot Chat extension for smoke tests
        if: ${{ env.SMOKE_TESTS == 'true' && env.BROWSER_TESTS != 'true' }}
        working-directory: extensions/copilot
        run: pnpm run compile

      # Reports the outputs of the setup as its own, which the WSL steps below read. The setup has 15 minutes
      # from its start, as when it ran in the foreground.
      - name: Wait for the WSL Dev Container smoke test setup
        id: wsl-dev-container
        if: ${{ steps.wsl-dev-container-start.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'wsl-dev-container'
          $exitCodeFile = Join-Path $state 'exit-code.txt'
          $id, $startTime = (Get-Content -LiteralPath (Join-Path $state 'process.txt')) -split ' '
          $deadline = [DateTime]::Parse((Get-Content -LiteralPath (Join-Path $state 'deadline.txt')), $null, 'RoundtripKind')
          $timedOut = $false
          while (-not (Test-Path -LiteralPath $exitCodeFile)) {
            $process = Get-Process -Id $id -ErrorAction SilentlyContinue
            if (-not $process -or $process.StartTime.ToFileTimeUtc() -ne $startTime) {
              break
            }
            if ([DateTime]::UtcNow -gt $deadline) {
              taskkill /PID $id /T /F | Out-Host
              $timedOut = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.build\logs\wsl-dev-container\setup.log') -ErrorAction SilentlyContinue
          Get-Content -LiteralPath (Join-Path $state 'outputs.txt') | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($timedOut) {
            throw 'The WSL Dev Container smoke test setup did not finish within 15 minutes.'
          }
          if (-not (Test-Path -LiteralPath $exitCodeFile)) {
            throw 'The WSL Dev Container smoke test setup stopped without reporting its result.'
          }
          $code = [int](Get-Content -LiteralPath $exitCodeFile)
          if ($code -ne 0) {
            throw "The WSL Dev Container smoke test setup failed with exit code $code. See its log above."
          }

      - name: Diagnostics before smoke test run
        if: ${{ env.SMOKE_TESTS == 'true' && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: 🧪 Run smoke tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.SMOKE_TESTS == 'true' && env.WSL_SMOKE_TESTS != 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: pnpm run smoketest-no-compile --tracing --shard ${{ env.SMOKE_SHARD_INDEX }}/${{ env.SMOKE_SHARD_TOTAL }}
        env:
          VSCODE_SMOKE_TEST_POLICY: '1'

      # Only the WSL smoke test job runs the WSL suite, which needs its WSL setup. The shards don't set the
      # WSL variables, so they skip the suite.
      - name: 🧪 Run WSL Dev Container smoke tests (Electron)
        if: ${{ env.WSL_SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: pnpm run smoketest-no-compile --tracing -g 'Agents Window \(WSL Dev Container AgentHost\)'
        env:
          VSCODE_SMOKE_TEST_WSL_REQUIRED: '1'
          VSCODE_SMOKE_TEST_WSL_DISTRO: ${{ steps.wsl-dev-container.outputs.distro }}
          VSCODE_SMOKE_TEST_WSL_SERVER_PATH: ${{ steps.wsl-dev-container.outputs.serverPath }}

      # Configures a test Kerberos realm, CA and PAC on the elevated agent and reverts them afterwards. The pinned server
      # refuses a client built from source, so the editor window suite only runs in the Azure product build.
      - name: 🧪 Run WSL Kerberos proxy smoke tests (Electron)
        if: ${{ env.WSL_SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: .\test\smoke\scripts\run-agents-window-wsl-kerberos-proxy.ps1 -Distribution $env:WSL_SMOKE_DISTRO -WslServerPath $env:WSL_SMOKE_SERVER_PATH -Suites AgentsWindow
        env:
          WSL_SMOKE_DISTRO: ${{ steps.wsl-dev-container.outputs.distro }}
          WSL_SMOKE_SERVER_PATH: ${{ steps.wsl-dev-container.outputs.serverPath }}

      # Reads the outputs of the setup from its file, as the wait step doesn't run when a step before it fails,
      # and first stops the setup if it is still running.
      - name: Clean up WSL Dev Container smoke tests
        if: ${{ always() && steps.wsl-dev-container-start.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'wsl-dev-container'
          $id, $startTime = (Get-Content -LiteralPath (Join-Path $state 'process.txt')) -split ' '
          $process = Get-Process -Id $id -ErrorAction SilentlyContinue
          if ($process -and $process.StartTime.ToFileTimeUtc() -eq $startTime) {
            taskkill /PID $id /T /F | Out-Host
          }
          $outputs = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $state 'outputs.txt')) {
            $name, $value = $line -split '=', 2
            $outputs[$name] = $value
          }
          if ($outputs.root) {
            .\test\smoke\wslDevContainer.ps1 -Operation Cleanup -Distribution $outputs.distro -Root $outputs.root
          }

      - name: 🧪 Run smoke tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: pnpm run smoketest-no-compile --web --tracing --headless

      - name: 🧪 Run smoke tests (Remote)
        if: ${{ env.REMOTE_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        shell: pwsh
        run: pnpm run smoketest-no-compile --remote --tracing${{ env.SMOKE_SHARD_TOTAL > 1 && format(' --shard {0}/{1}', env.SMOKE_SHARD_INDEX, env.SMOKE_SHARD_TOTAL) || '' }}

      - name: Diagnostics after smoke test run
        if: ${{ env.SMOKE_TESTS == 'true' && always() }}
        shell: pwsh
        run: .\build\azure-pipelines\win32\listprocesses.bat
        continue-on-error: true

      - name: Publish Crash Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('crash-dump-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/crashes
          if-no-files-found: ignore

      # In order to properly symbolify above crash reports
      # (if any), we need the compiled native modules too
      - name: Publish Node Modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('node-modules-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: node_modules
          if-no-files-found: ignore

      - name: Publish Log Files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: ${{ format('logs-windows-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/logs
          if-no-files-found: ignore

  # The node.js integration tests (up to about 6.5 minutes when the plan selects many) and the extension
  # host tests (about 4 minutes) in one job could be the slowest job of the workflow, so they run on
  # separate machines, as on Linux. The node.js job runs only the tests that the plan selects, and is
  # skipped when it selects none.
  electron-node:
    name: Electron (node.js)
    if: ${{ inputs.node_integration_tests }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-node
      ELECTRON_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
      INTEGRATION_TEST_SUITE: node
      TEST_SELECTION: 'true'
    steps: *steps

  electron-extension-host:
    name: Electron (extension host)
    if: ${{ inputs.electron_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-extension-host
      ELECTRON_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
      INTEGRATION_TEST_SUITE: extension-host
    steps: *steps

  # Agent Host E2E is slower than the integration tests on Windows, so it runs in parallel with them on
  # other machines. It runs only the suites that the plan selects. The six suites take twice as long on
  # one 8-core larger runner as on the 1ES runners, and two shards still made it the slowest job of the
  # workflow, so the selected suites run in three shards.
  agent-host-e2e-1:
    name: Agent-Host-E2E (shard 1/3)
    if: ${{ inputs.agent_host_e2e_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-agent-host-e2e-1
      ELECTRON_TESTS: 'true'
      AGENT_HOST_E2E_TESTS: 'true'
      AGENT_HOST_E2E_SHARD_INDEX: '1'
      AGENT_HOST_E2E_SHARD_TOTAL: '3'
      TEST_SELECTION: 'true'
    steps: *steps

  agent-host-e2e-2:
    name: Agent-Host-E2E (shard 2/3)
    if: ${{ inputs.agent_host_e2e_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-agent-host-e2e-2
      ELECTRON_TESTS: 'true'
      AGENT_HOST_E2E_TESTS: 'true'
      AGENT_HOST_E2E_SHARD_INDEX: '2'
      AGENT_HOST_E2E_SHARD_TOTAL: '3'
      TEST_SELECTION: 'true'
    steps: *steps

  agent-host-e2e-3:
    name: Agent-Host-E2E (shard 3/3)
    if: ${{ inputs.agent_host_e2e_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-agent-host-e2e-3
      ELECTRON_TESTS: 'true'
      AGENT_HOST_E2E_TESTS: 'true'
      AGENT_HOST_E2E_SHARD_INDEX: '3'
      AGENT_HOST_E2E_SHARD_TOTAL: '3'
      TEST_SELECTION: 'true'
    steps: *steps

  # Running every Electron smoke test takes one machine up to about 20 minutes, the timeout of the
  # step, so the shards split them over parallel machines (see .github/skills/smoke-tests/SKILL.md).
  # The WSL Dev Container suite runs in its own job (electron-smoke-wsl), so that the shards use the
  # workspace images on the larger runners.
  electron-smoke-1:
    name: Electron-Smoke (shard 1/3)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-smoke-shard1
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '1'
      SMOKE_SHARD_TOTAL: '3'
    steps: *steps

  electron-smoke-2:
    name: Electron-Smoke (shard 2/3)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-smoke-shard2
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '2'
      SMOKE_SHARD_TOTAL: '3'
    steps: *steps

  electron-smoke-3:
    name: Electron-Smoke (shard 3/3)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: electron-smoke-shard3
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '3'
      SMOKE_SHARD_TOTAL: '3'
    steps: *steps

  # The WSL Dev Container suite and the WSL Kerberos proxy smoke tests. The WSL setup runs in the
  # background while the job installs and builds. GitHub-hosted Windows runners intermittently freeze
  # while WSL2 provisions a distribution (https://github.com/actions/runner-images/issues/14938): the
  # step timeout never fires, no log is kept, and the job only fails when GitHub notices that it lost
  # the runner, about 45 minutes later. That happened in 3 of about 90 runs of the WSL smoke tests on
  # the larger runners, and in none of about 740 on the 1ES pool, so this job runs on the 1ES pool.
  # JobId must be unique per job.
  electron-smoke-wsl:
    name: Electron-Smoke (WSL)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-windows-2022-x64, "JobId=windows-test-wsl-smoke-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    env:
      ARTIFACT_NAME: electron-smoke-wsl
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      WSL_SMOKE_TESTS: 'true'
    steps: *steps

  browser-unit:
    name: Browser-Unit
    if: ${{ inputs.browser_unit_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: browser-unit
      BROWSER_TESTS: 'true'
      UNIT_TESTS: 'true'
      TEST_SELECTION: 'true'
    steps: *steps

  # The browser integration tests and the browser smoke tests take about 3 and 3.5 minutes. In one job
  # they would be one of the slowest jobs of the workflow, so they run on separate machines.
  browser-integration:
    name: Browser (integration)
    if: ${{ inputs.browser_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: browser
      BROWSER_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
    steps: *steps

  browser-smoke:
    name: Browser (smoke)
    if: ${{ inputs.browser_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: browser-smoke
      BROWSER_TESTS: 'true'
      SMOKE_TESTS: 'true'
    steps: *steps

  # The remote integration tests and the remote smoke tests in one job could be the slowest job of the
  # workflow, so they run on separate machines. The remote smoke tests alone take about 6 minutes, so
  # they run in two shards (see test/smoke/src/shard.ts).
  remote-integration:
    name: Remote (integration)
    if: ${{ inputs.remote_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: remote
      REMOTE_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
    steps: *steps

  remote-smoke-1:
    name: Remote (smoke, shard 1/2)
    if: ${{ inputs.remote_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: remote-smoke-shard1
      REMOTE_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '1'
      SMOKE_SHARD_TOTAL: '2'
    steps: *steps

  remote-smoke-2:
    name: Remote (smoke, shard 2/2)
    if: ${{ inputs.remote_affected }}
    runs-on: vscode-large-runners-windows-8-core
    env:
      ARTIFACT_NAME: remote-smoke-shard2
      REMOTE_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '2'
      SMOKE_SHARD_TOTAL: '2'
    steps: *steps

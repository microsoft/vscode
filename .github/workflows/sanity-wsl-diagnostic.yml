name: Sanity WSL diagnostic (TEMPORARY, remove before merge)

on:
  pull_request:

permissions:
  contents: read

jobs:
  launch:
    name: Playwright launch of the wsl-desktop arguments
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-windows-2022-x64, "JobId=sanity-launch-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    timeout-minutes: 30
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .github/sanity-diag
            build/azure-pipelines/common
            build/checksums
            test/sanity
            .nvmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install sanity test dependencies
        working-directory: test/sanity
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Restore WSL installer
        uses: ./.github/actions/restore-wsl-installer

      - name: Launch variants
        shell: pwsh
        env:
          DEBUG: pw:browser*
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./build/azure-pipelines/common/wsl.psm1
          Install-Wsl -CacheDirectory .build/wsl-installer
          $rootfs = Join-Path $env:RUNNER_TEMP 'ubuntu.tar.gz'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors -o $rootfs 'https://cloud-images.ubuntu.com/wsl/jammy/20250318/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz'
          $distroDir = Join-Path $env:RUNNER_TEMP 'ubuntu'
          New-Item -ItemType Directory -Force $distroDir | Out-Null
          Write-Host (Invoke-WslExe -ArgumentList '--import', 'Ubuntu', $distroDir, $rootfs, '--version', '2' -TimeoutSeconds 180).Output
          $metadata = Invoke-RestMethod 'https://update.code.visualstudio.com/api/versions/commit:16d22415b62f4bd6b056011027f53c3e9978fbf4/win32-x64-archive/insider'
          $zip = Join-Path $env:RUNNER_TEMP 'code.zip'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors -o $zip $metadata.url
          $appRoot = Join-Path $env:RUNNER_TEMP 'code'
          Expand-Archive -LiteralPath $zip -DestinationPath $appRoot
          $exe = Get-ChildItem -LiteralPath $appRoot -Recurse -Filter 'Code - Insiders.exe' | Select-Object -First 1 -ExpandProperty FullName
          $dataDir = Join-Path (Split-Path -Parent $exe) 'data'
          $extensions = Join-Path $env:RUNNER_TEMP 'extensions'
          $crash = Join-Path $env:GITHUB_WORKSPACE 'crash-dumps\wsl-desktop-x64'
          New-Item -ItemType Directory -Force $dataDir, $extensions | Out-Null
          node .github/sanity-diag/launch.ts $exe $dataDir $extensions $crash

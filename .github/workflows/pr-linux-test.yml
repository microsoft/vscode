on:
  workflow_call:
    inputs:
      electron_unit_affected:
        description: Whether the pull request can affect the Electron-Unit jobs, which are skipped when false
        type: boolean
        default: true
      electron_affected:
        description: Whether the pull request can affect the Electron job, which is skipped when false
        type: boolean
        default: true
      agent_host_e2e_affected:
        description: Whether the pull request can affect the Agent-Host-E2E job, which is skipped when false
        type: boolean
        default: true
      electron_smoke_affected:
        description: Whether the pull request can affect the Electron-Smoke jobs, which are skipped when false
        type: boolean
        default: true
      browser_unit_affected:
        description: Whether the pull request can affect the Browser-Unit job, which is skipped when false
        type: boolean
        default: true
      browser_affected:
        description: Whether the pull request can affect the Browser job, which is skipped when false
        type: boolean
        default: true
      remote_affected:
        description: Whether the pull request can affect the Remote job, which is skipped when false
        type: boolean
        default: true
      agent_host_test_profile:
        description: Agent Host test profile, 'pr' or 'full' (see .github/actions/detect-agent-host-e2e-changes)
        type: string
        default: full
      agent_host_test_profile_reason:
        description: Reason for selecting the Agent Host test profile
        type: string
        default: Change detection unavailable

env:
  NPM_ARCH: x64
  VSCODE_ARCH: x64
  VSCODE_SKIP_PRELAUNCH: '1'

# Each job reports as "Linux / <job name>", for example "Linux / Browser-Unit", whether it runs or
# not: the names are fixed, as GitHub does not evaluate the expressions in the name of a skipped job.
# The jobs run the steps of the first one (steps: &steps), and their env selects which of them run
# (a flag is on when it is 'true'):
# - ELECTRON_TESTS, BROWSER_TESTS or REMOTE_TESTS: the test runner
# - UNIT_TESTS, INTEGRATION_TESTS, SMOKE_TESTS and AGENT_HOST_E2E_TESTS: the kinds of tests
# - UNIT_TEST_SUITE: the unit tests of an Electron job, 'electron' or 'node', or both when unset
# - SMOKE_SHARD_INDEX and SMOKE_SHARD_TOTAL: the 1-based index of the Electron smoke test shard to run,
#   and the number of shards
# - ARTIFACT_NAME: identifies the job in the names of the artifacts that it publishes
jobs:
  # Linux runs every unit test, so the Electron and node.js unit tests in one job could be the slowest
  # job of the workflow: they run on separate machines. macOS and Windows run only the selected unit
  # tests, so they rarely take as long.
  electron-unit-electron:
    name: Electron-Unit (electron)
    if: ${{ inputs.electron_unit_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron-unit-electron
      ELECTRON_TESTS: 'true'
      UNIT_TESTS: 'true'
      UNIT_TEST_SUITE: electron
    steps: &steps
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup system services
        run: |
          set -e
          # Allow unprivileged user namespaces for Chromium's namespace sandbox
          # Ubuntu 24.04 restricts this by default via AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Start X server
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libgbm1 \
            rpm \
            bubblewrap \
            socat
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install build dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          source ./build/azure-pipelines/linux/setup-env.sh

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .build folder
        run: mkdir -p .build

      - name: Prepare built-in extensions cache key
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workaround expat NULL deref CVEs in fontconfig parsing
        run: |
          set -e
          # Ubuntu 24.04 ships expat 2.6.1 which has multiple NULL dereference
          # CVEs triggered when fontconfig parses <include> directives via
          # expat's XML_ExternalEntityParserCreate:
          #   CVE-2026-24515 (backported but crash persists)
          #   CVE-2026-32776 (not yet backported) - empty external parameter entities
          #   CVE-2026-32778 (not yet backported) - setContext after OOM
          # All three are fixed upstream in expat >= 2.7.5.
          # Check if the runner already has the fix — skip workaround if so.
          EXPAT_VER=$(dpkg-query -W -f='${Version}' libexpat1 2>/dev/null || echo "0")
          if dpkg --compare-versions "$EXPAT_VER" ge "2.7.5"; then
            echo "::warning::libexpat1 $EXPAT_VER includes all CVE fixes (>= 2.7.5). The fontconfig workaround in this workflow can be removed."
            exit 0
          fi
          echo "Installed expat: $EXPAT_VER — applying fontconfig workaround"
          # Workaround: use a minimal fontconfig config with no <include> directives,
          # avoiding the external entity parser codepath entirely. Based on upstream
          # fontconfig 2.15.0 fonts.conf.in with <include> removed, generic family
          # aliases inlined, and default font mappings for generic families added
          # (from conf.d/49-sansserif.conf and DejaVu font configs).
          # Remove once Ubuntu backports the remaining CVE fixes.
          cat > /tmp/fonts-minimal.conf << 'FONTCONFIG_EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <dir>/usr/share/fonts</dir>
            <dir>/usr/local/share/fonts</dir>
            <dir prefix="xdg">fonts</dir>
            <cachedir>/var/cache/fontconfig</cachedir>
            <cachedir prefix="xdg">fontconfig</cachedir>
            <!-- Generic family aliases from upstream fonts.conf -->
            <match target="pattern">
              <test qual="any" name="family"><string>mono</string></test>
              <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>sans serif</string></test>
              <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>sans</string></test>
              <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>system ui</string></test>
              <edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
            </match>
            <!-- Map generic families to actual fonts (from conf.d/49-sansserif, 57-dejavu) -->
            <alias>
              <family>monospace</family>
              <prefer><family>DejaVu Sans Mono</family></prefer>
            </alias>
            <alias>
              <family>sans-serif</family>
              <prefer><family>DejaVu Sans</family></prefer>
            </alias>
            <alias>
              <family>serif</family>
              <prefer><family>DejaVu Serif</family></prefer>
            </alias>
            <!-- Fallback: assign sans-serif to unmatched families (from 49-sansserif.conf) -->
            <match target="pattern">
              <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
              <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
              <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
              <edit name="family" mode="append_last"><string>sans-serif</string></edit>
            </match>
            <!-- Rendering defaults -->
            <match target="font">
              <edit name="antialias" mode="assign"><bool>true</bool></edit>
              <edit name="hinting" mode="assign"><bool>true</bool></edit>
              <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
            </match>
            <config>
              <rescan><int>0</int></rescan>
            </config>
          </fontconfig>
          FONTCONFIG_EOF
          echo "FONTCONFIG_FILE=/tmp/fonts-minimal.conf" >> "$GITHUB_ENV"

      - name: Fontconfig diagnostics and cache reset
        run: |
          set -e
          echo "--- Font package versions ---"
          dpkg -l | grep -E 'libexpat|fontconfig|libfreetype|libpango' || true
          echo ""
          echo "--- Installed font packages ---"
          apt list --installed 2>/dev/null | grep -E 'fonts-|fontconfig' || true
          echo ""
          echo "--- Active fontconfig file ---"
          echo "FONTCONFIG_FILE=${FONTCONFIG_FILE:-/etc/fonts/fonts.conf}"
          echo ""
          echo "--- Verify active config integrity ---"
          python3 -c "
          import xml.etree.ElementTree as ET, os, glob, sys
          fc = os.environ.get('FONTCONFIG_FILE', '/etc/fonts/fonts.conf')
          files = [fc] if os.path.exists(fc) else ['/etc/fonts/fonts.conf'] + sorted(glob.glob('/etc/fonts/conf.d/*.conf'))
          for f in files:
              try:
                  ET.parse(f)
              except Exception as e:
                  print(f'WARNING: {f} is invalid: {e}', file=sys.stderr)
          print('Font config XML validation complete')
          "
          echo ""
          echo "--- Check for symlink loops in font dirs ---"
          find /usr/share/fonts -maxdepth 3 -type l -exec test -d {} \; -print 2>/dev/null | head -10 || true
          echo ""
          echo "--- Clear and rebuild font cache ---"
          sudo rm -rf /var/cache/fontconfig 2>/dev/null || true
          rm -rf ~/.cache/fontconfig 2>/dev/null || true
          fc-cache -f -v 2>&1 | tail -5
          echo ""
          echo "--- fontconfig version ---"
          fc-cache --version 2>&1 | head -1
        continue-on-error: true

      - name: Transpile client and extensions
        run: npm run gulp transpile-client-esbuild transpile-extensions

      - name: Setup Electron
        if: ${{ (env.ELECTRON_TESTS == 'true' && env.UNIT_TEST_SUITE != 'node') || env.REMOTE_TESTS == 'true' }}
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile browser integration test runner
        if: ${{ env.BROWSER_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        working-directory: test/integration/browser
        run: npm run compile

      - name: Install Playwright Chromium
        if: ${{ env.BROWSER_TESTS == 'true' }}
        run: |
          set -e

          for i in {1..3}; do
            if npm exec -- playwright install --only-shell chromium; then
              echo "Install successful on attempt $i"
              break
            fi

            if [ $i -eq 3 ]; then
              echo "Install failed after 3 attempts" >&2
              exit 1
            fi

            echo "Install failed on attempt $i, retrying..."
            sleep 5
          done

      - name: 🧪 Run unit tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.UNIT_TESTS == 'true' && env.UNIT_TEST_SUITE != 'node' }}
        timeout-minutes: 25
        run: ./scripts/test.sh --tfs "Unit Tests" --workers 4 --rerun-failed-files 2
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run unit tests (node.js)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.UNIT_TESTS == 'true' && env.UNIT_TEST_SUITE != 'electron' }}
        timeout-minutes: 25
        run: npm run test-node -- --workers 4 --rerun-failed-files 2

      - name: 🧪 Run unit tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.UNIT_TESTS == 'true' }}
        timeout-minutes: 30
        run: npm run test-browser-no-install -- --browser chromium --tfs "Browser Unit Tests" --workers 4 --rerun-failed-files 2
        env:
          DEBUG: "*browser*"

      - name: Compile extensions for integration tests & smoke tests
        if: ${{ env.INTEGRATION_TESTS == 'true' || env.SMOKE_TESTS == 'true' }}
        run: |
          set -e
          npm run gulp \
            compile-extension:configuration-editing \
            compile-extension:css-language-features-server \
            compile-extension:emmet \
            compile-extension:git \
            compile-extension:git-base \
            compile-extension:github-authentication \
            compile-extension:html-language-features-server \
            compile-extension:ipynb \
            compile-extension:notebook-renderers \
            compile-extension:json-language-features-client \
            compile-extension:json-language-features-server \
            compile-extension:markdown-language-features \
            compile-extension-media \
            compile-extension:microsoft-authentication \
            compile-extension:typescript-language-features \
            compile-extension:vscode-api-tests \
            compile-extension:vscode-colorize-tests \
            compile-extension:vscode-colorize-perf-tests \
            compile-extension:vscode-test-resolver

      - name: 🧪 Run Agent Host E2E tests (Electron)
        id: agent-host-e2e
        if: ${{ env.ELECTRON_TESTS == 'true' && env.AGENT_HOST_E2E_TESTS == 'true' }}
        timeout-minutes: 25
        run: ./scripts/test-agent-host-e2e.sh --tfs "Integration Tests" --rerun-failed-files 2
        env:
          DISPLAY: ":10"
          AGENT_HOST_TEST_PROFILE: ${{ inputs.agent_host_test_profile }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ inputs.agent_host_test_profile_reason }}
          VSCODE_SKIP_PRELAUNCH: '1'

      # Runs even when Agent Host E2E failed in the same job, so that one does not hide the other.
      # Reruns the failed tests in a fresh window.
      - name: 🧪 Run integration tests (Electron)
        id: node-integration-tests
        if: ${{ env.ELECTRON_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' && !cancelled() && (success() || steps.agent-host-e2e.outcome == 'failure') }}
        timeout-minutes: 25
        run: ./scripts/test-integration.sh --only-node-tests --tfs "Integration Tests" --rerun-failed-files 2
        env:
          DISPLAY: ":10"
          AGENT_HOST_TEST_PROFILE: ${{ inputs.agent_host_test_profile }}
          AGENT_HOST_TEST_PROFILE_REASON: ${{ inputs.agent_host_test_profile_reason }}
          VSCODE_SKIP_PRELAUNCH: '1'

      # Runs even when the node.js integration tests or Agent Host E2E failed in the same job.
      # The extension host suites are not rerun.
      - name: 🧪 Run extension host integration tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' && !cancelled() && (success() || steps.agent-host-e2e.outcome == 'failure' || steps.node-integration-tests.outcome == 'failure') }}
        timeout-minutes: 15
        run: ./scripts/test-integration.sh --only-extension-host-tests
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: 🧪 Run integration tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        timeout-minutes: 20
        run: ./scripts/test-web-integration.sh --browser chromium

      - name: 🧪 Run integration tests (Remote)
        if: ${{ env.REMOTE_TESTS == 'true' && env.INTEGRATION_TESTS == 'true' }}
        timeout-minutes: 20
        run: ./scripts/test-remote-integration.sh
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Compile smoke tests
        if: ${{ env.SMOKE_TESTS == 'true' }}
        working-directory: test/smoke
        run: npm run compile

      - name: Compile Copilot Chat extension for smoke tests
        if: ${{ env.SMOKE_TESTS == 'true' && env.BROWSER_TESTS != 'true' }}
        working-directory: extensions/copilot
        run: npm run compile

      # Remove the musl-libc Claude Code native binary so the bundled
      # @anthropic-ai/claude-agent-sdk in extensions/copilot falls through to the
      # glibc variant (or its bundled ./cli.js fallback). The musl binary is
      # pulled in by the root devDependency @anthropic-ai/claude-agent-sdk@0.2.x,
      # whose package metadata declares both "linux-x64" and "linux-x64-musl" as
      # optionalDependencies with `os: ["linux"]` and no libc filter, so npm
      # installs both variants on any Linux. The SDK probes the musl variant
      # first; spawning a musl-linked ELF on the glibc-based GitHub Actions
      # runner returns ENOENT (missing ELF interpreter), which causes Claude
      # session smoke tests to time out. See
      # https://github.com/anthropics/claude-agent-sdk-typescript for the SDK
      # resolution order.
      - name: Remove musl Claude binary on glibc Linux
        if: ${{ env.SMOKE_TESTS == 'true' && env.BROWSER_TESTS != 'true' }}
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl

      - name: Diagnostics before smoke test run (processes, max_user_watches, number of opened file handles)
        run: |
          set -e
          ps -ef
          cat /proc/sys/fs/inotify/max_user_watches
          lsof | wc -l
        continue-on-error: true
        if: ${{ env.SMOKE_TESTS == 'true' && always() }}

      - name: Set up native policy smoke fixture
        if: ${{ env.ELECTRON_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        id: policy-fixture
        run: |
          set -e
          sudo mkdir /etc/vscode
          echo "created=true" >> "$GITHUB_OUTPUT"
          sudo chown "$(id -u):$(id -g)" /etc/vscode

      - name: 🧪 Run smoke tests (Electron)
        if: ${{ env.ELECTRON_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        run: npm run smoketest-no-compile -- --tracing --shard ${{ env.SMOKE_SHARD_INDEX }}/${{ env.SMOKE_SHARD_TOTAL }}
        env:
          DISPLAY: ":10"
          VSCODE_SMOKE_TEST_POLICY: '1'

      - name: Clean up native policy smoke fixture
        if: ${{ always() && steps.policy-fixture.outputs.created == 'true' }}
        run: |
          set -e
          sudo rm -f /etc/vscode/policy.json
          sudo rmdir /etc/vscode

      - name: 🧪 Run smoke tests (Browser, Chromium)
        if: ${{ env.BROWSER_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        run: npm run smoketest-no-compile -- --web --tracing --headless

      - name: 🧪 Run smoke tests (Remote)
        if: ${{ env.REMOTE_TESTS == 'true' && env.SMOKE_TESTS == 'true' }}
        timeout-minutes: 20
        run: npm run smoketest-no-compile -- --remote --tracing
        env:
          DISPLAY: ":10"

      - name: Diagnostics after smoke test run (processes, max_user_watches, number of opened file handles)
        if: ${{ env.SMOKE_TESTS == 'true' && always() }}
        run: |
          set -e
          ps -ef
          cat /proc/sys/fs/inotify/max_user_watches
          lsof | wc -l
        continue-on-error: true

      - name: Publish Crash Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('crash-dump-linux-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/crashes
          if-no-files-found: ignore

      # In order to properly symbolify above crash reports
      # (if any), we need the compiled native modules too
      - name: Publish Node Modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: ${{ format('node-modules-linux-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: node_modules
          if-no-files-found: ignore

      - name: Publish Log Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: ${{ format('logs-linux-{0}-{1}-{2}', env.VSCODE_ARCH, env.ARTIFACT_NAME, github.run_attempt) }}
          path: .build/logs
          if-no-files-found: ignore

  electron-unit-node:
    name: Electron-Unit (node)
    if: ${{ inputs.electron_unit_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron-unit-node
      ELECTRON_TESTS: 'true'
      UNIT_TESTS: 'true'
      UNIT_TEST_SUITE: node
    steps: *steps

  electron:
    name: Electron
    if: ${{ inputs.electron_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron
      ELECTRON_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
    steps: *steps

  # The integration tests and Agent Host E2E in one job would be the slowest job of the workflow, so
  # Agent Host E2E runs in parallel on its own machine.
  agent-host-e2e:
    name: Agent-Host-E2E
    if: ${{ inputs.agent_host_e2e_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron-agent-host-e2e
      ELECTRON_TESTS: 'true'
      AGENT_HOST_E2E_TESTS: 'true'
    steps: *steps

  # Running every Electron smoke test takes one machine up to about 20 minutes, the timeout of the
  # step, so the shards split them over parallel machines (see .github/skills/smoke-tests/SKILL.md).
  electron-smoke-1:
    name: Electron-Smoke (shard 1/2)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron-smoke-shard1
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '1'
      SMOKE_SHARD_TOTAL: '2'
    steps: *steps

  electron-smoke-2:
    name: Electron-Smoke (shard 2/2)
    if: ${{ inputs.electron_smoke_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: electron-smoke-shard2
      ELECTRON_TESTS: 'true'
      SMOKE_TESTS: 'true'
      SMOKE_SHARD_INDEX: '2'
      SMOKE_SHARD_TOTAL: '2'
    steps: *steps

  browser-unit:
    name: Browser-Unit
    if: ${{ inputs.browser_unit_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: browser-unit
      BROWSER_TESTS: 'true'
      UNIT_TESTS: 'true'
    steps: *steps

  browser:
    name: Browser
    if: ${{ inputs.browser_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: browser
      BROWSER_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
      SMOKE_TESTS: 'true'
    steps: *steps

  remote:
    name: Remote
    if: ${{ inputs.remote_affected }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: remote
      REMOTE_TESTS: 'true'
      INTEGRATION_TESTS: 'true'
      SMOKE_TESTS: 'true'
    steps: *steps

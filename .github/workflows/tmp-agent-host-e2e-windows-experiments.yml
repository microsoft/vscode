name: TEMP Agent Host E2E Windows Experiments

on: pull_request

permissions:
  contents: read

jobs:
  experiment:
    name: AH E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: large-devdrive-temp
            runner: vscode-large-runners-windows-8-core
            variant: devdrive-temp
          - name: large-devdrive-workspace
            runner: vscode-large-runners-windows-8-core
            variant: devdrive-workspace
          - name: 1es-control
            runner: 1es
            variant: control
    runs-on: ${{ matrix.runner == '1es' && fromJSON(format('["self-hosted", "1ES.Pool=1es-vscode-oss-windows-2022-x64", "JobId=ahexp3-{0}-{1}"]', github.run_id, github.run_attempt)) || matrix.runner }}
    env:
      VSCODE_ARCH: x64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - name: Create Dev Drive
        if: ${{ matrix.variant != 'control' }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $script = Join-Path $env:RUNNER_TEMP 'devdrive.txt'
          "create vdisk file=`"C:\devdrive.vhdx`" maximum=102400 type=expandable`nattach vdisk`ncreate partition primary`nassign letter=R" | Out-File -Encoding ascii $script
          diskpart /s $script | Out-Null
          Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Out-Null
          New-Item -ItemType Directory -Path R:\tmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=R:\tmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=R:\tmp"
          if ($env:VARIANT -eq 'devdrive-workspace') {
            # Mount the volume above the workspace so that actions/checkout does not clean the volume root.
            $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
            Get-ChildItem -Force -LiteralPath $parent | Format-Table FullName
            Remove-Item -LiteralPath $env:GITHUB_WORKSPACE
            if (Get-ChildItem -Force -LiteralPath $parent) { throw 'Workspace parent is not empty' }
            Add-PartitionAccessPath -DriveLetter R -AccessPath $parent
            New-Item -ItemType Directory -Path $env:GITHUB_WORKSPACE | Out-Null
          }
          "Dev Drive ready in $([int]$sw.Elapsed.TotalSeconds)s"
        env:
          VARIANT: ${{ matrix.variant }}

      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Fail on node_modules cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: exit 1

      - name: Transpile client and extensions
        shell: pwsh
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Agent Host E2E tests with I/O attribution
        timeout-minutes: 45
        shell: pwsh
        run: |
          $csv = Join-Path $env:RUNNER_TEMP 'perf.csv'
          $counters = @('\PhysicalDisk(_Total)\Avg. Disk sec/Write', '\PhysicalDisk(_Total)\Disk Writes/sec', '\PhysicalDisk(_Total)\Disk Write Bytes/sec', '\PhysicalDisk(_Total)\Disk Read Bytes/sec', '\PhysicalDisk(_Total)\Avg. Disk Bytes/Write', '\PhysicalDisk(_Total)\Current Disk Queue Length', '\Processor(_Total)\% Processor Time')
          $perf = Start-Process typeperf -ArgumentList (@($counters | ForEach-Object { "`"$_`"" }) + @('-si', '5', '-f', 'CSV', '-o', "`"$csv`"", '-y')) -PassThru -WindowStyle Hidden
          $stop = Join-Path $env:RUNNER_TEMP 'sampler.stop'
          $out = Join-Path $env:RUNNER_TEMP 'sampler.csv'
          $sampler = Join-Path $env:RUNNER_TEMP 'sampler.ps1'
          @'
          param($Stop, $Out)
          $seen = @{}
          while (-not (Test-Path $Stop)) {
            foreach ($p in Get-CimInstance Win32_Process -Property ProcessId, Name, CreationDate, WriteTransferCount, WriteOperationCount, ReadTransferCount) {
              $seen["$($p.ProcessId)|$($p.CreationDate)"] = $p
            }
            Start-Sleep -Milliseconds 1000
          }
          $seen.Values | Group-Object Name | ForEach-Object {
            [pscustomobject]@{
              Name = $_.Name; Processes = $_.Count
              WriteMB = [math]::Round(($_.Group | Measure-Object WriteTransferCount -Sum).Sum / 1MB)
              WriteOps = ($_.Group | Measure-Object WriteOperationCount -Sum).Sum
              ReadMB = [math]::Round(($_.Group | Measure-Object ReadTransferCount -Sum).Sum / 1MB)
            }
          } | Sort-Object WriteMB -Descending | Export-Csv -NoTypeInformation $Out
          '@ | Set-Content -Path $sampler
          $samplerProcess = Start-Process pwsh -ArgumentList @('-NoProfile', '-File', $sampler, $stop, $out) -PassThru -WindowStyle Hidden
          "TEMP=$env:TEMP WORKSPACE=$((Get-Item .).FullName)"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          .\scripts\test-agent-host-e2e.bat --tfs "Integration Tests"
          $exitCode = $LASTEXITCODE
          "Agent Host E2E exit code $exitCode after $([math]::Round($sw.Elapsed.TotalMinutes, 1)) min"
          Stop-Process -Id $perf.Id -Force -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path $stop | Out-Null
          $samplerProcess.WaitForExit(60000) | Out-Null
          Start-Sleep -Seconds 2
          $rows = Import-Csv $csv
          $columns = $rows[0].PSObject.Properties.Name | Select-Object -Skip 1
          foreach ($column in $columns) {
            $values = @($rows | ForEach-Object { $_.$column } | Where-Object { $_ -and $_.Trim() } | ForEach-Object { [double]$_ } | Sort-Object)
            if ($values.Count -eq 0) { continue }
            $avg = ($values | Measure-Object -Average).Average
            $p95 = $values[[math]::Min($values.Count - 1, [math]::Floor($values.Count * 0.95))]
            'COUNTER {0,-60} avg {1,14:N3}  p95 {2,14:N3}  max {3,14:N3}' -f ($column -replace '^\\\\[^\\]+', ''), $avg, $p95, $values[-1]
          }
          Import-Csv $out | Select-Object -First 15 | ForEach-Object { 'WRITER {0,-30} n={1,5} writeMB={2,8} writeOps={3,10} readMB={4,8}' -f $_.Name, $_.Processes, $_.WriteMB, $_.WriteOps, $_.ReadMB }
          exit $exitCode
        env:
          VSCODE_SKIP_AGENT_HOST_E2E: '0'
          AGENT_HOST_TEST_PROFILE: full
          AGENT_HOST_TEST_PROFILE_REASON: Windows runner experiment

name: TEMP Agent Host E2E Windows Experiments

on: pull_request

permissions:
  contents: read

jobs:
  experiment:
    name: AH E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: large-devdrive-workspace
            runner: vscode-large-runners-windows-8-core
            variant: devdrive
            jobs: ''
          - name: large-noflush
            runner: vscode-large-runners-windows-8-core
            variant: noflush
            jobs: ''
    runs-on: ${{ matrix.runner }}
    env:
      VSCODE_ARCH: x64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - name: Mount Dev Drive at the workspace and TEMP
        if: ${{ matrix.variant == 'devdrive' }}
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $script = Join-Path $env:RUNNER_TEMP 'devdrive.txt'
          "create vdisk file=`"C:\devdrive.vhdx`" maximum=102400 type=expandable`nattach vdisk`ncreate partition primary`nassign letter=R" | Out-File -Encoding ascii $script
          diskpart /s $script
          Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Out-Null
          fsutil devdrv query R: 2>&1
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
          if (Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE) { throw 'Workspace is not empty' }
          # Mount the volume above the workspace so that actions/checkout does not try to clean the volume root.
          $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
          if (@(Get-ChildItem -Force -LiteralPath $parent).Count -ne 1) { throw 'Workspace parent has other entries' }
          Remove-Item -LiteralPath $env:GITHUB_WORKSPACE
          Add-PartitionAccessPath -DriveLetter R -AccessPath $parent
          New-Item -ItemType Directory -Path $env:GITHUB_WORKSPACE | Out-Null
          New-Item -ItemType Directory -Path R:\tmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=R:\tmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=R:\tmp"
          "Dev Drive ready in $([int]$sw.Elapsed.TotalSeconds)s"
          Get-Volume -DriveLetter R | Format-Table -AutoSize
          Get-Item -LiteralPath $parent | Format-List FullName, Attributes, LinkType, Target

      - name: Suppress disk cache flushes
        if: ${{ matrix.variant == 'noflush' }}
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class DiskCache {
            [StructLayout(LayoutKind.Sequential)]
            public struct DISK_CACHE_SETTING { public uint Version; public int State; [MarshalAs(UnmanagedType.U1)] public bool IsPowerProtected; }
            [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            static extern SafeFileHandle CreateFile(string name, uint access, uint share, IntPtr sa, uint disposition, uint flags, IntPtr template);
            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool DeviceIoControl(SafeFileHandle h, uint code, ref DISK_CACHE_SETTING inBuf, int inSize, ref DISK_CACHE_SETTING outBuf, int outSize, out int returned, IntPtr overlapped);
            public static string SetPowerProtected(int disk) {
              using (var h = CreateFile(@"\\.\PhysicalDrive" + disk, 0xC0000000, 3, IntPtr.Zero, 3, 0, IntPtr.Zero)) {
                if (h.IsInvalid) { throw new Win32Exception(); }
                var s = new DISK_CACHE_SETTING();
                int size = Marshal.SizeOf(typeof(DISK_CACHE_SETTING));
                int r;
                if (!DeviceIoControl(h, 0x740E0, ref s, 0, ref s, size, out r, IntPtr.Zero)) { throw new Win32Exception(); }
                string before = "version=" + s.Version + " state=" + s.State + " powerProtected=" + s.IsPowerProtected;
                s.Version = (uint)size;
                s.IsPowerProtected = true;
                if (!DeviceIoControl(h, 0x7C0E4, ref s, size, ref s, 0, out r, IntPtr.Zero)) { throw new Win32Exception(); }
                return before;
              }
            }
          }
          '@
          function Test-Fsync([string] $Root) {
            $dir = Join-Path $Root "fsbench-$([guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Path $dir | Out-Null
            $bytes = [byte[]]::new(4096)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 300; $i++) { $fs = [IO.File]::Open("$dir\s$i", 'Create'); $fs.Write($bytes, 0, 4096); $fs.Flush($true); $fs.Dispose() }
            $fsync = $sw.Elapsed.TotalMilliseconds / 300
            $sw.Restart()
            for ($i = 0; $i -lt 5000; $i++) { [IO.File]::WriteAllBytes("$dir\f$i", $bytes) }
            $create = $sw.Elapsed.TotalMilliseconds / 5000
            Remove-Item -LiteralPath $dir -Recurse -Force
            'fsync {0:N2} ms/file, create {1:N3} ms/file' -f $fsync, $create
          }
          "Before: $(Test-Fsync $env:RUNNER_TEMP)"
          $disk = (Get-Partition -DriveLetter C).DiskNumber
          "Disk $disk cache setting before: $([DiskCache]::SetPowerProtected($disk))"
          Get-PhysicalDisk | ForEach-Object { Get-StorageAdvancedProperty -PhysicalDisk $_ } | Format-Table -AutoSize
          "After: $(Test-Fsync $env:RUNNER_TEMP)"

      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Fail on node_modules cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: exit 1

      - name: Transpile client and extensions
        shell: pwsh
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Agent Host E2E tests with performance counters
        timeout-minutes: 45
        shell: pwsh
        run: |
          $csv = Join-Path $env:RUNNER_TEMP 'perf.csv'
          $counters = @('\PhysicalDisk(_Total)\Avg. Disk sec/Write', '\PhysicalDisk(_Total)\Avg. Disk sec/Read', '\PhysicalDisk(_Total)\Disk Transfers/sec', '\PhysicalDisk(_Total)\Current Disk Queue Length', '\Processor(_Total)\% Processor Time', '\Memory\Available MBytes', '\System\Processor Queue Length')
          $perf = Start-Process typeperf -ArgumentList (@($counters | ForEach-Object { "`"$_`"" }) + @('-si', '5', '-f', 'CSV', '-o', "`"$csv`"", '-y')) -PassThru -WindowStyle Hidden
          "TEMP=$env:TEMP"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          .\scripts\test-agent-host-e2e.bat --tfs "Integration Tests" $(if ($env:EXTRA_ARGS) { $env:EXTRA_ARGS -split ' ' })
          $exitCode = $LASTEXITCODE
          "Agent Host E2E exit code $exitCode after $([math]::Round($sw.Elapsed.TotalMinutes, 1)) min"
          Stop-Process -Id $perf.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $rows = Import-Csv $csv
          $columns = $rows[0].PSObject.Properties.Name | Select-Object -Skip 1
          foreach ($column in $columns) {
            $values = @($rows | ForEach-Object { $_.$column } | Where-Object { $_ -and $_.Trim() } | ForEach-Object { [double]$_ } | Sort-Object)
            if ($values.Count -eq 0) { continue }
            $avg = ($values | Measure-Object -Average).Average
            $p95 = $values[[math]::Min($values.Count - 1, [math]::Floor($values.Count * 0.95))]
            '{0,-70} avg {1,12:N4}  p95 {2,12:N4}  max {3,12:N4}' -f ($column -replace '^\\\\[^\\]+', ''), $avg, $p95, $values[-1]
          }
          exit $exitCode
        env:
          EXTRA_ARGS: ${{ matrix.jobs }}
          VSCODE_SKIP_AGENT_HOST_E2E: '0'
          AGENT_HOST_TEST_PROFILE: full
          AGENT_HOST_TEST_PROFILE_REASON: Windows runner experiment

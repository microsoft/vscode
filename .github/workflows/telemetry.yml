name: 'Telemetry'

on:
  pull_request:
    branches:
      - main
      - 'release/*'

permissions: {}
jobs:
  check-metadata:
    name: 'Check metadata'
    runs-on: 'ubuntu-latest'

    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: 'lts/*'

      - name: 'Run vscode-telemetry-extractor'
        run: 'npx --package=@vscode/telemetry-extractor@1.14.0 --yes vscode-telemetry-extractor -s .'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Validate core telemetry metadata'
        run: |
          # Match the extractor version and core telemetry scope used by Azure.
          version=$(node -p "require('./package-lock.json').packages['node_modules/@vscode/telemetry-extractor'].version")
          npx --package="@vscode/telemetry-extractor@$version" --yes vscode-telemetry-extractor --sourceDir . --excludedDir extensions --applyEndpoints
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

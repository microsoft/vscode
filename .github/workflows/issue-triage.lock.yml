  activation:
    needs:
      - check_issue
      - pre_activation
    if: >
      needs.pre_activation.outputs.activated == 'true' && ((needs.check_issue.outputs.proceed == 'true') &&
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'stale'))

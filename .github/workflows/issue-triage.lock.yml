name: "Issue Triage"
on:
  issues:
    # names: # Label filtering applied via job conditions
    # - stale # Label filtering applied via job conditions
    types:
      - opened
      - labeled
  # roles: all # Roles processed as role check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      issue_number:
        description: Issue number to triage (open, unassigned, and not already handled)
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.label.name == 'stale') && format('issue-triage-{0}', github.event.issue.number || inputs.issue_number) || format('issue-triage-run-{0}', github.run_id) }}

run-name: "Issue Triage -- #${{ github.event.issue.number || inputs.issue_number }}"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.issue-triage
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Issue%20Triage,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore


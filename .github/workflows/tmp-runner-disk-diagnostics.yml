name: TEMP Runner Disk Diagnostics

on: pull_request

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: large-8-core
            runner: vscode-large-runners-windows-8-core
          - name: windows-latest
            runner: windows-latest
          - name: 1es
            runner: 1es
    runs-on: ${{ matrix.runner == '1es' && fromJSON(format('["self-hosted", "1ES.Pool=1es-vscode-oss-windows-2022-x64", "JobId=diag-{0}-{1}"]', github.run_id, github.run_attempt)) || matrix.runner }}
    steps:
      - name: System
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object Model, TotalPhysicalMemory | Format-List
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, FileSystemLabel, Size, SizeRemaining -AutoSize
          Get-PhysicalDisk | Format-Table DeviceId, FriendlyName, MediaType, BusType, Size -AutoSize
          Get-PhysicalDisk | ForEach-Object { Get-StorageAdvancedProperty -PhysicalDisk $_ } | Format-Table -AutoSize
          Get-Partition | Where-Object DriveLetter | Format-Table DiskNumber, DriveLetter, Size -AutoSize
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled | Format-List
          (Get-MpPreference).ExclusionPath
          fltmc
          "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE RUNNER_TEMP=$env:RUNNER_TEMP TEMP=$env:TEMP LOCALAPPDATA=$env:LOCALAPPDATA USERPROFILE=$env:USERPROFILE"

      - name: Benchmark
        shell: pwsh
        run: |
          function Test-Directory([string] $Root) {
            $dir = Join-Path $Root "fsbench-$([guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Path $dir | Out-Null
            $bytes = [byte[]]::new(4096)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 300; $i++) {
              $fs = [IO.File]::Open("$dir\s$i", 'Create')
              $fs.Write($bytes, 0, 4096)
              $fs.Flush($true)
              $fs.Dispose()
            }
            $fsync = $sw.Elapsed.TotalMilliseconds / 300
            $sw.Restart()
            for ($i = 0; $i -lt 10000; $i++) { [IO.File]::WriteAllBytes("$dir\f$i", $bytes) }
            $create = $sw.Elapsed.TotalMilliseconds / 10000
            $sw.Restart()
            $big = [byte[]]::new(1GB)
            $fs = [IO.File]::Open("$dir\big", 'Create')
            $fs.Write($big, 0, $big.Length)
            $fs.Flush($true)
            $fs.Dispose()
            $seq = 1024 / $sw.Elapsed.TotalSeconds
            $sw.Restart()
            Remove-Item -LiteralPath $dir -Recurse -Force
            $delete = $sw.Elapsed.TotalMilliseconds
            '{0,-45} fsync {1,7:N2} ms/file | create {2,6:N3} ms/file | 1 GB write+flush {3,6:N0} MB/s | delete 10301 files {4,6:N0} ms' -f $Root, $fsync, $create, $seq, $delete
          }
          foreach ($root in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, 'C:\', 'D:\') | Select-Object -Unique) {
            if (Test-Path -LiteralPath $root) { Test-Directory $root }
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 50; $i++) { cmd.exe /c exit 0 }
          'spawn cmd.exe: {0:N1} ms' -f ($sw.Elapsed.TotalMilliseconds / 50)
          $sw.Restart()
          for ($i = 0; $i -lt 20; $i++) { node -e 0 }
          'spawn node.exe: {0:N1} ms' -f ($sw.Elapsed.TotalMilliseconds / 20)

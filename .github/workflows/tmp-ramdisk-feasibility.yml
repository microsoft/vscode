name: TEMP RAM Disk Feasibility

on: pull_request

permissions:
  contents: read

jobs:
  ramdisk:
    name: RAM disk (large-8-core)
    runs-on: vscode-large-runners-windows-8-core
    steps:
      - name: Create RAM disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $feature = Install-WindowsFeature -Name FS-iSCSITarget-Server
          "Install-WindowsFeature: success=$($feature.Success) restart=$($feature.RestartNeeded) after $([int]$sw.Elapsed.TotalSeconds)s"
          Set-Service -Name MSiSCSI -StartupType Automatic
          Start-Service -Name MSiSCSI
          $initiator = (Get-InitiatorPort | Select-Object -First 1).NodeAddress
          "Initiator: $initiator"
          New-IscsiVirtualDisk -Path 'ramdisk:vscode-test.vhdx' -Size 16GB | Out-Null
          New-IscsiServerTarget -TargetName vscode-test -InitiatorIds "IQN:$initiator" | Out-Null
          Add-IscsiVirtualDiskTargetMapping -TargetName vscode-test -Path 'ramdisk:vscode-test.vhdx'
          New-IscsiTargetPortal -TargetPortalAddress 127.0.0.1 | Out-Null
          $target = Get-IscsiTarget | Where-Object NodeAddress -like '*vscode-test*'
          Connect-IscsiTarget -NodeAddress $target.NodeAddress | Out-Null
          $disk = $null
          for ($i = 0; $i -lt 30 -and -not $disk; $i++) { $disk = Get-Disk | Where-Object BusType -eq 'iSCSI'; if (-not $disk) { Start-Sleep 1 } }
          $disk | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter T -UseMaximumSize | Format-Volume -FileSystem NTFS -Confirm:$false -Force | Out-Null
          "RAM disk ready after $([int]$sw.Elapsed.TotalSeconds)s"
          Get-Volume -DriveLetter T | Format-Table -AutoSize
          Get-PhysicalDisk | Format-Table DeviceId, FriendlyName, BusType, Size -AutoSize

      - name: Benchmark
        shell: pwsh
        run: |
          function Test-Directory([string] $Root) {
            $dir = Join-Path $Root "fsbench-$([guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Path $dir | Out-Null
            $bytes = [byte[]]::new(9000)
            $jobs = 1..6 | ForEach-Object {
              Start-ThreadJob -ArgumentList $dir, $_ -ScriptBlock {
                param($dir, $n)
                $bytes = [byte[]]::new(9000)
                $sw = [Diagnostics.Stopwatch]::StartNew()
                for ($i = 0; $i -lt 300; $i++) { $fs = [IO.File]::Open("$dir\s$n-$i", 'Create'); $fs.Write($bytes, 0, $bytes.Length); $fs.Flush($true); $fs.Dispose() }
                $sw.Elapsed.TotalMilliseconds / 300
              }
            }
            $fsync = ($jobs | Receive-Job -Wait -AutoRemoveJob | Measure-Object -Average).Average
            $sw = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 5000; $i++) { [IO.File]::WriteAllBytes("$dir\f$i", $bytes) }
            $create = $sw.Elapsed.TotalMilliseconds / 5000
            Remove-Item -LiteralPath $dir -Recurse -Force
            '{0,-40} 6x parallel write+fsync {1,7:N2} ms/file | create {2,6:N3} ms/file' -f $Root, $fsync, $create
          }
          Test-Directory $env:RUNNER_TEMP
          Test-Directory $env:GITHUB_WORKSPACE
          Test-Directory 'T:\'

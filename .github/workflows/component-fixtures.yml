name: Component Fixtures

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  # Screenshots & Tests is a required check, which the merge queue of main waits for
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read
  statuses: write
  pull-requests: write
  id-token: write
  # Finds and downloads the workspace image (see .github/workflows/workspace_image/README.md)
  actions: read

concurrency:
  group: component-fixtures-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Fixture Tests
    # The merge queue and the pull requests to release branches run on dedicated runners, like pr.yml (see the comment at the top of its jobs)
    runs-on: &runner ${{ (github.event_name == 'merge_group' || startsWith(github.base_ref, 'release/')) && 'vscode-large-runners-ubuntu-8-core-merge-queue' || 'vscode-large-runners-ubuntu-8-core' }}
    steps:
      # The jobs start from a workspace image of main, like the test jobs of pr.yml (see
      # .github/workflows/workspace_image/README.md): its dependencies are installed, and its .git
      # holds the commit it was built at, so the checkout writes and the install steps install only
      # what changed since. Its scripts run before the checkout, so they come from the API, at the
      # commit that the job tests, as in pr-workspace-images.yml. Without an image, or on any error,
      # the install steps install everything, without the pnpm store cache. Screenshots reuses these
      # steps.
      - &image-scripts
        name: Download the workspace image scripts
        id: image-scripts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/workspace-image"
          mkdir -p "$dir"
          echo '{ "type": "module" }' > "$dir/package.json"
          # The scripts keep their folders below workspace_image, such as win32/vhd.ps1
          files=(.nvmrc .github/workflows/workspace_image/{image.ts,win32/vhd.ps1,win32/Vhd.cs})
          args=()
          for file in "${files[@]}"; do
            args+=(-o "$dir/${file#.github/workflows/workspace_image/}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA")
          done
          curl -fsSL --retry 3 --parallel --create-dirs -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw' "${args[@]}"
          for file in "${files[@]}"; do
            [ -s "$dir/${file#.github/workflows/workspace_image/}" ]
          done
          echo "node-version=$(tr -d '[:space:]' < "$dir/.nvmrc")" >> "$GITHUB_OUTPUT"

      - &image-node
        name: Setup Node.js
        if: steps.image-scripts.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.image-scripts.outputs.node-version }}

      # An ext4 volume, which a loop device mounts at the parent of the workspace. image.ts gives up
      # before the timeout of the step, and then unmounts the image, so that the job sets up as
      # without an image. Pull requests and pushes use the images of their base branch or branch:
      # pr-workspace-images.yml only builds those of main.
      - &image-restore
        name: Restore the workspace image
        id: image
        if: steps.image-scripts.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        run: node "$RUNNER_TEMP/workspace-image/image.ts" restore --name workspace-image-linux-x64.img --branch "$WORKSPACE_IMAGE_BRANCH" --timeout-seconds 240
        env:
          GH_TOKEN: ${{ github.token }}
          # The merge queue, whose temporary branches have no images, uses the images of main
          WORKSPACE_IMAGE_BRANCH: ${{ github.base_ref || github.event_name == 'merge_group' && 'main' || github.ref_name }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - &node-without-image
        name: Setup Node.js
        if: steps.image-scripts.outcome != 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Only the dependencies of the root project and the Playwright fixture tests, without the
      # root install scripts that install every other install root.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter ./test/componentFixtures/playwright
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build/rspack is a member of the build workspace. pnpm also installs the build project's own
      # dependencies, so skip their install scripts (native modules): rspack doesn't need them.
      - name: Install rspack dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
        working-directory: build/rspack

      - name: Copy codicons
        run: cp node_modules/@vscode/codicons/dist/codicon.ttf src/vs/base/browser/ui/codicons/codicon/codicon.ttf

      - name: Build component explorer
        run: pnpm exec rspack build --config rspack.serve-out.config.mts
        working-directory: build/rspack
        env:
          COMPONENT_EXPLORER_STATIC_BUILD: 1

      # Pushes to main save this cache, so pull requests don't download the browsers. Also with a
      # workspace image, whose browsers are only Chromium's headless shell: the action points
      # PLAYWRIGHT_BROWSERS_PATH at the cached browsers in the workspace instead.
      - name: Restore Playwright browsers
        uses: ./.github/actions/restore-playwright
        with:
          browsers: chromium
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        working-directory: test/componentFixtures/playwright

      - name: Run Playwright fixture tests
        run: pnpm exec playwright test
        working-directory: test/componentFixtures/playwright

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test/componentFixtures/playwright/test-results/

  screenshots:
    name: Screenshots
    runs-on: *runner
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need enough history for the merge-base lookup below to succeed even
          # when the target branch has advanced since the PR was opened. Full
          # clone would be wasteful for this large repo, so cap at 150.
          fetch-depth: 150
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - *node-without-image

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Only the dependencies of the root project and the Playwright fixture tests, without the
      # root install scripts that install every other install root.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter ./test/componentFixtures/playwright
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also installs build/rspack, a member of the build workspace.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
        working-directory: build

      - name: Copy codicons
        run: cp node_modules/@vscode/codicons/dist/codicon.ttf src/vs/base/browser/ui/codicons/codicon/codicon.ttf

      - name: Build component explorer
        run: pnpm exec rspack build --config rspack.serve-out.config.mts
        working-directory: build/rspack
        env:
          COMPONENT_EXPLORER_STATIC_BUILD: 1

      - name: Upload component explorer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-explorer
          path: .build/rspack-serve-out/

      # Pushes to main save this cache, so pull requests don't download the browsers. Also with a
      # workspace image (see Playwright Fixture Tests).
      - name: Restore Playwright browsers
        uses: ./.github/actions/restore-playwright
        with:
          browsers: chromium
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Capture screenshots
        run: ./node_modules/.bin/component-explorer render --project ./test/componentFixtures/component-explorer.json --fixture-id-regex '/Light$'

      - name: Check fixture errors
        id: fixture_errors
        if: always()
        # TODO: "render" should just return a non-zero exit code if any fixture had an error (and print the errors), so we don't need to parse the manifest here.
        # Then we can remove this step.
        run: |
          MANIFEST="test/componentFixtures/.screenshots/current/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::No manifest found — render may have failed entirely"
            exit 0
          fi
          # Log per-fixture errors but do not fail here — let later steps run
          # (artifact upload, diff, PR comment) so failures are debuggable.
          # The final "Fail if fixtures had errors" step turns this into a
          # job failure.
          if node -e "
            const m = require('./$MANIFEST');
            const errs = m.fixtures.filter(f => f.hasError);
            if (!errs.length) { console.log('No fixture errors.'); process.exit(0); }
            console.log(errs.length + ' fixture(s) with errors:');
            for (const f of errs) {
              const errorEvents = (f.events || []).filter(e => e.isError);
              const msg = errorEvents.map(e => e.message).join('; ') || 'unknown error';
              console.log('::error::' + f.fixtureId + ': ' + msg);
              for (const e of errorEvents) {
                if (e.stack) { console.log('  stack: ' + e.stack); }
              }
              const nonErrorEvents = (f.events || []).filter(e => !e.isError);
              for (const e of nonErrorEvents) { console.log('  event: ' + JSON.stringify(e)); }
            }
            process.exit(1);
          "; then
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check blocks-ci screenshots
        id: blocks-ci
        if: always()
        # The service URL is baked into the committed blocks-ci-screenshots.md
        # as `![screenshot](<service-url>/images/<hash>)` (see
        # build/lib/screenshotBlocksCi.ts). It is passed here so the script
        # regenerates the markdown using the same URL prefix; otherwise the
        # equality check against the committed file would always fail. No HTTP
        # call is made — the URL is purely a string written into the markdown.
        run: |
          node build/lib/screenshotBlocksCi.ts \
            test/componentFixtures/.screenshots/current/manifest.json \
            test/componentFixtures/blocks-ci-screenshots.md \
            https://hediet-screenshots.azurewebsites.net \
            > /tmp/blocks-ci-updated.md 2>/tmp/blocks-ci-stderr.txt \
            && echo "match=true" >> "$GITHUB_OUTPUT" \
            || {
              echo "match=false" >> "$GITHUB_OUTPUT"
              cat /tmp/blocks-ci-stderr.txt >&2
              diff -u test/componentFixtures/blocks-ci-screenshots.md /tmp/blocks-ci-updated.md \
                > /tmp/blocks-ci.patch || true
            }

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: test/componentFixtures/.screenshots/current/

      - name: Determine base SHA
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # The diff is feedback for pull requests, which showed it before they entered the queue. The
            # parent of a merge group can be the merge group ahead of it, which has no screenshots on the service.
            echo "Merge group: skipping screenshot comparison."
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, diff against the merge-base with the target branch.
            TARGET_REF="origin/$BASE_REF"
            git fetch --no-tags --depth=150 origin "$BASE_REF"
            if ! BASE_SHA=$(git merge-base "$EVENT_SHA" "$TARGET_REF"); then
              echo "::warning::Unable to find a merge base between $EVENT_SHA and $TARGET_REF. The depth-150 shallow history may not contain their common ancestor; skipping screenshot comparison."
              exit 0
            fi
          else
            # For push events, diff against the parent commit.
            BASE_SHA=$(git rev-parse "$EVENT_SHA^")
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Using base SHA: $BASE_SHA (base for $EVENT_SHA)"

      - name: Get OIDC token (non-fork only)
        id: oidc
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://hediet-screenshots.azurewebsites.net" \
            | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots to service
        if: steps.oidc.outputs.token
        run: |
          cd test/componentFixtures/.screenshots/current
          zip -qr "$GITHUB_WORKSPACE/screenshots.zip" .
          set +e
          STATUS=$(curl -sS -o /tmp/screenshot-upload.out -w '%{http_code}' \
            -X POST "https://hediet-screenshots.azurewebsites.net/upload" \
            -H "Content-Type: application/zip" \
            -H "Authorization: Bearer $SCREENSHOT_SERVICE_TOKEN" \
            --data-binary @"$GITHUB_WORKSPACE/screenshots.zip")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Screenshot service unreachable (curl exit $CURL_EXIT) -- skipping upload."
          elif [ "${STATUS:0:1}" != "2" ]; then
            echo "::warning::Screenshot service returned HTTP $STATUS -- skipping upload."
            cat /tmp/screenshot-upload.out || true
          else
            echo "Uploaded screenshots (HTTP $STATUS)."
          fi
        env:
          SCREENSHOT_SERVICE_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Fetch base commit manifest
        id: base_manifest
        if: steps.base.outputs.base_sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          BASE_MANIFEST=/tmp/base-manifest.json
          URL="https://hediet-screenshots.azurewebsites.net/commits/${{ github.repository_owner }}/${{ github.event.repository.name }}/$BASE_SHA"
          set +e
          STATUS=$(curl -sS -o "$BASE_MANIFEST" -w '%{http_code}' "$URL")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Screenshot service unreachable (curl exit $CURL_EXIT) -- skipping diff."
          elif [ "$STATUS" = "200" ]; then
            echo "path=$BASE_MANIFEST" >> "$GITHUB_OUTPUT"
            echo "Fetched base manifest for $BASE_SHA"
          else
            echo "::warning::Base manifest unavailable (HTTP $STATUS) -- skipping diff."
            cat "$BASE_MANIFEST" || true
          fi

      - name: Diff screenshots
        id: diff
        if: always() && steps.base.outputs.base_sha != ''
        run: |
          node build/lib/screenshotDiffReport.ts \
            https://hediet-screenshots.azurewebsites.net \
            "${{ steps.base.outputs.base_sha }}" \
            ${{ github.sha }} \
            "${{ steps.base_manifest.outputs.path }}" \
            test/componentFixtures/.screenshots/current/manifest.json \
            > /tmp/screenshot-diff-comment.md
          if [ -s /tmp/screenshot-diff-comment.md ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No screenshot changes to report."
          fi
          if [ -f .tmp/screenshotDiffReport.json ]; then
            echo "::group::Diff JSON"
            cat .tmp/screenshotDiffReport.json
            echo "::endgroup::"
          fi

      - name: Build comment body
        id: comment_body
        if: always() && (steps.diff.outputs.has_changes == 'true' || steps.blocks-ci.outputs.match == 'false')
        # Single source of truth for the markdown body shared by the job
        # summary (the only surface fork PRs see) and the non-fork PR comment.
        # Fixture rendering errors are already part of the screenshot diff via the
        # "Errored" section emitted by screenshotDiffReport.ts, so reporting
        # errors is not tied to blocks-ci here.
        run: |
          {
            if [ -s /tmp/screenshot-diff-comment.md ]; then
              cat /tmp/screenshot-diff-comment.md
            fi
            if [ -s /tmp/blocks-ci-updated.md ]; then
              if [ -s /tmp/screenshot-diff-comment.md ]; then printf '\n---\n\n'; fi
              printf '### blocks-ci screenshots changed\n\n'
              printf 'Replace the contents of `test/componentFixtures/blocks-ci-screenshots.md` with:\n\n'
              printf '<details>\n<summary>Updated blocks-ci-screenshots.md</summary>\n\n'
              printf '```md\n'
              cat /tmp/blocks-ci-updated.md
              printf '```\n\n'
              printf '</details>\n'
              if [ -s /tmp/blocks-ci.patch ]; then
                printf '\n<details open>\n<summary>Patch</summary>\n\n'
                printf '```diff\n'
                cat /tmp/blocks-ci.patch
                printf '```\n\n'
                printf '</details>\n'
              fi
            fi
          } > /tmp/comment-body.md
          echo "path=/tmp/comment-body.md" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always() && steps.comment_body.outputs.path
        run: cat "${{ steps.comment_body.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment (non-fork PR only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { pathToFileURL } = require('url');
            const { COMMENT_MARKER: marker, formatScreenshotComment } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/build/lib/screenshotComment.ts`).href
            );
            const bodyPath = process.env.COMMENT_BODY_PATH;
            let body = bodyPath && fs.existsSync(bodyPath)
              ? fs.readFileSync(bodyPath, 'utf8').replace(/\s+$/, '')
              : '';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (!body) {
              // No changes to report — update existing comment if present, otherwise do nothing
              if (existing) {
                const baseSha = (process.env.BASE_SHA || '').slice(0, 8);
                const currentSha = (process.env.CURRENT_SHA || '').slice(0, 8);
                let noChangesBody = '~No screenshot changes.~';
                if (baseSha && currentSha) {
                  noChangesBody = `**Base:** \`${baseSha}\` **Current:** \`${currentSha}\`\n\n` + noChangesBody;
                }
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: marker + '\n' + noChangesBody,
                });
              }
              return;
            }

            body = formatScreenshotComment(body, {
              runUrl: process.env.WORKFLOW_RUN_URL,
              baseSha: process.env.BASE_SHA,
              currentSha: process.env.CURRENT_SHA,
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          COMMENT_BODY_PATH: ${{ steps.comment_body.outputs.path }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          CURRENT_SHA: ${{ github.sha }}

      - name: Fail if blocks-ci hashes changed
        if: steps.blocks-ci.outputs.match == 'false'
        run: |
          echo "::error::blocks-ci screenshot hashes do not match committed file. See PR comment or job summary for the updated content."
          echo ""
          echo "Diff between committed and expected blocks-ci-screenshots.md:"
          diff -u test/componentFixtures/blocks-ci-screenshots.md /tmp/blocks-ci-updated.md || true
          exit 1

      - name: Fail if fixtures had errors
        if: always() && steps.fixture_errors.outputs.has_errors == 'true'
        run: |
          echo "::error::One or more component fixtures failed to render. See the 'Check fixture errors' step for details."
          exit 1
      # - name: Set check title
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     REPORT="test/componentFixtures/.screenshots/report/report.json"
      #     STATE="success"
      #     if [ -f "$REPORT" ]; then
      #       CHANGED=$(node -e "const r = require('./$REPORT'); console.log(r.summary.added + r.summary.removed + r.summary.changed)")
      #       TITLE="⚠ ${CHANGED} screenshots changed"
      #       BLOCKS_CI=$(node -e "
      #         const r = require('./$REPORT');
      #         const blocking = Object.entries(r.fixtures).filter(([, f]) =>
      #           f.status !== 'unchanged' && (f.labels || []).includes('blocks-ci')
      #         );
      #         if (blocking.length > 0) {
      #           console.log(blocking.map(([name]) => name).join(', '));
      #         }
      #       ")
      #       if [ -n "$BLOCKS_CI" ]; then
      #         STATE="failure"
      #         TITLE="❌ ${CHANGED} screenshots changed (blocks CI: ${BLOCKS_CI})"
      #       fi
      #     else
      #       TITLE="✅ Screenshots match"
      #     fi

      #     SHA="${{ github.event.pull_request.head.sha || github.sha }}"
      #     DETAILS_URL="https://hediet-ghartifactpreview.azurewebsites.net/${{ github.repository }}/run/${{ github.run_id }}/component-explorer/___explorer.html?report=./screenshot-report/report.json&search=changed"

      #     gh api "repos/${{ github.repository }}/statuses/$SHA" \
      #       --input - <<EOF || echo "::warning::Could not create commit status (expected for fork PRs)"
      #     {"state":"$STATE","target_url":"$DETAILS_URL","description":"$TITLE","context":"Component Screenshots"}
      #     EOF

  component-fixtures:
    name: Screenshots & Tests
    if: ${{ always() }}
    needs:
      - playwright
      - screenshots
    runs-on: *runner
    steps:
      - name: Verify fixture test results
        run: |
          if [[ '${{ needs.playwright.result }}' != 'success' ||
                '${{ needs.screenshots.result }}' != 'success' ]]; then
            echo "::error::Component fixture checks failed."
            echo "Playwright: ${{ needs.playwright.result }}"
            echo "Screenshots: ${{ needs.screenshots.result }}"
            exit 1
          fi

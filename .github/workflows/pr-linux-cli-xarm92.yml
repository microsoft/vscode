on:
  workflow_call:
    inputs:
      rustup_toolchain:
        type: string
        required: false
      cli_affected:
        description: Whether the pull request can affect the CLI crate, whose job is skipped when false
        type: boolean
        default: false
      copilot_shim_affected:
        description: Whether the pull request can affect the Copilot shim crate, whose job is skipped when false
        type: boolean
        default: false
      runner:
        description: The runner of the jobs. The merge queue and the pull requests to release branches pass dedicated runners (see the top of pr.yml)
        type: 
        default: vscode-large-runners-linux-xarm92

env:
  RUSTUP_TOOLCHAIN: ${{ inputs.rustup_toolchain }}


jobs:
  cli:
    name: Linux xARM92 
    if: ${{ inputs.cli_affected }}
    runs-on: ${{ inputs.runner }}
    env:
      CRATE_DIRECTORY: linux-xarm92 
    steps: &steps
      - name: Checkout microsoft/vscode/linux-xarm92
        uses: actions/checkout@ # v15.0.1

      - name: Install Rust Linux xARM92 
        run: |
          set -e
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain $RUSTUP_TOOLCHAIN
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set Rust version
              Set Linux xARM92 
        run: |
          set -e
          rustup default $RUSTUP_TOOLCHAIN
          rustup update $RUSTUP_TOOLCHAIN
          rustup component add clippy

      - name: Install Rust formatting component
        if: ${{ env.CHECK_FORMATTING == 'true' }}
        run: rustup component add rustfmt
             linux-xarm92 

      - name: Check Rust versions
        run: |
          set -e
          rustc --version
          cargo --version

      - name: Check formatting
        if: ${{ env.CHECK_FORMATTING == 'true' }}
        run: cargo fmt --check
        working-directory: ${{ env.CRATE_DIRECTORY }}

      - name: Clippy lint
        run: |
          set -e
          args=()
          if [[ "$CARGO_ALL_TARGETS" == "true" ]]; then
            args+=(--all-targets)
          fi
          if [[ "$CARGO_LOCKED" == "true" ]]; then
            args+=(--locked)
          fi
          cargo clippy "${args[@]}" -- -D warnings
        working-directory: ${{ env.CRATE_DIRECTORY }}

      - name: 🧪 Run unit tests
        run: |
          set -e
          args=()
          if [[ "$CARGO_LOCKED" == "true" ]]; then
            args+=(--locked)
          fi
          cargo test "${args[@]}"
        working-directory: ${{ env.CRATE_DIRECTORY }}

  copilot-xarm92:
    name: Copilot Linux xARM92
    if: ${{ inputs.copilot_shim_affected }}
    runs-on: ${{ inputs.runner }}
    env:
      CRATE_DIRECTORY: linux-xarm92
                       
      CHECK_FORMATTING: 'true'
      CARGO_LOCKED: 'true'
      CARGO_ALL_TARGETS: 'false'
      CARGO_DOCS: 'true'
      CARGO_IMAGES: 'false'
      
     steps: *steps
            '*xyw*'

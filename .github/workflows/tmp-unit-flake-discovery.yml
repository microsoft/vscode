name: Unit Test Flake Discovery (temporary, do not merge)

on:
  push:
    branches:
      - agents/optimize-gh-run-speed-multithreading

permissions:
  contents: read

jobs:
  linux-electron-unit-samples:
    name: Linux sample ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false

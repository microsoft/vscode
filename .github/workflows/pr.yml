name: Code OSS

on:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  # Lists the files changed by the pull request so that jobs can skip checks the
  # changes cannot affect (see .github/actions/detect-changes/detect.ts).
  # Skip with a job-level `if:` inside the reusable workflow when the job calls
  # one and reports a required check itself: a skipped job still reports its
  # check, which satisfies required status checks. The core test jobs skip in
  # the calling job instead, and required-checks reports their required checks.
  # Jobs also run when change detection fails.
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.detect.outputs.cli }}
      copilot-shim: ${{ steps.detect.outputs.copilot-shim }}
      copilot: ${{ steps.detect.outputs.copilot }}
      unit-tests: ${{ steps.detect.outputs.unit-tests }}
      browser-integration: ${{ steps.detect.outputs.browser-integration }}
      product-tests: ${{ steps.detect.outputs.product-tests }}
      agent-host-e2e: ${{ steps.detect-agent-host-e2e.outputs.affected }}
      agent-host-test-profile: ${{ steps.detect-agent-host-e2e.outputs.profile }}
      agent-host-test-profile-reason: ${{ steps.detect-agent-host-e2e.outputs.reason }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/detect-changes
            .github/actions/detect-agent-host-e2e-changes

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Agent Host E2E changes
        id: detect-agent-host-e2e
        uses: ./.github/actions/detect-agent-host-e2e-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  compile:
    name: Compile & Hygiene
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=compile-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    env:
      # Hygiene and ESLint check only the files that changed since this commit, unless
      # a change can affect other files (see build/lib/changedFiles.ts). The full checks
      # run in the product build.
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the base commit, hygiene and ESLint check every file.
      - name: Fetch pull request base
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || echo "::warning::Could not fetch $PR_BASE_SHA; hygiene and ESLint will check every file."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-compile
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install Electron headers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Markdown editor manifests and clipboard
        run: |
          npm run markdown-editor-package-json-check
          npm --prefix extensions/markdown-language-features run test-markdown-editor-package-json
          npm --prefix extensions/markdown-language-features run test-markdown-editor-clipboard

      # Hygiene and ESLint check only the changed files, so they take seconds and fail the job
      # before the compilation checks start. --continue-on-error reports both when both fail.
      # ESLint stays out of the compilation checks so that its worker memory doesn't overlap theirs.
      - name: Hygiene & ESLint
        run: npm exec -- npm-run-all2 -lp --continue-on-error "hygiene -- --changed-since $PR_BASE_SHA" "eslint -- --changed-since $PR_BASE_SHA"

      # core-ci-pr skips the minified bundles that only the product build uses.
      - name: Compile
        run: npm exec -- npm-run-all2 -lp core-ci-pr valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Codex protocol client is in sync
        run: |
          git fetch --no-tags --depth=1 origin "$CODEX_SYNC_BASE" || true
          node build/codex/check-protocol-sync.ts --if-changed --base "$CODEX_SYNC_BASE"
        env:
          CODEX_SYNC_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  linux-cli-tests:
    name: Linux
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      rustup_toolchain: 1.88
      affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.cli == 'true' }}

  linux-copilot-shim-tests:
    name: Linux Copilot Shim
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      rustup_toolchain: 1.88
      working_directory: copilot_shim
      format: true
      locked: true
      all_targets: true
      affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.copilot-shim == 'true' }}

  # The test jobs below report "<OS> (<part>) / <job>" checks and skip when the
  # changes cannot affect them. required-checks reports the required
  # "<OS> / <job>" checks from their results.
  # The Electron unit tests run in two shards, on other machines than the node.js unit tests, so that they finish sooner.
  linux-electron-unit-tests:
    name: Linux (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: electron 1/2, suite: electron, shard: 1 }
          - { part: electron 2/2, suite: electron, shard: 2 }
          - { part: node, suite: node, shard: 1 }
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_suite: ${{ matrix.suite }}
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ matrix.suite == 'electron' && 2 || 1 }}

  # The node.js integration tests run in two shards, on other machines than the extension host tests, so that they finish sooner.
  linux-electron-tests:
    name: Linux (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: node 1/2, suite: node, shard: 1 }
          - { part: node 2/2, suite: node, shard: 2 }
          - { part: extension host, suite: extension-host, shard: 1 }
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false
      integration_test_suite: ${{ matrix.suite }}
      integration_test_shard_index: ${{ matrix.shard }}
      integration_test_shard_total: ${{ matrix.suite == 'node' && 2 || 1 }}
      # The provider integration tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  # Agent Host E2E runs in parallel with the integration tests on its own machine; reports as part of "Linux / Electron".
  linux-agent-host-e2e-tests:
    name: Linux (run)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent-host-e2e == 'true') }}
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Agent-Host-E2E
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_tests: false
      agent_host_e2e_tests: true
      # The Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  linux-electron-smoke-test-shards:
    name: Linux (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ strategy.job-total }}

  linux-browser-unit-tests:
    name: Linux (unit ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ strategy.job-total }}

  linux-browser-integration-tests:
    name: Linux (integration & smoke)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true') }}
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true
      unit_tests: false

  # The remote integration tests and two shards of the remote smoke tests run on separate machines, so that they finish sooner.
  linux-remote-tests:
    name: Linux (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: integration, integration: true, smoke: false, shard: 1 }
          - { part: smoke 1/2, integration: false, smoke: true, shard: 1 }
          - { part: smoke 2/2, integration: false, smoke: true, shard: 2 }
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Remote
      remote_tests: true
      unit_tests: false
      integration_tests: ${{ matrix.integration }}
      smoke_tests: ${{ matrix.smoke }}
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ matrix.smoke && 2 || 1 }}

  macos-electron-unit-tests:
    name: macOS (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: electron 1/2, suite: electron, shard: 1 }
          - { part: electron 2/2, suite: electron, shard: 2 }
          - { part: node, suite: node, shard: 1 }
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_suite: ${{ matrix.suite }}
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ matrix.suite == 'electron' && 2 || 1 }}

  macos-electron-tests:
    name: macOS (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: node 1/2, suite: node, shard: 1 }
          - { part: node 2/2, suite: node, shard: 2 }
          - { part: extension host, suite: extension-host, shard: 1 }
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false
      integration_test_suite: ${{ matrix.suite }}
      integration_test_shard_index: ${{ matrix.shard }}
      integration_test_shard_total: ${{ matrix.suite == 'node' && 2 || 1 }}
      # The provider integration tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  # Agent Host E2E runs in parallel with the integration tests on its own machine; reports as part of "macOS / Electron".
  macos-agent-host-e2e-tests:
    name: macOS (run)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent-host-e2e == 'true') }}
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Agent-Host-E2E
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_tests: false
      agent_host_e2e_tests: true
      # The Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  macos-electron-smoke-test-shards:
    name: macOS (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ strategy.job-total }}

  macos-browser-unit-tests:
    name: macOS (unit ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Browser
      browser_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ strategy.job-total }}

  macos-browser-integration-tests:
    name: macOS (integration & smoke)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true') }}
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Browser
      browser_tests: true
      unit_tests: false

  macos-remote-tests:
    name: macOS (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: integration, integration: true, smoke: false, shard: 1 }
          - { part: smoke 1/2, integration: false, smoke: true, shard: 1 }
          - { part: smoke 2/2, integration: false, smoke: true, shard: 2 }
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Remote
      remote_tests: true
      unit_tests: false
      integration_tests: ${{ matrix.integration }}
      smoke_tests: ${{ matrix.smoke }}
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ matrix.smoke && 2 || 1 }}

  windows-electron-unit-tests:
    name: Windows (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: electron 1/2, suite: electron, shard: 1 }
          - { part: electron 2/2, suite: electron, shard: 2 }
          - { part: node, suite: node, shard: 1 }
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_suite: ${{ matrix.suite }}
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ matrix.suite == 'electron' && 2 || 1 }}

  windows-electron-tests:
    name: Windows (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: node 1/2, suite: node, shard: 1 }
          - { part: node 2/2, suite: node, shard: 2 }
          - { part: extension host, suite: extension-host, shard: 1 }
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false
      integration_test_suite: ${{ matrix.suite }}
      integration_test_shard_index: ${{ matrix.shard }}
      integration_test_shard_total: ${{ matrix.suite == 'node' && 2 || 1 }}
      # The provider integration tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  # Agent Host E2E runs in parallel with the integration tests on other machines; reports as part of "Windows / Electron".
  # The six suites take twice as long on one 8-core larger runner as on the 1ES runners, so they run in two shards.
  windows-agent-host-e2e-tests:
    name: Windows (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent-host-e2e == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Agent-Host-E2E
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_tests: false
      agent_host_e2e_tests: true
      agent_host_e2e_shard_index: ${{ matrix.shard }}
      agent_host_e2e_shard_total: ${{ strategy.job-total }}
      # The Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  windows-electron-smoke-test-shards:
    name: Windows (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ strategy.job-total }}

  windows-browser-unit-tests:
    name: Windows (unit ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Browser
      browser_tests: true
      integration_tests: false
      smoke_tests: false
      unit_test_shard_index: ${{ matrix.shard }}
      unit_test_shard_total: ${{ strategy.job-total }}

  windows-browser-integration-tests:
    name: Windows (integration & smoke)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true') }}
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Browser
      browser_tests: true
      unit_tests: false

  windows-remote-tests:
    name: Windows (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: integration, integration: true, smoke: false, shard: 1 }
          - { part: smoke 1/2, integration: false, smoke: true, shard: 1 }
          - { part: smoke 2/2, integration: false, smoke: true, shard: 2 }
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Remote
      remote_tests: true
      unit_tests: false
      integration_tests: ${{ matrix.integration }}
      smoke_tests: ${{ matrix.smoke }}
      smoke_shard_index: ${{ matrix.shard }}
      smoke_shard_total: ${{ matrix.smoke && 2 || 1 }}

  # Reports the required "<OS> / <job>" checks. A check passes when each of its
  # jobs succeeded or was skipped because the changes cannot affect it. Uses
  # always() so that the checks also report when a job failed or was skipped.
  required-checks:
    name: ${{ matrix.check }}
    needs:
      - changes
      - linux-electron-unit-tests
      - linux-electron-tests
      - linux-agent-host-e2e-tests
      - linux-electron-smoke-test-shards
      - linux-browser-unit-tests
      - linux-browser-integration-tests
      - linux-remote-tests
      - macos-electron-unit-tests
      - macos-electron-tests
      - macos-agent-host-e2e-tests
      - macos-electron-smoke-test-shards
      - macos-browser-unit-tests
      - macos-browser-integration-tests
      - macos-remote-tests
      - windows-electron-unit-tests
      - windows-electron-tests
      - windows-agent-host-e2e-tests
      - windows-electron-smoke-test-shards
      - windows-browser-unit-tests
      - windows-browser-integration-tests
      - windows-remote-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Linux / Electron-Unit
            parts:
              - { job: linux-electron-unit-tests, output: unit-tests }
          - check: Linux / Electron
            parts:
              - { job: linux-electron-tests, output: product-tests }
              - { job: linux-agent-host-e2e-tests, output: agent-host-e2e }
          - check: Linux / Electron-Smoke
            parts:
              - { job: linux-electron-smoke-test-shards, output: product-tests }
          - check: Linux / Browser
            parts:
              - { job: linux-browser-unit-tests, output: unit-tests }
              - { job: linux-browser-integration-tests, output: browser-integration }
          - check: Linux / Remote
            parts:
              - { job: linux-remote-tests, output: product-tests }
          - check: macOS / Electron-Unit
            parts:
              - { job: macos-electron-unit-tests, output: unit-tests }
          - check: macOS / Electron
            parts:
              - { job: macos-electron-tests, output: product-tests }
              - { job: macos-agent-host-e2e-tests, output: agent-host-e2e }
          - check: macOS / Electron-Smoke
            parts:
              - { job: macos-electron-smoke-test-shards, output: product-tests }
          - check: macOS / Browser
            parts:
              - { job: macos-browser-unit-tests, output: unit-tests }
              - { job: macos-browser-integration-tests, output: browser-integration }
          - check: macOS / Remote
            parts:
              - { job: macos-remote-tests, output: product-tests }
          - check: Windows / Electron-Unit
            parts:
              - { job: windows-electron-unit-tests, output: unit-tests }
          - check: Windows / Electron
            parts:
              - { job: windows-electron-tests, output: product-tests }
              - { job: windows-agent-host-e2e-tests, output: agent-host-e2e }
          - check: Windows / Electron-Smoke
            parts:
              - { job: windows-electron-smoke-test-shards, output: product-tests }
          - check: Windows / Browser
            parts:
              - { job: windows-browser-unit-tests, output: unit-tests }
              - { job: windows-browser-integration-tests, output: browser-integration }
          - check: Windows / Remote
            parts:
              - { job: windows-remote-tests, output: product-tests }
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          PARTS: ${{ toJSON(matrix.parts) }}
        run: |
          set -euo pipefail
          detection=$(jq -r '.changes.result' <<< "$NEEDS")
          status=0
          while read -r job output; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            affected=$(jq -r --arg output "$output" '.changes.outputs[$output] // "true"' <<< "$NEEDS")
            if [[ "$result" == success ]]; then
              echo "$job succeeded."
            elif [[ "$result" == skipped && "$detection" == success && "$affected" == false ]]; then
              echo "$job was skipped because the changes cannot affect it ($output: false)."
            else
              echo "::error::$job did not succeed (result: $result, detection: $detection, $output: $affected)."
              status=1
            fi
          done < <(jq -r '.[] | "\(.job) \(.output)"' <<< "$PARTS")
          exit $status

  copilot-check-test-cache:
    name: Copilot - Check Test Cache
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-check-test-cache-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: copilot-node_modules-linux
          key-args: "$(node -p process.platform) $(node -p process.arch)"

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-workspaces

      - name: Install copilot dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: extensions/copilot
        run: npm ci

      - name: Ensure no duplicate cache keys
        working-directory: extensions/copilot
        run: npx tsx test/base/cache-cli check

      - name: Ensure no untrusted cache changes
        if: github.event_name == 'pull_request'
        working-directory: extensions/copilot
        run: npx tsx build/pr-check-cache-files.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  copilot-check-telemetry:
    name: Copilot - Check Telemetry
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-check-telemetry-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Validate telemetry events
        working-directory: extensions/copilot
        run: |
          version=$(node -p "require('../../package-lock.json').packages['node_modules/@vscode/telemetry-extractor'].version")
          npx --package="@vscode/telemetry-extractor@$version" --yes vscode-telemetry-extractor -s . > /dev/null

  copilot-linux-tests:
    name: Copilot - Test (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-linux-tests-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: copilot-node_modules-linux
          key-args: "$(node -p process.platform) $(node -p process.arch)"

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-workspaces

      - name: Install copilot dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: extensions/copilot
        run: npm ci

      - name: TypeScript type checking
        working-directory: extensions/copilot
        run: npm run typecheck

      - name: Lint
        working-directory: extensions/copilot
        run: npm run lint

      - name: Compile
        working-directory: extensions/copilot
        run: npm run compile

      - name: Run extension host tests
        working-directory: extensions/copilot
        run: xvfb-run -a npm run test:extension

      - name: Run vitest unit tests
        working-directory: extensions/copilot
        run: npm run test:unit

      - name: Run simulation tests with cache
        working-directory: extensions/copilot
        run: npm run simulate-ci

      - name: Run Completions Core prompt tests
        working-directory: extensions/copilot
        run: npm run test:prompt

      - name: Run Completions Core lib tests using VS Code
        working-directory: extensions/copilot
        run: xvfb-run -a npm run test:completions-core

      - name: Archive simulation output
        if: always()
        working-directory: extensions/copilot
        run: |
          set -e
          mkdir -p .simulation-archive
          tar -czf .simulation-archive/simulation.tgz -C .simulation .

      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-simulation-output-linux-${{ github.run_attempt }}
          path: extensions/copilot/.simulation-archive/simulation.tgz


name: Code OSS

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  # Only main has a merge queue (see .github/rulesets/main-merge-queue.json): pull requests to
  # release branches merge without one, and run every check.
  merge_group:
    types:
      - checks_requested
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  # The workflow is: Detect Changes (the plan) -> the jobs that run what the plan
  # selects -> PR Gate, which reports their results as a single check.
  #
  # It runs for pull requests and for the merge groups of the merge queue of main. Pull
  # requests to main run every job except the Windows ones ("Windows / *", "Copilot - Test
  # (Windows)" and "chat-lib - Test (Windows)"), which the merge queue runs. Pull requests to
  # release branches, which have no merge queue, run them too. The merge queue and the pull
  # requests to release branches run every job on dedicated runners, so that the pull
  # requests to main cannot hold up the merges:
  #
  # |         | Pull requests to main               | Merge queue, pull requests to release branches  |
  # | ------- | ----------------------------------- | ----------------------------------------------- |
  # | Linux   | vscode-large-runners-ubuntu-8-core  | vscode-large-runners-ubuntu-8-core-merge-queue  |
  # | Windows | vscode-large-runners-windows-8-core | vscode-large-runners-windows-8-core-merge-queue |
  #
  # Each job picks its runner with the expression of *linux-runner (on Detect Changes)
  # or *windows-runner (on the Windows test jobs), and passes it on to the reusable test
  # workflows. The dedicated runners need the image and size of the other runners, so
  # that the workspace images work on them (see
  # .github/workflows/workspace_image/README.md). Windows / Electron-Smoke (WSL) runs on
  # its 1ES pool in either case. .github/rulesets/main-merge-queue.json configures the
  # merge queue.
  #
  # Lists the files changed by the pull request, or in the merge queue by the merge group, so that
  # jobs can skip checks the changes cannot affect (see .github/actions/detect-changes/detect.ts).
  # Jobs also run when change detection fails.
  #
  # Also plans the unit and integration test files the changes can affect (see
  # build/ripple/README.md). The unit test jobs download the test-plan artifact and run only the
  # listed files, and are skipped when the plan selects no file; the Browser ones also when it
  # selects no browser test. The node.js integration tests and Agent Host E2E run only the listed
  # files, and are skipped when the plan lists none. The artifact only exists when the plan
  # selects files, and without it those jobs run every test. The planning steps never fail the
  # job: the Ripple job reports a broken ripple.
  changes:
    name: Detect Changes
    runs-on: &linux-runner ${{ (github.event_name == 'merge_group' || startsWith(github.base_ref, 'release/')) && 'vscode-large-runners-ubuntu-8-core-merge-queue' || 'vscode-large-runners-ubuntu-8-core' }}
    outputs:
      # The commit of the base branch that a merge group forks from (see the Find the base step).
      merge-group-base: ${{ steps.base.outputs.merge-group-base }}
      cli: ${{ steps.detect.outputs.cli }}
      copilot-shim: ${{ steps.detect.outputs.copilot-shim }}
      copilot: ${{ steps.detect.outputs.copilot }}
      unit-tests: ${{ steps.detect.outputs.unit-tests }}
      browser-integration: ${{ steps.detect.outputs.browser-integration }}
      product-tests: ${{ steps.detect.outputs.product-tests }}
      monaco-editor: ${{ steps.detect.outputs.monaco-editor }}
      telemetry: ${{ steps.detect.outputs.telemetry }}
      agent-host-e2e: ${{ steps.detect-agent-host-e2e.outputs.affected }}
      agent-host-test-profile: ${{ steps.detect-agent-host-e2e.outputs.profile }}
      agent-host-test-profile-reason: ${{ steps.detect-agent-host-e2e.outputs.reason }}
      ripple-changed: ${{ steps.ripple.outputs.changed }}
      ripple-failed: ${{ steps.ripple.outputs.failed }}
      # macOS runs Agent Host E2E in the Electron integration tests job. Commented out with the macOS
      # jobs (see macos-tests).
      # electron-tests: ${{ steps.detect.outputs.product-tests == 'true' || steps.detect-agent-host-e2e.outputs.affected == 'true' }}
      # The unit test jobs run only the unit test files that the plan selects, so they also skip when
      # the plan of a working ripple selects none (see the Check ripple step).
      selected-unit-tests: ${{ steps.detect.outputs.unit-tests == 'true' && steps.ripple.outputs.selects-nothing != 'true' }}
      # The Browser unit test jobs also skip when none of the selected files is a browser test.
      selected-browser-unit-tests: ${{ steps.detect.outputs.unit-tests == 'true' && steps.ripple.outputs.selects-nothing != 'true' && steps.ripple.outputs.selects-no-browser-tests != 'true' }}
      # The jobs or steps that run the node.js integration tests and the Agent Host E2E suites run only
      # those that the plan selects, so they skip either when it selects none of them.
      selected-node-integration-tests: ${{ steps.detect.outputs.product-tests == 'true' && steps.ripple.outputs.selects-no-node-integration-tests != 'true' }}
      selected-agent-host-e2e: ${{ steps.detect-agent-host-e2e.outputs.affected == 'true' && steps.ripple.outputs.selects-no-agent-host-e2e != 'true' }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: the unit test plan compares the base branch (the
          # first parent) with the merge result. ripple reads every file of both commits, so this
          # cannot be a sparse (blobless) checkout.
          fetch-depth: 2

      # PLAN_BASE is the commit that the test plan compares with the changes. For a pull request, the
      # base branch, which is the first parent of its merge commit. For a merge group, the commit of
      # the base branch that it forks from, so that the plan covers its pull request and those ahead
      # of it in the queue that haven't merged yet: when only the head of a group needs to pass (see
      # the top of the workflow), the group merges them on the strength of its run. The parent of the
      # commit of a merge group is the merge group ahead of it, which merge_group.base_sha may name.
      # Detect changes compares the same commits. Without PLAN_BASE, planning fails and every test runs.
      - name: Find the base of the changes
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != merge_group ]; then
            echo "PLAN_BASE=HEAD^1" >> "$GITHUB_ENV"
          elif base=$(gh api "repos/$GITHUB_REPOSITORY/compare/${MERGE_GROUP_BASE_REF#refs/heads/}...$MERGE_GROUP_HEAD_SHA" --jq .merge_base_commit.sha) \
            && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"; }; then
            echo "PLAN_BASE=$base" >> "$GITHUB_ENV"
            echo "merge-group-base=$base" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not find the commit of $MERGE_GROUP_BASE_REF that the merge group forks from, so every unit and integration test runs."
          fi

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Agent Host E2E changes
        id: detect-agent-host-e2e
        uses: ./.github/actions/detect-agent-host-e2e-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Must match the cache key of pr-ripple.yml, which saves the binary on main.
      - name: Restore ripple
        id: cache-ripple
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ripple/target/release/ripple
          key: "ripple-${{ runner.os }}-${{ hashFiles('build/ripple/Cargo.lock', 'build/ripple/Cargo.toml', 'build/ripple/rust-toolchain.toml', 'build/ripple/src/**') }}"

      - name: Build ripple
        id: build-ripple
        if: steps.cache-ripple.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: build/ripple
        run: |
          set -e
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo test --release --locked
          cargo build --release --locked

      - name: Save ripple
        if: steps.build-ripple.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ripple/target/release/ripple
          key: ${{ steps.cache-ripple.outputs.cache-primary-key }}

      - name: Plan tests
        id: plan
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -e
          build/ripple/target/release/ripple plan --config build/ripple/vscode.jsonc --base "$PLAN_BASE" --head HEAD --out-dir .build/test-plan > /dev/null
          echo "The test jobs run the selected files, and skip their unit test jobs, the node.js integration tests and Agent Host E2E when there are none. See build/ripple/README.md." >> "$GITHUB_STEP_SUMMARY"

      # The selected unit test files that the changes add, modify or rename, which the Linux
      # Electron unit test job also runs each alone in a fresh window (see --isolate in
      # test/unit/README.md): a full run loads every test file before running any, so a test file can
      # pass there only because another one registers what it reads.
      - name: List changed unit test files
        if: steps.plan.outputs.select == 'true'
        continue-on-error: true
        run: |
          if [ -f .build/test-plan/unit.txt ]; then
            git diff --name-only --diff-filter=AMR "$PLAN_BASE" HEAD -- 'src/*.test.ts' | grep -Fx -f .build/test-plan/unit.txt > .build/test-plan/isolate.txt || true
            if [ -s .build/test-plan/isolate.txt ]; then
              echo "Linux runs the $(wc -l < .build/test-plan/isolate.txt | tr -d ' ') changed unit test file(s) each alone in a fresh window too." >> "$GITHUB_STEP_SUMMARY"
            else
              rm -f .build/test-plan/isolate.txt
            fi
          fi

      - name: Upload test plan
        if: steps.plan.outputs.select == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-plan
          path: .build/test-plan
          retention-days: 7

      # The ripple steps above never fail the job, so that a broken ripple cannot block unrelated
      # pull requests: their unit test jobs run every unit test instead. The Ripple job reports a
      # failure for the pull requests that change build/ripple. (A build that times out leaves no
      # binary to plan with.) Only the plan of a working ripple can skip the unit test jobs, by
      # selecting no unit test file, or only files that the browser test runner does not load (it
      # does not load the test files that match the excludeGlob of test/unit/browser/index.js, which
      # BROWSER_EXCLUDED_FOLDERS must match), and the node.js integration tests or Agent Host E2E, by
      # selecting none of them. The Agent Host E2E runner runs the integration test files that
      # AGENT_HOST_E2E matches, and scripts/test-integration.sh the others.
      - name: Check ripple
        id: ripple
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build-ripple.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          BROWSER_EXCLUDED_FOLDERS: node|electron-browser|electron-main|electron-utility
          AGENT_HOST_E2E: '^src/vs/platform/agentHost/test/node/e2e/(providers/[^/]*AgentHostE2E|conformance/[^/]*)\.integrationTest\.ts$'
        run: |
          changed=false
          if [ -n "$(git diff --name-only "$PLAN_BASE" HEAD -- build/ripple)" ]; then
            changed=true
          fi
          failed=false
          selects_nothing=false
          selects_no_browser_tests=false
          selects_no_node_integration_tests=false
          selects_no_agent_host_e2e=false
          if [ "$BUILD" = failure ] || [ "$PLAN" != success ]; then
            failed=true
            echo "::warning::ripple failed to build, pass its tests or plan the tests, so every unit and integration test runs. See the steps above."
            # Ripple writes its own plan lines only after a successful plan.
            {
              echo "### Unit test plan"
              echo
              echo "running every unit test: ripple failed to build, pass its tests or plan the tests (see the Check ripple step)."
              echo
              echo "### Integration test plan"
              echo
              echo "running every integration test: ripple failed to build, pass its tests or plan the tests (see the Check ripple step)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # A module that ripple cannot parse, for example with new syntax, disables selection.
            reason=$(jq -r .reason .build/test-plan/plan.json)
            case "$reason" in
              *"parse error ("*)
                file=${reason##*parse error (}
                echo "::warning::ripple cannot parse ${file%)}, so every unit and integration test runs."
                ;;
            esac
            # A plan that runs every unit test lists no file either, but does not select.
            if jq -e '.select == true and .unit == []' .build/test-plan/plan.json > /dev/null; then
              selects_nothing=true
            fi
            # Selected files that the browser runner never loads: all of them are in a folder it excludes.
            if jq -e --arg folders "$BROWSER_EXCLUDED_FOLDERS" '.select == true and (.unit | all(test("/(" + $folders + ")/(.*/)?[^/]*\\.test\\.ts$")))' .build/test-plan/plan.json > /dev/null; then
              selects_no_browser_tests=true
            fi
            if jq -e --arg e2e "$AGENT_HOST_E2E" '.integration.select == true and (.integration.files | all(test($e2e)))' .build/test-plan/plan.json > /dev/null; then
              selects_no_node_integration_tests=true
            fi
            if jq -e --arg e2e "$AGENT_HOST_E2E" '.integration.select == true and (.integration.files | any(test($e2e)) | not)' .build/test-plan/plan.json > /dev/null; then
              selects_no_agent_host_e2e=true
            fi
          fi
          {
            echo "changed=$changed"
            echo "failed=$failed"
            echo "selects-nothing=$selects_nothing"
            echo "selects-no-browser-tests=$selects_no_browser_tests"
            echo "selects-no-node-integration-tests=$selects_no_node_integration_tests"
            echo "selects-no-agent-host-e2e=$selects_no_agent_host_e2e"
          } >> "$GITHUB_OUTPUT"

  # Keep these checks first after Detect Changes so they appear at the top of the job group.
  # Compile & Hygiene always runs: its build script tests also check the Azure Pipelines
  # definitions, which no other job of this workflow reads.
  compile:
    name: Compile & Hygiene
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: *linux-runner
    # actions: read finds and downloads the workspace image (see .github/workflows/workspace_image/README.md)
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      checks-failed: ${{ steps.failed-checks.outputs.failed }}
    env:
      # Hygiene and oxlint check only the files that changed since this commit, the base of the
      # pull request or the commit of the base branch that a merge group forks from, unless a
      # change can affect other files (see build/lib/changedFiles.ts). The full checks run in the
      # scheduled and manual product builds.
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || needs.changes.outputs.merge-group-base }}
    steps:
      # The jobs of this workflow that install the dependencies start from a workspace image of main,
      # like the test jobs (see pr-linux-test.yml and .github/workflows/workspace_image/README.md): its
      # dependencies are installed, and its .git holds the commit it was built at, so the checkout
      # writes and the install steps install only what changed since. Its scripts run before the
      # checkout, so they come from the API, at the commit that the job tests, as in
      # pr-workspace-images.yml. Without an image, or on any error, the install steps install
      # everything, without the pnpm store cache. The other jobs reuse these steps.
      - &image-scripts
        name: Download the workspace image scripts
        id: image-scripts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/workspace-image"
          mkdir -p "$dir"
          echo '{ "type": "module" }' > "$dir/package.json"
          # The scripts keep their folders below workspace_image, such as win32/vhd.ps1
          files=(.nvmrc .github/workflows/workspace_image/{image.ts,win32/vhd.ps1,win32/Vhd.cs})
          args=()
          for file in "${files[@]}"; do
            args+=(-o "$dir/${file#.github/workflows/workspace_image/}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA")
          done
          curl -fsSL --retry 3 --parallel --create-dirs -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw' "${args[@]}"
          for file in "${files[@]}"; do
            [ -s "$dir/${file#.github/workflows/workspace_image/}" ]
          done
          echo "node-version=$(tr -d '[:space:]' < "$dir/.nvmrc")" >> "$GITHUB_OUTPUT"

      - &image-node
        name: Setup Node.js
        if: steps.image-scripts.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.image-scripts.outputs.node-version }}

      # An ext4 volume on Linux and a Dev Drive in a VHDX on Windows, mounted at the parent of the
      # workspace. Only the larger runners of pr-workspace-images.yml have the path of its workspace.
      # image.ts gives up before the timeout of the step, and then unmounts the image, so that the job
      # sets up as without an image. Pull requests to release branches look for images of their own
      # branch, which pr-workspace-images.yml doesn't build.
      - &image-restore
        name: Restore the workspace image
        id: image
        if: steps.image-scripts.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ runner.temp }}
        run: node "$RUNNER_TEMP/workspace-image/image.ts" restore --name "$WORKSPACE_IMAGE_NAME" --branch "$WORKSPACE_IMAGE_BRANCH" --timeout-seconds 240
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_IMAGE_NAME: ${{ runner.os == 'Windows' && 'workspace-image-win32-x64.img' || 'workspace-image-linux-x64.img' }}
          WORKSPACE_IMAGE_BRANCH: ${{ github.base_ref || 'main' }}

      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      # Without the base commit, hygiene and oxlint check every file.
      - name: Fetch pull request base
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || echo "::warning::Could not fetch $PR_BASE_SHA; hygiene and oxlint will check every file."

      - &node-without-image
        name: Setup Node.js
        if: steps.image-scripts.outcome != 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install system packages
        uses: ./.github/actions/install-linux-packages

      - name: Install Electron headers
        run: pnpm run preinstall

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check /build/ scripts
        id: typecheck-build
        run: pnpm run typecheck
        working-directory: build

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Markdown editor manifests and clipboard
        id: markdown-editor
        run: |
          pnpm run markdown-editor-package-json-check
          pnpm -C extensions/markdown-language-features run test-markdown-editor-package-json
          pnpm -C extensions/markdown-language-features run test-markdown-editor-clipboard

      # Hygiene and oxlint check only the changed files, so they take seconds and fail the job
      # before the compilation checks start. --continue-on-error reports both when both fail.
      # oxlint runs the rules of eslint.config.js (see oxlint.config.ts). It stays out of the
      # compilation checks so that the memory of its processes doesn't overlap theirs. A merge
      # group has no base when Detect Changes failed, and then they check every file.
      - name: Hygiene & oxlint
        id: hygiene
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            pnpm exec npm-run-all2 -lp --continue-on-error "hygiene --changed-since $PR_BASE_SHA" "oxlint --changed-since $PR_BASE_SHA"
          else
            pnpm exec npm-run-all2 -lp --continue-on-error hygiene oxlint
          fi

      # core-ci-pr skips the minified bundles that only the product build uses.
      - name: Compile
        id: compile
        run: pnpm exec npm-run-all2 -lp core-ci-pr valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Without a base (see Hygiene & oxlint), it checks the client whether or not its inputs changed.
      - name: Check Codex protocol client is in sync
        id: codex-sync
        run: |
          if [ -n "$CODEX_SYNC_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$CODEX_SYNC_BASE" || true
            node build/codex/check-protocol-sync.ts --if-changed --base "$CODEX_SYNC_BASE"
          else
            node build/codex/check-protocol-sync.ts
          fi
        env:
          CODEX_SYNC_BASE: ${{ github.event.pull_request.base.sha || needs.changes.outputs.merge-group-base }}

      - name: Check cyclic dependencies
        id: cyclic-dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

      # Tells Cancel Run that a check of the change failed, rather than the setup of the job, which a rerun fixes.
      - name: Report failed checks
        id: failed-checks
        if: ${{ failure() && (steps.typecheck-build.outcome == 'failure' || steps.markdown-editor.outcome == 'failure' || steps.hygiene.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.codex-sync.outcome == 'failure' || steps.cyclic-dependencies.outcome == 'failure') }}
        run: echo "failed=true" >> "$GITHUB_OUTPUT"

  monaco-editor:
    name: Monaco Editor
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.monaco-editor == 'true') }}
    runs-on: *linux-runner
    timeout-minutes: 40
    # actions: read finds and downloads the workspace image (see Compile & Hygiene)
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - *node-without-image

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install system packages
        uses: ./.github/actions/install-linux-packages

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          pnpm install --frozen-lockfile

      - name: Download Playwright
        run: pnpm run playwright-install

      - name: Run Monaco Editor Checks
        run: pnpm run monaco-compile-check

      - name: Check generated Monaco declarations
        run: pnpm run gulp monacodts-check

      - name: Editor Distro & ESM
        run: pnpm run gulp editor-distro

      - name: Editor ESM sources check
        working-directory: ./test/monaco
        run: pnpm run esm-check

      - name: Typings validation prep
        run: |
          mkdir typings-test

      - name: Typings validation
        working-directory: ./typings-test
        # npm only writes a CommonJS package.json here; `pnpm init` defaults to ES modules.
        run: |
          npm init -yp
          ../node_modules/.bin/tsc6 --init
          echo "import '../out-monaco-editor-core';" > a.ts
          ../node_modules/.bin/tsc6 --noEmit

      - name: Package Editor with Webpack
        working-directory: ./test/monaco
        run: pnpm run bundle-webpack

      - name: Compile Editor Tests
        working-directory: ./test/monaco
        run: pnpm run compile

      - name: Run Editor Tests
        timeout-minutes: 5
        working-directory: ./test/monaco
        run: pnpm run test

  telemetry:
    name: Telemetry
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.telemetry == 'true') }}
    runs-on: *linux-runner
    permissions: {}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install telemetry extractor
        run: |
          # Use the same exact version as pnpm install in the official builds. Only the extractor is
          # installed, into a scratch folder outside the repository, so npm is fine for this.
          version=$(pnpm list --lockfile-only --json --depth 0 --filter . @vscode/telemetry-extractor | node -p "const [root] = JSON.parse(require('fs').readFileSync(0, 'utf8')); ({ ...root.dependencies, ...root.devDependencies })['@vscode/telemetry-extractor'].version")
          npm install --prefix "$RUNNER_TEMP/telemetry-extractor" --no-save --no-package-lock --no-audit --no-fund "@vscode/telemetry-extractor@$version"

      - name: Run vscode-telemetry-extractor
        run: node build/azure-pipelines/common/extract-telemetry.ts
        env:
          VSCODE_TELEMETRY_EXTRACTOR: ${{ runner.temp }}/telemetry-extractor/node_modules/@vscode/telemetry-extractor/out/extractor.js
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails when a pull request that changes build/ripple breaks ripple's build, its tests or the
  # planning of the pull request, before the failure reaches main. Skipped for the other pull
  # requests, which a broken ripple must not block (see the Check ripple step of Detect Changes).
  ripple:
    name: Ripple
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ripple-changed == 'true' }}
    runs-on: *linux-runner
    steps:
      - name: Check that ripple builds, passes its tests and plans the tests
        env:
          FAILED: ${{ needs.changes.outputs.ripple-failed }}
        run: |
          if [ "$FAILED" != false ]; then
            echo "::error::This pull request changes build/ripple, and ripple failed to build, pass its tests or plan the tests. See the Detect Changes job."
            exit 1
          fi
          echo "ripple built, passed its tests and planned the tests in Detect Changes."

  # The test jobs below report "<OS> / <job>" checks, for example "Windows / Electron-Unit", whether
  # they run or not. Each calls the reusable workflow of its OS, whose jobs have fixed names, run on
  # the runner that the calling job passes, and skip when the changes cannot affect them (the
  # *_affected inputs). The calling jobs always run, as GitHub reports a skipped calling job under its
  # own name only, except the Windows one, which pull requests to main skip, as the merge queue runs
  # it: they report a single skipped Windows check.
  linux-rust-tests:
    name: Linux
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      rustup_toolchain: 1.88
      cli_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.cli == 'true' }}
      copilot_shim_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.copilot-shim == 'true' }}
      runner: *linux-runner

  linux-tests:
    name: Linux
    needs: changes
    if: ${{ !cancelled() }}
    # actions: read finds and downloads the workspace image (see .github/workflows/workspace_image/README.md)
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      electron_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-unit-tests == 'true' }}
      electron_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # Linux runs Agent Host E2E in a job of its own, and only the suites that the plan selects.
      agent_host_e2e_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-agent-host-e2e == 'true' }}
      electron_smoke_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      browser_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-browser-unit-tests == 'true' }}
      browser_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true' }}
      remote_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # The Electron (node.js) job runs only the node.js integration tests that the plan selects, and is
      # skipped when it selects none.
      node_integration_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-node-integration-tests == 'true' }}
      # The provider integration tests and the Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}
      # Pull requests to release branches find no images of their branch, and install everything. The
      # merge queue, which has no base_ref, uses the images of main.
      workspace_image_branch: ${{ github.base_ref || 'main' }}
      runner: *linux-runner

  # The macOS jobs are commented out, so that pull requests don't wait for macOS runners: the Linux,
  # Windows and Compile & Hygiene jobs catch almost every failure that they caught, and the Azure
  # product build still runs the macOS tests on main (see
  # build/azure-pipelines/darwin/steps/product-build-darwin-test.yml). To run them again, uncomment
  # this job and chat-lib-macos-tests, their entries in the needs of PR Gate, the electron-tests output

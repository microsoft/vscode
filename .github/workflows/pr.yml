  # Runs on the larger runners, whose workspaces have the path of the workspace images
  chat-lib-windows-tests:
    name: chat-lib - Test (Windows)
    needs: changes
    # Pull requests to main skip the Windows checks, which the merge queue runs (see the top of the workflow).
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.base_ref != 'main') && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: *windows-runner
    timeout-minutes: 30
    # actions: read finds and downloads the workspace image (see Compile & Hygiene)
    permissions:
      contents: read
      actions: read
    env:
      # The workspace image is mounted at the parent of the workspace without a drive letter, so
      # esbuild needs the volume paths of pnpm's junctions (see pr-win32-test.yml)
      GODEBUG: winreadlinkvolume=1
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - name: Test chat-lib
        uses: ./.github/actions/test-chat-lib
        with:
          # Installs on top of the workspace image, or everything without an image
          restore-pnpm-store: 'false'

  # When Compile & Hygiene finds a problem in the change, which has to be fixed and pushed again
  # anyway, this job cancels the run so that the test jobs free their machines for other pull
  # requests or merge groups, above all the scarce Windows ones. It does not cancel when the setup of
  # Compile & Hygiene fails, as a rerun of that job fixes it. It runs apart from Compile & Hygiene so
  # that the code of the pull request never runs with a token that can cancel workflow runs, and the
  # token of a pull request from a fork cannot cancel the run. Merge groups are branches of this
  # repository.
  cancel-run:
    name: Cancel Run
    needs: compile
    if: ${{ failure() && needs.compile.outputs.checks-failed == 'true' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: *linux-runner
    permissions:
      actions: write
    steps:
      - name: Cancel the workflow run
        run: |
          echo "::notice title=Run cancelled::Compile & Hygiene failed, so the other jobs were cancelled. Fix the change and push again."
          gh run cancel "$RUN_ID" --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}

  # The only check of this workflow that branch protection requires, of pull
  # requests and of the merge groups of the merge queue:
  # Detect Changes plans the changes, the jobs above run what the plan
  # selects, and this gate passes when every job succeeded or was skipped
  # because the changes cannot affect it, or because the merge queue runs it.
  # Detect Changes fails open: when it fails, every job runs, so its failure
  # does not fail the gate (yet).
  # Uses always() so that the gate also reports when a job failed or the run
  # was cancelled, as a skipped required check would pass.
  # Every job of this workflow must be listed in needs.
  pr-gate:
    name: PR Gate
    needs:
      - changes
      - compile
      - monaco-editor
      - telemetry
      - ripple
      - linux-rust-tests
      - linux-tests
      # - macos-tests
      - windows-tests
      - copilot-check-test-cache
      - copilot-check-telemetry
      - copilot-linux-tests
      - copilot-windows-tests
      - chat-lib-linux-tests
      # - chat-lib-macos-tests
      - chat-lib-windows-tests
      - cancel-run
    if: ${{ always() }}
    runs-on: *linux-runner
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r job result; do
            case "$job:$result" in
              # Cancel Run only runs after Compile & Hygiene failed, which fails the gate, and the run it
              # cancels can cancel it too.
              cancel-run:*)
                ;;
              *:success)
                echo "$job succeeded." ;;
              *:skipped)
                echo "$job was skipped because the changes cannot affect it, or the merge queue runs it." ;;
              changes:failure)
                echo "::warning::Detect Changes failed, so every job ran." ;;
              *)
                echo "::error::$job did not succeed (result: $result)."
                status=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$NEEDS")
          exit $status

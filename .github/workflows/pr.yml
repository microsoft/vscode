    # actions: read finds and downloads the workspace image (see Compile & Hygiene)
    permissions:
      contents: read
      actions: read
    env:
      # The workspace image is mounted at the parent of the workspace without a drive letter, so
      # esbuild needs the volume paths of pnpm's junctions (see pr-win32-test.yml)
      GODEBUG: winreadlinkvolume=1
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0'

      - name: Install setuptools
        run: pip install setuptools

      # Same commands as the Copilot jobs of pr-pnpm-store.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter vscode-eslint-plugin-local --filter copilot-chat --filter @vscode/chat-lib

      - name: Build copilot dependencies
        run: pnpm --filter copilot-chat --filter @vscode/chat-lib rebuild

      - name: Run copilot postinstall
        working-directory: extensions/copilot
        run: pnpm run postinstall

      - name: Compile
        working-directory: extensions/copilot
        run: pnpm run compile

      - name: Run extension host tests
        working-directory: extensions/copilot
        run: pnpm run test:extension

      - name: Run vitest unit tests
        working-directory: extensions/copilot
        run: pnpm run test:unit

      - name: Run simulation tests with cache
        working-directory: extensions/copilot
        run: pnpm run simulate-ci

      - name: Run Completions Core prompt tests
        working-directory: extensions/copilot
        run: pnpm run test:prompt

      - name: Run Completions Core lib tests using VS Code
        working-directory: extensions/copilot
        run: pnpm run test:completions-core

  # GitHub neither expands the matrix of a job that its if: skips nor evaluates the expressions in
  # the name of a skipped job, so each platform has its own job with a fixed name instead of a
  # matrix over the operating systems.
  chat-lib-linux-tests:
    name: chat-lib - Test (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: *linux-runner
    timeout-minutes: 30

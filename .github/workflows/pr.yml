name: Code OSS

on:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  # TEMPORARY (flaky test flush-out): only the Windows Electron integration job runs. Do not merge.
  windows-electron-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false

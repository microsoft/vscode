  # GitHub neither expands the matrix of a job that its if: skips nor evaluates the expressions in
  # the name of a skipped job, so each platform has its own job with a fixed name instead of a
  # matrix over the operating systems.
  chat-lib-linux-tests:
    name: chat-lib - Test (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


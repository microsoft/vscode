  #     node_integration_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-node-integration-tests == 'true' }}
  #     agent_host_e2e_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-agent-host-e2e == 'true' }}
  #     # The provider integration tests and the Agent Host E2E tests read the profile.

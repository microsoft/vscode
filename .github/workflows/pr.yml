    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test chat-lib
        uses: ./.github/actions/test-chat-lib

  # The only check of this workflow that branch protection requires:
  # Detect Changes plans the pull request, the jobs above run what the plan
  # selects, and this gate passes when every job succeeded or was skipped
  # because the changes cannot affect it. Detect Changes fails open: when it
  # fails, every job runs, so its failure does not fail the gate (yet).
  # Uses always() so that the gate also reports when a job failed or the run
  # was cancelled, as a skipped required check would pass.
  # Every job of this workflow must be listed in needs.
  pr-gate:
    name: PR Gate
    needs:
      - changes
      - compile
      - monaco-editor
      - telemetry
      - ripple
      - linux-rust-tests
      - linux-tests
      - macos-tests
      - windows-tests
      - copilot-check-test-cache
      - copilot-check-telemetry
      - copilot-linux-tests
      - copilot-windows-tests
      - chat-lib-linux-tests
      - chat-lib-macos-tests
      - chat-lib-windows-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r job result; do
            case "$job:$result" in
              *:success)
                echo "$job succeeded." ;;
              *:skipped)
                echo "$job was skipped because the changes cannot affect it." ;;
              changes:failure)
                echo "::warning::Detect Changes failed, so every job ran." ;;
              *)
                echo "::error::$job did not succeed (result: $result)."
                status=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$NEEDS")
          exit $status

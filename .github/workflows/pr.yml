    permissions:
      contents: read
      actions: read
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - name: Test chat-lib
        uses: ./.github/actions/test-chat-lib
        with:

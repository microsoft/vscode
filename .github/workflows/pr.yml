      electron_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # Windows runs Agent Host E2E in jobs of its own, and only the suites that the plan selects.
      agent_host_e2e_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-agent-host-e2e == 'true' }}
      electron_smoke_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      browser_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-browser-unit-tests == 'true' }}
      browser_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true' }}
      remote_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # The Electron (node.js) job runs only the node.js integration tests that the plan selects, and is
      # skipped when it selects none.
      node_integration_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-node-integration-tests == 'true' }}
      # The provider integration tests and the Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}
      # Pull requests to release branches find no images of their branch, and install everything. The

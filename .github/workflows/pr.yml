      workspace_image_branch: ${{ github.base_ref || 'main' }}
      runner: &windows-runner ${{ (github.event_name == 'merge_group' || startsWith(github.base_ref, 'release/')) && 'vscode-large-runners-windows-8-core-merge-queue' || 'vscode-large-runners-windows-8-core' }}

  copilot-check-test-cache:
    name: Copilot - Check Test Cache
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: *linux-runner
    # actions: read finds and downloads the workspace image (see Compile & Hygiene)
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Copilot and chat-lib are members of the root workspace, which an image holds installed
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Same commands as the Copilot jobs of pr-pnpm-store.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter vscode-eslint-plugin-local --filter copilot-chat --filter @vscode/chat-lib

      - name: Build copilot dependencies
        run: pnpm --filter copilot-chat --filter @vscode/chat-lib rebuild

      - name: Run copilot postinstall
        working-directory: extensions/copilot
        run: pnpm run postinstall

      - name: Ensure no duplicate cache keys
        working-directory: extensions/copilot
        run: pnpm exec tsx test/base/cache-cli check

      - name: Ensure no untrusted cache changes
        if: github.event_name == 'pull_request'
        working-directory: extensions/copilot
        run: pnpm exec tsx build/pr-check-cache-files.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  copilot-check-telemetry:
    name: Copilot - Check Telemetry
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: *linux-runner
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Validate telemetry events
        working-directory: extensions/copilot
        run: |
          version=$(pnpm -C ../.. list --lockfile-only --json --depth 0 --filter . @vscode/telemetry-extractor | node -p "const [root] = JSON.parse(require('fs').readFileSync(0, 'utf8')); ({ ...root.dependencies, ...root.devDependencies })['@vscode/telemetry-extractor'].version")
          npx --package="@vscode/telemetry-extractor@$version" --yes vscode-telemetry-extractor -s . > /dev/null

  copilot-linux-tests:
    name: Copilot - Test (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: *linux-runner
    # actions: read finds and downloads the workspace image (see Compile & Hygiene)
    permissions:
      contents: read
      actions: read
    steps:
      - *image-scripts
      - *image-node
      - *image-restore

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # With a workspace image, keeps its untracked files, such as node_modules, and reuses its .git
          clean: ${{ steps.image.outputs.used != 'true' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install system dependencies
        run: |
          set -e
          # The extension host tests launch VS Code, whose Chromium sandbox needs unprivileged
          # user namespaces, which Ubuntu 24.04 restricts by default via AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1

      # Same commands as the Copilot jobs of pr-pnpm-store.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter vscode-eslint-plugin-local --filter copilot-chat --filter @vscode/chat-lib

      - name: Build copilot dependencies
        run: pnpm --filter copilot-chat --filter @vscode/chat-lib rebuild

      - name: Run copilot postinstall
        working-directory: extensions/copilot
        run: pnpm run postinstall

      - name: TypeScript type checking
        working-directory: extensions/copilot
        run: pnpm run typecheck

      - name: Lint
        working-directory: extensions/copilot
        run: pnpm run lint

      - name: Compile
        working-directory: extensions/copilot
        run: pnpm run compile

      - name: Run extension host tests
        working-directory: extensions/copilot
        run: xvfb-run -a pnpm run test:extension

      - name: Run vitest unit tests
        working-directory: extensions/copilot
        run: pnpm run test:unit

      - name: Run simulation tests with cache
        working-directory: extensions/copilot
        run: pnpm run simulate-ci

      - name: Run Completions Core prompt tests
        working-directory: extensions/copilot
        run: pnpm run test:prompt

      - name: Run Completions Core lib tests using VS Code
        working-directory: extensions/copilot
        run: xvfb-run -a pnpm run test:completions-core

      - name: Archive simulation output
        if: always()
        working-directory: extensions/copilot
        run: |
          set -e
          mkdir -p .simulation-archive
          tar -czf .simulation-archive/simulation.tgz -C .simulation .

      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-simulation-output-linux-${{ github.run_attempt }}
          path: extensions/copilot/.simulation-archive/simulation.tgz

  copilot-windows-tests:
    name: Copilot - Test (Windows)
    needs: changes
    # Pull requests to main skip the Windows checks, which the merge queue runs (see the top of the workflow).
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.base_ref != 'main') && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}

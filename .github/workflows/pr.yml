name: Code OSS

on:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  # The workflow is: Detect Changes (the plan) -> the jobs that run what the plan
  # selects -> PR Gate, which reports their results as a single check.
  #
  # Lists the files changed by the pull request so that jobs can skip checks the
  # changes cannot affect (see .github/actions/detect-changes/detect.ts).
  # Jobs also run when change detection fails.
  #
  # Also plans the unit and integration test files the pull request can affect (see
  # build/ripple/README.md). Linux runs every unit and integration test on every push; the macOS
  # and Windows unit test jobs download the test-plan artifact and run only the listed files, and
  # are skipped when the plan selects no file; the Browser ones also when it selects no browser
  # test. Their Electron jobs run only the listed node.js integration tests and Agent Host E2E
  # suites, and skip either when the plan lists none. The artifact only exists when the plan
  # selects files, and without it those jobs run every test. The planning steps never fail the
  # job: the Ripple job reports a broken ripple.
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.detect.outputs.cli }}
      copilot-shim: ${{ steps.detect.outputs.copilot-shim }}
      copilot: ${{ steps.detect.outputs.copilot }}
      unit-tests: ${{ steps.detect.outputs.unit-tests }}
      browser-integration: ${{ steps.detect.outputs.browser-integration }}
      product-tests: ${{ steps.detect.outputs.product-tests }}
      agent-host-e2e: ${{ steps.detect-agent-host-e2e.outputs.affected }}
      agent-host-test-profile: ${{ steps.detect-agent-host-e2e.outputs.profile }}
      agent-host-test-profile-reason: ${{ steps.detect-agent-host-e2e.outputs.reason }}
      ripple-changed: ${{ steps.ripple.outputs.changed }}
      ripple-failed: ${{ steps.ripple.outputs.failed }}
      # macOS runs Agent Host E2E in the Electron integration tests job.
      electron-tests: ${{ steps.detect.outputs.product-tests == 'true' || steps.detect-agent-host-e2e.outputs.affected == 'true' }}
      # The macOS and Windows unit test jobs run only the unit test files that the plan selects, so
      # they also skip when the plan of a working ripple selects none (see the Check ripple step).
      selected-unit-tests: ${{ steps.detect.outputs.unit-tests == 'true' && steps.ripple.outputs.selects-nothing != 'true' }}
      # The Browser unit test jobs also skip when none of the selected files is a browser test.
      selected-browser-unit-tests: ${{ steps.detect.outputs.unit-tests == 'true' && steps.ripple.outputs.selects-nothing != 'true' && steps.ripple.outputs.selects-no-browser-tests != 'true' }}
      # The macOS and Windows Electron jobs run only the node.js integration tests and the Agent
      # Host E2E suites that the plan selects, so they skip either when it selects none of them.
      selected-node-integration-tests: ${{ steps.detect.outputs.product-tests == 'true' && steps.ripple.outputs.selects-no-node-integration-tests != 'true' }}
      selected-agent-host-e2e: ${{ steps.detect-agent-host-e2e.outputs.affected == 'true' && steps.ripple.outputs.selects-no-agent-host-e2e != 'true' }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: the unit test plan compares the base branch (the
          # first parent) with the merge result. ripple reads every file of both commits, so this
          # cannot be a sparse (blobless) checkout.
          fetch-depth: 2

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Agent Host E2E changes
        id: detect-agent-host-e2e
        uses: ./.github/actions/detect-agent-host-e2e-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Must match the cache key of pr-ripple.yml, which saves the binary on main.
      - name: Restore ripple
        id: cache-ripple
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ripple/target/release/ripple
          key: "ripple-${{ runner.os }}-${{ hashFiles('build/ripple/Cargo.lock', 'build/ripple/Cargo.toml', 'build/ripple/rust-toolchain.toml', 'build/ripple/src/**') }}"

      - name: Build ripple
        id: build-ripple
        if: steps.cache-ripple.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: build/ripple
        run: |
          set -e
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo test --release --locked
          cargo build --release --locked

      - name: Save ripple
        if: steps.build-ripple.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ripple/target/release/ripple
          key: ${{ steps.cache-ripple.outputs.cache-primary-key }}

      - name: Plan tests
        id: plan
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -e
          build/ripple/target/release/ripple plan --config build/ripple/vscode.jsonc --base HEAD^1 --head HEAD --out-dir .build/test-plan > /dev/null
          echo "Linux runs every unit and integration test; macOS and Windows run the selected files, and skip their unit test jobs, the node.js integration tests and Agent Host E2E when there are none. See build/ripple/README.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test plan
        if: steps.plan.outputs.select == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-plan
          path: .build/test-plan
          retention-days: 7

      # The ripple steps above never fail the job, so that a broken ripple cannot block unrelated
      # pull requests: their macOS and Windows unit test jobs run every unit test instead. The
      # Ripple job reports a failure for the pull requests that change build/ripple. (A build that
      # times out leaves no binary to plan with.) Only the plan of a working ripple can skip the
      # macOS and Windows unit test jobs, by selecting no unit test file, or only files that the
      # browser test runner does not load (it does not load the test files that match the
      # excludeGlob of test/unit/browser/index.js, which BROWSER_EXCLUDED_FOLDERS must match), and
      # the node.js integration tests or Agent Host E2E of their Electron jobs, by selecting none
      # of them. The Agent Host E2E runner runs the integration test files that AGENT_HOST_E2E
      # matches, and scripts/test-integration.sh the others.
      - name: Check ripple
        id: ripple
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build-ripple.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          BROWSER_EXCLUDED_FOLDERS: node|electron-browser|electron-main|electron-utility
          AGENT_HOST_E2E: '^src/vs/platform/agentHost/test/node/e2e/(providers/[^/]*AgentHostE2E|conformance/[^/]*)\.integrationTest\.ts$'
        run: |
          changed=false
          if [ -n "$(git diff --name-only HEAD^1 HEAD -- build/ripple)" ]; then
            changed=true
          fi
          failed=false
          selects_nothing=false
          selects_no_browser_tests=false
          selects_no_node_integration_tests=false
          selects_no_agent_host_e2e=false
          if [ "$BUILD" = failure ] || [ "$PLAN" != success ]; then
            failed=true
            echo "::warning::ripple failed to build, pass its tests or plan the tests, so macOS and Windows run every test. See the steps above."
            # Ripple writes its own plan lines only after a successful plan.
            {
              echo "### Unit test plan"
              echo
              echo "running every unit test: ripple failed to build, pass its tests or plan the tests (see the Check ripple step)."
              echo
              echo "### Integration test plan"
              echo
              echo "running every integration test: ripple failed to build, pass its tests or plan the tests (see the Check ripple step)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # A module that ripple cannot parse, for example with new syntax, disables selection.
            reason=$(jq -r .reason .build/test-plan/plan.json)
            case "$reason" in
              *"parse error ("*)
                file=${reason##*parse error (}
                echo "::warning::ripple cannot parse ${file%)}, so macOS and Windows run every unit and integration test."
                ;;
            esac
            # A plan that runs every unit test lists no file either, but does not select.
            if jq -e '.select == true and .unit == []' .build/test-plan/plan.json > /dev/null; then
              selects_nothing=true
            fi
            # Selected files that the browser runner never loads: all of them are in a folder it excludes.
            if jq -e --arg folders "$BROWSER_EXCLUDED_FOLDERS" '.select == true and (.unit | all(test("/(" + $folders + ")/(.*/)?[^/]*\\.test\\.ts$")))' .build/test-plan/plan.json > /dev/null; then
              selects_no_browser_tests=true
            fi
            if jq -e --arg e2e "$AGENT_HOST_E2E" '.integration.select == true and (.integration.files | all(test($e2e)))' .build/test-plan/plan.json > /dev/null; then
              selects_no_node_integration_tests=true
            fi
            if jq -e --arg e2e "$AGENT_HOST_E2E" '.integration.select == true and (.integration.files | any(test($e2e)) | not)' .build/test-plan/plan.json > /dev/null; then
              selects_no_agent_host_e2e=true
            fi
          fi
          {
            echo "changed=$changed"
            echo "failed=$failed"
            echo "selects-nothing=$selects_nothing"
            echo "selects-no-browser-tests=$selects_no_browser_tests"
            echo "selects-no-node-integration-tests=$selects_no_node_integration_tests"
            echo "selects-no-agent-host-e2e=$selects_no_agent_host_e2e"
          } >> "$GITHUB_OUTPUT"

  # Keep these checks first after Detect Changes so they appear at the top of the job group.
  compile:
    name: Compile & Hygiene
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=compile-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    env:
      # Hygiene and ESLint check only the files that changed since this commit, unless
      # a change can affect other files (see build/lib/changedFiles.ts). The full checks
      # run in the scheduled and manual product builds.
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the base commit, hygiene and ESLint check every file.
      - name: Fetch pull request base
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || echo "::warning::Could not fetch $PR_BASE_SHA; hygiene and ESLint will check every file."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-compile
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install Electron headers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Markdown editor manifests and clipboard
        run: |
          npm run markdown-editor-package-json-check
          npm --prefix extensions/markdown-language-features run test-markdown-editor-package-json
          npm --prefix extensions/markdown-language-features run test-markdown-editor-clipboard

      # Hygiene and ESLint check only the changed files, so they take seconds and fail the job
      # before the compilation checks start. --continue-on-error reports both when both fail.
      # ESLint stays out of the compilation checks so that its worker memory doesn't overlap theirs.
      - name: Hygiene & ESLint
        run: npm exec -- npm-run-all2 -lp --continue-on-error "hygiene -- --changed-since $PR_BASE_SHA" "eslint -- --changed-since $PR_BASE_SHA"

      # core-ci-pr skips the minified bundles that only the product build uses.
      - name: Compile
        run: npm exec -- npm-run-all2 -lp core-ci-pr valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Codex protocol client is in sync
        run: |
          git fetch --no-tags --depth=1 origin "$CODEX_SYNC_BASE" || true
          node build/codex/check-protocol-sync.ts --if-changed --base "$CODEX_SYNC_BASE"
        env:
          CODEX_SYNC_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  monaco-editor:
    name: Monaco Editor
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Reuse the node_modules cache that .github/workflows/pr-node-modules.yml keeps warm on
      # `main`. Never save: PR-scoped caches are not shared with other PRs and only evict the
      # shared ones.
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-compile
          key-args: "compile $(node -p process.arch)"

      - name: Install system dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y libxkbfile-dev pkg-config libkrb5-dev libxss1

      - name: Execute npm
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci

      - name: Download Playwright
        run: npm run playwright-install

      - name: Run Monaco Editor Checks
        run: npm run monaco-compile-check

      - name: Check generated Monaco declarations
        run: npm run gulp monacodts-check

      - name: Editor Distro & ESM
        run: npm run gulp editor-distro

      - name: Editor ESM sources check
        working-directory: ./test/monaco
        run: npm run esm-check

      - name: Typings validation prep
        run: |
          mkdir typings-test

      - name: Typings validation
        working-directory: ./typings-test
        run: |
          npm init -yp
          ../node_modules/.bin/tsc6 --init
          echo "import '../out-monaco-editor-core';" > a.ts
          ../node_modules/.bin/tsc6 --noEmit

      - name: Package Editor with Webpack
        working-directory: ./test/monaco
        run: npm run bundle-webpack

      - name: Compile Editor Tests
        working-directory: ./test/monaco
        run: npm run compile

      - name: Run Editor Tests
        timeout-minutes: 5
        working-directory: ./test/monaco
        run: npm run test

  telemetry:
    name: Telemetry
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install telemetry extractor
        run: |
          # Use the same exact version as npm ci in the official builds.
          version=$(node -p "require('./package-lock.json').packages['node_modules/@vscode/telemetry-extractor'].version")
          npm install --prefix "$RUNNER_TEMP/telemetry-extractor" --no-save --no-package-lock --no-audit --no-fund "@vscode/telemetry-extractor@$version"

      - name: Run vscode-telemetry-extractor
        run: node build/azure-pipelines/common/extract-telemetry.ts
        env:
          VSCODE_TELEMETRY_EXTRACTOR: ${{ runner.temp }}/telemetry-extractor/node_modules/@vscode/telemetry-extractor/out/extractor.js
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails when a pull request that changes build/ripple breaks ripple's build, its tests or the
  # planning of the pull request, before the failure reaches main. Skipped for the other pull
  # requests, which a broken ripple must not block (see the Check ripple step of Detect Changes).
  ripple:
    name: Ripple
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ripple-changed == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check that ripple builds, passes its tests and plans the tests
        env:
          FAILED: ${{ needs.changes.outputs.ripple-failed }}
        run: |
          if [ "$FAILED" != false ]; then
            echo "::error::This pull request changes build/ripple, and ripple failed to build, pass its tests or plan the tests. See the Detect Changes job."
            exit 1
          fi
          echo "ripple built, passed its tests and planned the tests in Detect Changes."

  # The test jobs below report "<OS> / <job>" checks, for example "Windows / Electron-Unit", whether
  # they run or not. Each calls the reusable workflow of its OS, whose jobs have fixed names and skip
  # when the changes cannot affect them (the *_affected inputs). The calling jobs always run, as
  # GitHub reports a skipped calling job under its own name only.
  linux-rust-tests:
    name: Linux
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      rustup_toolchain: 1.88
      cli_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.cli == 'true' }}
      copilot_shim_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.copilot-shim == 'true' }}

  linux-tests:
    name: Linux
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      electron_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true' }}
      electron_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      agent_host_e2e_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.agent-host-e2e == 'true' }}
      electron_smoke_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      browser_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit-tests == 'true' }}
      browser_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true' }}
      remote_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # The provider integration tests and the Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  macos-tests:
    name: macOS
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      electron_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-unit-tests == 'true' }}
      electron_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.electron-tests == 'true' }}
      electron_smoke_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      browser_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-browser-unit-tests == 'true' }}
      browser_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true' }}
      remote_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # The Electron job also runs Agent Host E2E. It runs only the node.js integration tests and the
      # Agent Host E2E suites that the plan selects, and skips them when it selects none.
      node_integration_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-node-integration-tests == 'true' }}
      agent_host_e2e_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-agent-host-e2e == 'true' }}
      # The provider integration tests and the Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  windows-tests:
    name: Windows
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      electron_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-unit-tests == 'true' }}
      electron_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # Windows runs Agent Host E2E in jobs of its own, and only the suites that the plan selects.
      agent_host_e2e_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-agent-host-e2e == 'true' }}
      electron_smoke_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      browser_unit_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-browser-unit-tests == 'true' }}
      browser_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.browser-integration == 'true' }}
      remote_affected: ${{ needs.changes.result != 'success' || needs.changes.outputs.product-tests == 'true' }}
      # The Electron job runs only the node.js integration tests that the plan selects, and skips them
      # when it selects none.
      node_integration_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.selected-node-integration-tests == 'true' }}
      # The provider integration tests and the Agent Host E2E tests read the profile.
      agent_host_test_profile: ${{ needs.changes.outputs.agent-host-test-profile || 'full' }}
      agent_host_test_profile_reason: ${{ needs.changes.outputs.agent-host-test-profile-reason || 'Change detection unavailable' }}

  copilot-check-test-cache:
    name: Copilot - Check Test Cache
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-check-test-cache-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: copilot-node_modules-linux
          key-args: "$(node -p process.platform) $(node -p process.arch)"

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-workspaces

      - name: Install copilot dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: extensions/copilot
        run: npm ci

      - name: Ensure no duplicate cache keys
        working-directory: extensions/copilot
        run: npx tsx test/base/cache-cli check

      - name: Ensure no untrusted cache changes
        if: github.event_name == 'pull_request'
        working-directory: extensions/copilot
        run: npx tsx build/pr-check-cache-files.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  copilot-check-telemetry:
    name: Copilot - Check Telemetry
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-check-telemetry-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Validate telemetry events
        working-directory: extensions/copilot
        run: |
          version=$(node -p "require('../../package-lock.json').packages['node_modules/@vscode/telemetry-extractor'].version")
          npx --package="@vscode/telemetry-extractor@$version" --yes vscode-telemetry-extractor -s . > /dev/null

  copilot-linux-tests:
    name: Copilot - Test (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-ubuntu-22.04-x64, "JobId=copilot-linux-tests-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0'

      - name: Install setuptools
        run: pip install setuptools

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: copilot-node_modules-linux
          key-args: "$(node -p process.platform) $(node -p process.arch)"

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-workspaces

      - name: Install copilot dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: extensions/copilot
        run: npm ci

      - name: TypeScript type checking
        working-directory: extensions/copilot
        run: npm run typecheck

      - name: Lint
        working-directory: extensions/copilot
        run: npm run lint

      - name: Compile
        working-directory: extensions/copilot
        run: npm run compile

      - name: Run extension host tests
        working-directory: extensions/copilot
        run: xvfb-run -a npm run test:extension

      - name: Run vitest unit tests
        working-directory: extensions/copilot
        run: npm run test:unit

      - name: Run simulation tests with cache
        working-directory: extensions/copilot
        run: npm run simulate-ci

      - name: Run Completions Core prompt tests
        working-directory: extensions/copilot
        run: npm run test:prompt

      - name: Run Completions Core lib tests using VS Code
        working-directory: extensions/copilot
        run: xvfb-run -a npm run test:completions-core

      - name: Archive simulation output
        if: always()
        working-directory: extensions/copilot
        run: |
          set -e
          mkdir -p .simulation-archive
          tar -czf .simulation-archive/simulation.tgz -C .simulation .

      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-simulation-output-linux-${{ github.run_attempt }}
          path: extensions/copilot/.simulation-archive/simulation.tgz


  # Commented out with the macOS test jobs (see macos-tests).
  # chat-lib-macos-tests:
  #   name: chat-lib - Test (macOS)
  #   needs: changes
  #   if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.copilot == 'true') }}

name: Cancellation A-B diagnostics (DO NOT MERGE)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'diagnostics/335076-cancellation-ab'
    runs-on: macos-26-xlarge
    timeout-minutes: 60
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: arm64
      NPM_ARCH: arm64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Save identical diagnostic instrumentation
        run: |
          git diff 6acb3aafa40acf016d00efd5230a97e446ecfa7e HEAD -- src/vs/platform/agentHost/test/node/e2e/harness/agentHostE2ETestHarness.ts > "$RUNNER_TEMP/cancellation.patch"
          git show HEAD:.github/cancellation-ab.sh > "$RUNNER_TEMP/cancellation-ab.sh"
          git diff --exit-code e341a3c1515af84f5f679761d76a05a02af182cd 6acb3aafa40acf016d00efd5230a97e446ecfa7e -- package.json package-lock.json .npmrc .nvmrc
      - name: Restore dependencies
        id: cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-macos
          key-args: "darwin arm64 $(node -p process.arch)"
      - name: Install locked dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm ci
        env:
          npm_config_arch: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_DEFINES: kerberos_use_rtld=false
      - name: Prepare Electron
        run: npm run electron -- arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Alternate base and PR on the same runner
        run: bash "$RUNNER_TEMP/cancellation-ab.sh"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cancellation-ab-evidence
          path: ${{ runner.temp }}/cancellation-ab
          retention-days: 7

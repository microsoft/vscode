name: node_modules restore benchmark

# Throwaway benchmark of ways to restore node_modules on the runners of the PR checks.
#
# Run 6: what do the runners give us, and how fast can a node_modules disk image become a
# workspace on Windows? A prepare job builds VHDX images from the node_modules cache of the PR jobs
# and uploads them as artifacts, which, unlike new cache entries, cannot evict the caches of the
# PR jobs from the full repository cache. Each Windows job then sets up the workspace like a PR job
# on a fresh runner, with one way to get node_modules, and builds. The network and disk jobs
# measure each platform. The scripts are in .github/workflows/node_modules_bench.
on:
  push:
    branches:
      - agents/optimize-node-modules-performance
    paths:
      - .github/workflows/node-modules-bench.yml
      - .github/workflows/node_modules_bench/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-windows:
    name: 'Prepare: Windows'
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 90
    outputs:
      image-artifact-id: ${{ steps.upload-nm-refs.outputs.artifact-id }}
    steps:
      - &dev-drive
        # Same as in pr-win32-test.yml
        name: Move the workspace to a Dev Drive
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $mount = Split-Path $workspace -Parent
          $vhd = Join-Path $env:RUNNER_TEMP 'workspace.vhdx'
          try {
            if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
            @(
              "create vdisk file=`"$vhd`" maximum=204800 type=expandable"
              "select vdisk file=`"$vhd`""
              'attach vdisk'
              'create partition primary'
              'assign letter=W'
            ) | Set-Content diskpart.txt
            diskpart /s diskpart.txt | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart exited with $LASTEXITCODE" }
            Format-Volume -DriveLetter W -DevDrive -Confirm:$false -Force | Out-Host
            Remove-Item $workspace
            if (Get-ChildItem -Force $mount) { throw "$mount holds more than the workspace" }
            Add-PartitionAccessPath -DriveLetter W -AccessPath "$mount\"
            # Without a drive letter, the native realpath of the workspace files stays under $mount.
            Remove-PartitionAccessPath -DriveLetter W -AccessPath 'W:\'
            New-Item -ItemType Directory -Path $workspace | Out-Null
            fsutil devdrv query $mount | Out-Host
          } catch {
            Write-Output "::warning::The workspace stays on the OS disk: $_"
            New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          }
          exit 0

      - &checkout
        name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - &restore-windows
        name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 x64 $(node -p process.arch)"

      - &cache-miss
        name: Fail on a node_modules cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: exit 1

      - name: Pack the archives
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = 'Stop'
          mkdir .build/nmb -ea 0
          exec { node build/azure-pipelines/common/listNodeModules.ts .build/nmb/list.txt }
          exec { node .github/workflows/node_modules_bench/archive.ts pack --root . --list .build/nmb/list.txt --out .build/nmb/plain.tar.zst --out nomap+nocopilot@.build/nmb/pruned.tar.zst }

      # The warm workspace image starts from a checkout of main about 150 commits back, like an image
      # built at the last dependency change, which actions/checkout then updates to this commit
      - name: Find an older commit of main
        id: older
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api 'repos/microsoft/vscode/commits?sha=main&per_page=1&page=150' --jq '.[0].sha')" >> "$GITHUB_OUTPUT"

      - name: Checkout the older commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.older.outputs.sha }}
          path: warm
          lfs: true
          persist-credentials: false

      - name: Build the Dev Drive images
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = 'Stop'
          exec { node .github/workflows/node_modules_bench/bench.ts images }

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-results-prepare-windows, path: .build/nmb/results.*, retention-days: 3, if-no-files-found: ignore }
      - name: Upload the scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-scripts, path: .github/workflows/node_modules_bench/, retention-days: 1, if-no-files-found: error }
      - name: Upload plain.tar.zst
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-plain, path: .build/nmb/plain.tar.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload pruned.tar.zst
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-pruned, path: .build/nmb/pruned.tar.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload the empty Dev Drive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-empty, path: .build/nmb/empty.vhdx.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload the node_modules Dev Drive
        id: upload-nm-refs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-nm-refs, path: .build/nmb/nm-refs.vhdx.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload the compressed NTFS node_modules volume
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-nm-ntfs, path: .build/nmb/nm-ntfs.vhdx.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload the warm workspace Dev Drive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-windows-warm-refs, path: .build/nmb/warm-refs.vhdx.zst, compression-level: 0, retention-days: 1, if-no-files-found: error }

  # Today's PR job, plus the steps that read node_modules
  windows-today:
    name: 'Windows: today'
    needs: prepare-windows
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 60
    steps:
      - *dev-drive
      - *checkout
      - *setup-node
      - *restore-windows
      - *cache-miss
      - &transpile
        name: Transpile client and extensions
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"
      - &compile-extensions
        # Same as in pr-win32-test.yml
        name: Compile extensions for integration tests & smoke tests
        run: npm run gulp compile-extension:configuration-editing compile-extension:css-language-features-server compile-extension:emmet compile-extension:git compile-extension:git-base compile-extension:github-authentication compile-extension:html-language-features-server compile-extension:ipynb compile-extension:notebook-renderers compile-extension:json-language-features-client compile-extension:json-language-features-server compile-extension:markdown-language-features compile-extension-media compile-extension:microsoft-authentication compile-extension:typescript-language-features compile-extension:vscode-api-tests compile-extension:vscode-colorize-tests compile-extension:vscode-colorize-perf-tests compile-extension:vscode-test-resolver
      - &read-node-modules
        name: Read every file of node_modules
        run: node .github/workflows/node_modules_bench/archive.ts read --root .

  # The workspace is a downloaded Dev Drive VHDX, attached with the virtual disk API instead of
  # diskpart and the storage cmdlets. Its node_modules come from 7-Zip like today, from the
  # parallel extractor, or are already in the image.
  windows-image:
    name: 'Windows: ${{ matrix.name }}'
    needs: prepare-windows
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'empty image, cached I/O, 7-Zip', image: empty, cached: 'true', node-modules: 7z }
          - { name: 'empty image, cached I/O, extractor', image: empty, cached: 'true', node-modules: extractor }
          - { name: 'node_modules image, cached I/O', image: nm-refs, cached: 'true', node-modules: move }
          - { name: 'node_modules image, uncached I/O', image: nm-refs, cached: 'false', node-modules: move }
          - { name: 'compressed NTFS node_modules image, cached I/O', image: nm-ntfs, cached: 'true', node-modules: move }
          - { name: 'warm workspace image, cached I/O', image: warm-refs, cached: 'true', node-modules: warm }
    env:
      NMB_CACHED: ${{ matrix.cached }}
    steps:
      - name: Download the scripts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-scripts
          path: ${{ runner.temp }}/nmb-scripts
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-windows-${{ matrix.image }}
          path: ${{ runner.temp }}/nmb
      - name: Decompress the image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = Get-ChildItem "$env:RUNNER_TEMP\nmb" -Filter '*.vhdx.zst' | Select-Object -First 1
          $time = Measure-Command { zstd -d -q --long=31 -f $image.FullName -o "$env:RUNNER_TEMP\workspace.vhdx" }
          if ($LASTEXITCODE -ne 0) { throw "zstd exited with $LASTEXITCODE" }
          $size = (Get-Item "$env:RUNNER_TEMP\workspace.vhdx").Length
          Write-Output ("Decompressed {0:N0} MB into {1:N0} MB in {2:N1}s" -f ($image.Length / 1MB), ($size / 1MB), $time.TotalSeconds)
          Remove-Item $image.FullName
      - name: Move the workspace to the image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $mount = Split-Path $workspace -Parent
          if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
          Remove-Item $workspace
          if (Get-ChildItem -Force $mount) { throw "$mount holds more than the workspace" }
          $cached = $env:NMB_CACHED -eq 'true'
          & "$env:RUNNER_TEMP\nmb-scripts\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace.vhdx" -MountFolder $mount -CachedIo:$cached -NoWriteHardening:$cached
          if (-not (Test-Path $workspace)) { New-Item -ItemType Directory -Path $workspace | Out-Null }
          Get-ChildItem -Force $mount | Out-Host
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # The warm workspace image holds node_modules, which `git clean` would delete
          clean: ${{ matrix.node-modules != 'warm' }}
      - *setup-node
      - name: Restore node_modules cache
        id: cache-node-modules
        if: matrix.node-modules == '7z'
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 x64 $(node -p process.arch)"
      - name: Download plain.tar.zst
        if: matrix.node-modules == 'extractor'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-windows-plain
          path: ${{ runner.temp }}/nmb
      - name: Extract node_modules through the volume path
        if: matrix.node-modules == 'extractor'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:UV_THREADPOOL_SIZE = '256'
          node .github/workflows/node_modules_bench/archive.ts extract --archive "$env:RUNNER_TEMP\nmb\plain.tar.zst" --dest "$env:NMB_VOLUME$(Split-Path $env:GITHUB_WORKSPACE -Leaf)" --concurrency 256
          if ($LASTEXITCODE -ne 0) { throw "The extractor exited with $LASTEXITCODE" }
      - name: Move node_modules into the checkout
        if: matrix.node-modules == 'move'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mount = Split-Path $env:GITHUB_WORKSPACE -Parent
          node .github/workflows/node_modules_bench/archive.ts move --from "$mount\nm" --to $env:GITHUB_WORKSPACE --roots "$mount\nm\.nmb-roots.txt"
          if ($LASTEXITCODE -ne 0) { throw "The move exited with $LASTEXITCODE" }
      - *transpile
      - *compile-extensions
      - *read-node-modules

  # What each platform gives a restore: download throughput from the cache and artifact storage
  # with more parallel requests than actions/cache makes, disk write speed, and zstd speed
  network-and-disks:
    name: 'Network and disks: ${{ matrix.os }}'
    needs: prepare-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: vscode-large-runners-windows-8-core, prefix: node_modules-windows, key-args: 'win32 x64 x64' }
          - { os: linux, runner: vscode-large-runners-ubuntu-8-core, prefix: node_modules-linux, key-args: 'linux x64 x64' }
          - { os: macos, runner: vscode-large-runners-macos-5-core-0, prefix: node_modules-macos, key-args: 'darwin arm64 arm64' }
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *setup-node

      # Like restore-node-modules: on Windows, the key file comes from PowerShell, which ends it with a newline
      - name: Compute the node_modules cache key
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts ${{ matrix.key-args }} > .build/packagelockhash
      - name: Compute the node_modules cache key
        if: matrix.os != 'windows'
        shell: bash
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts ${{ matrix.key-args }} > .build/packagelockhash

      - name: Get the download URLs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NMB_CACHE_KEY: ${{ matrix.prefix }}-${{ hashFiles('.build/packagelockhash') }}
          NMB_WINDOWS: ${{ matrix.os == 'windows' }}
          NMB_ARTIFACT_ID: ${{ needs.prepare-windows.outputs.image-artifact-id }}
          NMB_TOKEN: ${{ github.token }}
        with:
          script: |
            const crypto = require('crypto');
            // The version of the node_modules cache entry, as actions/cache computes it
            const components = ['.build/node_modules_cache', 'zstd-without-long'];
            if (process.env.NMB_WINDOWS === 'true') {
              components.push('windows-only');
            }
            components.push('1.0');
            const version = crypto.createHash('sha256').update(components.join('|')).digest('hex');
            const cache = await fetch(new URL('twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', process.env.ACTIONS_RESULTS_URL), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}` },
              body: JSON.stringify({ key: process.env.NMB_CACHE_KEY, restore_keys: [], version }),
            });
            const entry = await cache.json();
            core.info(`Cache entry: HTTP ${cache.status}, ok: ${entry.ok}, key: ${entry.matched_key}`);
            if (entry.signed_download_url) {
              core.setSecret(entry.signed_download_url);
              core.exportVariable('NMB_CACHE_URL', entry.signed_download_url);
            }
            const artifact = await fetch(`https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${process.env.NMB_ARTIFACT_ID}/zip`, {
              headers: { Authorization: `Bearer ${process.env.NMB_TOKEN}`, Accept: 'application/vnd.github+json' },
              redirect: 'manual',
            });
            const location = artifact.headers.get('location');
            core.info(`Artifact: HTTP ${artifact.status}, redirect: ${!!location}`);
            if (location) {
              core.setSecret(location);
              core.exportVariable('NMB_ARTIFACT_URL', location);
            }

      - name: Download throughput
        shell: bash
        run: |
          set -e
          net=.github/workflows/node_modules_bench/net.ts
          node $net download --url-env NMB_CACHE_URL --connections 1,4,8,16,32,64 --chunk-mb 8 --label 'cache entry'
          node $net download --url-env NMB_ARTIFACT_URL --connections 1,4,8,16,32,64 --chunk-mb 8 --label 'artifact'
          node $net download --url-env NMB_ARTIFACT_URL --connections 32 --chunk-mb 8 --label 'artifact to disk' --out "$RUNNER_TEMP/nmb-download.zip"

      - name: Download the node_modules Dev Drive with download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-windows-nm-refs
          path: ${{ runner.temp }}/nmb

      - name: zstd decompression speed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'nmb') -Filter '*.zst' | Select-Object -First 1
          zstd -l $file.FullName
          $time = Measure-Command { zstd -t -q --long=31 $file.FullName }
          Write-Output ("zstd -t of {0:N0} MB took {1:N2}s" -f ($file.Length / 1MB), $time.TotalSeconds)
          Remove-Item $file.FullName

      - name: Disks (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Volume | Format-Table -AutoSize | Out-Host
          Get-PhysicalDisk | Select-Object FriendlyName, MediaType, BusType, Size | Format-Table -AutoSize | Out-Host
          Get-CimInstance Win32_ComputerSystem | Select-Object Model, TotalPhysicalMemory | Format-List | Out-Host
          node .github/workflows/node_modules_bench/net.ts disk --file "$env:RUNNER_TEMP\nmb-disk.bin" --mb 4096
          foreach ($drive in Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -ne 'C' -and $_.Free -gt 10GB }) {
            node .github/workflows/node_modules_bench/net.ts disk --file "$($drive.Root)nmb-disk.bin" --mb 4096
          }
      - name: Disks (Linux)
        if: matrix.os == 'linux'
        run: |
          set -e
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,ROTA,MODEL || true
          df -h
          free -g
          node .github/workflows/node_modules_bench/net.ts disk --file "$RUNNER_TEMP/nmb-disk.bin" --mb 4096
          sudo mkdir -p /mnt/nmb && sudo chown "$(id -u)" /mnt/nmb
          node .github/workflows/node_modules_bench/net.ts disk --file /mnt/nmb/disk.bin --mb 4096
          if mountpoint -q /dev/shm; then node .github/workflows/node_modules_bench/net.ts disk --file /dev/shm/nmb-disk.bin --mb 4096; fi
      - name: Disks (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          diskutil list || true
          df -h
          sysctl -n hw.memsize hw.ncpu
          node .github/workflows/node_modules_bench/net.ts disk --file "$RUNNER_TEMP/nmb-disk.bin" --mb 4096

      # macOS 26 brings ASIF, a sparse disk image format that Apple describes as close to native speed
      - name: ASIF disk image (macOS)
        if: matrix.os == 'macos'
        continue-on-error: true
        run: |
          diskutil image 2>&1 | head -40 || true
          image="$RUNNER_TEMP/nmb.asif"
          time diskutil image create blank --fs APFS --format ASIF --size 100G --volumeName nmb "$image"
          ls -la "$image"
          time diskutil image attach "$image"
          mount | grep -i nmb || true
          node .github/workflows/node_modules_bench/net.ts disk --file /Volumes/nmb/nmb-disk.bin --mb 4096
      - name: Download pruned.tar.zst (macOS)
        if: matrix.os == 'macos'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-windows-pruned
          path: ${{ runner.temp }}/nmb
      - name: Create files on the boot volume and in the ASIF image (macOS)
        if: matrix.os == 'macos'
        continue-on-error: true
        run: |
          set -e
          extract() { UV_THREADPOOL_SIZE=16 node .github/workflows/node_modules_bench/archive.ts extract --archive "$RUNNER_TEMP/nmb/pruned.tar.zst" --dest "$1" --concurrency 16; }
          extract "$RUNNER_TEMP/nmb-boot"
          extract /Volumes/nmb/files
          node .github/workflows/node_modules_bench/archive.ts read --root "$RUNNER_TEMP/nmb-boot" || true

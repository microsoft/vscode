name: node_modules restore benchmark

# Throwaway benchmark of ways to restore node_modules on the runners of the PR checks.
#
# Run 9 confirms the Windows image: node_modules with the copies of the same content cloned by
# CopyFile on ReFS, and a seeded .git: the objects of an older commit of main with a tag, so that
# the shallow fetch of actions/checkout downloads only what changed. Runs 7 and 8 measured Linux
# (squashfs and overlays) and macOS (ASIF), whose jobs are off: Windows writes its disk at
# 250-650 MB/s, so the size of its image decides, with cached I/O and a temporary file.
# The prepare jobs upload the images as artifacts without a zip, which, unlike new cache entries,
# cannot evict the caches of the PR jobs from the full repository cache. The other jobs set up a
# workspace like a PR job on a fresh runner, and build. The scripts are in
# .github/workflows/node_modules_bench.
on:
  push:
    branches:
      - agents/optimize-node-modules-performance
    paths:
      - .github/workflows/node-modules-bench.yml
      - .github/workflows/node_modules_bench/**
  workflow_dispatch:

permissions:
  contents: read
  # The signed download URLs of the artifacts
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The jobs that restore an image need the scripts before they check out the repository
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/node_modules_bench
          persist-credentials: false
      # Compiling it in PowerShell takes over 10 seconds on a new Windows runner
      - name: Compile NmbVhd.dll
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nmbvhd"
          mkdir -p "$src"
          cp .github/workflows/node_modules_bench/NmbVhd.cs .github/workflows/node_modules_bench/NmbVhd.csproj "$src/"
          dotnet build "$src/NmbVhd.csproj" -c Release -o "$src/out" -nologo
          cp "$src/out/NmbVhd.dll" .github/workflows/node_modules_bench/
      - name: Upload the scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-scripts, path: .github/workflows/node_modules_bench/, retention-days: 3, if-no-files-found: error }

  prepare-windows:
    name: 'Prepare: Windows'
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 120
    outputs:
      nm-copyfile: ${{ steps.up-nm-copyfile.outputs.artifact-id }}
      nm-pruned: ${{ steps.up-nm-pruned.outputs.artifact-id }}
    steps:
      - &dev-drive
        # Same as in pr-win32-test.yml
        name: Move the workspace to a Dev Drive
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $mount = Split-Path $workspace -Parent
          $vhd = Join-Path $env:RUNNER_TEMP 'workspace.vhdx'
          try {
            if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
            @(
              "create vdisk file=`"$vhd`" maximum=204800 type=expandable"
              "select vdisk file=`"$vhd`""
              'attach vdisk'
              'create partition primary'
              'assign letter=W'
            ) | Set-Content diskpart.txt
            diskpart /s diskpart.txt | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart exited with $LASTEXITCODE" }
            Format-Volume -DriveLetter W -DevDrive -Confirm:$false -Force | Out-Host
            Remove-Item $workspace
            if (Get-ChildItem -Force $mount) { throw "$mount holds more than the workspace" }
            Add-PartitionAccessPath -DriveLetter W -AccessPath "$mount\"
            # Without a drive letter, the native realpath of the workspace files stays under $mount.
            Remove-PartitionAccessPath -DriveLetter W -AccessPath 'W:\'
            New-Item -ItemType Directory -Path $workspace | Out-Null
            fsutil devdrv query $mount | Out-Host
          } catch {
            Write-Output "::warning::The workspace stays on the OS disk: $_"
            New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          }
          exit 0

      - &checkout
        name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - &restore-windows
        name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows
          key-args: "win32 x64 $(node -p process.arch)"

      - &cache-miss
        name: Fail on a node_modules cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: exit 1

      - name: Pack the archives
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = 'Stop'
          mkdir .build/nmb -ea 0
          exec { node build/azure-pipelines/common/listNodeModules.ts .build/nmb/list.txt }
          exec { node .github/workflows/node_modules_bench/archive.ts pack --root . --list .build/nmb/list.txt --out .build/nmb/plain.tar.zst --out nomap+nocopilot@.build/nmb/pruned.tar.zst }

      # The seeded .git comes from a checkout of main about 150 commits back, like an image built at
      # the last dependency change
      - &find-older
        name: Find an older commit of main
        id: older
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/microsoft/vscode/commits?sha=main&per_page=1&page=150' | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - &checkout-older
        name: Checkout the older commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.older.outputs.sha }}
          path: warm
          lfs: true
          persist-credentials: false

      - name: Build the Dev Drive images
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = 'Stop'
          exec { node .github/workflows/node_modules_bench/bench.ts images run9 }

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: nmb-results-prepare-windows, path: .build/nmb/results.*, retention-days: 3, if-no-files-found: ignore }
      - name: Upload the node_modules image
        id: up-nm-copyfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { path: .build/nmb/nm-copyfile-L9.nmbimg, archive: false, retention-days: 3, if-no-files-found: warn }
      - name: Upload the pruned node_modules image
        id: up-nm-pruned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { path: .build/nmb/nm-pruned-L9.nmbimg, archive: false, retention-days: 3, if-no-files-found: warn }

  # Today's PR job, plus the steps that read node_modules
  windows-today:
    name: 'Windows: today'
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 60
    steps:
      - *dev-drive
      - *checkout
      - *setup-node
      - *restore-windows
      - *cache-miss
      - &transpile
        name: Transpile client and extensions
        run: npm run gulp "transpile-client-esbuild" "transpile-extensions"
      - &compile-extensions
        # Same as in pr-win32-test.yml
        name: Compile extensions for integration tests & smoke tests
        run: npm run gulp compile-extension:configuration-editing compile-extension:css-language-features-server compile-extension:emmet compile-extension:git compile-extension:git-base compile-extension:github-authentication compile-extension:html-language-features-server compile-extension:ipynb compile-extension:notebook-renderers compile-extension:json-language-features-client compile-extension:json-language-features-server compile-extension:markdown-language-features compile-extension-media compile-extension:microsoft-authentication compile-extension:typescript-language-features compile-extension:vscode-api-tests compile-extension:vscode-colorize-tests compile-extension:vscode-colorize-perf-tests compile-extension:vscode-test-resolver
      - &read-node-modules
        name: Read every file of node_modules
        run: node .github/workflows/node_modules_bench/archive.ts read --root .

  # The workspace is a Dev Drive VHDX that `net.ts image-restore` recreates, attached with the
  # virtual disk API at the parent folder of the workspace. It holds node_modules, which moves
  # into the checkout, and a seeded .git, which actions/checkout reuses.
  windows-image:
    name: 'Windows: ${{ matrix.name }}'
    needs: [scripts, prepare-windows]
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'node_modules image, uncached I/O', image: nm-copyfile, cached: 'false', temporary: 'false' }
          - { name: 'node_modules image, cached I/O', image: nm-copyfile, cached: 'true', temporary: 'false' }
          - { name: 'node_modules image, cached I/O, temporary file', image: nm-copyfile, cached: 'true', temporary: 'true' }
          - { name: 'pruned node_modules image, cached I/O, temporary file', image: nm-pruned, cached: 'true', temporary: 'true' }
    env:
      NMB_TOKEN: ${{ github.token }}
    steps:
      - &download-scripts
        name: Download the scripts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmb-scripts
          path: ${{ runner.temp }}/nmb-scripts
      - &setup-node-early
        # Before the checkout, for the scripts: the version of .nvmrc
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - &safe-directory
        # The files of an image belong to the user of the machine that built it
        name: Trust the owner of the checkout
        run: git config --global --add safe.directory '*'
      - name: Restore the image
        shell: pwsh
        env:
          NMB_ARTIFACT_ID: ${{ needs.prepare-windows.outputs[matrix.image] }}
          NMB_TEMPORARY: ${{ matrix.temporary }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = "$env:RUNNER_TEMP\workspace.vhdx"
          $existing = @()
          if ($env:NMB_TEMPORARY -eq 'true') {
            # Windows keeps the data of a temporary file in memory while it has enough
            New-Item -ItemType File -Path $vhd | Out-Null
            (Get-Item $vhd).Attributes = 'Temporary'
            $existing = @('--open-existing', 'true')
          }
          node "$env:RUNNER_TEMP\nmb-scripts\net.ts" image-restore --artifact-id $env:NMB_ARTIFACT_ID --out $vhd --sparse false @existing
          if ($LASTEXITCODE -ne 0) { throw "image-restore exited with $LASTEXITCODE" }
          (Get-Item $vhd).Attributes | Out-Host
      - name: Move the workspace to the image
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          NMB_CACHED: ${{ matrix.cached }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $mount = Split-Path $workspace -Parent
          if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
          Remove-Item $workspace
          if (Get-ChildItem -Force $mount) { throw "$mount holds more than the workspace" }
          & "$env:RUNNER_TEMP\nmb-scripts\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace.vhdx" -MountFolder $mount -CachedIo:($env:NMB_CACHED -eq 'true') -Trust
          Get-ChildItem -Force $mount | Out-Host
          Get-ChildItem -Force $workspace | Out-Host
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Reuses the seeded .git of the image
          clean: false
      - name: Move node_modules into the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mount = Split-Path $env:GITHUB_WORKSPACE -Parent
          node .github/workflows/node_modules_bench/archive.ts move --from "$mount\nm" --to $env:GITHUB_WORKSPACE --roots "$mount\nm\.nmb-roots.txt"
          if ($LASTEXITCODE -ne 0) { throw "The move exited with $LASTEXITCODE" }
      - *transpile
      - *compile-extensions
      - *read-node-modules

  prepare-linux:
    name: 'Prepare: Linux'
    if: false
    runs-on: vscode-large-runners-ubuntu-8-core
    timeout-minutes: 90
    outputs:
      sq-nm-lz4hc: ${{ steps.up-sq-nm-lz4hc.outputs.artifact-id }}
    steps:
      - *checkout
      - *setup-node
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-linux
          key-args: 'linux x64 x64'
      - *cache-miss
      - &pack-posix
        name: Pack the archives
        run: |
          set -euo pipefail
          mkdir -p .build/nmb
          node build/azure-pipelines/common/listNodeModules.ts .build/nmb/list.txt
          node .github/workflows/node_modules_bench/archive.ts pack --root . --list .build/nmb/list.txt --out .build/nmb/plain.tar.zst --out nomap+nocopilot@.build/nmb/pruned.tar.zst
          # The node_modules folders, for the overlays and the moves
          awk -F/ '{ for (i = 1; i <= NF; i++) if ($i == "node_modules") { r = $1; for (j = 2; j <= i; j++) r = r "/" $j; print r; break } }' .build/nmb/list.txt | sort -u > .build/nmb/roots.txt
          wc -l .build/nmb/roots.txt
      - *find-older
      - *checkout-older
      - &seed-git
        # The .git of the older checkout without its index, with a tag at its commit, which the
        # shallow fetch of actions/checkout sends to download only what changed since
        name: Seed a .git
        run: |
          set -euo pipefail
          cp -R warm/.git "$RUNNER_TEMP/seed.git"
          rm -f "$RUNNER_TEMP/seed.git/index"
          git --git-dir="$RUNNER_TEMP/seed.git" tag --force nmb-seed HEAD
          du -sh "$RUNNER_TEMP/seed.git"
      - name: Install squashfs-tools
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools
      - name: Build the image
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          UV_THREADPOOL_SIZE=64 node .github/workflows/node_modules_bench/archive.ts extract --archive .build/nmb/plain.tar.zst --dest "$stage" --concurrency 64
          cp .build/nmb/roots.txt "$stage/.nmb-roots.txt"
          cp -R "$RUNNER_TEMP/seed.git" "$stage/.nmb-seed.git"
          # squashfs stores the files of the same content once
          time mksquashfs "$stage" .build/nmb/sq-nm-lz4hc.sqfs -noappend -b 128K -no-progress -quiet -comp lz4 -Xhc
          ls -la .build/nmb/sq-nm-lz4hc.sqfs
      - name: Upload the image
        id: up-sq-nm-lz4hc
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { path: .build/nmb/sq-nm-lz4hc.sqfs, archive: false, retention-days: 3, if-no-files-found: warn }

  posix-today:
    name: '${{ matrix.os }}: today'
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: vscode-large-runners-ubuntu-8-core, prefix: node_modules-linux, key-args: 'linux x64 x64' }
          - { os: macOS, runner: vscode-large-runners-macos-5-core-0, prefix: node_modules-macos, key-args: 'darwin arm64 arm64' }
    steps:
      - *checkout
      - *setup-node
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: ${{ matrix.prefix }}
          key-args: ${{ matrix.key-args }}
      - *cache-miss
      - *transpile
      - *compile-extensions
      - *read-node-modules

  # A compressed squashfs image, which the kernel decompresses as files are read, with an overlay
  # per node_modules folder for the writes, and a seeded .git
  linux-image:
    name: 'Linux: squashfs lz4hc + overlays + seeded .git, ${{ matrix.connections }} connections'
    if: false
    needs: [scripts, prepare-linux]
    runs-on: vscode-large-runners-ubuntu-8-core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        connections: [16, 32]
    env:
      NMB_TOKEN: ${{ github.token }}
    steps:
      - *download-scripts
      - *setup-node-early
      - name: Download the image
        env:
          NMB_ARTIFACT_ID: ${{ needs.prepare-linux.outputs.sq-nm-lz4hc }}
        run: node "$RUNNER_TEMP/nmb-scripts/net.ts" download-entry --artifact-id "$NMB_ARTIFACT_ID" --out-file "$RUNNER_TEMP/nmb.sqfs" --connections ${{ matrix.connections }}
      - name: Mount the image and seed .git
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/nmb
          time sudo mount -t squashfs -o loop,ro "$RUNNER_TEMP/nmb.sqfs" /mnt/nmb
          [ -z "$(ls -A "$GITHUB_WORKSPACE")" ] || { echo "$GITHUB_WORKSPACE is not empty"; exit 1; }
          time cp -R /mnt/nmb/.nmb-seed.git "$GITHUB_WORKSPACE/.git"
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Reuses the seeded .git
          clean: false
      - name: Put node_modules into the checkout
        run: |
          set -euo pipefail
          mounted=0
          skipped=0
          while IFS= read -r root; do
            [ -n "$root" ] || continue
            target="$GITHUB_WORKSPACE/$root"
            if [ -e "$target" ]; then
              # A test fixture that the repository tracks
              skipped=$((skipped + 1))
              continue
            fi
            mkdir -p "$target" "$RUNNER_TEMP/overlay/upper/$root" "$RUNNER_TEMP/overlay/work/$root"
            sudo mount -t overlay overlay -o "lowerdir=/mnt/nmb/$root,upperdir=$RUNNER_TEMP/overlay/upper/$root,workdir=$RUNNER_TEMP/overlay/work/$root" "$target"
            mounted=$((mounted + 1))
          done < /mnt/nmb/.nmb-roots.txt
          echo "$mounted overlays, $skipped node_modules folders already in the checkout"
      - *transpile
      - *compile-extensions
      - *read-node-modules

  prepare-macos:
    name: 'Prepare: macOS'
    if: false
    runs-on: vscode-large-runners-macos-5-core-0
    timeout-minutes: 90
    outputs:
      asif-nm: ${{ steps.up-asif-nm.outputs.artifact-id }}
      dmg-nm: ${{ steps.up-dmg-nm.outputs.artifact-id }}
    steps:
      - *checkout
      - *setup-node
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-macos
          key-args: 'darwin arm64 arm64'
      - *cache-miss
      - *pack-posix
      - *find-older
      - *checkout-older
      - *safe-directory
      - *seed-git
      - name: Build the images
        run: |
          set -euo pipefail
          nmb=.github/workflows/node_modules_bench
          # Node's copyFile copies the files that it should clone on APFS: `cp -c` clones them
          extract() {
            UV_THREADPOOL_SIZE=16 node $nmb/archive.ts extract --archive .build/nmb/plain.tar.zst --dest "$1" --concurrency 16 --clone-list "$RUNNER_TEMP/clones.txt"
            echo "cloning $(wc -l < "$RUNNER_TEMP/clones.txt") copies"
            tr '\t\n' '\0\0' < "$RUNNER_TEMP/clones.txt" | xargs -0 -n2 -P8 cp -c
          }
          # A writable APFS volume in a sparse ASIF image of macOS 26, which Spotlight leaves alone,
          # with node_modules to move into the checkout and a seeded .git
          diskutil image create blank --fs APFS --format ASIF --size 100G --volumeName nmbnm "$RUNNER_TEMP/nm.asif"
          diskutil image attach --nobrowse "$RUNNER_TEMP/nm.asif"
          touch /Volumes/nmbnm/.metadata_never_index
          mkdir /Volumes/nmbnm/nm
          time extract /Volumes/nmbnm/nm
          cp .build/nmb/roots.txt /Volumes/nmbnm/nm/.nmb-roots.txt
          mkdir /Volumes/nmbnm/vscode
          cp -R "$RUNNER_TEMP/seed.git" /Volumes/nmbnm/vscode/.git
          df -h /Volumes/nmbnm
          diskutil eject /Volumes/nmbnm
          ls -la "$RUNNER_TEMP/nm.asif"
          node $nmb/net.ts image-pack --in "$RUNNER_TEMP/nm.asif" --out .build/nmb/asif-nm-L9.nmbimg --level 9
          # A compressed, read-only disk image, which macOS reads on demand from a URL
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          time extract "$stage"
          cp .build/nmb/roots.txt "$stage/.nmb-roots.txt"
          cp -R "$RUNNER_TEMP/seed.git" "$stage/.nmb-seed.git"
          time diskutil image create from --format ULFO --volumeName nmbdmg "$stage" .build/nmb/dmg-nm.dmg
          ls -la .build/nmb/dmg-nm.dmg
      - name: Upload the ASIF image
        id: up-asif-nm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { path: .build/nmb/asif-nm-L9.nmbimg, archive: false, retention-days: 3, if-no-files-found: warn }
      - name: Upload the DMG
        id: up-dmg-nm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { path: .build/nmb/dmg-nm.dmg, archive: false, retention-days: 3, if-no-files-found: warn }

  macos-image:
    name: 'macOS: ${{ matrix.name }}'
    if: false
    needs: [scripts, prepare-macos]
    runs-on: vscode-large-runners-macos-5-core-0
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ASIF image, block clones, seeded .git', flow: asif }
          - { name: 'DMG attached on demand over HTTP, symlinks, seeded .git', flow: http }
    env:
      NMB_TOKEN: ${{ github.token }}
      NMB_FLOW: ${{ matrix.flow }}
    steps:
      - *download-scripts
      - *setup-node-early
      - *safe-directory
      - name: Restore the ASIF image
        if: matrix.flow == 'asif'
        env:
          NMB_ARTIFACT_ID: ${{ needs.prepare-macos.outputs.asif-nm }}
        run: node "$RUNNER_TEMP/nmb-scripts/net.ts" image-restore --artifact-id "$NMB_ARTIFACT_ID" --out "$RUNNER_TEMP/nm.asif"
      - name: Mount the ASIF image at the parent folder of the workspace
        if: matrix.flow == 'asif'
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          parent="$(dirname "$ws")"
          [ -z "$(ls -A "$ws")" ] || { echo "$ws is not empty"; exit 1; }
          [ "$(ls -A "$parent")" = "$(basename "$ws")" ] || { echo "$parent holds more than the workspace"; ls -la "$parent"; exit 1; }
          time diskutil image attach --nobrowse --mountPoint "$parent" "$RUNNER_TEMP/nm.asif"
          mount | grep "$parent"
          ls -la "$parent" "$ws"
      - name: Attach the DMG from the network
        if: matrix.flow == 'http'
        env:
          NMB_ARTIFACT_ID: ${{ needs.prepare-macos.outputs.dmg-nm }}
        run: |
          set -euo pipefail
          # A local proxy renews the signed URL of the artifact, which expires after a minute
          nohup node "$RUNNER_TEMP/nmb-scripts/net.ts" serve --artifact-id "$NMB_ARTIFACT_ID" --port 18765 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 50); do grep -q Serving "$RUNNER_TEMP/serve.log" && break; sleep 0.2; done
          cat "$RUNNER_TEMP/serve.log"
          mkdir -p "$RUNNER_TEMP/dmg"
          # A shadow file takes the writes
          time diskutil image attach --nobrowse --mountPoint "$RUNNER_TEMP/dmg" http://127.0.0.1:18765/ --shadow "$RUNNER_TEMP/dmg.shadow"
          time cp -R "$RUNNER_TEMP/dmg/.nmb-seed.git" "$GITHUB_WORKSPACE/.git"
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Reuses the seeded .git
          clean: false
      - name: Put node_modules into the checkout
        run: |
          set -euo pipefail
          if [ "$NMB_FLOW" = asif ]; then
            parent="$(dirname "$GITHUB_WORKSPACE")"
            node .github/workflows/node_modules_bench/archive.ts move --from "$parent/nm" --to "$GITHUB_WORKSPACE" --roots "$parent/nm/.nmb-roots.txt"
            exit 0
          fi
          linked=0
          while IFS= read -r root; do
            [ -n "$root" ] || continue
            [ -e "$GITHUB_WORKSPACE/$root" ] && continue
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/$root")"
            ln -s "$RUNNER_TEMP/dmg/$root" "$GITHUB_WORKSPACE/$root"
            linked=$((linked + 1))
          done < "$RUNNER_TEMP/dmg/.nmb-roots.txt"
          echo "$linked symlinks"
      - *transpile
      - *compile-extensions
      - *read-node-modules
      - name: Network traffic of the DMG
        if: always() && matrix.flow == 'http'
        run: tail -5 "$RUNNER_TEMP/serve.log"

name: Code OSS (workspace images)

# Builds the workspace images that the test jobs of pull requests (pr-linux-test.yml,
# pr-darwin-test.yml and pr-win32-test.yml) mount instead of installing the dependencies, Electron and
# the Playwright browsers: a disk image of a workspace of main at the path of the workspaces of the
# jobs, with a .git that their checkouts reuse. See .github/workflows/workspace_image/README.md.
on:
  push:
    branches:
      - main
    # The inputs of the install (see build/npm/installStateHash.ts) and of Electron
    paths:
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
      - '**/.npmrc'
      - '**/.pnpmfile.mjs'
      - .nvmrc
      - build/npm/**
      - build/checksums/electron.txt
      - .github/workflows/pr-workspace-images.yml
      - .github/workflows/workspace_image/**
  schedule:
    # The checkout of a job downloads what changed since the commit of its image
    - cron: '41 */6 * * *'
  workflow_dispatch:
  # Builds the images of a branch, for the workspace_image_branch input of the test workflows
  workflow_call:

permissions:
  contents: read

# Unlike `github.workflow`, the name of the group differs from that of a calling workflow
concurrency:
  group: workspace-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux
    runs-on: vscode-large-runners-ubuntu-8-core
    timeout-minutes: 60
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
    steps:
      # The macOS and Windows jobs create the volume of their image before the checkout, so all three
      # download the scripts the way the test jobs do
      - &download-scripts
        name: Download the workspace image scripts
        id: image-scripts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/workspace-image"
          mkdir -p "$dir"
          echo '{ "type": "module" }' > "$dir/package.json"
          files=(.nvmrc .github/workflows/workspace_image/{image.ts,vhd.ps1,Vhd.cs})
          args=()
          for file in "${files[@]}"; do
            args+=(-o "$dir/${file##*/}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA")
          done
          curl -fsSL --retry 3 --parallel -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw' "${args[@]}"
          for file in "${files[@]}"; do
            [ -s "$dir/${file##*/}" ]
          done
          echo "node-version=$(tr -d '[:space:]' < "$dir/.nvmrc")" >> "$GITHUB_OUTPUT"

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.image-scripts.outputs.node-version }}

      - &checkout
        name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # No credentials in the .git of an image
          persist-credentials: false

      # pnpm/action-setup itself instead of .github/actions/setup-pnpm: the runner reads the action.yml
      # of a local action again for its post step, after the macOS and Windows jobs detached the volume
      # of the workspace
      - &setup-pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - &tool-folders
        name: Put the pnpm store and the Playwright browsers into the image
        shell: bash
        run: node "$RUNNER_TEMP/workspace-image/image.ts" env

      # The same packages as in pr-node-modules.yml, for the native modules
      - name: Install build tools
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev squashfs-tools

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The sysroots, compilers and headers of setup-env.sh stay in .build, for the jobs whose
      # dependencies changed
      - name: Install dependencies
        run: |
          set -e

          source ./build/azure-pipelines/linux/setup-env.sh

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - &setup-electron
        name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - &seed
        name: Prepare the workspace for the image
        shell: bash
        run: node "$RUNNER_TEMP/workspace-image/image.ts" seed

      # A squashfs, which the jobs mount without writing it: the kernel decompresses what they read
      - name: Build the image
        run: |
          set -euo pipefail
          root="$(dirname "$GITHUB_WORKSPACE")"
          du -sh "$root"/.[!.]* "$root"/*/node_modules "$root"/*/.build "$root"/*/.git || true
          time mksquashfs "$root" "$RUNNER_TEMP/workspace-image-linux-x64.sqfs" -noappend -b 128K -no-progress -quiet -comp lz4 -Xhc
          ls -la "$RUNNER_TEMP/workspace-image-linux-x64.sqfs"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/workspace-image-linux-x64.sqfs
          archive: false
          retention-days: 2
          if-no-files-found: error

  macOS:
    name: macOS
    runs-on: vscode-large-runners-macos-5-core-0
    timeout-minutes: 60
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - *download-scripts
      - *setup-node

      # An APFS volume in a sparse ASIF image, mounted at the parent folder of the workspace like in the jobs
      - name: Create the volume of the image
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$(dirname "$GITHUB_WORKSPACE")"
          diskutil image create blank --fs APFS --format ASIF --size 100G --volumeName vscode-workspace "$RUNNER_TEMP/workspace-image.asif"
          diskutil image attach --nobrowse --mountPoint "$root" "$RUNNER_TEMP/workspace-image.asif"
          # Spotlight leaves the volume alone
          touch "$root/.metadata_never_index"
          mkdir "$GITHUB_WORKSPACE"

      - *checkout
      - *setup-pnpm
      - *tool-folders

      - name: Install dependencies
        run: |
          set -e
          c++ --version
          xcode-select -print-path
          python3 -m pip install --break-system-packages setuptools

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same as in pr-darwin-test.yml
          GYP_DEFINES: "kerberos_use_rtld=false"

      - *setup-electron

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --only-shell chromium webkit

      - *seed

      - name: Build the image
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$(dirname "$GITHUB_WORKSPACE")"
          du -sh "$root"/.[!.]* "$root"/*/node_modules "$root"/*/.build "$root"/*/.git || true
          df -h "$root"
          # Retried, in case Spotlight or a process that just ended still holds a file
          hdiutil detach "$root" || { sleep 5; hdiutil detach -force "$root"; }
          ls -la "$RUNNER_TEMP/workspace-image.asif"
          node "$RUNNER_TEMP/workspace-image/image.ts" pack --in "$RUNNER_TEMP/workspace-image.asif" --out "$RUNNER_TEMP/workspace-image-darwin-arm64.img"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/workspace-image-darwin-arm64.img
          archive: false
          retention-days: 2
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 90
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
    steps:
      - *download-scripts
      - *setup-node

      # A Dev Drive in a VHDX with blocks of 1 MB, mounted at the parent folder of the workspace like
      # in the jobs: pnpm links the packages of different folders with junctions, whose targets are
      # absolute paths. 64 GB leave the jobs room, and less of the VHDX to ReFS's metadata than 200 GB.
      - name: Create the volume of the image
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $root = Split-Path $workspace -Parent
          if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
          Remove-Item $workspace
          if (Get-ChildItem -Force $root) { throw "$root holds more than the workspace" }
          & "$env:RUNNER_TEMP\workspace-image\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace-image.vhdx" -Create -MaximumSizeGB 64 -MountFolder $root
          New-Item -ItemType Directory -Path $workspace | Out-Null

      - *checkout
      - *setup-pnpm
      - *tool-folders

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { pnpm install --frozen-lockfile }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "pnpm install failed after 5 attempts"
                throw
              }
              Write-Host "pnpm install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - *setup-electron

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { pnpm exec playwright install --only-shell chromium }

      - *seed

      - name: Build the image
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Split-Path $env:GITHUB_WORKSPACE -Parent
          fsutil volume diskfree $root | Out-Host
          & "$env:RUNNER_TEMP\workspace-image\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace-image.vhdx" -MountFolder $root -Detach
          # The next steps start in the workspace
          New-Item -ItemType Directory -Path $env:GITHUB_WORKSPACE -Force | Out-Null
          Get-Item "$env:RUNNER_TEMP\workspace-image.vhdx" | Format-List Name, Length
          node "$env:RUNNER_TEMP\workspace-image\image.ts" pack --in "$env:RUNNER_TEMP\workspace-image.vhdx" --out "$env:RUNNER_TEMP\workspace-image-win32-x64.img"
          if ($LASTEXITCODE -ne 0) { throw "image.ts pack exited with $LASTEXITCODE" }

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/workspace-image-win32-x64.img
          archive: false
          retention-days: 2
          if-no-files-found: error

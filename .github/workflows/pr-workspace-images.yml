  #         hdiutil detach "$root" || { sleep 5; hdiutil detach -force "$root"; }
  #         ls -la "$RUNNER_TEMP/workspace-image.asif"
  #         node "$RUNNER_TEMP/workspace-image/image.ts" pack --in "$RUNNER_TEMP/workspace-image.asif" --out "$RUNNER_TEMP/workspace-image-darwin-arm64.img"
  #
  #     - name: Upload the image
  #       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
  #       with:
  #         path: ${{ runner.temp }}/workspace-image-darwin-arm64.img
  #         archive: false
  #         retention-days: 2
  #         if-no-files-found: error

  windows:
    name: Windows
    runs-on: vscode-large-runners-windows-8-core
    timeout-minutes: 90
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
    steps:
      - *download-scripts
      - *setup-node

      # A Dev Drive in a VHDX with blocks of 1 MB, mounted at the parent folder of the workspace like
      # in the jobs: pnpm links the packages of different folders with junctions, whose targets are
      # absolute paths. 64 GB leave the jobs room, and less of the VHDX to ReFS's metadata than 200 GB.
      - name: Create the volume of the image
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $root = Split-Path $workspace -Parent
          if (Get-ChildItem -Force $workspace) { throw "$workspace is not empty" }
          Remove-Item $workspace
          if (Get-ChildItem -Force $root) { throw "$root holds more than the workspace" }
          & "$env:RUNNER_TEMP\workspace-image\win32\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace-image.vhdx" -Create -MaximumSizeGB 64 -MountFolder $root
          New-Item -ItemType Directory -Path $workspace | Out-Null

      - *checkout
      - *setup-pnpm
      - *tool-folders

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { pnpm run preinstall }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { pnpm install --frozen-lockfile }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "pnpm install failed after 5 attempts"
                throw
              }
              Write-Host "pnpm install failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - *check-native-optional-deps

      - *setup-electron

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { pnpm exec playwright install --only-shell chromium }

      - *seed

      - name: Build the image
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Split-Path $env:GITHUB_WORKSPACE -Parent
          fsutil volume diskfree $root | Out-Host
          & "$env:RUNNER_TEMP\workspace-image\win32\vhd.ps1" -Path "$env:RUNNER_TEMP\workspace-image.vhdx" -MountFolder $root -Detach
          # The next steps start in the workspace
          New-Item -ItemType Directory -Path $env:GITHUB_WORKSPACE -Force | Out-Null
          Get-Item "$env:RUNNER_TEMP\workspace-image.vhdx" | Format-List Name, Length
          node "$env:RUNNER_TEMP\workspace-image\image.ts" pack --in "$env:RUNNER_TEMP\workspace-image.vhdx" --out "$env:RUNNER_TEMP\workspace-image-win32-x64.img"
          if ($LASTEXITCODE -ne 0) { throw "image.ts pack exited with $LASTEXITCODE" }

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/workspace-image-win32-x64.img
          archive: false
          retention-days: 2
          if-no-files-found: error

  # The WSL distribution that the Windows WSL smoke test job imports instead of building it (see
  # test/smoke/wslDevContainer.ps1 and electron-smoke-wsl in pr-win32-test.yml). It only needs to be recent, so it is
  # rebuilt with the daily images and on manual runs, but not on pushes. It runs on the 1ES pool like that job, as
  # GitHub-hosted Windows runners intermittently freeze while WSL2 provisions a distribution. JobId must be unique per
  # job. The cache key hashes the files that define the distribution, so that the WSL job of a commit that changes them
  # builds the distribution instead; the WSL job restores the newest entry of its key.
  wsl-distro:
    name: Windows (WSL distro)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: [ self-hosted, 1ES.Pool=1es-vscode-oss-windows-2022-x64, "JobId=wsl-distro-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    timeout-minutes: 30
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore WSL installer
        uses: ./.github/actions/restore-wsl-installer

      - name: Prepare the WSL distribution
        timeout-minutes: 20
        shell: pwsh
        run: .\test\smoke\wslDevContainer.ps1 -Operation Prepare -Destination "$env:GITHUB_WORKSPACE\.build\wsl-distro\vscode-wsl-smoke.vhdx"
        env:
          WSL_INSTALLER_CACHE_DIR: ${{ github.workspace }}\.build\wsl-installer

      - name: Save the WSL distribution
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/wsl-distro
          key: "wsl-distro-v1-${{ runner.os }}-${{ hashFiles('test/smoke/wslDevContainer.ps1', 'build/checksums/wsl.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Publish Log Files
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows-x64-wsl-distro-${{ github.run_attempt }}
          path: .build/logs
          if-no-files-found: ignore
